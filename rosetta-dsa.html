== s[r]:\n            if r - l + 1 > max_len:\n                start, max_len = l, r - l + 1\n            l -= 1; r += 1\n    for i in range(len(s)):\n        expand(i, i)      # odd length\n        expand(i, i+1)    # even length\n    return s[start:start+max_len]", "extra": "<b>Expand from center:</b> Har index ko center maan ke odd/even dono expand karo. O(n²) time, O(1) space. DP bhi ho sakta hai lekin ye approach simpler hai. Longest Palindromic Subsequence DP hai — ye substring hai.", "cpp": "void expand(const std::string& s, int l, int r, int& start, int& maxLen) {\n    while (l >= 0 && r < (int)s.size() && s[l] == s[r]) {\n        if (r - l + 1 > maxLen) {\n            start = l;\n            maxLen = r - l + 1;\n        }\n        l--; r++;\n    }\n}\n\nstd::string longestPalindrome(std::string s) {\n    int start = 0, maxLen = 1;\n    for (int i = 0; i < (int)s.size(); i++) {\n        expand(s, i, i, start, maxLen);      // odd\n        expand(s, i, i + 1, start, maxLen);  // even\n    }\n    return s.substr(start, maxLen);\n}"}, {"type": "lc", "cat": "10. Strings", "title": "Q41 · Group Anagrams", "diff": "M", "note": "Anagrams ko group mein daalo — sorted string as key use karo.", "java": "static List<List<String>> groupAnagrams(String[] strs) {\n    Map<String, List<String>> map = new HashMap<>();\n    for (String s : strs) {\n        char[] ch = s.toCharArray();\n        java.util.Arrays.sort(ch);\n        String key = new String(ch);\n        map.computeIfAbsent(key,\n            k -> new ArrayList<>()).add(s);\n    }\n    return new ArrayList<>(map.values());\n}", "python": "from collections import defaultdict\ndef group_anagrams(strs):\n    mp = defaultdict(list)\n    for s in strs:\n        mp[\"\".join(sorted(s))].append(s)\n    return list(mp.values())", "extra": "<b>Key insight:</b> Sorted version of anagrams same hota hai — \"eat\" → \"aet\", \"tea\" → \"aet\". HashMap mein sorted string key, original strings list mein. O(n * k log k) jahan k = max string length.", "cpp": "std::vector<std::vector<std::string>> groupAnagrams(std::vector<std::string>& strs) {\n    std::unordered_map<std::string, std::vector<std::string>> map;\n    for (std::string s : strs) {\n        std::string key = s;\n        std::sort(key.begin(), key.end());\n        map[key].push_back(s);\n    }\n    std::vector<std::vector<std::string>> res;\n    for (auto& p : map) res.push_back(p.second);\n    return res;\n}"}, {"type": "lc", "cat": "10. Strings", "title": "Q42 · Minimum Window Substring", "diff": "H", "note": "s mein se sabse chhoti substring jo t ke saare characters contain kare.", "java": "static String minWindow(String s, String t) {\n    int[] freq = new int[128];\n    for (char c : t.toCharArray()) freq[c]++;\n    int left = 0, minStart = 0, minLen = Integer.MAX_VALUE;\n    int count = t.length();\n    for (int right = 0; right < s.length(); right++) {\n        if (freq[s.charAt(right)]-- > 0) count--;\n        while (count == 0) {\n            if (right - left + 1 < minLen) {\n                minStart = left;\n                minLen = right - left + 1;\n            }\n            if (++freq[s.charAt(left++)] > 0) count++;\n        }\n    }\n    return minLen == Integer.MAX_VALUE ?\n        \"\" : s.substring(minStart, minStart + minLen);\n}", "python": "def min_window(s, t):\n    from collections import Counter\n    need = Counter(t)\n    missing = len(t)\n    left = start = 0\n    min_len = float('inf')\n    for right, ch in enumerate(s):\n        if need[ch] > 0:\n            missing -= 1\n        need[ch] -= 1\n        while missing == 0:\n            if right - left + 1 < min_len:\n                min_len = right - left + 1\n                start = left\n            need[s[left]] += 1\n            if need[s[left]] > 0:\n                missing += 1\n            left += 1\n    return \"\" if min_len == float('inf') else s[start:start+min_len]", "extra": "<b>Sliding Window + HashMap:</b> Right pointer expand karo jab tak t ke saare characters cover ho jayein. Phir left pointer shrink karo jab tak valid hai. O(n) time. Ye Hard level question hai — sliding window ka king. Interview mein directly poochte hain.", "cpp": "std::string minWindow(std::string s, std::string t) {\n    int freq[128] = {0};\n    for (char c : t) freq[(unsigned char)c]++;\n    int left = 0, minStart = 0, minLen = INT_MAX;\n    int count = (int)t.size();\n    for (int right = 0; right < (int)s.size(); right++) {\n        if (freq[(unsigned char)s[right]]-- > 0) count--;\n        while (count == 0) {\n            if (right - left + 1 < minLen) {\n                minStart = left;\n                minLen = right - left + 1;\n            }\n            if (++freq[(unsigned char)s[left++]] > 0) count++;\n        }\n    }\n    return minLen == INT_MAX ? \"\" : s.substr(minStart, minLen);\n}"}, {"cat": "10. Strings", "title": "Sawaal 3 — Strings ke Questions", "note": "Slicing, methods aur string tricks test karo.", "type": "quiz", "questions": [{"q": "<code>s = \"Python\"; s[-1]</code> kya return karega?", "opts": ["Error", "'o'", "'n'", "'P'"], "ans": 2, "expl": "Negative indexing last se count karta hai: s[-1] = 'n' (last char), s[-2] = 'o'. Java mein ye nahi hota — <code>s.charAt(s.length()-1)</code> likhna padta."}, {"q": "<code>\"Hello World\"[1:4]</code> kya return karega?", "opts": ["\"Hell\"", "\"ell\"", "\"llo\"", "\"Hel\""], "ans": 1, "expl": "Slicing <code>[start:stop]</code> mein stop exclusive hai. Index 1='e', 2='l', 3='l' → \"ell\". Index 4 ('o') include nahi hota."}, {"q": "String ko reverse karne ka shortest Python tareeka?", "opts": ["<code>s.reverse()</code>", "<code>reversed(s)</code>", "<code>s[::-1]</code>", "<code>s.rev()</code>"], "ans": 2, "expl": "<code>s[::-1]</code> — slicing ka step -1 poora string reverse kar deta hai. <code>s.reverse()</code> strings pe nahi chalta (lists pe chalta hai)."}, {"q": "<code>len(\"Hello World\")</code> kya return karega?", "opts": ["10", "11", "12", "9"], "ans": 1, "expl": "Space bhi count hota hai: H-e-l-l-o(5) + space(1) + W-o-r-l-d(5) = 11."}, {"q": "Java mein <code>s.equals(t)</code> ka Python equivalent kya hai?", "opts": ["<code>s is t</code>", "<code>s == t</code>", "<code>s.eq(t)</code>", "<code>compare(s,t)</code>"], "ans": 1, "expl": "Python mein <code>==</code> value compare karta hai (Java mein objects pe <code>==</code> reference compare karta hai). <code>is</code> Python mein identity check hai."}, {"q": "<code>s = s + ch</code> ko loop mein likhne se kya problem hai?", "opts": ["Koi problem nahi", "Syntax error", "O(n²) ho jaata hai", "Strings change ho jaati hain"], "ans": 2, "expl": "Strings immutable hain — har baar nayi string ban ti hai, purani copy hoti hai. Python mein <code>list+join()</code>, Java mein <code>StringBuilder</code> use karo."}]}, {"cat": "11. Arrays & Lists", "title": "Array / List Basics", "note": "Java ka fixed-size array vs Python ka dynamic list. Ye difference memory + performance dono ko samajhne ke liye zaroori hai.", "type": "code", "java": "int[] arr = {10, 20, 30, 40};\narr[0] = 100;\nint len = arr.length;   // property, method nahi\n\n// fixed size: create ke baad change nahi ho sakti\nint[] another = new int[5];        // sab 0\nint[] filled = new int[]{1, 2, 3};\n\nint[][] matrix = new int[3][3];    // 2D array", "python": "arr = [10, 20, 30, 40]\narr[0] = 100\nlength = len(arr)         # function, property nahi\n\nanother = [0] * 5         # [0, 0, 0, 0, 0]\nempty = []                # empty list\n\nmatrix = [[0] * 3 for _ in range(3)]   # 2D list 🔥", "extra": "⚠️ <b>Kritik fark:</b> Java array <b>fixed</b> hai (size badal nahi sakti). Python list <b>dynamic</b> hai — append/remove free. Java ka resizable equivalent <code>ArrayList</code> hai. 2D matrix banate waqt Python mein <code>[[0]*3 for _ in range(3)]</code> use karo — <code>[[0]*3]*3</code> mat karna (teeno rows same reference share karenge, bada bug).", "cpp": "// ARRAY BASICS\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int arr[] = {10, 20, 30, 40};\n    arr[0] = 100;\n    int len = sizeof(arr) / sizeof(arr[0]);   // 4 — array ki total size / ek element\n\n    // fixed size: create ke baad change nahi ho sakti\n    int another[5] = {};        // sab 0\n    int filled[] = {1, 2, 3};\n\n    int matrix[3][3] = {};      // 2D array\n\n    cout << arr[0] << \" \" << len << endl;\n    cout << another[0] << \" \" << filled[0] << \" \" << matrix[0][0] << endl;\n    return 0;\n}"}, {"cat": "11. Arrays & Lists", "title": "ArrayList / List Methods", "note": "Java ke ArrayList methods vs Python list methods — ye table DSA mein dynamic list operations ke liye baraabar lagti hai.", "type": "table", "headers": ["Java (ArrayList)", "Python (list)", "Note"], "rows": [["<code>add(x)</code>", "<code>append(x)</code>", "End mein insert, O(1)"], ["<code>add(i, x)</code>", "<code>insert(i, x)</code>", "Given index pe, O(n)"], ["<code>remove(i)</code>", "<code>del arr[i]</code> / <code>pop(i)</code>", "Index se remove"], ["<code>remove(Object)</code>", "<code>arr.remove(x)</code>", "Pehli value remove"], ["<code>size()</code>", "<code>len(arr)</code>", ""], ["<code>get(i)</code>", "<code>arr[i]</code>", ""], ["<code>set(i, x)</code>", "<code>arr[i] = x</code>", ""], ["<code>contains(x)</code>", "<code>x in arr</code>", "O(n) linear search"], ["<code>clear()</code>", "<code>arr.clear()</code>", ""], ["<code>Collections.sort(arr)</code>", "<code>arr.sort()</code>", "In-place sort"], ["<code>Collections.reverse(arr)</code>", "<code>arr.reverse()</code>", "In-place reverse"], ["<code>isEmpty()</code>", "<code>len(arr) == 0</code>", ""], ["<code>toArray()</code>", "<code>list(arr)</code>", "List → array/list"]]}, {"cat": "11. Arrays & Lists", "title": "2D Arrays / Matrices", "note": "Matrix traversal, transpose — DSA grid problems ka base. Dono languages mein same logic, alag syntax.", "type": "code", "java": "int[][] mat = {\n    {1, 2, 3},\n    {4, 5, 6}\n};\nint rows = mat.length;\nint cols = mat[0].length;\n\nfor (int i = 0; i < rows; i++) {\n    for (int j = 0; j < cols; j++) {\n        System.out.print(mat[i][j] + \" \");\n    }\n    System.out.println();\n}\n\n// sum of all elements\nint sum = 0;\nfor (int[] row : mat) for (int v : row) sum += v;", "python": "mat = [\n    [1, 2, 3],\n    [4, 5, 6]\n]\nrows, cols = len(mat), len(mat[0])\n\nfor i in range(rows):\n    for j in range(cols):\n        print(mat[i][j], end=\" \")\n    print()\n\ntotal = sum(sum(row) for row in mat)\n\n# transpose 🔥\ntrans = [[mat[j][i] for j in range(rows)] for i in range(cols)]", "extra": "<b>Flow:</b> rows = mat.length, cols = mat[0].length. Python transposition one-liner: <code>[[mat[j][i] for j in range(rows)] for i in range(cols)]</code>. Grid BFS/DFS problems (maze, islands) mein ye matrix pattern hi use hota hai.", "cpp": "// 2D ARRAYS / MATRICES\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int mat[2][3] = {\n        {1, 2, 3},\n        {4, 5, 6}\n    };\n    int rows = sizeof(mat) / sizeof(mat[0]);        // 2\n    int cols = sizeof(mat[0]) / sizeof(mat[0][0]);  // 3\n\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            cout << mat[i][j] << \" \";\n        }\n        cout << endl;\n    }\n\n    // sum of all elements\n    int sum = 0;\n    for (int i = 0; i < rows; i++)\n        for (int j = 0; j < cols; j++) sum += mat[i][j];\n\n    cout << \"sum: \" << sum << endl;\n    return 0;\n}"}, {"cat": "11. Arrays & Lists", "title": "Slicing & Sorted Copy", "note": "Python ka slicing feature Java mein manually loop se karna padta hai. sorted() vs sort() ka fark DSA mein common gotcha hai.", "type": "code", "java": "// Java mein direct slicing nahi hai\nint[] sub = Arrays.copyOfRange(arr, 1, 4);\n\nint[] sorted = arr.clone();\nArrays.sort(sorted);        // original ko nahi chhota\n\n// descending sort\nInteger[] boxed = Arrays.stream(arr).boxed().toArray(Integer[]::new);\nArrays.sort(boxed, Collections.reverseOrder());", "python": "sub = arr[1:4]            # [20, 30, 40]\nevery_2nd = arr[::2]\nlast_3 = arr[-3:]\nreversed_ = arr[::-1]\n\nnew_sorted = sorted(arr)      # nayi list, original safe 🔥\narr.sort()                    # in-place, original change\narr.sort(reverse=True)        # descending", "extra": "<b>Ye fark yaad rakhna:</b> <code>sorted(arr)</code> ek <b>nayi</b> sorted list return karta hai (original safe). <code>arr.sort()</code> original list ko <b>in-place</b> sort karta hai aur None return karta hai. Java mein <code>Arrays.sort(arr)</code> in-place hai, nayi sorted copy ke liye <code>clone()</code> + sort karna padta.", "cpp": "// SLICING & SORTED COPY\n#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {10, 20, 30, 40};\n\n    // C++ mein direct slicing nahi hai — iterator range se copy karo\n    vector<int> sub(arr.begin() + 1, arr.begin() + 4);   // {20, 30, 40} (end exclusive)\n\n    vector<int> sorted = arr;\n    sort(sorted.begin(), sorted.end());        // original ko nahi chhota\n\n    // descending sort\n    sort(sorted.begin(), sorted.end(), greater<int>());\n\n    cout << sub[0] << \" \" << sub[1] << \" \" << sub[2] << endl;\n    cout << sorted[0] << \" \" << sorted[1] << \" \" << sorted[2] << endl;\n    cout << \"original: \" << arr[0] << endl;    // 10 — safe\n    return 0;\n}"}, {"cat": "11. Arrays & Lists", "title": "Min, Max, Sum & Comprehension", "note": "Python ke built-in aggregate functions ek line mein kaam khatam karte hain. List comprehension Streams ka chhota bhai hai.", "type": "code", "java": "int mx = Arrays.stream(arr).max().getAsInt();\nint mn = Arrays.stream(arr).min().getAsInt();\nint sum = Arrays.stream(arr).sum();\n\n// manual bhi same kaam:\nint m = Integer.MIN_VALUE;\nfor (int x : arr) m = Math.max(m, x);\n\nint[] squares = new int[5];\nfor (int i = 0; i < 5; i++) squares[i] = i * i;", "python": "mx = max(arr)\nmn = min(arr)\ntotal = sum(arr)\n\nsquares = [i * i for i in range(5)]          # 🔥 comprehension\nevens = [x for x in arr if x % 2 == 0]\npairs = [(x, y) for x in [1,2] for y in [3,4]]\n\n# generator (memory efficient)\nsquares_gen = (i * i for i in range(5))", "extra": "<b>List comprehension syntax:</b> <code>[expr for item in iterable if condition]</code>. Ye Java ke Streams jaisa hai lekin bahut compact. Empty list check: <code>if arr:</code> (Python) vs <code>if(!arr.isEmpty())</code> (Java). Python <code>sum(arr)</code> int overflow nahi karta.", "cpp": "// MIN, MAX, SUM\n#include <algorithm>\n#include <climits>\n#include <iostream>\n#include <numeric>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {3, 1, 4, 1, 5};\n\n    int mx = *max_element(arr.begin(), arr.end());\n    int mn = *min_element(arr.begin(), arr.end());\n    int sum = accumulate(arr.begin(), arr.end(), 0);\n\n    // manual bhi same kaam:\n    int m = INT_MIN;\n    for (int x : arr) m = max(m, x);\n\n    // comprehension nahi hota — loop + push_back\n    vector<int> squares;\n    for (int i = 0; i < 5; i++) squares.push_back(i * i);\n\n    cout << mx << \" \" << mn << \" \" << sum << \" \" << m << endl;\n    for (int x : squares) cout << x << \" \";\n    cout << endl;\n    return 0;\n}"}, {"cat": "11. Arrays & Lists", "title": "Reverse, Rotate & In-place Tricks", "note": "Reverse aur rotation — interview mein 5-6 baar poocha jaane wala pattern. In-place techniques dono languages mein same logic use karti hain.", "type": "code", "java": "// reverse whole array in-place\nint l = 0, r = arr.length - 1;\nwhile (l < r) {\n    int t = arr[l]; arr[l] = arr[r]; arr[r] = t;\n    l++; r--;\n}\n\n// rotate right by k: reverse 3 steps\nreverse(arr, 0, n - 1);\nreverse(arr, 0, k - 1);\nreverse(arr, k, n - 1);", "python": "arr.reverse()            # in-place reverse\n\nrev = arr[::-1]           # new reversed list\n\n# rotate right by k 🔥\nk %= len(arr)\narr = arr[-k:] + arr[:-k]\n\n# rotate left by k\narr = arr[k:] + arr[:k]", "extra": "<b>Rotation trick:</b> rotate-right-by-k = <code>arr[-k:] + arr[:-k]</code>. Java mein ye 3-step reverse method use hota hai (reverse whole, reverse first k, reverse rest) — wo logic Python mein bhi same chalega agar tum manually karo. Modulo <code>k %= len(arr)</code> dono mein zaroori hai (k &gt; n ho sakta hai).", "cpp": "// REVERSE & ROTATE — IN-PLACE TRICKS\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid reverseRange(vector<int>& a, int lo, int hi) {\n    while (lo < hi) {\n        int t = a[lo]; a[lo] = a[hi]; a[hi] = t;\n        lo++; hi--;\n    }\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5};\n\n    // reverse whole array in-place (manual two-pointer)\n    int l = 0, r = (int)arr.size() - 1;\n    while (l < r) {\n        int t = arr[l]; arr[l] = arr[r]; arr[r] = t;\n        l++; r--;\n    }\n    // ab arr = {5, 4, 3, 2, 1}\n\n    // rotate right by k: reverse 3 steps (alag array pe)\n    vector<int> rot = {1, 2, 3, 4, 5};\n    int n = (int)rot.size();\n    int k = 2 % n;\n    reverseRange(rot, 0, n - 1);\n    reverseRange(rot, 0, k - 1);\n    reverseRange(rot, k, n - 1);\n\n    for (int x : arr) cout << x << \" \";\n    cout << endl;\n    for (int x : rot) cout << x << \" \";\n    cout << endl;\n    return 0;\n}"}, {"cat": "11. Arrays & Lists", "title": "Sawaal 4 — Arrays ke Questions", "note": "Lists, slicing aur sorting test karo.", "type": "quiz", "questions": [{"q": "Java array vs Python list — kaunsa dynamic (size badal sakta hai)?", "opts": ["Java array", "Python list", "Dono", "Koi nahi"], "ans": 1, "expl": "Python list dynamic hai — append/remove kar sakte ho. Java array fixed hai; resizable equivalent ArrayList hai."}, {"q": "<code>[x * x for x in range(4)]</code> kya return karega?", "opts": ["[0,1,2,3]", "[1,4,9,16]", "[0,1,4,9]", "[0,4,8,12]"], "ans": 2, "expl": "Comprehension <code>[expr for x in range(4)]</code> — x = 0,1,2,3, aur result = x² = 0,1,4,9. Index-0 se shuru hota hai!"}, {"q": "<code>sorted(arr)</code> aur <code>arr.sort()</code> mein kya fark hai?", "opts": ["Koi fark nahi", "sorted nayi list deta hai, sort in-place karta hai", "sort nayi list deta hai", "dono original ko delete karte hain"], "ans": 1, "expl": "<code>sorted(arr)</code> → nayi sorted list (original safe). <code>arr.sort()</code> → original ko modify karta hai, None return karta hai. Interview gotcha!"}, {"q": "<code>arr[::2]</code> kya deta hai?", "opts": ["Har 2nd element (even indices)", "Pehle 2 elements", "Aakhri 2 elements", "Double the list"], "ans": 0, "expl": "Slicing <code>[start:stop:step]</code> mein step 2 = har doosra element: indices 0,2,4,... Ye pattern problems mein useful hai."}, {"q": "Python 2D list <code>matrix = [[0]*3 for _ in range(3)]</code> kyu use karte hain?", "opts": ["Wo fast hai", "Taaki har row alag object ho", "Syntax ka requirement", "Isse matlab nahi padta"], "ans": 1, "expl": "<code>[[0]*3]*3</code> mein teeno rows ek hi object ko point karte hain — ek row badlo, sab badal jaayenge. List comprehension se har row nayi ban ti hai."}, {"q": "Array reverse in-place ka standard technique?", "opts": ["<code>for x in arr</code> loop", "Two-pointer swap", "<code>arr.copy()</code>", "<code>len(arr)</code>"], "ans": 1, "expl": "Two-pointer: l=0, r=n-1, while l&lt;r → swap arr[l],arr[r], l++, r--. Ye O(n) time, O(1) space — interview mein in-place poochte hain."}]}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q1 · Two Sum", "diff": "E", "note": "Array mein aise 2 numbers ke indices return karo jinka sum = target ho.", "java": "public int[] twoSum(int[] nums, int target) {\n    Map<Integer,Integer> m = new HashMap<>();\n    for (int i = 0; i < nums.length; i++) {\n        int need = target - nums[i];\n        if (m.containsKey(need))\n            return new int[]{m.get(need), i};\n        m.put(nums[i], i);\n    }\n    return new int[]{};\n}", "python": "def twoSum(nums, target):\n    m = {}\n    for i, v in enumerate(nums):\n        if target - v in m:\n            return [m[target - v], i]\n        m[v] = i\n    return []", "extra": "<b>HashMap</b> mein har number + index rakho. Har step pe check karo ki <b>target - nums[i]</b> pehle se map mein hai toh dono indices return. O(n).", "cpp": "std::vector<int> twoSum(std::vector<int>& nums, int target) {\n    std::unordered_map<int, int> m;\n    for (int i = 0; i < (int)nums.size(); i++) {\n        int need = target - nums[i];\n        if (m.count(need)) return {m[need], i};\n        m[nums[i]] = i;\n    }\n    return {};\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q2 · Contains Duplicate", "diff": "E", "note": "Array mein koi value duplicate hai ya nahi.", "java": "public boolean containsDuplicate(int[] nums) {\n    Set<Integer> s = new HashSet<>();\n    for (int n : nums)\n        if (!s.add(n)) return true;\n    return false;\n}", "python": "def containsDuplicate(nums):\n    return len(set(nums)) != len(nums)", "extra": "<b>Set</b> mein add karte jaao — dobara add hua toh duplicate. Python mein set size compare. O(n).", "cpp": "bool containsDuplicate(std::vector<int>& nums) {\n    std::unordered_set<int> s;\n    for (int n : nums)\n        if (!s.insert(n).second) return true;\n    return false;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q3 · Valid Anagram", "diff": "E", "note": "Check karo dono strings same characters utni hi baar rakhti hain ya nahi.", "java": "public boolean isAnagram(String s, String t) {\n    if (s.length() != t.length()) return false;\n    int[] c = new int[26];\n    for (int i = 0; i < s.length(); i++) {\n        c[s.charAt(i)-'a']++;\n        c[t.charAt(i)-'a']--;\n    }\n    for (int x : c) if (x != 0) return false;\n    return true;\n}", "python": "from collections import Counter\ndef isAnagram(s, t):\n    return Counter(s) == Counter(t)", "extra": "<b>Count array (26)</b> — ek se +1, dusri se -1, sab 0 hain toh anagram. Python <b>Counter</b>. O(n).", "cpp": "bool isAnagram(std::string s, std::string t) {\n    if (s.size() != t.size()) return false;\n    int c[26] = {0};\n    for (int i = 0; i < (int)s.size(); i++) {\n        c[s[i] - 'a']++;\n        c[t[i] - 'a']--;\n    }\n    for (int i = 0; i < 26; i++)\n        if (c[i] != 0) return false;\n    return true;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q4 · Group Anagrams", "diff": "M", "note": "Strings ko group karo — anagrams same group mein hon.", "java": "public List<List<String>> groupAnagrams(String[] strs) {\n    Map<String, List<String>> m = new HashMap<>();\n    for (String s : strs) {\n        char[] c = s.toCharArray();\n        Arrays.sort(c);\n        m.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);\n    }\n    return new ArrayList<>(m.values());\n}", "python": "from collections import defaultdict\ndef groupAnagrams(strs):\n    m = defaultdict(list)\n    for s in strs:\n        m[''.join(sorted(s))].append(s)\n    return list(m.values())", "extra": "Har string ko <b>sort</b> karo, sorted form <b>key</b> bano — same anagram ek bucket. O(n·k log k).", "cpp": "std::vector<std::vector<std::string>> groupAnagrams(std::vector<std::string>& strs) {\n    std::unordered_map<std::string, std::vector<std::string>> m;\n    for (std::string s : strs) {\n        std::string key = s;\n        std::sort(key.begin(), key.end());\n        m[key].push_back(s);\n    }\n    std::vector<std::vector<std::string>> res;\n    for (auto& p : m) res.push_back(p.second);\n    return res;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q5 · Top K Frequent Elements", "diff": "M", "note": "Sabse zyada baar aane wale K elements return karo.", "java": "public int[] topKFrequent(int[] nums, int k) {\n    Map<Integer,Integer> cnt = new HashMap<>();\n    for (int n : nums) cnt.merge(n, 1, Integer::sum);\n    PriorityQueue<Integer> pq = new PriorityQueue<>((a,b)->cnt.get(a)-cnt.get(b));\n    for (int n : cnt.keySet()) {\n        pq.offer(n);\n        if (pq.size() > k) pq.poll();\n    }\n    int[] r = new int[k];\n    for (int i = 0; i < k; i++) r[i] = pq.poll();\n    return r;\n}", "python": "from collections import Counter\nimport heapq\ndef topKFrequent(nums, k):\n    cnt = Counter(nums)\n    return heapq.nlargest(k, cnt.keys(), key=cnt.get)", "extra": "Frequency count, phir <b>min-heap size k</b> ya Python <b>nlargest</b>. O(n log k).", "cpp": "std::vector<int> topKFrequent(std::vector<int>& nums, int k) {\n    std::unordered_map<int, int> cnt;\n    for (int n : nums) cnt[n]++;\n    // min-heap of size k (freq ascending)\n    std::priority_queue<std::pair<int, int>,\n        std::vector<std::pair<int, int>>,\n        std::greater<std::pair<int, int>>> pq;\n    for (auto& p : cnt) {\n        pq.push({p.second, p.first});\n        if ((int)pq.size() > k) pq.pop();\n    }\n    std::vector<int> r;\n    while (!pq.empty()) {\n        r.push_back(pq.top().second);\n        pq.pop();\n    }\n    return r;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q6 · Product of Array Except Self", "diff": "M", "note": "Har index pe baaki sab elements ka product, bina division ke.", "java": "public int[] productExceptSelf(int[] nums) {\n    int n = nums.length;\n    int[] r = new int[n];\n    r[0] = 1;\n    for (int i = 1; i < n; i++)\n        r[i] = r[i-1] * nums[i-1];\n    int right = 1;\n    for (int i = n-1; i >= 0; i--) {\n        r[i] *= right;\n        right *= nums[i];\n    }\n    return r;\n}", "python": "def productExceptSelf(nums):\n    n = len(nums)\n    r = [1] * n\n    for i in range(1, n):\n        r[i] = r[i-1] * nums[i-1]\n    right = 1\n    for i in range(n-1, -1, -1):\n        r[i] *= right\n        right *= nums[i]\n    return r", "extra": "Pehle pass <b>left products</b>, dusre pass <b>right products</b> multiply. O(n), O(1) extra.", "cpp": "std::vector<int> productExceptSelf(std::vector<int>& nums) {\n    int n = (int)nums.size();\n    std::vector<int> r(n);\n    r[0] = 1;\n    for (int i = 1; i < n; i++)\n        r[i] = r[i - 1] * nums[i - 1];\n    int right = 1;\n    for (int i = n - 1; i >= 0; i--) {\n        r[i] *= right;\n        right *= nums[i];\n    }\n    return r;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q7 · Longest Consecutive Sequence", "diff": "M", "note": "Longest consecutive numbers ka length, O(n) mein.", "java": "public int longestConsecutive(int[] nums) {\n    Set<Integer> s = new HashSet<>();\n    for (int n : nums) s.add(n);\n    int best = 0;\n    for (int n : s) {\n        if (!s.contains(n-1)) {\n            int len = 1;\n            while (s.contains(n+len)) len++;\n            best = Math.max(best, len);\n        }\n    }\n    return best;\n}", "python": "def longestConsecutive(nums):\n    s = set(nums)\n    best = 0\n    for n in s:\n        if n - 1 not in s:\n            ln = 1\n            while n + ln in s:\n                ln += 1\n            best = max(best, ln)\n    return best", "extra": "Sirf <b>sequence ke start</b> se count karo (n-1 exist na ho) — har element ek baar. O(n).", "cpp": "int longestConsecutive(std::vector<int>& nums) {\n    std::unordered_set<int> s(nums.begin(), nums.end());\n    int best = 0;\n    for (int n : s) {\n        if (!s.count(n - 1)) {\n            int len = 1;\n            while (s.count(n + len)) len++;\n            best = std::max(best, len);\n        }\n    }\n    return best;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q8 · Maximum Subarray", "diff": "M", "note": "Sum sabse zyada wala contiguous subarray ka sum.", "java": "public int maxSubArray(int[] nums) {\n    int best = nums[0], cur = nums[0];\n    for (int i = 1; i < nums.length; i++) {\n        cur = Math.max(nums[i], cur + nums[i]);\n        best = Math.max(best, cur);\n    }\n    return best;\n}", "python": "def maxSubArray(nums):\n    cur = best = nums[0]\n    for v in nums[1:]:\n        cur = max(v, cur + v)\n        best = max(best, cur)\n    return best", "extra": "<b>Kadane's algorithm</b> — badhana hai ya naya shuru. O(n).", "cpp": "int maxSubArray(std::vector<int>& nums) {\n    int best = nums[0], cur = nums[0];\n    for (int i = 1; i < (int)nums.size(); i++) {\n        cur = std::max(nums[i], cur + nums[i]);\n        best = std::max(best, cur);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q9 · Subarray Sum Equals K", "diff": "M", "note": "Kitne contiguous subarrays ka sum exactly K hai.", "java": "public int subarraySum(int[] nums, int k) {\n    Map<Integer,Integer> m = new HashMap<>();\n    m.put(0, 1);\n    int sum = 0, ans = 0;\n    for (int n : nums) {\n        sum += n;\n        ans += m.getOrDefault(sum - k, 0);\n        m.merge(sum, 1, Integer::sum);\n    }\n    return ans;\n}", "python": "def subarraySum(nums, k):\n    m = {0: 1}\n    s = ans = 0\n    for n in nums:\n        s += n\n        ans += m.get(s - k, 0)\n        m[s] = m.get(s, 0) + 1\n    return ans", "extra": "<b>Prefix sum + hashmap</b>. prefixSum - k pehle aaya toh utne aur subarrays. O(n).", "cpp": "int subarraySum(std::vector<int>& nums, int k) {\n    std::unordered_map<int, int> m;\n    m[0] = 1;\n    int sum = 0, ans = 0;\n    for (int n : nums) {\n        sum += n;\n        auto it = m.find(sum - k);\n        if (it != m.end()) ans += it->second;\n        m[sum]++;\n    }\n    return ans;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q10 · K-diff Pairs in an Array", "diff": "M", "note": "Pairs jinka difference exactly k — unique pairs.", "java": "public int findPairs(int[] nums, int k) {\n    Map<Integer,Integer> m = new HashMap<>();\n    for (int n : nums) m.merge(n, 1, Integer::sum);\n    int ans = 0;\n    for (int n : m.keySet()) {\n        if (k == 0) { if (m.get(n) > 1) ans++; }\n        else if (m.containsKey(n + k)) ans++;\n    }\n    return ans;\n}", "python": "def findPairs(nums, k):\n    m = {}\n    for n in nums:\n        m[n] = m.get(n, 0) + 1\n    ans = 0\n    for n in m:\n        if k == 0:\n            if m[n] > 1: ans += 1\n        elif n + k in m:\n            ans += 1\n    return ans", "extra": "<b>Frequency map</b>. k==0 pe count>1, warna har n ke liye <b>n+k</b> check.", "cpp": "int findPairs(std::vector<int>& nums, int k) {\n    std::unordered_map<int, int> m;\n    for (int n : nums) m[n]++;\n    int ans = 0;\n    for (auto& p : m) {\n        int n = p.first;\n        if (k == 0) {\n            if (p.second > 1) ans++;\n        } else if (m.count(n + k)) ans++;\n    }\n    return ans;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q11 · Sort Colors", "diff": "M", "note": "0,1,2 ko in-place sort karo (Dutch flag).", "java": "public void sortColors(int[] nums) {\n    int lo = 0, hi = nums.length-1, i = 0;\n    while (i <= hi) {\n        if (nums[i] == 0) swap(nums, lo++, i++);\n        else if (nums[i] == 2) swap(nums, i, hi--);\n        else i++;\n    }\n}\nprivate void swap(int[] a, int i, int j) {\n    int t = a[i]; a[i] = a[j]; a[j] = t;\n}", "python": "def sortColors(nums):\n    lo = 0; hi = len(nums) - 1; i = 0\n    while i <= hi:\n        if nums[i] == 0:\n            nums[lo], nums[i] = nums[i], nums[lo]\n            lo += 1; i += 1\n        elif nums[i] == 2:\n            nums[i], nums[hi] = nums[hi], nums[i]\n            hi -= 1\n        else:\n            i += 1", "extra": "<b>Dutch National Flag</b> — 0 left, 2 right, 1 beech. O(n).", "cpp": "void sortColors(std::vector<int>& nums) {\n    int lo = 0, hi = (int)nums.size() - 1, i = 0;\n    while (i <= hi) {\n        if (nums[i] == 0) {\n            std::swap(nums[lo], nums[i]);\n            lo++; i++;\n        } else if (nums[i] == 2) {\n            std::swap(nums[i], nums[hi]);\n            hi--;\n        } else i++;\n    }\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q12 · Next Permutation", "diff": "M", "note": "Lexicographically next permutation (in-place).", "java": "public void nextPermutation(int[] nums) {\n    int i = nums.length - 2;\n    while (i >= 0 && nums[i] >= nums[i+1]) i--;\n    if (i >= 0) {\n        int j = nums.length - 1;\n        while (nums[j] <= nums[i]) j--;\n        swap(nums, i, j);\n    }\n    reverse(nums, i+1);\n}\nprivate void reverse(int[] a, int s) {\n    int i = s, j = a.length-1;\n    while (i < j) swap(a, i++, j--);\n}", "python": "def nextPermutation(nums):\n    i = len(nums) - 2\n    while i >= 0 and nums[i] >= nums[i+1]:\n        i -= 1\n    if i >= 0:\n        j = len(nums) - 1\n        while nums[j] <= nums[i]:\n            j -= 1\n        nums[i], nums[j] = nums[j], nums[i]\n    nums[i+1:] = reversed(nums[i+1:])", "extra": "Right se <b>pehla dip</b>, usse chhote-bade se swap, right part <b>reverse</b>.", "cpp": "void nextPermutation(std::vector<int>& nums) {\n    int i = (int)nums.size() - 2;\n    while (i >= 0 && nums[i] >= nums[i + 1]) i--;\n    if (i >= 0) {\n        int j = (int)nums.size() - 1;\n        while (nums[j] <= nums[i]) j--;\n        std::swap(nums[i], nums[j]);\n    }\n    std::reverse(nums.begin() + i + 1, nums.end());\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q13 · Majority Element", "diff": "E", "note": "Element jo n/2 se zyada baar aata hai.", "java": "public int majorityElement(int[] nums) {\n    int cand = 0, cnt = 0;\n    for (int n : nums) {\n        if (cnt == 0) cand = n;\n        cnt += (n == cand) ? 1 : -1;\n    }\n    return cand;\n}", "python": "def majorityElement(nums):\n    cand = cnt = 0\n    for n in nums:\n        if cnt == 0:\n            cand = n\n        cnt += 1 if n == cand else -1\n    return cand", "extra": "<b>Boyer-Moore voting</b> — candidate + counter. O(n), O(1).", "cpp": "int majorityElement(std::vector<int>& nums) {\n    int cand = 0, cnt = 0;\n    for (int n : nums) {\n        if (cnt == 0) cand = n;\n        cnt += (n == cand) ? 1 : -1;\n    }\n    return cand;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q14 · Find All Duplicates in an Array", "diff": "M", "note": "Jo number 2 baar aaye unhe list karo.", "java": "public List<Integer> findDuplicates(int[] nums) {\n    List<Integer> r = new ArrayList<>();\n    for (int n : nums) {\n        int idx = Math.abs(n) - 1;\n        if (nums[idx] < 0) r.add(Math.abs(n));\n        nums[idx] = -nums[idx];\n    }\n    return r;\n}", "python": "def findDuplicates(nums):\n    r = []\n    for n in nums:\n        idx = abs(n) - 1\n        if nums[idx] < 0:\n            r.append(abs(n))\n        nums[idx] = -nums[idx]\n    return r", "extra": "<b>abs(value)-1</b> pe negative mark — pehle se negative = duplicate. O(n), O(1).", "cpp": "std::vector<int> findDuplicates(std::vector<int>& nums) {\n    std::vector<int> r;\n    for (int n : nums) {\n        int idx = std::abs(n) - 1;\n        if (nums[idx] < 0) r.push_back(std::abs(n));\n        nums[idx] = -nums[idx];\n    }\n    return r;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q15 · Continuous Subarray Sum", "diff": "M", "note": "Kya koi subarray (size ≥ 2) jiska sum k ka multiple hai.", "java": "public boolean checkSubarraySum(int[] nums, int k) {\n    Map<Integer,Integer> m = new HashMap<>();\n    m.put(0, -1);\n    int sum = 0;\n    for (int i = 0; i < nums.length; i++) {\n        sum = (sum + nums[i]) % k;\n        if (m.containsKey(sum)) {\n            if (i - m.get(sum) > 1) return true;\n        } else m.put(sum, i);\n    }\n    return false;\n}", "python": "def checkSubarraySum(nums, k):\n    m = {0: -1}\n    s = 0\n    for i, v in enumerate(nums):\n        s = (s + v) % k\n        if s in m:\n            if i - m[s] > 1: return True\n        else:\n            m[s] = i\n    return False", "extra": "<b>Remainder prefix-sum map</b>. Same remainder = multiple, distance ≥ 2.", "cpp": "bool checkSubarraySum(std::vector<int>& nums, int k) {\n    std::unordered_map<int, int> m;\n    m[0] = -1;\n    int sum = 0;\n    for (int i = 0; i < (int)nums.size(); i++) {\n        sum = (sum + nums[i]) % k;\n        if (m.count(sum)) {\n            if (i - m[sum] > 1) return true;\n        } else m[sum] = i;\n    }\n    return false;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q16 · Insert Delete GetRandom O(1)", "diff": "M", "note": "Insert, remove, getRandom — teeno O(1).", "java": "class RandomizedSet {\n    Map<Integer,Integer> idx = new HashMap<>();\n    List<Integer> list = new ArrayList<>();\n    Random rnd = new Random();\n    public boolean insert(int v) {\n        if (idx.containsKey(v)) return false;\n        idx.put(v, list.size());\n        list.add(v);\n        return true;\n    }\n    public boolean remove(int v) {\n        if (!idx.containsKey(v)) return false;\n        int i = idx.remove(v);\n        int last = list.remove(list.size()-1);\n        if (i != list.size()) { list.set(i, last); idx.put(last, i); }\n        return true;\n    }\n    public int getRandom() { return list.get(rnd.nextInt(list.size())); }\n}", "python": "import random\nclass RandomizedSet:\n    def __init__(self):\n        self.idx = {}\n        self.list = []\n    def insert(self, v):\n        if v in self.idx: return False\n        self.idx[v] = len(self.list)\n        self.list.append(v)\n        return True\n    def remove(self, v):\n        if v not in self.idx: return False\n        i = self.idx.pop(v)\n        last = self.list.pop()\n        if i != len(self.list):\n            self.list[i] = last\n            self.idx[last] = i\n        return True\n    def getRandom(self):\n        return random.choice(self.list)", "extra": "<b>HashMap (value→index) + ArrayList</b>. Remove mein last element copy karke O(1).", "cpp": "class RandomizedSet {\n    std::unordered_map<int, int> idx;\n    std::vector<int> list;\npublic:\n    RandomizedSet() {}\n    bool insert(int v) {\n        if (idx.count(v)) return false;\n        idx[v] = (int)list.size();\n        list.push_back(v);\n        return true;\n    }\n    bool remove(int v) {\n        if (!idx.count(v)) return false;\n        int i = idx[v];\n        idx.erase(v);\n        int last = list.back();\n        list.pop_back();\n        if (i != (int)list.size()) {\n            list[i] = last;\n            idx[last] = i;\n        }\n        return true;\n    }\n    int getRandom() {\n        return list[rand() % list.size()];\n    }\n};"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q17 · Maximum Product Subarray", "diff": "M", "note": "Subarray jiska product sabse zyada.", "java": "public int maxProduct(int[] nums) {\n    int best = nums[0], mn = nums[0], mx = nums[0];\n    for (int i = 1; i < nums.length; i++) {\n        int t1 = nums[i]*mn, t2 = nums[i]*mx;\n        mn = Math.min(nums[i], Math.min(t1, t2));\n        mx = Math.max(nums[i], Math.max(t1, t2));\n        best = Math.max(best, mx);\n    }\n    return best;\n}", "python": "def maxProduct(nums):\n    mn = mx = best = nums[0]\n    for v in nums[1:]:\n        a, b = v*mn, v*mx\n        mn = min(v, a, b)\n        mx = max(v, a, b)\n        best = max(best, mx)\n    return best", "extra": "<b>min aur max dono track</b> — negative×negative = positive.", "cpp": "int maxProduct(vector<int>& nums) {\n    int best = nums[0], mn = nums[0], mx = nums[0];\n    for (int i = 1; i < (int)nums.size(); i++) {\n        int t1 = nums[i] * mn, t2 = nums[i] * mx;\n        mn = min(nums[i], min(t1, t2));\n        mx = max(nums[i], max(t1, t2));\n        best = max(best, mx);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q18 · Set Matrix Zeroes", "diff": "M", "note": "Row/col jismein 0, poori row/col ko 0 banao (in-place).", "java": "public void setZeroes(int[][] m) {\n    boolean fr = false, fc = false;\n    for (int i = 0; i < m.length; i++)\n        for (int j = 0; j < m[0].length; j++)\n            if (m[i][j] == 0) {\n                if (i == 0) fr = true;\n                if (j == 0) fc = true;\n                m[i][0] = 0; m[0][j] = 0;\n            }\n    for (int i = 1; i < m.length; i++)\n        for (int j = 1; j < m[0].length; j++)\n            if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;\n    if (fr) for (int j = 0; j < m[0].length; j++) m[0][j] = 0;\n    if (fc) for (int i = 0; i < m.length; i++) m[i][0] = 0;\n}", "python": "def setZeroes(m):\n    R, C = len(m), len(m[0])\n    fr = any(x == 0 for x in m[0])\n    fc = any(m[i][0] == 0 for i in range(R))\n    for i in range(R):\n        for j in range(C):\n            if m[i][j] == 0:\n                m[i][0] = 0; m[0][j] = 0\n    for i in range(1, R):\n        for j in range(1, C):\n            if m[i][0] == 0 or m[0][j] == 0:\n                m[i][j] = 0\n    if fr: m[0] = [0]*C\n    if fc:\n        for i in range(R): m[i][0] = 0", "extra": "<b>Pehli row/col marker</b> use karo, phir baaki update, aakhir mein pehli row/col.", "cpp": "void setZeroes(vector<vector<int>>& m) {\n    int R = m.size(), C = m[0].size();\n    bool fr = false, fc = false;\n    for (int i = 0; i < R; i++)\n        for (int j = 0; j < C; j++)\n            if (m[i][j] == 0) {\n                if (i == 0) fr = true;\n                if (j == 0) fc = true;\n                m[i][0] = 0; m[0][j] = 0;\n            }\n    for (int i = 1; i < R; i++)\n        for (int j = 1; j < C; j++)\n            if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;\n    if (fr) for (int j = 0; j < C; j++) m[0][j] = 0;\n    if (fc) for (int i = 0; i < R; i++) m[i][0] = 0;\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q19 · Rotate Image", "diff": "M", "note": "Matrix ko 90° clockwise rotate (in-place).", "java": "public void rotate(int[][] m) {\n    int n = m.length;\n    for (int i = 0; i < n; i++)\n        for (int j = i; j < n; j++) {\n            int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;\n        }\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n/2; j++) {\n            int t = m[i][j]; m[i][j] = m[i][n-1-j]; m[i][n-1-j] = t;\n        }\n}", "python": "def rotate(m):\n    n = len(m)\n    for i in range(n):\n        for j in range(i, n):\n            m[i][j], m[j][i] = m[j][i], m[i][j]\n    for r in m:\n        r.reverse()", "extra": "<b>Transpose</b> + har <b>row reverse</b> = 90° rotate. O(n²).", "cpp": "void rotate(vector<vector<int>>& m) {\n    int n = m.size();\n    for (int i = 0; i < n; i++)\n        for (int j = i; j < n; j++)\n            swap(m[i][j], m[j][i]);            // transpose\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n / 2; j++)\n            swap(m[i][j], m[i][n - 1 - j]);    // row reverse\n}"}, {"type": "lc", "cat": "11. Arrays & Lists", "title": "Q20 · Spiral Matrix", "diff": "M", "note": "Matrix elements spiral order mein.", "java": "public List<Integer> spiralOrder(int[][] m) {\n    List<Integer> r = new ArrayList<>();\n    int t = 0, b = m.length-1, l = 0, rt = m[0].length-1;\n    while (t <= b && l <= rt) {\n        for (int j = l; j <= rt; j++) r.add(m[t][j]);\n        for (int i = t+1; i <= b; i++) r.add(m[i][rt]);\n        if (t < b) for (int j = rt-1; j >= l; j--) r.add(m[b][j]);\n        if (l < rt) for (int i = b-1; i > t; i--) r.add(m[i][l]);\n        t++; b--; l++; rt--;\n    }\n    return r;\n}", "python": "def spiralOrder(m):\n    r = []\n    t, b, l, rt = 0, len(m)-1, 0, len(m[0])-1\n    while t <= b and l <= rt:\n        for j in range(l, rt+1): r.append(m[t][j])\n        for i in range(t+1, b+1): r.append(m[i][rt])\n        if t < b:\n            for j in range(rt-1, l-1, -1): r.append(m[b][j])\n        if l < rt:\n            for i in range(b-1, t, -1): r.append(m[i][l])\n        t += 1; b -= 1; l += 1; rt -= 1\n    return r", "extra": "4 <b>boundaries</b> tighten karte jaao. Har cell ek baar. O(n).", "cpp": "vector<int> spiralOrder(vector<vector<int>>& m) {\n    vector<int> r;\n    int t = 0, b = (int)m.size() - 1, l = 0, rt = (int)m[0].size() - 1;\n    while (t <= b && l <= rt) {\n        for (int j = l; j <= rt; j++) r.push_back(m[t][j]);\n        for (int i = t + 1; i <= b; i++) r.push_back(m[i][rt]);\n        if (t < b) for (int j = rt - 1; j >= l; j--) r.push_back(m[b][j]);\n        if (l < rt) for (int i = b - 1; i > t; i--) r.push_back(m[i][l]);\n        t++; b--; l++; rt--;\n    }\n    return r;\n}"}, {"cat": "12. Collections", "title": "Tuple (Python-only)", "note": "Java ka native tuple nahi hai. Python ka tuple immutable fixed-size group hai — dictionary keys aur function returns ke liye perfect.", "type": "code", "java": "// Java: koi native tuple nahi.\n// Options: array, custom class, ya\n// javafx.util.Pair<>(a, b) (limited)\n\nint[] pair = {10, 20};\nString name = pair[0];\nint value = pair[1];", "python": "t = (10, 20, 30)     # immutable\nx, y, z = t            # unpacking 🔥\na, b = 5, 10           # multiple assign\na, b = b, a            # swap without temp!\n\npoint = (3, 4)         # coordinate\nd = {point: \"origin\"}  # tuple = valid dict key\n\nt2 = t + (40,)         # new tuple, t unchanged", "extra": "<b>Tuple immutable</b> hai — isliye dictionary keys ya set elements ke liye safe. Java mein swap ke liye temp variable chahiye: <code>int t=a; a=b; b=t;</code> — Python mein <code>a, b = b, a</code> ek line mein. Multiple return values bhi tuples se aati hain.", "cpp": "// C++: std::pair / std::tuple — tuple ka kaam.\n// Tuple immutable hai: copy ya tuple_cat se naya object banta hai.\n#include <iostream>\n#include <string>\n#include <tuple>\n#include <utility>\n#include <map>\nusing namespace std;\n\nint main() {\n    pair<int, int> p = {10, 20};             // 2-value tuple (pair)\n    auto [name, value] = p;                  // unpacking (structured bindings)\n    cout << name << \" \" << value << \"\\n\";    // 10 20\n\n    int a = 5, b = 10;\n    swap(a, b);                              // bina temp ke swap\n    cout << a << \" \" << b << \"\\n\";           // 10 5\n\n    tuple<int, string, double> t = make_tuple(1, \"hi\", 0.5);  // multi-value\n    auto [x, y, z] = t;\n    cout << x << \" \" << y << \" \" << z << \"\\n\";\n\n    auto t2 = tuple_cat(t, make_tuple(40));  // naya tuple, t unchanged\n    cout << get<3>(t2) << \"\\n\";              // 40\n\n    map<pair<int, int>, string> d;           // pair = valid map key\n    d[{3, 4}] = \"origin\";\n    cout << d[{3, 4}] << \"\\n\";\n    return 0;\n}"}, {"cat": "12. Collections", "title": "Set / HashSet", "note": "Duplicate-free collection — dono languages mein O(1) lookup/insert. Python ke set aur bhi powerful hain (set operations built-in).", "type": "code", "java": "HashSet<Integer> set = new HashSet<>();\nset.add(10);\nset.add(10);          // duplicate ignore\nboolean has = set.contains(10);\nset.remove(10);\nint sz = set.size();", "python": "s = set()\ns.add(10)\ns.add(10)             # duplicate ignore\nhas = 10 in s\ns.remove(10)\nsz = len(s)\n\n# set comprehension 🔥\nevens = {x for x in arr if x % 2 == 0}\n\n# set operations built-in\na = {1, 2, 3}; b = {2, 3, 4}\na | b   # union     {1,2,3,4}\na & b   # intersect {2,3}\na - b   # diff      {1}\na ^ b   # symmetric {1,4}", "extra": "<b>Dedup trick:</b> <code>arr = list(set(arr))</code> — ek line mein duplicates hatao (order guarantee nahi). Java ke <code>TreeSet</code> (sorted) ka Python mein direct built-in nahi — <code>sorted(set(arr))</code> use karo. Set operations (<code>| &amp; - ^</code>) leetcode problems (common elements, differences) mein time bachate hain.", "cpp": "#include <iostream>\n#include <unordered_set>\n#include <set>\n#include <algorithm>\n#include <iterator>\n#include <vector>\nusing namespace std;\n\nint main() {\n    unordered_set<int> s;\n    s.insert(10);\n    s.insert(10);            // duplicate ignore\n    bool has = s.count(10);  // 1 = mila, 0 = nahi\n    s.erase(10);\n    int sz = s.size();\n    cout << has << \" \" << sz << \"\\n\";\n\n    // set operations sorted set pe milte hain\n    set<int> a = {1, 2, 3}, b = {2, 3, 4};\n    vector<int> uni, inter, diff, sym;\n    set_union(a.begin(), a.end(), b.begin(), b.end(), back_inserter(uni));\n    set_intersection(a.begin(), a.end(), b.begin(), b.end(), back_inserter(inter));\n    set_difference(a.begin(), a.end(), b.begin(), b.end(), back_inserter(diff));\n    set_symmetric_difference(a.begin(), a.end(), b.begin(), b.end(), back_inserter(sym));\n\n    cout << \"union | = \"; for (int x : uni) cout << x << \" \";  cout << \"\\n\";\n    cout << \"inter & = \"; for (int x : inter) cout << x << \" \"; cout << \"\\n\";\n    cout << \"diff  - = \"; for (int x : diff) cout << x << \" \"; cout << \"\\n\";\n    cout << \"sym   ^ = \"; for (int x : sym) cout << x << \" \";  cout << \"\\n\";\n    return 0;\n}"}, {"cat": "12. Collections", "title": "Dictionary / HashMap 🔥", "note": "DSA ka sabse important data structure — key-value pairs. Python dict Java se zyada flexible hai (ordered, hashable keys).", "type": "code", "java": "HashMap<Integer, Integer> map = new HashMap<>();\nmap.put(5, 10);\nint v = map.get(5);              // 10 (or null)\nboolean has = map.containsKey(5);\nmap.remove(5);\nint d = map.getOrDefault(x, 0);   // default value\n\n// frequency counting\nfor (int x : arr) {\n    map.put(x, map.getOrDefault(x, 0) + 1);\n}", "python": "mp = {}\nmp[5] = 10\nv = mp.get(5)              # 10 (or None)\nhas = 5 in mp\nmp.pop(5)\nd = mp.get(x, 0)           # default value\n\n# frequency counting 🔥\nfor x in arr:\n    mp[x] = mp.get(x, 0) + 1\n\n# update multiple keys\nmp.update({1: 2, 3: 4})", "extra": "<b>Frequency map pattern</b> — <code>mp[x] = mp.get(x, 0) + 1</code> — anagram, duplicates, count problems mein sabse zyada repeat hone wala idiom. Interview tip: <code>mp.get(x, default)</code> Java ke <code>getOrDefault</code> jaisa hi hai. Python dict insertion order maintain karta hai.", "cpp": "#include <iostream>\n#include <unordered_map>\n#include <vector>\nusing namespace std;\n\nint main() {\n    unordered_map<int, int> mp;\n    mp[5] = 10;\n    int v = mp[5];                     // 10\n    bool has = mp.count(5);            // 1 ya 0\n    mp.erase(5);\n    int d = mp.count(3) ? mp[3] : 0;   // default value\n    cout << v << \" \" << has << \" \" << d << \"\\n\";\n\n    // frequency counting\n    vector<int> arr = {1, 2, 3, 2, 1, 2};\n    for (int x : arr) mp[x] = mp[x] + 1;   // mp[x] auto 0 se shuru\n\n    // multiple keys update\n    mp[1] = 2;\n    mp[3] = 4;\n\n    for (auto& e : mp) cout << e.first << \":\" << e.second << \" \";\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "12. Collections", "title": "Dict Traversal & Map Methods", "note": "Keys, values aur entries iterate karne ke dono languages ke tareeke.", "type": "table", "headers": ["Kaam", "Java", "Python"], "rows": [["Key+Value loop", "<code>for(Map.Entry e : map.entrySet())</code>", "<code>for k, v in mp.items():</code>"], ["Sirf keys", "<code>for(int k : map.keySet())</code>", "<code>for k in mp:</code>"], ["Sirf values", "<code>for(int v : map.values())</code>", "<code>for v in mp.values():</code>"], ["Key check", "<code>map.containsKey(k)</code>", "<code>k in mp</code>"], ["Value check", "<code>map.containsValue(v)</code>", "<code>v in mp.values()</code>"], ["Size", "<code>map.size()</code>", "<code>len(mp)</code>"], ["Add/Update", "<code>map.put(k,v)</code>", "<code>mp[k] = v</code>"], ["Default get", "<code>map.getOrDefault(k,d)</code>", "<code>mp.get(k,d)</code>"], ["Sorted by key", "<code>new TreeMap&lt;&gt;(map)</code>", "<code>dict(sorted(mp.items()))</code>"], ["Top frequent", "Manual heap", "<code>Counter(arr).most_common(k)</code>"]]}, {"cat": "12. Collections", "title": "Stack", "note": "LIFO structure — Python mein plain list hi stack hai. append() push, pop() pop, arr[-1] peek.", "type": "code", "java": "Stack<Integer> st = new Stack<>();\nst.push(10);\nst.push(20);\nint top = st.peek();      // 20\nst.pop();                  // 20 nikla\nboolean empty = st.isEmpty();\nint sz = st.size();", "python": "st = []\nst.append(10)\nst.append(20)\ntop = st[-1]              # peek\nst.pop()                  # 20 nikla\nempty = len(st) == 0\nsz = len(st)", "extra": "Python mein <code>list.append()</code> aur <code>list.pop()</code> O(1) hain — alag Stack class ki zarurat nahi. Stack ke classic problems: balanced parentheses, reverse polish notation, monotonic stack (next greater element). Logic dono languages mein same.", "cpp": "#include <iostream>\n#include <stack>\nusing namespace std;\n\nint main() {\n    stack<int> st;\n    st.push(10);\n    st.push(20);\n    int top = st.top();      // 20 (peek)\n    st.pop();                // 20 nikla\n    bool empty = st.empty();\n    int sz = st.size();      // ab 1\n    cout << \"top=\" << top << \" empty=\" << empty << \" size=\" << sz << \"\\n\";\n    return 0;\n}"}, {"cat": "12. Collections", "title": "Queue & Deque", "note": "FIFO structure. Python mein hamesha <code>collections.deque</code> use karo — normal list ka pop(0) O(n) hai (BFS mein TLE lagega).", "type": "code", "java": "Queue<Integer> q = new LinkedList<>();\nq.add(10);\nq.add(20);\nint front = q.poll();     // 10 (null if empty)\nint peek = q.peek();      // 20\n\n// Deque = double-ended\nDeque<Integer> dq = new ArrayDeque<>();\ndq.addFirst(5); dq.addLast(6);\nint f = dq.removeFirst();\nint l = dq.removeLast();", "python": "from collections import deque\nq = deque()\nq.append(10)\nq.append(20)\nfront = q.popleft()       # 10\npeek = q[0]               # 20\n\n# double-ended 🔥\ndq = deque()\ndq.appendleft(5); dq.append(6)\nf = dq.popleft()\nl = dq.pop()", "extra": "⚠️ <b>Ye galti mat karna:</b> Python <code>list.pop(0)</code> O(n) hai (saare elements shift hote hain). <code>deque.popleft()</code> O(1) hai. BFS, sliding window, task scheduler — sabme deque hi use hota hai. Java mein Queue interface + LinkedList/ArrayDeque implementation.", "cpp": "#include <iostream>\n#include <queue>\n#include <deque>\nusing namespace std;\n\nint main() {\n    queue<int> q;\n    q.push(10);\n    q.push(20);\n    int front = q.front();   // 10\n    q.pop();                 // 10 nikla\n    int peek = q.front();    // 20\n    cout << front << \" \" << peek << \"\\n\";\n\n    // deque = double-ended\n    deque<int> dq;\n    dq.push_front(5);\n    dq.push_back(6);\n    int f = dq.front();\n    int l = dq.back();\n    dq.pop_front();\n    dq.pop_back();\n    cout << f << \" \" << l << \"\\n\";\n    return 0;\n}"}, {"cat": "12. Collections", "title": "PriorityQueue / Heap", "note": "Java ka PriorityQueue default min-heap. Python ka heapq module — par sirf min-heap, max-heap ke liye negate karo.", "type": "code", "java": "PriorityQueue<Integer> pq = new PriorityQueue<>();\npq.add(10);\npq.add(5);\nint min = pq.poll();        // 5 (min-heap default)\nint top = pq.peek();        // 10\n\n// max-heap:\nPriorityQueue<Integer> maxpq =\n    new PriorityQueue<>(Collections.reverseOrder());", "python": "import heapq\npq = []\nheapq.heappush(pq, 10)\nheapq.heappush(pq, 5)\nmn = heapq.heappop(pq)      # 5 (min-heap default)\ntop = pq[0]                 # 10 (peek)\n\n# max-heap trick 🔥 negate karo\nheapq.heappush(pq, -10)\nmx = -heapq.heappop(pq)\n\n# array se heap bananao\nheapq.heapify(arr)", "extra": "<b>K Largest pattern:</b> kth largest nikalne ke liye min-heap size k rakho. Python negate-trick: push karte waqt <code>-x</code>, pop karke <code>-y</code>. <code>heapify(arr)</code> O(n) mein array ko heap banata hai. Ye DSA interview ka sabse common pattern hai (K largest, median of stream, merge k sorted lists).", "cpp": "#include <iostream>\n#include <queue>\n#include <vector>\n#include <functional>\nusing namespace std;\n\nint main() {\n    // min-heap: greater<> comparator lagana padta hai\n    priority_queue<int, vector<int>, greater<int>> pq;\n    pq.push(10);\n    pq.push(5);\n    int mn = pq.top();       // 5\n    pq.pop();\n    int top = pq.top();      // 10\n    cout << mn << \" \" << top << \"\\n\";\n\n    // max-heap: default comparator hi kaafi hai\n    priority_queue<int> maxpq;\n    maxpq.push(10);\n    maxpq.push(5);\n    cout << maxpq.top() << \"\\n\";   // 10\n    return 0;\n}"}, {"cat": "12. Collections", "title": "Linked List", "note": "Java mein built-in LinkedList class hai. Python mein khud Node class banani padti hai — interview mein linked list problems isi Node class se solve hoti hain.", "type": "code", "java": "LinkedList<Integer> list = new LinkedList<>();\nlist.add(10);\nlist.addFirst(5);\nlist.addLast(20);\nlist.getFirst();   // 5\nlist.getLast();    // 20", "python": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\nhead = Node(10)\nhead.next = Node(20)\n\n# traversal\ncur = head\nwhile cur:\n    print(cur.data)\n    cur = cur.next", "extra": "<b>Interview flow:</b> Python mein linked list ke saare patterns isi Node class se karo — reverse (3 pointers), mid (slow-fast), cycle detect (Floyd's). Java ke built-in LinkedList se problem-solving nahi hoti, DSA mein Node class hi use karte hain.", "cpp": "#include <iostream>\nusing namespace std;\n\nstruct Node {                 // DSA me Node class se solve karte hain\n    int data;\n    Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\n\nint main() {\n    Node* head = new Node(10);\n    head->next = new Node(20);\n\n    // traversal\n    for (Node* cur = head; cur; cur = cur->next)\n        cout << cur->data << \"\\n\";     // 10, 20\n\n    // cleanup\n    while (head) { Node* t = head; head = head->next; delete t; }\n    return 0;\n}"}, {"type": "lc", "cat": "12. Collections", "title": "Q61 · LRU Cache", "diff": "M", "note": "HashMap + Doubly Linked List se O(1) get/put — ye question interview mein sabse zyada poochte hain.", "java": "class LRUCache {\n    int cap;\n    Map<Integer, Node> map = new HashMap<>();\n    Node head = new Node(0,0), tail = new Node(0,0);\n    class Node { int k,v; Node prev,next;\n        Node(int k,int v){this.k=k;this.v=v;} }\n    public LRUCache(int capacity) {\n        cap = capacity;\n        head.next = tail; tail.prev = head;\n    }\n    void remove(Node n) {\n        n.prev.next = n.next;\n        n.next.prev = n.prev;\n    }\n    void addFirst(Node n) {\n        n.next = head.next; n.prev = head;\n        head.next.prev = n; head.next = n;\n    }\n    public int get(int key) {\n        if (!map.containsKey(key)) return -1;\n        Node n = map.get(key);\n        remove(n); addFirst(n);\n        return n.v;\n    }\n    public void put(int key, int val) {\n        if (map.containsKey(key))\n            remove(map.get(key));\n        Node n = new Node(key, val);\n        addFirst(n); map.put(key, n);\n        if (map.size() > cap) {\n            Node lru = tail.prev;\n            remove(lru); map.remove(lru.k);\n        }\n    }\n}", "python": "from collections import OrderedDict\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.cache = OrderedDict()\n    def get(self, key):\n        if key not in self.cache:\n            return -1\n        self.cache.move_to_end(key)\n        return self.cache[key]\n    def put(self, key, value):\n        if key in self.cache:\n            self.cache.move_to_end(key)\n        self.cache[key] = value\n        if len(self.cache) > self.cap:\n            self.cache.popitem(last=False)", "extra": "<b>Interview king:</b> Java: HashMap + Doubly Linked List manually. Python: <code>OrderedDict</code> shortcut. Get: key exist → move_to_end (most recent). Put: overflow → popitem(last=False) = LRU. O(1) get & put. LFU Cache bhi same pattern + frequency counter.", "cpp": "// Doubly Linked List + hashmap = LRU\nstruct Node {\n    int k, v;\n    Node* prev;\n    Node* next;\n    Node(int key, int val) : k(key), v(val), prev(nullptr), next(nullptr) {}\n};\n\nclass LRUCache {\n    int cap;\n    unordered_map<int, Node*> map;\n    Node *head, *tail;\n\n    void remove(Node* n) {\n        n->prev->next = n->next;\n        n->next->prev = n->prev;\n    }\n    void addFirst(Node* n) {\n        n->next = head->next; n->prev = head;\n        head->next->prev = n; head->next = n;\n    }\n\npublic:\n    LRUCache(int capacity) {\n        cap = capacity;\n        head = new Node(0, 0); tail = new Node(0, 0);\n        head->next = tail; tail->prev = head;\n    }\n    int get(int key) {\n        if (!map.count(key)) return -1;\n        Node* n = map[key];\n        remove(n); addFirst(n);\n        return n->v;\n    }\n    void put(int key, int val) {\n        if (map.count(key)) {\n            remove(map[key]);\n            delete map[key];\n        }\n        Node* n = new Node(key, val);\n        addFirst(n);\n        map[key] = n;\n        if (map.size() > (size_t)cap) {\n            Node* lru = tail->prev;\n            remove(lru);\n            map.erase(lru->k);\n            delete lru;\n        }\n    }\n};"}, {"cat": "12. Collections", "title": "Sawaal 5 — Collections ke Questions", "note": "HashMap, Stack, Queue, Heap test karo.", "type": "quiz", "questions": [{"q": "Java HashMap ka Python equivalent?", "opts": ["list", "tuple", "dict", "set"], "ans": 2, "expl": "<code>HashMap ↔ dict</code>. Key-value pairs. <code>mp[k] = v</code> put, <code>k in mp</code> containsKey, <code>mp.get(k, d)</code> getOrDefault."}, {"q": "Python mein Stack ke liye best kya hai?", "opts": ["collections.deque", "list (append/pop)", "dict", "heapq"], "ans": 1, "expl": "Stack = LIFO. <code>list.append()</code> push aur <code>list.pop()</code> pop — dono O(1). deque bhi chalega but list simpler hai."}, {"q": "Queue ke liye Python mein <code>list.pop(0)</code> kyu nahi use karna chahiye?", "opts": ["Chalta hai, bas slow nahi hai", "O(n) hai (elements shift hote hain)", "Syntax error deta hai", "pop(0) exist hi nahi karta"], "ans": 1, "expl": "<code>list.pop(0)</code> mein saare elements ko ek position shift karna padta hai → O(n). <code>deque.popleft()</code> O(1) hai."}, {"q": "Python heapq ka default behavior kya hai?", "opts": ["Max-heap", "Min-heap", "Stack", "Sorted list"], "ans": 1, "expl": "heapq hamesha min-heap hai — smallest element top pe. Max-heap ke liye values negate karke push/pop karo."}, {"q": "<code>mp.get(x, 0)</code> kya return karega agar x key exist nahi karti?", "opts": ["Error", "None", "0", "-1"], "ans": 2, "expl": "get ka second argument default value hai. Key missing → 0 return. Java mein <code>map.getOrDefault(x, 0)</code> same."}, {"q": "Set se duplicates hatane ka Python one-liner?", "opts": ["<code>arr.dedup()</code>", "<code>list(set(arr))</code>", "<code>arr.remove_dup()</code>", "<code>set.remove(arr)</code>"], "ans": 1, "expl": "<code>list(set(arr))</code> — set automatically duplicates hata deta hai. Note: order guaranteed nahi. Order chahiye toh loop se seen-set + nayi list banao."}]}, {"cat": "09. Functions", "title": "Functions & Multiple Returns", "note": "def keyword, koi return type declaration nahi, aur tuple-return ka magic — Python ka function Java se zyada flexible hai.", "type": "code", "java": "static int add(int a, int b) {\n    return a + b;\n}\nstatic void greet() {\n    System.out.println(\"Hi\");\n}\n\n// multiple return ke liye array/object chahiye\nstatic int[] calc(int a, int b) {\n    return new int[]{a + b, a - b};\n}\nint[] r = calc(10, 5);", "python": "def add(a, b):\n    return a + b\n\ndef greet():\n    print(\"Hi\")       # no return = returns None\n\n# multiple return 🔥\ndef calc(a, b):\n    return a + b, a - b   # technically tuple\n\ns, d = calc(10, 5)        # unpack directly", "extra": "Python function <b>ek saath multiple values return</b> karta hai (tuple ke form mein) — Java mein array, List ya custom class banani padti hai. Python ka koi bhi function return type declare nahi karta — aur <code>return</code> nahi likha toh <code>None</code> return hota hai.", "cpp": "#include <iostream>\n#include <utility>\nusing namespace std;\n\nint add(int a, int b) { return a + b; }\n\nvoid greet() { cout << \"Hi\\n\"; }   // no return = void\n\n// multiple return ke liye pair/tuple/struct chahiye\npair<int, int> calc(int a, int b) {\n    return {a + b, a - b};\n}\n\nint main() {\n    greet();\n    auto [s, d] = calc(10, 5);     // unpack directly\n    cout << s << \" \" << d << \"\\n\"; // 15 5\n    return 0;\n}"}, {"cat": "09. Functions", "title": "Default Arguments & *args", "note": "Java ka method overloading Python mein default arguments aur *args se replace hota hai — same kaam, kam code.", "type": "code", "java": "// method overloading: same name, different params\nstatic int add(int a, int b) { return a + b; }\nstatic int add(int a, int b, int c) {\n    return a + b + c;\n}\n\nadd(1, 2);        // 3\nadd(1, 2, 3);     // 6", "python": "def add(a, b, c=0):      # default argument\n    return a + b + c\n\nadd(1, 2)          # 3\nadd(1, 2, 3)       # 6\n\n# variable number of args 🔥\ndef total(*nums):\n    return sum(nums)\n\ntotal(1, 2, 3, 4)  # 10", "extra": "Java mein overloading ke liye har signature ke liye alag method likhna padta hai. Python mein <code>default arguments</code> + <code>*args</code> ek hi function mein sab handle kar leta hai. Bonus: Python <code>def f(**kwargs)</code> se named arguments ka dict milta hai.", "cpp": "#include <iostream>\n#include <initializer_list>\nusing namespace std;\n\n// C++ default arguments — Java overloading ka kaam ek function mein\nint add(int a, int b, int c = 0) {\n    return a + b + c;\n}\n\n// variable number of args\nint total(initializer_list<int> nums) {\n    int s = 0;\n    for (int x : nums) s += x;\n    return s;\n}\n\nint main() {\n    cout << add(1, 2) << \"\\n\";            // 3\n    cout << add(1, 2, 3) << \"\\n\";         // 6\n    cout << total({1, 2, 3, 4}) << \"\\n\";  // 10\n    return 0;\n}"}, {"cat": "09. Functions", "title": "Lambda Expressions", "note": "Anonymous one-line functions — sorting ke saath combination mein sabse powerful. Python lambdas return statement nahi likhte.", "type": "code", "java": "// Java lambda\n(a, b) -> a + b\n\nComparator<int[]> cmp = (a, b) -> a[0] - b[0];\nlist.sort((a, b) -> a[0] - b[0]);\n\nArrays.sort(intervals, (a, b) ->\n    a[0] != b[0] ? a[0] - b[0] : a[1] - b[1]);", "python": "add = lambda a, b: a + b\n\narr.sort(key=lambda x: x[0])          # by first element\narr.sort(key=lambda x: x[1], reverse=True)\nintervals.sort(key=lambda x: (x[0], x[1]))   # multi-key 🔥\n\n# filter/map with lambda\nevens = list(filter(lambda x: x % 2 == 0, arr))\ndoubled = list(map(lambda x: x * 2, arr))", "extra": "Python lambda ek <b>single expression</b> hota hai — jo likha wo auto-return hota hai, <code>return</code> keyword nahi likhte. Sorting mein <code>key=lambda</code> sabse common. Multi-key sort: <code>key=lambda x: (x[0], x[1])</code> — Java mein comparator ke andar nested condition lagani padti.", "cpp": "#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <iterator>\nusing namespace std;\n\nint main() {\n    // lambda: single expression, auto-return\n    auto add = [](int a, int b) { return a + b; };\n    cout << add(1, 2) << \"\\n\";   // 3\n\n    // sort by first, then second (multi-key)\n    vector<vector<int>> intervals = {{3, 1}, {1, 2}, {1, 1}};\n    sort(intervals.begin(), intervals.end(), [](const vector<int>& a, const vector<int>& b) {\n        if (a[0] != b[0]) return a[0] < b[0];\n        return a[1] < b[1];\n    });\n    for (auto& iv : intervals) cout << iv[0] << \",\" << iv[1] << \" \";\n    cout << \"\\n\";   // 1,1 1,2 3,1\n\n    // filter/map with lambda\n    vector<int> arr = {1, 2, 3, 4, 5, 6};\n    vector<int> evens, doubled;\n    copy_if(arr.begin(), arr.end(), back_inserter(evens),\n            [](int x) { return x % 2 == 0; });\n    transform(arr.begin(), arr.end(), back_inserter(doubled),\n              [](int x) { return x * 2; });\n    cout << \"evens: \";   for (int x : evens) cout << x << \" \";  cout << \"\\n\";\n    cout << \"double: \";  for (int x : doubled) cout << x << \" \"; cout << \"\\n\";\n    return 0;\n}"}, {"cat": "09. Functions", "title": "Sawaal 6 — Functions ke Questions", "note": "def, lambdas, return patterns test karo.", "type": "quiz", "questions": [{"q": "Python function mein return type declare karna zaroori hai?", "opts": ["Ha", "Nahi", "Sirf int ke liye", "Depends on compiler"], "ans": 1, "expl": "Python dynamically typed hai — return type declare nahi hota. <code>def add(a,b): return a+b</code> — bas itna."}, {"q": "<code>def f(): return 1, 2</code> — f() kya return karega?", "opts": ["1", "2", "Error", "Tuple (1, 2)"], "ans": 3, "expl": "Multiple values comma se likhne se tuple return hota hai. Unpack: <code>a, b = f()</code>."}, {"q": "Python lambda ka sahi syntax?", "opts": ["<code>lambda a, b: return a+b</code>", "<code>lambda a, b: a + b</code>", "<code>def lambda(a,b)</code>", "<code>lambda(a,b) → a+b</code>"], "ans": 1, "expl": "Lambda mein return keyword nahi hota — expression hi auto-return hoti hai. <code>add = lambda a,b: a+b</code>."}, {"q": "Java <code>this</code> ka Python equivalent?", "opts": ["<code>me</code>", "<code>self</code>", "<code>it</code>", "<code>this</code>"], "ans": 1, "expl": "Python mein har method ka pehla parameter <code>self</code> hota hai jo current object ko point karta hai — Java ka this."}, {"q": "<code>arr.sort(key=lambda x: x[1], reverse=True)</code> kya karta hai?", "opts": ["Pehle element se descending", "Doosre element se descending", "Kuch nahi", "Ascending by second"], "ans": 1, "expl": "key = second element (index 1), reverse=True = descending. Ye 'sort by second column' pattern interview mein bahut use hota."}, {"q": "Java method overloading ka Python equivalent?", "opts": ["Alag-alag method names", "Default arguments + *args", "Interfaces", "Constructor"], "ans": 1, "expl": "Python overloading support nahi karta — default args (<code>def f(a, b=0)</code>) aur <code>*args</code> hi same kaam karte hain."}]}, {"cat": "13. OOP", "title": "Class & Constructor", "note": "this → self, aur constructor ka naam Python mein hamesha <code>__init__</code> hota hai. 'new' keyword bhi nahi chahiye.", "type": "code", "java": "class Student {\n    String name;\n    int age;\n\n    Student(String name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\n    void introduce() {\n        System.out.println(\"Hi, \" + name);\n    }\n}\n\nStudent s = new Student(\"Vinay\", 20);", "python": "class Student:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def introduce(self):\n        print(f\"Hi, {self.name}\")\n\ns = Student(\"Vinay\", 20)   # 'new' nahi chahiye", "extra": "<b>Key fark:</b> Java ka constructor class ke naam se banta hai (<code>Student(...)</code>); Python mein hamesha <code>__init__</code>. Har instance method ka <b>pehla parameter self</b> hona chahiye. Python mein variables class body mein declare nahi hote — constructor ke andar <code>self.xyz</code> se bante hain.", "cpp": "#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Student {\npublic:\n    string name;\n    int age;\n\n    // constructor class ke naam se banta hai\n    Student(string name, int age) {\n        this->name = name;\n        this->age = age;\n    }\n\n    void introduce() {\n        cout << \"Hi, \" << name << \"\\n\";\n    }\n};\n\nint main() {\n    Student s(\"Vinay\", 20);   // 'new' nahi chahiye jab stack object ho\n    s.introduce();\n    return 0;\n}"}, {"cat": "13. OOP", "title": "Encapsulation & Visibility", "note": "Java ka private/public enforcement strong hai. Python mein sab default public — private ka sirf convention hai (underscore).", "type": "code", "java": "public class Bank {\n    private double balance;      // sirf class ke andar\n\n    public void deposit(double amt) {\n        if (amt > 0) balance += amt;\n    }\n    public double getBalance() {\n        return balance;\n    }\n}\n\n// getter/setter patterns", "python": "class Bank:\n    def __init__(self):\n        self.__balance = 0     # name-mangled (private-ish)\n        self._internal = 0     # convention: \"protected\"\n\n    def deposit(self, amt):\n        if amt > 0:\n            self.__balance += amt\n\n    def get_balance(self):\n        return self.__balance\n\n    @property\n    def balance(self):         # 🔥 pythonic getter\n        return self.__balance", "extra": "Java <code>private</code> compiler-level enforced hai. Python mein <code>_x</code> convention hai (mat chhoo), <code>__x</code> name-mangling karta hai (class ke bahar se na access ho). Pythonic getter/setter: <code>@property</code> decorator — <code>b.balance</code> padhna allowed, direct set nahi.", "cpp": "#include <iostream>\nusing namespace std;\n\nclass Bank {\nprivate:\n    double balance;      // sirf class ke andar\n\npublic:\n    Bank() : balance(0) {}\n    void deposit(double amt) {\n        if (amt > 0) balance += amt;\n    }\n    double getBalance() {   // getter\n        return balance;\n    }\n};\n\nint main() {\n    Bank b;\n    b.deposit(100);\n    b.deposit(-50);        // negative ignore\n    cout << b.getBalance() << \"\\n\";   // 100\n    return 0;\n}"}, {"cat": "13. OOP", "title": "Inheritance & Exceptions", "note": "extends → parenthesis, try-catch → try-except. Structure dono mein same rehta hai.", "type": "code", "java": "class Animal {\n    Animal(String name) { this.name = name; }\n    void speak() { System.out.println(\"...\"); }\n}\n\nclass Dog extends Animal {\n    Dog(String name) { super(name); }\n    @Override void speak() {\n        System.out.println(\"Woof!\");\n    }\n}\n\ntry {\n    int x = 10 / 0;\n} catch (Exception e) {\n    System.out.println(e);\n} finally {\n    System.out.println(\"Done\");\n}", "python": "class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        print(\"...\")\n\nclass Dog(Animal):\n    def __init__(self, name):\n        super().__init__(name)\n    def speak(self):\n        print(\"Woof!\")\n\ntry:\n    x = 10 / 0\nexcept Exception as e:\n    print(e)\nfinally:\n    print(\"Done\")", "extra": "<code>class X extends Y</code> → <code>class X(Y):</code>. <code>super()</code> dono mein same. Multiple inheritance: Python allow karta hai (<code>class C(A, B)</code>), Java mein interfaces se simulate hota. Exception hierarchy bhi similar: specific se generic catch karo.", "cpp": "#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\nclass Animal {\npublic:\n    string name;\n    Animal(string name) : name(name) {}\n    virtual void speak() { cout << \"...\\n\"; }\n};\n\nclass Dog : public Animal {\npublic:\n    Dog(string name) : Animal(name) {}\n    void speak() override { cout << \"Woof!\\n\"; }\n};\n\nint main() {\n    Dog d(\"Tommy\");\n    d.speak();              // Woof!\n\n    try {\n        throw runtime_error(\"10 / 0 -> exception\");  // C++ me /0 UB hai\n    } catch (const exception& e) {\n        cout << e.what() << \"\\n\";\n    }\n    // finally nahi — C++ RAII/destructor ka kaam\n    return 0;\n}"}, {"cat": "13. OOP", "title": "Sawaal 7 — OOP ke Questions", "note": "Classes, inheritance, exceptions test karo.", "type": "quiz", "questions": [{"q": "Python constructor ka naam kya hai?", "opts": ["<code>constructor()</code>", "<code>__init__()</code>", "<code>this()</code>", "<code>init()</code>"], "ans": 1, "expl": "Python constructor hamesha <code>__init__(self, ...)</code> hota hai. Java mein class ke naam se banta hai."}, {"q": "<code>class Dog(Animal):</code> ka kya matlab hai?", "opts": ["Dog ko Animal se banao", "Dog, Animal ka parent hai", "Dog, Animal se inherit karta hai", "Syntax error"], "ans": 2, "expl": "Parenthesis mein parent class hoti hai — Java ka <code>extends</code>. Dog, Animal ki properties/methods inherit karega."}, {"q": "Python mein private variable ka convention kya hai?", "opts": ["<code>private</code> keyword", "<code>_name</code> underscore", "<code>self.__name</code>", "Koi tarika nahi"], "ans": 1, "expl": "Python mein sab public hai. <code>_name</code> = convention (mat chhoo), <code>__name</code> = name mangling se effectively private. Java ke private jaisa compiler enforcement nahi."}, {"q": "<code>try/except Exception as e</code> mein <code>as e</code> se kya milta hai?", "opts": ["Exception ka message", "Exception object (error details)", "Error line number", "Code"], "ans": 1, "expl": "<code>e</code> exception object hai — <code>print(e)</code> se message dikhta hai. Java mein <code>catch(Exception e)</code> similar."}, {"q": "Python multiple inheritance allowed hai?", "opts": ["Nahi", "Haan, <code>class C(A, B)</code>", "Sirf Java mein", "Sirf interfaces se"], "ans": 1, "expl": "Python <code>class C(A, B):</code> allow karta hai. Java mein ek class ek hi class extend kar sakti hai — multiple ke liye interfaces."}, {"q": "Java mein <code>new Student(\"Vinay\")</code> — Python equivalent?", "opts": ["<code>new Student(\"Vinay\")</code>", "<code>Student(\"Vinay\")</code>", "<code>Student.create(\"Vinay\")</code>", "<code>new.Student(\"Vinay\")</code>"], "ans": 1, "expl": "Python mein <code>new</code> keyword nahi hota — bas class ko call karo: <code>Student(\"Vinay\")</code>. Ye constructor ko call karta hai."}]}, {"cat": "18. Utility & Tricks", "title": "Math Functions", "note": "Java ki Math class ke methods vs Python ke built-in aur math module — abs, max, min built-in hain, baaki import chahiye.", "type": "table", "headers": ["Java", "Python", "Note"], "rows": [["<code>Math.abs(x)</code>", "<code>abs(x)</code>", "Built-in, import nahi chahiye"], ["<code>Math.max(a,b)</code>", "<code>max(a,b)</code>", "Built-in"], ["<code>Math.min(a,b)</code>", "<code>min(a,b)</code>", "Built-in"], ["<code>Math.pow(a,b)</code>", "<code>a ** b</code>", "Operator hai, function nahi"], ["<code>Math.sqrt(x)</code>", "<code>math.sqrt(x)</code>", "import math"], ["<code>Math.ceil(x)</code>", "<code>math.ceil(x)</code>", "import math"], ["<code>Math.floor(x)</code>", "<code>math.floor(x)</code>", "import math"], ["Factorial (loop)", "<code>math.factorial(n)</code>", "Python built-in!"], ["GCD", "<code>BigInteger.gcd()</code>", "<code>math.gcd(a,b)</code>"], ["<code>Arrays.binarySearch()</code>", "<code>bisect.bisect_left()</code>", "import bisect"], ["Random", "<code>new Random().nextInt(n)</code>", "<code>random.randint(0,n)</code>"]]}, {"cat": "18. Utility & Tricks", "title": "Collections Module — Python Power Tools 🔥", "note": "Ye imports Java mein exist hi nahi karte — Counter, defaultdict, deque. DSA problems (frequency, BFS, top-k) ek line mein solve ho jaati hain.", "type": "code", "java": "// Java: sab manually likhna padta hai\nHashMap<Integer,Integer> freq = new HashMap<>();\nfor (int x : arr) {\n    freq.put(x, freq.getOrDefault(x, 0) + 1);\n}\n\n// top-2 frequent: heap + manual count\nPriorityQueue<int[]> pq = new PriorityQueue<>(\n    (a, b) -> a[1] - b[1]);\nfor (var e : freq.entrySet()) {\n    pq.add(new int[]{e.getKey(), e.getValue()});\n    if (pq.size() > 2) pq.poll();\n}", "python": "from collections import Counter, defaultdict, deque\n\nfreq = Counter(arr)            # 🔥 one-liner frequency\nfreq.most_common(2)            # top 2 frequent\n\ndd = defaultdict(int)          # missing key = auto 0\ndd[x] += 1                     # getOrDefault chahiye nahi\n\nd = defaultdict(list)          # missing key = auto []\nd[key].append(val)\n\n# deque BFS ready\nq = deque([start])", "extra": "<b>Counter</b> = dictionary + counting methods (<code>most_common</code>, <code>elements</code>, <code>update</code>). <b>defaultdict</b> = missing key pe default value auto-create (<code>int</code> → 0, <code>list</code> → [], <code>lambda: set()</code>). Ye Python ke special weapons hain — anagram, majority element, frequency-based problems me time bachate hain.", "cpp": "#include <iostream>\n#include <unordered_map>\n#include <vector>\n#include <queue>\n#include <functional>\n#include <utility>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 2, 3, 2, 1, 2, 4, 1};\n\n    // frequency counting — Counter/defaultdict jaisa\n    unordered_map<int, int> freq;\n    for (int x : arr) freq[x] = freq[x] + 1;   // missing key = auto 0\n\n    // top-2 frequent: min-he
