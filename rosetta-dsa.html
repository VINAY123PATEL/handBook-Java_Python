 exceptions = compiler force karta hai handle karne ko (IOException wagera). Python mein ye concept nahi — sab runtime pe aata hai. Java ke <code>throws</code> keyword ka Python mein equivalent nahi.", "cpp": "#include <fstream>\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\n// C++ — SIRF 'unchecked' (runtime) exceptions hain;\n// Java jaisa checked/unchecked ka distinction NAHI hai.\n// Compiler kuch handle karne ko force nahi karta.\n\n// CUSTOM EXCEPTION\nclass AgeException : public exception {\npublic:\n    explicit AgeException(const char* msg) : message(msg) {}\n    const char* what() const noexcept override { return message; }\n\nprivate:\n    const char* message;\n};\n\n// Java ke 'throws' ka C++ mein koi equivalent nahi —\n// bas documentation ke liye comment/reference\nvoid validate(int age) {\n    if (age < 0) throw AgeException(\"Negative age\");\n}\n\nint main() {\n    // Java checked exception (FileNotFoundException) jaisi cheez:\n    // yahan compiler force nahi karta — runtime pe file open hoti hai\n    ifstream f(\"file.txt\");\n    if (!f) {\n        cout << \"File nahi mili\\n\";   // checking manually\n    } else {\n        cout << \"File mil gayi\\n\";\n    }\n\n    try {\n        validate(-5);\n    } catch (const AgeException& e) {\n        cout << \"Caught: \" << e.what() << \"\\n\";\n    }\n\n    // Common C++ exceptions: std::out_of_range, std::invalid_argument,\n    // std::bad_alloc, std::length_error — sab runtime pe aate hain.\n    return 0;\n}"}, {"cat": "14. Exception Handling", "title": "Common Exceptions — Dono Languages", "note": "Ye exceptions interview mein bahut poochte hain. Inke messages yaad rakhna — debugging mein helpful hai.", "type": "table", "headers": ["Exception", "Java", "Python", "Kab Aata Hai?"], "rows": [["Null/None access", "NullPointerException", "AttributeError / TypeError", "null pe method call"], ["Index out of range", "ArrayIndexOutOfBoundsException", "IndexError", "arr[100] when size=3"], ["Division by zero", "ArithmeticException", "ZeroDivisionError", "5 / 0"], ["Type mismatch", "ClassCastException", "TypeError", "int + str"], ["File not found", "FileNotFoundException", "FileNotFoundError", "galat filename"], ["Key not found", "NoSuchElementException", "KeyError", "dict[\"missing\"]"], ["Number format", "NumberFormatException", "ValueError", "Integer.parseInt(\"abc\")"], ["Stack overflow", "StackOverflowError", "RecursionError", "infinite recursion"], ["Out of memory", "OutOfMemoryError", "MemoryError", "bahut bada array"]], "extra": "<b>Tip:</b> Debugging mein sabse pehle ERROR MESSAGE padho — wo exactly batata hai kya problem hai. Stack trace mein top line dekho — wahan actual error hota hai."}, {"cat": "14. Exception Handling", "title": "Exception Handling Best Practices", "note": "Ye practices follow karo to code production-ready banega. Interview mein ye poochte hain.", "type": "code", "java": "// JAVA BEST PRACTICES\n\n// 1. Specific exceptions catch karo\n// BAD\ntry { ... }\ncatch (Exception e) { ... }  // too broad\n\n// GOOD\ntry { ... }\ncatch (FileNotFoundException e) { ... }\ncatch (IOException e) { ... }\n\n// 2. Resource management — try-with-resources\ntry (BufferedReader br = new BufferedReader(\n        new FileReader(\"file.txt\"))) {\n    String line = br.readLine();\n}  // auto-close\n\n// 3. Custom exceptions banao for business logic\nclass InsufficientBalance extends Exception {\n    private double amount;\n    InsufficientBalance(double amount) {\n        super(\"Balance kam hai: \" + amount);\n        this.amount = amount;\n    }\n}\n\n// 4. Never swallow exceptions\n// BAD: catch (Exception e) { }\n// GOOD: log karo ya rethrow karo", "python": "# PYTHON BEST PRACTICES\n\n# 1. Specific exceptions catch karo\n# BAD\ntry:\n    ...\nexcept Exception as e:  # too broad\n    ...\n\n# GOOD\ntry:\n    ...\nexcept FileNotFoundError as e:\n    ...\nexcept PermissionError as e:\n    ...\n\n# 2. Context manager for resources\nwith open(\"file.txt\") as f:\n    content = f.read()\n# auto-close hota hai\n\n# 3. EAFP > LBYL\n# BAD (Look Before You Leap)\nif key in my_dict:\n    val = my_dict[key]\n\n# GOOD (Easier to Ask Forgiveness)\ntry:\n    val = my_dict[key]\nexcept KeyError:\n    val = default\n\n# 4. Bare except mat lagao\n# BAD: except:\n# GOOD: except ValueError:", "extra": "<b>Rule:</b> Specific exceptions catch karo, broad exception mat pakdo. Resources ke liye try-with-resources (Java) ya with statement (Python) use karo. Custom exceptions business logic ke liye banao.", "cpp": "// C++ EXCEPTION BEST PRACTICES\n\n#include <iostream>\n#include <fstream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// 3. Custom exception banao for business logic\nclass InsufficientBalance : public runtime_error {\npublic:\n    double amount;\n    InsufficientBalance(double a)\n        : runtime_error(\"Balance kam hai: \" + to_string(a)), amount(a) {}\n};\n\nint main() {\n    struct finally { ~finally() { cout << \"done\\n\"; } } fin; // RAII = finally\n\n    // 1. Specific exceptions catch karo\n    // BAD: catch (...) — too broad, kuch pata nahi chalta\n    try {\n        stoi(\"not a number\");\n    } catch (const invalid_argument& e) {        // specific pehle\n        cerr << \"Specific: \" << e.what() << \"\\n\";\n    } catch (const exception& e) {               // generic baad mein\n        cerr << \"General: \" << e.what() << \"\\n\";\n    }\n\n    // 2. Resource management — RAII (auto-close)\n    {\n        ofstream(\"file.txt\") << \"Hi from RAII\\n\";   // demo file banao\n        ifstream br(\"file.txt\");                    // BufferedReader jaisa\n        string line;\n        while (getline(br, line)) cout << line << \"\\n\";\n    }   // yahan file band ho gayi — finally ki zarurat nahi\n\n    // 3. Custom exception demo\n    try {\n        throw InsufficientBalance(250.5);\n    } catch (const InsufficientBalance& e) {\n        cerr << \"Custom: \" << e.what() << \"\\n\";\n    }\n\n    // 4. Never swallow exceptions — log karo ya rethrow karo\n    try {\n        throw runtime_error(\"kuch galat\");\n    } catch (const exception& e) {\n        cerr << \"log: \" << e.what() << \"\\n\";\n    }\n    return 0;\n}"}, {"cat": "15. File Handling", "title": "File Handling — Read & Write", "note": "File handling har project mein zaroori hai. Data save karna, read karna, process karna — sab file handling se hota hai.", "type": "code", "java": "// JAVA FILE HANDLING\n\n// Reading — BufferedReader (fast)\nimport java.io.*;\n\nBufferedReader br = new BufferedReader(\n    new FileReader(\"data.txt\"));\nString line;\nwhile ((line = br.readLine()) != null) {\n    System.out.println(line);\n}\nbr.close();\n\n// Reading — Files (Java NIO, easier)\nString content = Files.readString(Path.of(\"data.txt\"));\n\n// Writing — BufferedWriter\nBufferedWriter bw = new BufferedWriter(\n    new FileWriter(\"output.txt\"));\nbw.write(\"Hello World\");\nbw.newLine();\nbw.close();\n\n// try-with-resources (auto close)\ntry (BufferedReader br2 = new BufferedReader(\n        new FileReader(\"data.txt\"))) {\n    String line2;\n    while ((line2 = br2.readLine()) != null) {\n        System.out.println(line2);\n    }\n}\n\n// File check\nFile f = new File(\"data.txt\");\nf.exists();\nf.length();\nf.isDirectory();", "python": "# PYTHON FILE HANDLING\n\n# Reading\nwith open(\"data.txt\") as f:\n    content = f.read()       # full content as string\n\nwith open(\"data.txt\") as f:\n    lines = f.readlines()    # list of lines\n\nwith open(\"data.txt\") as f:\n    for line in f:           # line by line (memory efficient)\n        print(line.strip())\n\n# Writing\nwith open(\"output.txt\", \"w\") as f:\n    f.write(\"Hello World\")\n    f.write(\"\\n\")\n\n# Appending\nwith open(\"output.txt\", \"a\") as f:\n    f.write(\"New line\\n\")\n\n# File check\nimport os\nos.path.exists(\"data.txt\")\nos.path.getsize(\"data.txt\")\nos.path.isdir(\"data.txt\")\n\n# pathlib (modern approach)\nfrom pathlib import Path\np = Path(\"data.txt\")\np.exists()\np.read_text()\np.write_text(\"Hello\")\np.stat().st_size", "extra": "<b>Key differences:</b> (1) Java: <code>BufferedReader</code> / <code>BufferedWriter</code>. Python: <code>open()</code>. (2) Python ka <code>with</code> statement auto-close karta hai. Java ka try-with-resources same kaam karta hai. (3) Python: <code>'r'</code>, <code>'w'</code>, <code>'a'</code> mode flags. Java: <code>FileReader</code>, <code>FileWriter</code>.", "cpp": "// C++ FILE HANDLING\n\n#include <iostream>\n#include <fstream>\n#include <string>\nusing namespace std;\n\nint main() {\n    ofstream(\"data.txt\") << \"Hello World\\nLine 2\\n\";   // write (create)\n\n    // Reading — ifstream + getline (BufferedReader jaisa)\n    ifstream br(\"data.txt\");\n    string line;\n    while (getline(br, line)) {\n        cout << line << \"\\n\";\n    }\n    br.close();\n\n    // Writing — ofstream (BufferedWriter jaisa)\n    ofstream bw(\"output.txt\");\n    bw << \"Hello World\\n\";\n    bw.close();\n\n    // try-with-resources = RAII (auto close)\n    {\n        ifstream br2(\"data.txt\");\n        string line2;\n        getline(br2, line2);\n        cout << \"First line: \" << line2 << \"\\n\";\n    }   // yahan auto-close ho gaya\n\n    // File check\n    ifstream f(\"data.txt\");\n    cout << \"exists: \" << (bool)f << \"\\n\";\n    f.seekg(0, ios::end);\n    streampos len = f.tellg();\n    cout << \"bytes: \" << static_cast<streamoff>(len) << \"\\n\";\n    f.close();\n    return 0;\n}"}, {"cat": "15. File Handling", "title": "File Modes & Operations", "note": "File open kaise karte hain — modes kya hain. Read, write, append, binary modes.", "type": "table", "headers": ["Operation", "Java", "Python"], "rows": [["Read text", "new FileReader(f)", "open(f, 'r')"], ["Write text (overwrite)", "new FileWriter(f)", "open(f, 'w')"], ["Append", "new FileWriter(f, true)", "open(f, 'a')"], ["Read binary", "new FileInputStream(f)", "open(f, 'rb')"], ["Write binary", "new FileOutputStream(f)", "open(f, 'wb')"], ["Read all lines", "Files.readAllLines()", "f.readlines()"], ["Write all lines", "Files.write()", "f.writelines()"], ["Check exists", "new File(f).exists()", "os.path.exists(f)"], ["Delete file", "new File(f).delete()", "os.remove(f)"], ["Create dir", "new File(d).mkdir()", "os.makedirs(d)"], ["List files", "new File(d).list()", "os.listdir(d)"]], "extra": "<b>Python shortcut:</b> <code>with open('file.txt') as f:</code> — ye yaad rakhna. Ye sabse commonly use hota hai. Java mein try-with-resources same kaam karta hai."}, {"cat": "15. File Handling", "title": "CSV & JSON File Handling", "note": "Data files ke saath kaam karna interview aur projects mein bahut zaroori hai. CSV aur JSON sabse common formats hain.", "type": "code", "java": "// JAVA — CSV reading (using Scanner)\nScanner sc = new Scanner(new File(\"data.csv\"));\nwhile (sc.hasNextLine()) {\n    String[] parts = sc.nextLine().split(\",\");\n    System.out.println(parts[0] + \" -> \" + parts[1]);\n}\n\n// JAVA — JSON (using Gson library)\nimport com.google.gson.Gson;\nimport com.google.gson.reflect.TypeToken;\n\n// Parse JSON\nString json = \"{\\\"name\\\":\\\"Vinay\\\",\\\"age\\\":25}\";\nGson gson = new Gson();\nUser user = gson.fromJson(json, User.class);\n\n// Write JSON\nString output = gson.toJson(user);", "python": "# PYTHON — CSV reading\nimport csv\n\nwith open('data.csv') as f:\n    reader = csv.reader(f)\n    for row in reader:\n        print(row[0], row[1])\n\n# CSV with headers\nwith open('data.csv') as f:\n    reader = csv.DictReader(f)\n    for row in reader:\n        print(row['name'], row['age'])\n\n# CSV writing\nwith open('out.csv', 'w', newline='') as f:\n    writer = csv.writer(f)\n    writer.writerow(['Name', 'Age'])\n    writer.writerow(['Vinay', 25])\n\n# PYTHON — JSON\nimport json\n\n# Parse JSON\nwith open('data.json') as f:\n    data = json.load(f)\n\n# Write JSON\ndata = {'name': 'Vinay', 'age': 25}\nwith open('out.json', 'w') as f:\n    json.dump(data, f, indent=2)\n\n# String to dict\ndata = json.loads('{\"name\": \"Vinay\"}')", "extra": "<b>Python advantage:</b> CSV aur JSON ke liye Python mein built-in modules hain (<code>csv</code>, <code>json</code>). Java mein ya library chahiye (Gson, Jackson) ya manual parsing. Python mein data processing bahut easy hai isliye Data Science mein popular hai.", "cpp": "// C++ — CSV & JSON handling\n// (Python json/csv built-in hain — C++ mein nahi, ye manual demo)\n\n#include <iostream>\n#include <fstream>\n#include <sstream>\n#include <string>\nusing namespace std;\n\nint main() {\n    ofstream(\"data.csv\") << \"Name,Age\\nVinay,25\\nRahul,30\\n\";\n    ofstream(\"data.json\") << \"{\\\"name\\\":\\\"Vinay\\\",\\\"age\\\":25}\";\n\n    // CSV reading — split by comma (Scanner jaisa)\n    ifstream f(\"data.csv\");\n    string line;\n    getline(f, line);                    // header skip\n    while (getline(f, line)) {\n        stringstream ss(line);\n        string name, age;\n        getline(ss, name, ',');\n        getline(ss, age, ',');\n        cout << name << \" -> \" << age << \"\\n\";\n    }\n\n    // JSON — C++ built-in nahi (nlohmann/json ya RapidJSON use karo)\n    // Neeche simple manual parse demo:\n    ifstream jf(\"data.json\");\n    string json, c;\n    while (getline(jf, c)) json += c;\n    size_t i = json.find(\"\\\"name\\\"\");            // \"name\" key\n    size_t start = json.find('\"', i + 7) + 1;    // value ka quote\n    size_t end = json.find('\"', start);\n    cout << \"name = \" << json.substr(start, end - start) << \"\\n\";\n\n    // Write JSON (manual)\n    ofstream(\"out.json\") << \"{\\\"name\\\":\\\"Vinay\\\",\\\"age\\\":25}\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "JDK / JRE / JVM & Program Flow", "note": "Java ka compile-run flow samjho — .java file javac se .class bytecode mein convert hoti hai, phir JVM usko run karta hai. Python mein ye step simple hai.", "type": "code", "java": "// COMPILE: .java -> .class (bytecode)\n$ javac Hello.java        // compiler: JDK ka part\n$ java Hello              // JVM run karta hai\n\n// 3 layers:\n// JVM  = bytecode RUN karta hai (platform-independent)\n// JRE  = JVM + libraries (run-time environment)\n// JDK  = JRE + tools (javac, javadoc, debugger)\n\n// \"Write once, run anywhere\"\n// .class bytecode kisi bhi OS ke JVM pe chalta hai", "python": "# .py file DIRECT run hoti hai (interpreted)\n$ python hello.py         # koi explicit compile nahi\n\n# lekin andar se:\n# .py -> bytecode (.pyc) -> PVM (Python Virtual Machine)\n\n# pip = Python ka package manager\n$ pip install requests\n\n# venv = project ka isolated environment\n$ python -m venv .venv", "extra": "<b>Interview flow:</b> JDK ⊃ JRE ⊃ JVM. Java compile+run — <code>javac</code> bytecode banata, <code>java</code> JVM pe chalat. Python interpreter hota hai — compile aur run ek saath. Dono languages platform-independent hain.", "cpp": "// COMPILE: .cpp -> .exe (native binary)\n// $ g++ hello.cpp -o hello.exe    // compiler: GCC ka part\n// $ ./hello.exe                   // OS directly run karta hai\n\n// C++ ka flow Java/Python se alag:\n// Java  : javac (.java -> .class bytecode) -> JVM run\n// Python: interpreter .py DIRECT chalata (bytecode chhup ke)\n// C++   : g++ source ko NATIVE machine code banata hai —\n//         koi separate virtual machine NAHI, binary direct chalta hai\n\n// \"Compile once, run on that platform\"\n// cross-platform = source ka ek copy, har OS pe alag compile\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello from C++\\n\";   // real runnable demo\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "main() Method & Program Structure", "note": "Java ka har program main() se shuru hota hai. Python mein koi main zaroori nahi — top-level code seedha chalta hai.", "type": "code", "java": "public class Main {           // file name = class name\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n        // public  = kahin se bhi access\n        // static  = object ke bina call\n        // void    = kuch return nahi\n        // args    = command-line arguments\n    }\n}\n// javac Main.java && java Main", "python": "# top-level code direct chal jaata hai\nprint(\"Hello\")\n\n# structured approach (optional but clean):\ndef main():\n    print(\"Hello\")\n\nif __name__ == \"__main__\":\n    main()\n# iska matlab: sirf direct run pe chalega,\n# import hone pe nahi 🔥", "extra": "Java ko hamesha <code>public static void main(String[] args)</code> chahiye. Python ka <code>if __name__ == \"__main__\":</code> guard ye control karta hai ki code direct run pe chale ya sirf import pe (isliye modules reusable hain).", "cpp": "#include <iostream>\nusing namespace std;\n\n// main() = C++ ka entry point — OS yahi se code chalata hai\n// argc = kitne command-line arguments, argv = unki values\n// (Java ke public static void main(String[] args) jaisa)\nint main(int argc, char* argv[]) {\n    cout << \"Hello\\n\";\n    // argv[0] hamesha program ka name hota hai\n    cout << \"args count: \" << argc << \"\\n\";\n    for (int i = 0; i < argc; ++i)\n        cout << \"argv[\" << i << \"] = \" << argv[i] << \"\\n\";\n    return 0;   // 0 = success (non-zero = error)\n}"}, {"cat": "16. Advanced Java", "title": "switch / match Statement", "note": "Java switch (case + break) ka Python equivalent match-case (Python 3.10+). Java 14+ ka enhanced switch arrow syntax se clean ho gaya.", "type": "code", "java": "int day = 3;\nswitch (day) {\n    case 1: System.out.println(\"Mon\"); break;\n    case 2: System.out.println(\"Tue\"); break;\n    default: System.out.println(\"Other\");\n}\n// break na laga toh fall-through hota hai!\n\n// enhanced switch (Java 14+): 🔥\nswitch (day) {\n    case 1 -> System.out.println(\"Mon\");\n    case 2 -> System.out.println(\"Tue\");\n    default -> System.out.println(\"Other\");\n}", "python": "day = 3\nmatch day:                    # Python 3.10+\n    case 1:\n        print(\"Mon\")\n    case 2:\n        print(\"Tue\")\n    case _:                   # default\n        print(\"Other\")\n\n# dict dispatch pattern 🔥 (common in DSA)\nm = {1: \"Mon\", 2: \"Tue\"}\nprint(m.get(day, \"Other\"))", "extra": "Java mein <code>break</code> bhoolna = fall-through bug. Python match mein automatic break hota hai. <code>case _:</code> = default. Pattern matching strings, tuples, types pe bhi kaam karta hai.", "cpp": "#include <iostream>\n#include <map>\nusing namespace std;\n\nint main() {\n    int day = 3;\n    switch (day) {\n        case 1: cout << \"Mon\\n\"; break;\n        case 2: cout << \"Tue\\n\"; break;\n        default: cout << \"Other\\n\";   // 3 -> default\n    }\n    // break na lagao toh fall-through hota hai!\n\n    // dict dispatch pattern 🔥 (DSA mein common) — C++ map\n    map<int, string> m = {{1, \"Mon\"}, {2, \"Tue\"}};\n    auto it = m.find(day);\n    cout << (it != m.end() ? it->second : \"Other\") << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "do-while Loop", "note": "do-while guarantee karta hai ki body at least ek baar chalegi. Python mein ye loop nahi hai — simulate karna padta hai.", "type": "code", "java": "int i = 0;\ndo {\n    System.out.println(i);    // pehle run\n    i++;\n} while (i < 5);\n\n// i=0 shuru mein ho ya 100, body ek baar\n// zaroor chalegi, phir condition check", "python": "# python mein do-while nahi hai\ni = 0\nwhile True:\n    print(i)          # pehle run\n    i += 1\n    if i >= 5:        # last mein condition\n        break\n\n# note: python andar ho ya na ho, ye\n# while True + break = do-while pattern", "extra": "<b>Yaad rakhne ka fark:</b> while check-then-run, do-while run-then-check. Python DSA mein shayad hi do-while chahiye — lekin Java syntax jaan kar rakhna. Interview mein aaye toh <code>while True: ... if cond: break</code> bolna.", "cpp": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int i = 0;\n    do {\n        cout << i << \"\\n\";    // pehle run\n        i++;\n    } while (i < 5);\n\n    // i=0 shuru mein ho ya 100, body ek baar zaroor chalegi,\n    // phir condition check (run-then-check)\n    cout << \"final i: \" << i << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Bitwise Operators", "note": "Bit-level operations — DSA ke XOR tricks aur bit manipulation questions ke liye. Operators dono languages mein same hain.", "type": "table", "headers": ["Operator", "Java", "Python", "Kaam"], "rows": [["AND", "<code>a & b</code>", "<code>a & b</code>", "Dono bits 1 toh 1"], ["OR", "<code>a | b</code>", "<code>a | b</code>", "Koi ek 1 toh 1"], ["XOR", "<code>a ^ b</code>", "<code>a ^ b</code>", "Same bits 0, different 1 🔥"], ["NOT", "<code>~a</code>", "<code>~a</code>", "Complement (0↔1)"], ["Left shift", "<code>a << k</code>", "<code>a << k</code>", "× 2^k"], ["Right shift", "<code>a >> k</code>", "<code>a >> k</code>", "÷ 2^k"], ["Unsigned right", "<code>a >>> k</code>", "<code>a >> k</code>", "Python sign-bit preserve karta"], ["Bit set check", "<code>(x >> i) & 1 == 1</code>", "<code>(x >> i) & 1</code>", "i-th bit on hai?"], ["Count 1s", "<code>Integer.bitCount(x)</code>", "<code>x.bit_count()</code>", "Popcount"]], "extra": "<b>Top XOR tricks:</b> <code>x ^ x = 0</code>, <code>x ^ 0 = x</code>, <code>x ^ x ^ y = y</code> — isi se Single Number (LeetCode 136) solve hota hai. <code>a ^ b</code> swap bina temp variable ke bhi kar sakte ho."}, {"cat": "16. Advanced Java", "title": "Method Overloading & Pass by Value", "note": "Overloading = same naam, alag parameters. Pass-by-value: Java aur Python dono primitives/immutable copy bhejte hain, lekin mutable objects ke saath reference ka khel hai.", "type": "code", "java": "static int add(int a, int b) { return a + b; }\nstatic int add(int a, int b, int c) {\n    return a + b + c;\n}\nstatic double add(double a, double b) {\n    return a + b;      // overloaded by type\n}\n\n// pass by VALUE\nvoid change(int x) { x = 99; }\n// caller ka variable UNAFFECTED rehta hai\n\n// object reference pass hota hai (mutable)\nvoid fill(int[] arr) { arr[0] = 5; }\n// original array change ho jaati hai!", "python": "# python mein overloading nahi — defaults se kaam\ndef add(a, b, c=0):\n    return a + b + c\n\nadd(1, 2)          # 3\nadd(1, 2, 3)       # 6\n\ndef change(x): x = 99      # int immutable: caller safe\ndef fill(arr): arr[0] = 5  # list mutable: caller BADAL jata 🔥\n# same behavior as Java", "extra": "<b>Interview gotcha:</b> Java aur Python dono 'pass by value' hain — par object variables ki value = reference hoti hai. Isliye mutable object (array/list/dict) andar se change karne pe caller ko bhi dikhta hai. Immutable (int/String/tuple) hamesha safe.", "cpp": "#include <iostream>\nusing namespace std;\n\nint add(int a, int b) { return a + b; }\nint add(int a, int b, int c) { return a + b + c; }   // overload by arity\ndouble add(double a, double b) { return a + b; }     // overload by type\n\n// pass by VALUE — copy ban jata, caller ka variable UNAFFECTED\nvoid change(int x) { x = 99; (void)x; }   // (void) sirf warning silence karta\n\n// array parameter = pointer — original array change ho jaati hai!\nvoid fill(int arr[]) { arr[0] = 5; }\n\nint main() {\n    cout << add(1, 2) << \" \" << add(1, 2, 3) << \" \"\n         << add(1.5, 2.5) << \"\\n\";        // 3 6 4\n\n    int n = 7;\n    change(n);\n    cout << \"n (unchanged): \" << n << \"\\n\";      // 7 — caller safe\n\n    int arr[] = {1, 2, 3};\n    fill(arr);                                  // array decays to pointer\n    cout << \"arr[0] (changed): \" << arr[0] << \"\\n\";   // 5 — original badla!\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "String Pool & StringBuilder", "note": "Java mein String literals String Pool mein share hote hain (== reference check). StringBuilder mutable hai, String immutable. Python mein == hamesha value compare karta hai.", "type": "code", "java": "String a = \"hello\";\nString b = \"hello\";\nSystem.out.println(a == b);    // TRUE (same pool ref)\nString c = new String(\"hello\");\nSystem.out.println(a == c);    // false (naya object)\n\n// StringBuilder (mutable, O(n) building) 🔥\nStringBuilder sb = new StringBuilder(\"Hello\");\nsb.append(\" World\");           // Hello World\nsb.insert(5, \",\");             // Hello, World\nsb.delete(5, 6);               // Hello World\nsb.replace(0, 1, \"J\");         // Jello World\nsb.reverse();                  // dlroW olleJ\nsb.toString();", "python": "# python strings bhi immutable hain\na = \"hello\"; b = \"hello\"\nprint(a == b)        # True — value compare hamesha\nprint(a is b)        # True (CPython may intern)\n\n# python mein == kabhi reference nahi compare karta 🔥\n# isliye a==b confusion nahi\n\n# string building — list + join() = StringBuilder\nparts = [\"Hello\", \"World\"]\n\",\".join(parts)              # \"Hello,World\"\n\ns = \"hello\"\ns.upper(); s[1:3]; s.replace(\"l\",\"L\")   # naye strings", "extra": "<b>Classic interview question:</b> 'String immutable kyu hai?' — security (passwords), thread-safety, string pool sharing. Java me <code>==</code> strings pe reference compare karta hai isliye hamesha <code>.equals()</code> use karo. Python <code>==</code> value hi compare karta hai — wo galti nahi hoti.", "cpp": "#include <iostream>\n#include <string>\n#include <algorithm>\n#include <sstream>\nusing namespace std;\n\nint main() {\n    // C++ std::string MUTABLE hai (Java String immutable se alag)\n    // \"pool\" nahi hota — values hamesha content se compare hoti hain\n    string a = \"hello\";\n    string b = \"hello\";\n    cout << (a == b) << \"\\n\";       // 1 (value compare, == reference nahi)\n\n    // StringBuilder jaisa kaam — std::string hi (mutable, O(n) building) 🔥\n    string sb = \"Hello\";\n    sb += \" World\";                // append  -> Hello World\n    sb.insert(5, \",\");             // insert   -> Hello, World\n    sb.erase(5, 1);                // delete   -> Hello World\n    sb.replace(0, 1, \"J\");         // replace  -> Jello World\n    reverse(sb.begin(), sb.end()); // reverse  -> dlroW olleJ\n    cout << sb << \"\\n\";\n\n    // ya ostringstream (fast concatenation)\n    ostringstream os;\n    os << \"Hello \" << \"World\";\n    cout << os.str() << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Wrapper Classes & Autoboxing", "note": "Java ke primitives (int, char...) ka object version hota hai (Integer, Character...) — autoboxing automatically convert karta hai. Python mein sab kuch object hai, wrappers ki zarurat hi nahi.", "type": "code", "java": "Integer x = 5;               // autoboxing: int -> Integer\nint y = x;                     // unboxing: Integer -> int\n\n// wrapper methods\nInteger.parseInt(\"42\");        // String -> int\nCharacter.isDigit('5');        // true\nCharacter.isLetter('A');       // true\nCharacter.toLowerCase('A');    // 'a'\nCharacter.isUpperCase('A');    // true\n\n// array of primitives ko sort descending:\nInteger[] arr = {5, 2, 9};\nArrays.sort(arr, Collections.reverseOrder());", "python": "# python: sab kuch object — wrappers nahi chahiye\nx = 5            # int object (no primitive)\ny = 5.5          # float object\n\n\"42\".isdigit()           # Character.isDigit\n\"A\".lower()              # Character.toLowerCase\n\"A\".isupper()            # Character.isUpperCase\n\"A\".isalpha()            # Character.isLetter\nint(\"42\")                # parse\n\n# descending sort is easy\narr.sort(reverse=True)", "extra": "Java mein collection (ArrayList&lt;Integer&gt;) ko primitive nahi chahiye — isliye wrappers zaroori. Python mein sab jagah objects hain, ye step skip hota hai. <code>Integer.parseInt</code> = <code>int()</code>, <code>Integer.valueOf</code> = direct.", "cpp": "#include <iostream>\n#include <cctype>\n#include <string>\n#include <vector>\n#include <algorithm>\n#include <functional>\nusing namespace std;\n\nint main() {\n    // C++ mein wrapper/boxing nahi chahiye — primitive types direct hain\n    int x = 5;                 // primitive, Integer jaisa koi wrapper nahi\n    cout << x << \"\\n\";\n\n    // parsing & char checks (Wrapper methods jaisa)\n    cout << stoi(\"42\") << \"\\n\";           // parse -> 42\n    cout << isdigit('5') << \"\\n\";         // 1\n    cout << isalpha('A') << \"\\n\";         // 1\n    cout << (char)tolower('A') << \"\\n\";   // a\n    cout << isupper('A') << \"\\n\";         // 1\n\n    // descending sort — Collections.reverseOrder jaisa\n    vector<int> arr = {5, 2, 9};\n    sort(arr.begin(), arr.end(), greater<int>());\n    for (int v : arr) cout << v << \" \";\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Arrays Class Methods", "note": "Arrays class ke static helpers — Java ka Python equivalent ek nazar mein. Arrays.binarySearch() se pehle sort() zaroori hai.", "type": "table", "headers": ["Kaam", "Java", "Python"], "rows": [["Sort", "<code>Arrays.sort(arr)</code>", "<code>arr.sort()</code>"], ["Fill", "<code>Arrays.fill(arr, 0)</code>", "<code>[0] * n</code>"], ["Copy", "<code>Arrays.copyOf(arr, n)</code>", "<code>arr[:n]</code>"], ["Copy range", "<code>Arrays.copyOfRange(arr,1,4)</code>", "<code>arr[1:4]</code>"], ["Compare", "<code>Arrays.equals(a, b)</code>", "<code>a == b</code>"], ["Print 1D", "<code>Arrays.toString(arr)</code>", "<code>arr</code>"], ["Print 2D", "<code>Arrays.deepToString(mat)</code>", "<code>mat</code>"], ["Binary search", "<code>Arrays.binarySearch(arr,x)</code>", "<code>bisect.bisect_left(arr,x)</code>"], ["Fill 2D", "<code>for (int[] r: mat) Arrays.fill(r, 0)</code>", "<code>[[0]*c for _ in range(r)]</code>"]]}, {"cat": "16. Advanced Java", "title": "Access Modifiers & Packages", "note": "Java ka public/private/protected/default — compiler-enforced hai. Python mein sab public, sirf conventions hain. Packages = Python modules.", "type": "code", "java": "package com.example.car;      // package declaration\n\npublic class Car {\n    private int speed;          // sirf is class ke andar\n    protected String name;      // package + subclasses\n    int color;                  // default: sirf package\n    public void drive() { }     // sab jagah\n\n    public int getSpeed() { return speed; }\n}\n// import com.example.car.Car;", "python": "# python modules = java packages\n# car.py file mein:\nclass Car:\n    def __init__(self):\n        self.speed = 0        # public\n        self._name = \"x\"      # \"protected\" — convention\n        self.__color = \"red\"  # \"private\" — name mangling\n\n# from car import Car\n# import car\n# car.Car()\n\n# __color actually _Car__color ban jaata 🔥\n# baahar se direct access hard hota hai", "extra": "<b>Access modifier hierarchy:</b> public (sab) &gt; protected (package + subclass) &gt; default (package) &gt; private (class). Python mein <code>_x</code> = 'mat chhoo' convention, <code>__x</code> = name-mangling se effectively private.", "cpp": "#include <iostream>\n#include <string>\nusing namespace std;\n\n// namespace = Java ka package 🔥\nnamespace car {\n\nclass Car {\nprivate:\n    int speed = 0;                 // sirf is class ke andar\nprotected:\n    string name = \"x\";             // derived classes ko accessible\n    int color = 0;                 // is namespace scope mein\npublic:\n    void drive() {}                // sab jagah accessible\n\n    int getSpeed() const { return speed; }   // getter (access jaisa)\n};\n\n}  // namespace car\n\nint main() {\n    car::Car c;                     // import car.Car jaisa\n    c.drive();\n    cout << \"speed: \" << c.getSpeed() << \"\\n\";\n    // c.speed — private, direct access COMPILE ERROR hota hai\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Exception Handling — Full Detail", "note": "throw = exception create karna, throws = method signature mein declare, custom exceptions apni class se. Python mein throw → raise.", "type": "code", "java": "// custom exception\nclass MyException extends Exception {\n    MyException(String msg) { super(msg); }\n}\n\npublic int divide(int a, int b) throws MyException {\n    if (b == 0) throw new MyException(\"zero!\");\n    return a / b;\n}\n\ntry {\n    int x = divide(10, 0);\n} catch (MyException e) {          // specific pehle\n    System.out.println(e.getMessage());\n} catch (Exception e) {            // generic baad mein\n    e.printStackTrace();\n} finally {                        // hamesha chalega\n    System.out.println(\"done\");\n}", "python": "class MyError(Exception):\n    def __init__(self, msg):\n        super().__init__(msg)\n\ndef divide(a, b):\n    if b == 0:\n        raise MyError(\"zero!\")      # throw ka equivalent\n    return a / b\n\ntry:\n    x = divide(10, 0)\nexcept MyError as e:                # specific pehle\n    print(e)                        # str(e) = message\nexcept Exception as e:              # generic baad\n    print(e)\nfinally:                            # hamesha chalega\n    print(\"done\")", "extra": "<b>Multiple catch:</b> specific exception pehle, Exception (parent) last mein — warna specific kabhi reach nahi hoga (compile error Java mein). <code>throws</code> Java mein compile-time declaration hai; Python mein sab runtime. Custom exception dono mein same pattern.", "cpp": "#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// custom exception (Java MyException extends Exception jaisa)\nclass MyException : public runtime_error {\npublic:\n    MyException(const string& msg) : runtime_error(msg) {}\n};\n\nint divide(int a, int b) {\n    if (b == 0) throw MyException(\"zero!\");\n    return a / b;\n}\n\nint main() {\n    struct finally { ~finally() { cout << \"done\\n\"; } } fin; // RAII = finally\n\n    try {\n        int x = divide(10, 0);\n        cout << x << \"\\n\";\n    } catch (const MyException& e) {        // specific pehle\n        cout << e.what() << \"\\n\";           // \"zero!\"\n    } catch (const exception& e) {          // generic baad mein\n        cerr << e.what() << \"\\n\";\n    }\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Comparable vs Comparator", "note": "Comparable = natural order (1 sort order), Comparator = custom order (lambda). Python mein key= hi comparator ka kaam karta hai.", "type": "code", "java": "class Student implements Comparable<Student> {\n    int marks;\n    String name;\n    public int compareTo(Student o) {\n        return this.marks - o.marks;   // natural: marks se\n    }\n}\nArrays.sort(students);    // compareTo use hoga\n\n// Comparator = custom (lambda) 🔥\nArrays.sort(students, (a, b) -> b.marks - a.marks); // desc\nArrays.sort(students, Comparator.comparingInt(s -> s.marks));\n// overflow-safe: Integer.compare(a,b) use karo", "python": "# natural order: python objects compare by ==, <, >\nstudents.sort()                    # agar __lt__ define ho\n\n# custom = key= hamesha 🔥\nstudents.sort(key=lambda s: s.marks)              # asc\nstudents.sort(key=lambda s: s.marks, reverse=True) # desc\n\n# multi-key: marks, phir name\nstudents.sort(key=lambda s: (s.marks, s.name))\n\n# old-style comparator (agar chahiye toh)\nfrom functools import cmp_to_key\nstudents.sort(key=cmp_to_key(lambda a, b: a.marks - b.marks))", "extra": "<b>Flow:</b> Comparable implement karo → <code>compareTo</code> likho → Collections.sort() natural order. Alag order chahiye → Comparator lambda. Python mein kabhi overthink mat karo — <code>key=lambda</code> hi enough hai. Interview mein Java ka comparator lambda pattern zaroor aata hai.", "cpp": "#include <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nstruct Student {\n    int marks;\n    string name;\n    // natural order = marks se (Java Comparable jaisa)\n    bool operator<(const Student& o) const { return marks < o.marks; }\n};\n\nint main() {\n    vector<Student> students = {{80, \"Aman\"}, {90, \"Bina\"}, {75, \"Chintu\"}};\n\n    sort(students.begin(), students.end());   // operator< use hoga (asc)\n    cout << \"asc:  \";\n    for (auto& s : students) cout << s.name << \" \";\n    cout << \"\\n\";\n\n    // Comparator = custom (lambda) 🔥 — desc\n    sort(students.begin(), students.end(),\n         [](const Student& a, const Student& b) { return a.marks > b.marks; });\n    cout << \"desc: \";\n    for (auto& s : students) cout << s.name << \" \";\n    cout << \"\\n\";\n\n    // multi-key: marks, phir name\n    sort(students.begin(), students.end(),\n         [](const Student& a, const Student& b) {\n             if (a.marks != b.marks) return a.marks < b.marks;\n             return a.name < b.name;\n         });\n    cout << \"multi done\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Generics & Type Safety", "note": "Java generics compile-time type safety dete hain — galat type pe compile error. Python dynamically typed hai, type hints sirf documentation.", "type": "code", "java": "List<Integer> list = new ArrayList<>();  // sirf Integer\nHashMap<String, Integer> map = new HashMap<>();\n\n// generic class\nclass Box<T> {\n    private T value;\n    public void set(T v) { value = v; }\n    public T get() { return value; }\n}\nBox<Integer> b = new Box<>();\nb.set(42);\nint x = b.get();      // no cast needed\n\n// List<String> -> koi Integer daalo toh COMPILE ERROR", "python": "# python: koi compile-time type safety nahi\nlst = []                  # kuch bhi daal sakte ho\nmp = {}\n\nclass Box:\n    def __init__(self, value):\n        self.value = value    # any type\n\n# type hints (optional — runtime pe effect nahi)\nfrom typing import List, Dict, Optional\n\ndef process(nums: List[int]) -> Dict[str, int]:\n    return {\"sum\": sum(nums)}\n\n# mypy se static check kar sakte ho (external tool)", "extra": "Java generics runtime pe type-erasure karte hain (compile-time check, runtime remove). Python type hints sirf documentation/tools ke liye. DSA mein Java generics (List&lt;Integer&gt;, Map&lt;String,Integer&gt;) roz lagte hain.", "cpp": "#include <iostream>\n#include <vector>\n#include <string>\n#include <unordered_map>\nusing namespace std;\n\n// generic class (Java Box<T> jaisa) 🔥\ntemplate <typename T>\nclass Box {\nprivate:\n    T value;\npublic:\n    void set(T v) { value = v; }\n    T get() const { return value; }\n};\n\nint main() {\n    vector<int> list;                    // sirf int\n    list.push_back(42);\n    unordered_map<string, int> mp;        // sirf string -> int\n    mp[\"key\"] = 7;\n\n    Box<int> b;                          // type specify karo\n    b.set(42);\n    int x = b.get();                     // no cast needed\n    cout << x << \"\\n\";\n\n    // list.push_back(\"str\") → COMPILE ERROR (type safety)\n    // C++ template compile-time type check hota hai\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Collections Class Utilities", "note": "Collections class = static helpers for lists. Python equivalents ek nazar mein.", "type": "table", "headers": ["Kaam", "Java", "Python"], "rows": [["Sort", "<code>Collections.sort(list)</code>", "<code>list.sort()</code>"], ["Reverse", "<code>Collections.reverse(list)</code>", "<code>list.reverse()</code>"], ["Max", "<code>Collections.max(list)</code>", "<code>max(list)</code>"], ["Min", "<code>Collections.min(list)</code>", "<code>min(list)</code>"], ["Frequency", "<code>Collections.frequency(list,x)</code>", "<code>list.count(x)</code>"], ["Swap", "<code>Collections.swap(list,i,j)</code>", "<code>list[i],list[j]=list[j],list[i]</code>"], ["Copy", "<code>Collections.copy(dst,src)</code>", "<code>list.copy()</code>"], ["Unmodifiable", "<code>Collections.unmodifiableList(list)</code>", "<code>tuple(list)</code>"], ["Fill", "<code>Collections.fill(list,x)</code>", "<code>[x]*n</code>"], ["Rotate", "<code>Collections.rotate(list,k)</code>", "<code>arr[-k:] + arr[:-k]</code>"]]}, {"cat": "16. Advanced Java", "title": "TreeSet / TreeMap / LinkedHashMap", "note": "Sorted aur ordered collections. Java ke TreeSet (sorted set) aur TreeMap (sorted keys) — Python mein built-in sorted set nahi, sorted() se simulate karo. LinkedHashMap insertion-order = Python default dict.", "type": "code", "java": "TreeSet<Integer> ts = new TreeSet<>();\nts.add(30); ts.add(10); ts.add(20);  // sorted!\nts.first();    // 10\nts.last();     // 30\nts.lower(25);  // 20 (just below)\nts.higher(25); // 30 (just above)\nts.ceiling(25);// 30 (>=)\nts.floor(25);  // 20 (<=)\n\nTreeMap<String, Integer> tm = new TreeMap<>(); // sorted keys\nLinkedHashMap<String,Integer> lhm =\n    new LinkedHashMap<>();   // insertion order", "python": "# sorted set: python built-in nahi\nts = sorted(set([30, 10, 20]))    # [10, 20, 30]\n\n# sorted dict (by key)\ntm = dict(sorted(mp.items()))\n\n# insertion order = python dict DEFAULT 🔥\nd = {}\nd[\"b\"] = 1; d[\"a\"] = 2\nlist(d)          # ['b', 'a'] — order preserved\n\n# next-greater style queries\nimport bisect\narr = [10, 20, 30]\ni = bisect.bisect_right(arr, 25)   # first > 25 => 30\ni = bisect.bisect_left(arr, 25)    # insertion point", "extra": "Java TreeSet/TreeMap operations O(log n) hote hain (red-black tree). Python sorted() O(n log n) baar-baar nahi karna — sorted array chahiye toh maintain karke bisect use karo. Interview me TreeMap (like floor/ceiling) = bisect pattern.", "cpp": "#include <iostream>\n#include <set>\n#include <map>\n#include <string>\n#include <iterator>\nusing namespace std;\n\nint main() {\n    set<int> ts = {30, 10, 20};   // TreeSet jaisa — sorted!\n    cout << *ts.begin() << \"\\n\";                    // 10  (first)\n    cout << *ts.rbegin() << \"\\n\";                   // 30  (last)\n    cout << *prev(ts.lower_bound(25)) << \"\\n\";      // 20  (floor 25, just below)\n    cout << *ts.lower_bound(25) << \"\\n\";            // 30  (ceiling, >=)\n    cout << *ts.upper_bound(25) << \"\\n\";            // 30  (higher, strictly >)\n\n    map<string, int> tm;                            // TreeMap jaisa — sorted keys\n    tm[\"banana\"] = 1; tm[\"apple\"] = 2; tm[\"cherry\"] = 3;\n    for (auto& [k, v] : tm) cout << k << \" \";       // apple banana cherry\n    cout << \"\\n\";\n\n    // insertion order (LinkedHashMap): C++ built-in nahi hai\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Stream API Basics", "note": "Java Streams = functional processing (filter/map/sort). Python comprehension usse bhi chhota hai. Placement ke liye basic understanding enough.", "type": "code", "java": "List<Integer> nums = Arrays.asList(1,2,3,4,5);\nList<Integer> evens = nums.stream()\n    .filter(n -> n % 2 == 0)\n    .collect(Collectors.toList());\n\nint sum = nums.stream().mapToInt(Integer::intValue).sum();\nint max = nums.stream().max(Integer::compare).get();\n\nList<String> names = list.stream()\n    .filter(s -> s.length() > 3)\n    .sorted()\n    .map(String::toUpperCase)\n    .collect(Collectors.toList());", "python": "nums = [1, 2, 3, 4, 5]\nevens = [n for n in nums if n % 2 == 0]   # 🔥 comprehension\n\ntotal = sum(nums)\nmx = max(nums)\n\nresult = [s.upper() for s in names\n          if len(s) > 3]\nresult.sort()          # stream().sorted() jaisa\n\n# ya method chain style\nresult = sorted(map(str.upper,\n                filter(lambda s: len(s) > 3, names)))", "extra": "<b>Mapping:</b> <code>filter()</code> = <code>[x for x in ... if cond]</code>, <code>map()</code> = <code>[expr for x in ...]</code>, <code>sorted()</code> = <code>.sorted()</code>, <code>collect()</code> = <code>list()</code>. Java streams lazy hain; comprehension eager. DSA mein comprehension hi use hota hai mostly.", "cpp": "#include <iostream>\n#include <vector>\n#include <string>\n#include <numeric>\n#include <algorithm>\n#include <cctype>\nusing namespace std;\n\nint main() {\n    vector<int> nums = {1, 2, 3, 4, 5};\n\n    // filter — evens (stream().filter jaisa)\n    vector<int> evens;\n    for (int n : nums) if (n % 2 == 0) evens.push_back(n);\n\n    // reduce — sum / max\n    int sum = accumulate(nums.begin(), nums.end(), 0);\n    int mx = *max_element(nums.begin(), nums.end());\n\n    // filter + sorted + map(toUpper)\n    vector<string> names = {\"a\", \"bbbb\", \"cc\", \"ddd\"};\n    vector<string> result;\n    for (auto& s : names) if (s.length() > 3) result.push_back(s);\n    sort(result.begin(), result.end());\n    for (auto& s : result)\n        for (auto& ch : s) ch = (char)toupper(ch);\n\n    cout << \"evens: \";\n    for (int v : evens) cout << v << \" \";\n    cout << \"\\nsum=\" << sum << \" max=\" << mx << \"\\nresult: \";\n    for (auto& s : result) cout << s << \" \";\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Enums — Constant Groups", "note": "Java enum = strongly-typed constant group (compile-time safe). Python 3.4+ ka <code>Enum</code> same kaam karta hai — names ko auto/auto numbers milte hain, iteration aur lookup dono supported.", "type": "code", "java": "// Java enum — class jaisa hi powerful\nenum Day {\n    MON(\"Monday\"), TUE(\"Tuesday\"), SAT(\"Saturday\");\n    private final String full;\n    Day(String full) { this.full = full; }  // constructor\n    public String full() { return full; }\n}\n\nDay d = Day.MON;\nd.name();        // \"MON\"\nd.ordinal();     // 0 (order)\nDay.valueOf(\"TUE\");  // lookup by name\n\n// iteration\nfor (Day x : Day.values()) { ... }\n\n// switch enum\nswitch (d) {\n    case MON: ... break;\n    default: ...\n}", "python": "from enum import Enum\n\nclass Day(Enum):\n    MON = 1\n    TUE = 2\n    SAT = 6\n\nd = Day.MON\nd.name        # \"MON\"\nd.value       # 1\nDay(6)        # lookup by value -> Day.SAT\nDay[\"TUE\"]    # lookup by name -> Day.TUE\n\nfor x in Day:\n    print(x)   # iterate all members\n\n# function-call syntax\nif d is Day.MON: ...", "extra": "<b>Interview:</b> enum comparison hamesha <code>==</code> / <code>is</code> se — string se compare mat karo (typo = bug). Python <code>IntEnum</code> = int ke saath compatible, <code>auto()</code> = khud numbering. Java enum extra fields + methods le sakta hai.", "cpp": "#include <iostream>\n#include <string>\nusing namespace std;\n\n// C++ enum class — type-safe constant group (Java enum jaisa)\nenum class Day { MON = 0, TUE = 1, SAT = 6 };\n\nstring fullName(Day d) {\n    switch (d) {                    // switch enum\n        case Day::MON: return \"Monday\";\n        case Day::TUE: return \"Tuesday\";\n        case Day::SAT: return \"Saturday\";\n        default: return \"?\";\n    }\n}\n\nint main() {\n    Day d = Day::MON;\n    cout << static_cast<int>(d) << \"\\n\";   // ordinal jaisa (0)\n    cout << fullName(d) << \"\\n\";           // \"Monday\"\n\n    // Day.valueOf(\"TUE\") — C++ built-in nahi; map se karo\n    // iteration over values — static_cast<int> loop se possible\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Date & Time API", "note": "Java 8+ ka <code>java.time</code> — LocalDate/LocalTime immutable hain. Python ka <code>datetime</code> module same kaam karta hai. Dono mein timezone handling important hai.", "type": "code", "java": "import java.time.*;\n\nLocalDate today = LocalDate.now();\nLocalDate d = LocalDate.of(2024, 5, 10);\nd.plusDays(5);         // 15 May\nd.minusMonths(1);      // 10 Apr\nd.isAfter(today);      // false\n\nLocalDateTime now = LocalDateTime.now();\nnow.format(DateTimeFormatter.ofPattern(\"dd-MM-yyyy\"));\n\n// difference\nlong days = ChronoUnit.DAYS.between(d, today);\n\n// timestamp (epoch millis)\nlong millis = System.currentTimeMillis();", "python": "from datetime import datetime, date, timedelta\n\ntoday = date.today()\nd = date(2024, 5, 10)\nd + timedelta(days=5)        # 15 May\nd - timedelta(days=30)       # 10 Apr\nd > today                    # False\n\nnow = datetime.now()\nnow.strftime(\"%d-%m-%Y\")     # formatting\n\n# difference\ndiff = today - d             # timedelta\ndiff.days\n\n# timestamp (epoch seconds)\nts = datetime.now().timestamp()", "extra": "<b>Interview:</b> Java <code>SimpleDateFormat</code> thread-safe nahi hai (shared static use mat karo) — <code>DateTimeFormatter</code> safe hai. Python <code>strftime</code> codes: <code>%Y</code>=year, <code>%m</code>=month, <code>%d</code>=day. Timezone: Java <code>ZonedDateTime</code>, Python <code>datetime.now(timezone.utc)</code>.", "cpp": "#include <iostream>\n#include <ctime>\n#include <iomanip>\n#include <chrono>\nusing namespace std;\n\nint main() {\n    time_t now = time(nullptr);\n\n    // date = 2024, 5, 10 (Java LocalDate.of jaisa)\n    tm d = {};\n    d.tm_year = 2024 - 1900; d.tm_mon = 4; d.tm_mday = 10;\n    time_t base = mktime(&d);\n\n    // plusDays(5) — mktime normalize karta hai\n    tm d_plus = d; d_plus.tm_mday += 5;\n    time_t plus5 = mktime(&d_plus);          // 15 May\n\n    // minusMonths(1)\n    tm d_minus = d; d_minus.tm_mon -= 1;\n    time_t minus1 = mktime(&d_minus);        // 10 Apr\n\n    cout << \"plus 5 days: \"\n         << put_time(localtime(&plus5), \"%d-%m-%Y\") << \"\\n\";\n    cout << \"minus 1 month: \"\n         << put_time(localtime(&minus1), \"%d-%m-%Y\") << \"\\n\";\n\n    cout << \"isAfter(today): \" << (base > now) << \"\\n\";   // 0 (past)\n\n    // difference in days (ChronoUnit.DAYS jaisa)\n    long days = static_cast<long>(difftime(now, base) / 86400.0);\n    cout << \"days since: \" << days << \"\\n\";\n\n    // formatting\n    cout << put_time(localtime(&now), \"%d-%m-%Y\") << \"\\n\";\n\n    // timestamp (epoch millis)\n    long long millis = chrono::duration_cast<chrono::milliseconds>(\n        chrono::system_clock::now().time_since_epoch()).count();\n    cout << \"epoch millis: \" << millis << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Big Numbers — Precision", "note": "Java int/long overflow se bachne ke liye <code>BigInteger</code> (unlimited) aur exact decimal ke liye <code>BigDecimal</code>. Python ka int unlimited hai (auto), <code>Decimal</code> exact decimals deta hai.", "type": "code", "java": "import java.math.BigInteger;\nimport java.math.BigDecimal;\n\nBigInteger a = new BigInteger(\"99999999999999999999\");\nBigInteger b = BigInteger.valueOf(2);\nBigInteger sum = a.add(b);          // add, subtract, multiply, divide\n\nBigDecimal x = new BigDecimal(\"0.1\");\nBigDecimal y = new BigDecimal(\"0.2\");\nx.add(y).doubleValue();              // 0.3 (exact!)\n\ndouble a2 = 0.1 + 0.2;               // 0.30000000000000004 bug!\n\n// compare\na.compareTo(b);                      // -1, 0, 1", "python": "# int is unlimited — koi overflow nahi\na = 99999999999999999999\nb = 2\nprint(a + b)                         # 100000000000000000001\n\nfrom decimal import Decimal\nx = Decimal(\"0.1\")\ny = Decimal(\"0.2\")\nprint(x + y)                         # 0.3 exact\n\n# float floating-point bug\nprint(0.1 + 0.2)                     # 0.30000000000000004\n\n# precision set karo\nfrom decimal import getcontext\ngetcontext().prec = 28", "extra": "<b>Interview:</b> money/precision problems mein <code>double</code> kabhi use mat karo — <code>BigDecimal</code> (Java) / <code>Decimal</code> (Python) lo. Large factorials/combinations (nCr) mein <code>BigInteger</code>/Python int zaroori. <code>compareTo()</code> = <code>==</code> ka safe version.", "cpp": "#include <iostream>\n#include <string>\n#include <algorithm>\n#include <limits>\nusing namespace std;\n\n// C++17 built-in big-int nahi (Boost::multiprecision chahiye)\n// Neeche string-based big addition ka simple demo:\nstring bigAdd(string a, string b) {\n    string res;\n    int carry = 0, i = static_cast<int>(a.size()) - 1,\n                  j = static_cast<int>(b.size()) - 1;\n    while (i >= 0 || j >= 0 || carry) {\n        int sum = carry;\n        if (i >= 0) sum += a[i--] - '0';\n        if (j >= 0) sum += b[j--] - '0';\n        res.push_back(static_cast<char>('0' + sum % 10));\n        carry = sum / 10;\n    }\n    reverse(res.begin(), res.end());\n    return res;\n}\n\nint main() {\n    // overflow — C++ silently wrap karta hai (warning bhi nahi)\n    unsigned long long big = numeric_limits<unsigned long long>::max();\n    cout << \"overflow -> \" << (big + 1) << \"\\n\";    // 0 (wrap)\n\n    // precision — 0.1 + 0.2 bug (double)\n    cout.precision(17);\n    cout << (0.1 + 0.2) << \"\\n\";   // 0.30000000000000004\n    cout.precision(6);\n\n    // big int demo — string add\n    cout << bigAdd(\"99999999999999999999\", \"2\") << \"\\n\";   // 100000000000000000001\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Optional — Null Handling", "note": "Java <code>Optional</code> = null ko explicitly represent karna (null-pointer se bachna). Python mein None hota hai — <code>is None</code> check se. Dono ka goal: 'value ho ya na ho' ko type-safe tarike se handle karna.", "type": "code", "java": "import java.util.Optional;\n\nOptional<String> name = Optional.of(\"Vinay\");\nOptional<String> empty = Optional.empty();\n\n// null-safe access\nname.isPresent();             // true\nname.get();                   // \"Vinay\"\nname.orElse(\"Guest\");         // default\nname.orElseThrow(() -> new IllegalStateException());\n\n// map / filter chain (stream jaisa)\nname.map(String::toUpperCase).orElse(\"?\");\n\n// Optional.ofNullable(userName) — null ho sakta hai\nOptional<String> v = Optional.ofNullable(getName());", "python": "# None is the \"Optional\" — explicit check\nname = \"Vinay\"          # ya None\nif name is None:\n    v = \"Guest\"\nelse:\n    v = name\n\n# walrus / conditional (one-liner)\nv = name or \"Guest\"          # \"\" bhi fallback hoga\n\n# safe navigation via getattr\nd.get(\"key\", \"default\")\n\n# py3.10+: match None pattern\nmatch name:\n    case None: v = \"Guest\"\n    case _:    v = name", "extra": "<b>Interview:</b> <code>orElse</code> eager hai (hamesha evaluate), <code>orElseGet</code> lazy. Python <code>or</code> sirf falsy (None, \"\", 0, []) pe fallback deta hai — <code>is None</code> strict check chahiye toh use that. Java Optional koi serializable nahi, field me rakhna anti-pattern hai.", "cpp": "#include <iostream>\n#include <string>\n#include <optional>\n#include <cctype>\nusing namespace std;\n\n// Optional jaisa null-handling — getNamemybe null ho sakta hai\noptional<string> getName(bool flag) {\n    if (flag) return string(\"Vinay\");\n    return nullopt;                  // Optional.empty() jaisa\n}\n\nint main() {\n    optional<string> name = getName(true);\n    cout << name.has_value() << \"\\n\";          // true (1)\n    cout << name.value() << \"\\n\";              // \"Vinay\"\n    cout << name.value_or(\"Guest\") << \"\\n\";    // default (orElse jaisa)\n\n    optional<string> empty = getName(false);\n    cout << empty.value_or(\"Guest\") << \"\\n\";   // \"Guest\"\n\n    // map + orElse jaisa chain (manually)\n    if (name) {\n        for (auto& ch : *name) ch = (char)toupper(ch);\n        cout << *name << \"\\n\";                 // \"VINAY\"\n    } else {\n        cout << \"?\\n\";\n    }\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Records & var — Boilerplate Katao", "note": "Java 16+ ka <code>record</code> = immutable data class — toString/equals/hashCode auto ban jaate hain. Python ka <code>@dataclass</code> same kaam karta hai. <code>var</code> (Java 10+) = type inference ka chhota sa shortcut.", "type": "code", "java": "// record — immutable data carrier (Java 16+)\nrecord Point(int x, int y) { }\nPoint p = new Point(3, 4);\np.x();           // accessor (p.x() nahi p.x)\np.toString();    // Point[x=3, y=4] auto\n\n// compact constructor — validation\nrecord User(String name, int age) {\n    User {\n        if (age < 0) throw new IllegalArgumentException();\n    }\n}\n\n// var — local type inference (Java 10+)\nvar list = new ArrayList<String>();   // type inferred", "python": "from dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n\np = Point(3, 4)\np.x                  # attribute\nstr(p)               # Point(x=3, y=4) auto\n\n# frozen=True = immutable (record jaisa)\n@dataclass(frozen=True)\nclass User:\n    name: str\n    age: int\n    def __post_init__(self):\n        if self.age < 0:\n            raise ValueError(\"age < 0\")", "extra": "<b>Interview:</b> record immutable hai — fields <code>private final</code>. Python <code>@dataclass(frozen=True)</code> = immutable, <code>@dataclass(order=True)</code> = comparison methods auto. Records/dataclasses map/serialization ke liye ideal hain.", "cpp": "#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// record = struct (value type); var = auto 🔥\nstruct Point {\n    int x, y;\n    Point(int x, int y) : x(x), y(y) {}\n    // toString jaisa (auto print)\n    friend ostream& operator<<(ostream& os, const Point& p) {\n        return os << \"Point[x=\" << p.x << \", y=\" << p.y << \"]\";\n    }\n};\n\n// validation in constructor (record compact constructor jaisa)\nstruct User {\n    string name;\n    int age;\n    User(const string& name, int age) : name(name), age(age) {\n        if (age < 0) throw invalid_argument(\"age negative!\");\n    }\n};\n\nint main() {\n    auto p = Point(3, 4);      // auto = Java ka var (type inferred)\n    cout << p.x << \"\\n\";       // attribute direct access (p.x(), nahi)\n    cout << p << \"\\n\";         // Point[x=3, y=4] toString auto\n\n    User u(\"Vinay\", 25);\n    cout << u.name << \" \" << u.age << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Method References & Function Passing", "note": "Java method reference <code>::</code> — lambda ka chhota form (System.out::println = x -> System.out.println(x)). Python mein functions pehle class citizens hain — directly pass karo, lambda optional.", "type": "code", "java": "import java.util.*;\nimport java.util.function.*;\n\n// method reference: Class::method\nList<String> names = Arrays.asList(\"a\", \"bb\", \"ccc\");\nnames.sort(String::compareTo);            // :: = lambda shortcut\nnames.forEach(System.out::println);       // (x) -> println(x)\n\n// function interfaces\nFunction<String, Integer> f = String::length;\nf.apply(\"abc\");                           // 3\n\nSupplier<Double> r = Math::random;\nBiFunction<Integer,Integer,Integer> add =\n    (a, b) -> a + b;                      // lambda", "python": "# functions are first-class — direct pass\nnames = [\"a\", \"bb\", \"ccc\"]\nnames.sort(key=len)            # len = function reference\nprint(*names, sep=\"\\n\")        # for-each\n\n# lambda / named function dono OK\nf = len\nf(\"abc\")                        # 3\n\nimport random, math\nimport functools\n\nnums = [1, 2, 3]\nsum(nums)                       # built-in hi function hai\n\n# partial — function + fixed args (curry jaisa)\nadd = lambda a, b: a + b\nadd5 = functools.partial(add, 5)\nadd5(3)                         # 8", "extra": "<b>Interview:</b> Java mein method reference 4 types hain — <code>Instance::method</code>, <code>Class::staticMethod</code>, <code>Class::instanceMethod</code>, <code>Class::new</code> (constructor). Python mein sab simple function references hain. <code>functools.partial</code> = Java currying ke nearest cousin.", "cpp": "#include <iostream>\n#include <vector>\n#include <string>\n#include <algorithm>\n#include <functional>\nusing namespace std;\n\nint len(const string& s) { return static_cast<int>(s.size()); }\nint add2(int a, int b) { return a + b; }\n\nint main() {\n    vector<string> names = {\"a\", \"bb\", \"ccc\"};\n    sort(names.begin(), names.end(),                // String::compareTo jaisa\n         [](const string& a, const string& b) { return a < b; });\n    for (auto& n : names) cout << n << \"\\n\";        // forEach (println jaisa)\n\n    // function reference — std::function (Function<String,Integer> jaisa)\n    function<int(const string&)> f = len;\n    cout << f(\"abc\") << \"\\n\";                       // 3\n\n    // function pointer direct\n    int (*addp)(int, int) = add2;\n    cout << addp(1, 2) << \"\\n\";                     // 3\n\n    // partial = curry jaisa (functools.partial jaisa)\n    auto add5 = bind(add2, 5, placeholders::_1);\n    cout << add5(3) << \"\\n\";                        // 8\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Multithreading — Thread & Runnable", "note": "Ek saath multiple tasks chalana. Java mein <b>Thread</b> class ya <b>Runnable</b> interface; Python mein <b>threading</b> module. Placement ke liye basics kaafi hain.", "type": "code", "java": "// 1) Thread class extend karke\nclass MyThread extends Thread {\n    public void run() {\n        System.out.println(\"Thread chala: \" + getName());\n    }\n}\nnew MyThread().start();   // start() -> naya thread\n\n// 2) Runnable interface (recommended)\nThread t = new Thread(() -> {\n    System.out.println(\"Runnable se\");\n});\nt.start();\nt.join();                 // wait for thread\n\n// sleep\nThread.sleep(1000);       // 1 second ruko\n\n// synchronized: ek time pe ek hi thread\nsynchronized void increment() { count++; }", "python": "import threading, time\n\ndef worker(name):\n    print(f\"Thread {name} chala\")\n    time.sleep(1)         # Java sleep() jaisa\n\nt1 = threading.Thread(target=worker, args=(\"A\",))\nt1.start()\nt1.join()                 # wait\n\n# Lock = synchronized jaisa\nlock = threading.Lock()\ndef safe():\n    with lock:            # critical section\n        count += 1\n\n# ThreadPoolExecutor (easy)\nfrom concurrent.futures import ThreadPoolExecutor\nwith ThreadPoolExecutor(max_workers=4) as ex:\n    ex.map(worker, [\"A\", \"B\", \"C\"])", "extra": "<b>Flow:</b> <code>start()</code> se thread shuru hota hai (direct <code>run()</code> call mat karo — woh same thread mein chalega). <code>join()</code> = thread ke khatam hone ka wait. <b>synchronized</b> / <b>Lock</b> shared data ko race condition se bachate hain. Python ka GIL hai — CPU-heavy tasks ke liye <code>multiprocessing</code> better.", "cpp": "#include <iostream>\n#include <thread>\n#include <chrono>\n#include <mutex>\nusing namespace std;\n\nint count = 0;\nmutex m;\n\nvoid inc() {\n    lock_guard<mutex> g(m);    // synchronized jaisa — critical section\n    count++;\n}\n\nint main() {\n    // 1) Thread + lambda (Runnable jaisa) 🔥\n    thread t1([] { cout << \"Thread chala\\n\"; });\n    t1.join();                 // thread ke khatam hone ka wait\n\n    // 2) sleep\n    thread t2([] {\n        this_thread::sleep_for(chrono::milliseconds(100));   // 100ms ruko\n        cout << \"slept then ran\\n\";\n    });\n    t2.join();\n\n    // 3) shared data — mutex se race condition safe\n    thread a(inc), b(inc);\n    a.join(); b.join();\n    cout << \"count: \" << count << \"\\n\";   // 2\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "JDBC & Databases", "note": "Java mein database se baat karne ka standard tarika <b>JDBC</b> hai. Python ka equivalent <b>sqlite3</b> / <b>psycopg2</b>. MERN mein aage aayega — abhi flow samjho.", "type": "code", "java": "// JDBC flow: connect -> statement -> query\nimport java.sql.*;\n\nConnection conn = DriverManager.getConnection(\n    \"jdbc:mysql://localhost/db\", \"user\", \"pass\");\n\nStatement st = conn.createStatement();\nResultSet rs = st.executeQuery(\"SELECT * FROM users\");\nwhile (rs.next()) {\n    System.out.println(rs.getString(\"name\"));\n}\n\n// PreparedStatement = SQL injection safe 🔥\nPreparedStatement ps = conn.prepareStatement(\n    \"INSERT INTO users (name) VALUES (?)\");\nps.setString(1, \"Vinay\");\nps.executeUpdate();\n\nconn.close();   // connection band karna mat bhoolo", "python": "import sqlite3\n\nconn = sqlite3.connect(\"app.db\")   # file-based DB\ncur = conn.cursor()\n\ncur.execute(\"CREATE TABLE IF NOT EXISTS users (name TEXT)\")\ncur.execute(\"INSERT INTO users VALUES (?)\", (\"Vinay\",))\n# ? = parameterized, injection safe 🔥\n\nrows = cur.execute(\"SELECT * FROM users\").fetchall()\nfor row in rows:\n    print(row)\n\nconn.commit()   # changes save karo\nconn.close()    # band karo\n\n# CRUD: INSERT / SELECT / UPDATE / DELETE", "extra": "<b>CRUD</b> = Create, Read, Update, Delete — har DB ka base. <b>PreparedStatement / ?</b> hamesha use karo (SQL injection se bachata hai). Java mein <code>try-with-resources</code> connection ko auto-close karta hai.", "cpp": "#include <iostream>\n#include <fstream>\n#include <string>\n#include <vector>\nusing namespace std;\n\n// C++ mein DB ke liye external lib chahiye (sqlite3.h / ODBC)\n// Flow same: connect -> statement -> query\n// Neeche CSV-as-table se SELECT + INSERT ka simple demo:\n\nstruct Users {                       // \"table\"\n    vector<string> names;\n    void load(const string& file) {  // SELECT * jaisa (from file)\n        ifstream f(file);\n        string line;\n        while (getline(f, line)) names.push_back(line);\n    }\n    void insert(const string& name) {   // \"PreparedStatement\" jaisa safe 🔥\n        names.push_back(name);          // SQL string concat nahi → injection safe\n    }\n    void selectAll() const {\n        for (auto& n : names) cout << n << \"\\n\";\n    }\n};\n\nint main() {\n    ofstream(\"users.csv\") << \"Vinay\\nRahul\\n\";   // demo DB file\n    Users db;\n    db.load(\"users.csv\");\n    db.insert(\"Sita\");\n    db.selectAll();\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "Sawaal 16 — Java Extras ke Questions", "note": "Java-specific concepts (JVM, switch, generics, exceptions) test karo.", "type": "quiz", "questions": [{"q": "JVM ka kaam kya hai?", "opts": [".java file compile karna", "Bytecode (.class) run karna", "Code likhna", "Packages banana"], "ans": 1, "expl": "JVM = Java Virtual Machine — compiled bytecode ko run karta hai (platform-independent). javac compile karta hai, JVM run karta hai."}, {"q": "do-while loop ki guarantee kya hai?", "opts": ["Hamesha 5 baar chalega", "At least ek baar chalega", "Kabhi nahi chalega", "Condition true toh ek baar"], "ans": 1, "expl": "do-while mein body pehle run hoti hai, phir condition check — isliye at least ek baar pakka chalega. while mein pehle check, isliye zero baar bhi chal sakta."}, {"q": "Java <code>throw new Exception()</code> ka Python equivalent?", "opts": ["<code>try</code>", "<code>raise Exception()</code>", "<code>except</code>", "<code>finally</code>"], "ans": 1, "expl": "<code>throw</code> → <code>raise</code>. Exception banate ho aur error signal karte ho. try/except usko catch karta hai."}, {"q": "Java mein <code>String a=\"hi\", b=\"hi\"; a == b</code> kya hai?", "opts": ["false hamesha", "true (same String Pool reference)", "compile error", "null"], "ans": 1, "expl": "Same string literals String Pool mein ek hi reference share karte hain — isliye == true. Par <code>new String(\"hi\")</code> se naya object banta — == false. Isliye .equals() use karo."}, {"q": "Java generics ka kya faida hai?", "opts": ["Runtime faster", "Compile-time type safety", "Less memory", "No need of compiler"], "ans": 1, "expl": "Generics galat type daalne pe compile-time error dete hain — runtime ClassCastException se bachte. Python mein ye check nahi hota (dynamic)."}, {"q": "Java <code>private</code> ka Python equivalent convention?", "opts": ["<code>__x</code> (name mangling)", "<code>private x</code>", "<code>x.private()</code>", "<code>final</code>"], "ans": 0, "expl": "Python mein <code>_x</code> = convention, <code>__x</code> = name mangling (effectively private). Compiler enforcement nahi — sirf discipline."}]}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q1 · HashMap kaise kaam karta hai?", "diff": "I", "note": "Java HashMap ki internal working explain karo — get/put ki time complexity kya hai?", "answer": "<b>Internal structure:</b> Array of <code>Node&lt;K,V&gt;</code> buckets. Har bucket ek linked list (ya tree) hai.\n<ul>\n<li><code>put(k,v)</code>: k ka <code>hashCode()</code> nikaalo, phir <code>hash % capacity</code> se bucket index nikaal kar wahan node daalo.</li>\n<li><code>get(k)</code>: same bucket mein hash + <code>equals()</code> se node dhoondo.</li>\n<li>2 equals-objects ka hashCode SAME hona chahiye (contract) — warna lookup fail ho jayega.</li>\n<li>Ek bucket mein 8+ nodes (treeify_threshold) hote hi linked list → <b>Red-Black tree</b> ban jata hai (worst case O(log n)).</li>\n<li>Load factor 0.75 — 75% full hone pe capacity double (rehash).</li>\n</ul>\n<b>Time:</b> average O(1), worst O(n)/O(log n). <b>vs Python dict:</b> dict = insertion-ordered, HashMap unordered; dict ki keys immutable honi chahiye (hashable), HashMap mein koi bhi object."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q2 · String, StringBuilder, StringBuffer ka fark?", "diff": "I", "note": "Dono mutable string classes mein kya difference hai, aur String immutable kyun hai?", "answer": "<b>String</b> = immutable (har operation naya object). Isliye loop mein string concat karna O(n²) hota hai — har baar naya object + copy.\n<br><br><b>StringBuilder</b> = mutable, <b>synchronized nahi</b> — single-thread mein fastest.\n<br><b>StringBuffer</b> = mutable, <b>synchronized</b> — multi-thread safe par thoda slow.\n<br><br><b>String immutable kyun?</b> — String Pool mein shared hone ki wajah se (security, caching, thread-safety). \n<br><br>Python mein strings bhi <b>immutable</b> hain; mutable version <code>list</code> of chars ya <code>io.StringIO</code> use hota hai."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q3 · equals() vs == aur hashCode() contract?", "diff": "I", "note": "Object comparison mein == aur equals() ka fark, aur equals-hashCode contract kya bolta hai?", "answer": "<b>==</b> = reference compare (same object hai ya nahi). Primitive pe value compare.\n<br><b>equals()</b> = value/logical compare — default Object.equals() bhi reference hi hota hai, isliye override karna padta hai.\n<br><br><b>Contract:</b> agar <code>a.equals(b)</code> true hai, toh <code>a.hashCode() == b.hashCode()</code> bhi true hona chahiye. Inverse zaroori nahi (hash collision ho sakta hai).\n<br><br>Python: <code>==</code> = value (Java ke equals jaisa), <code>is</code> = reference (Java ke == jaisa). Python objects ka default <code>__eq__</code> bhi identity hi hai."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q4 · Overloading vs Overriding?", "diff": "I", "note": "Compile-time vs runtime polymorphism ka fark explain karo.", "answer": "<b>Overloading</b> = same naam, alag parameters (same class). Compile-time resolve hota hai. Return type se overload nahi hota.\n<pre><code>void print(int a){...}\nvoid print(String s){...}</code></pre>\n<b>Overriding</b> = child class parent ka method same signature se re-define karta hai. Runtime resolve hota hai (dynamic dispatch). @Override annotation recommended.\n<br><br>Python: overloading nahi hoti — same naam ka method last wala hi rehta hai; <code>*args</code> se simulate karo. Overriding Python mein bhi hoti hai."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q5 · Exception: checked vs unchecked?", "diff": "I", "note": "Checked aur unchecked exceptions mein fark, aur kya 'finally' guarantee karta hai?", "answer": "<b>Checked</b> = compiler force karta hai handle karo (try-catch ya throws) — e.g. <code>IOException</code>, <code>SQLException</code>. Python mein iska exact equivalent nahi.\n<br><b>Unchecked</b> = runtime pe aati hain, handle karna optional — e.g. <code>NullPointerException</code>, <code>ArithmeticException</code>. Python ki saari exceptions isi jaisi hain.\n<br><br><b>finally</b> = exception aaye ya nahi, hamesha chalta hai (resource close ke liye). Java 7+ mein <code>try-with-resources</code> auto close karta hai.\n<br><br>Python: <code>try/except/else/finally</code> — <code>raise</code> (Java throw), custom exception = class Exception ko inherit karo."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q6 · Thread vs Process, aur synchronized?", "diff": "I", "note": "Process aur thread mein fark, synchronized keyword kya karta hai?", "answer": "<b>Process</b> = apni memory + resources (heavy). <b>Thread</b> = same process ke andar, shared memory (light, communication aasan par race conditions risk).\n<br><br><b>synchronized</b> = ek time pe ek hi thread method/block mein — <b>monitor lock (intrinsic lock)</b> pe. Critical section safe.\n<ul>\n<li><code>synchronized void m()</code> — instance lock</li>\n<li><code>synchronized static void m()</code> — class lock</li>\n</ul>\n<b>vs Python:</b> <b>GIL</b> (Global Interpreter Lock) CPU-bound threads ko parallel nahi chalne deta — I/O-bound ke liye threads, CPU-bound ke liye multiprocessing. Java threads truly parallel hain (multi-core)."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q7 · Garbage Collection kya hai?", "diff": "I", "note": "Java mein GC kaise kaam karta hai, aur memory leak kab hota hai?", "answer": "<b>GC</b> = unused objects ki memory automatically free karta hai (manual free nahi, C/C++ ke opposite). Reachability se decide hota hai — koi thread object ko reference nahi kar raha toh mark-and-sweep.\n<br><br>Heap ke generations: Young (Eden + Survivor) → Old. Minor GC (young) + Major GC (old). <b>Stop-the-world</b> pauses kaam karte hain.\n<br><br><b>Memory leak kab?</b> — static collections mein objects rakhe raho, unclosed resources (streams/connections), listener/observer remove na karo, hashmap keys jo equals/hashCode break karein.\n<br><br>Python: reference counting + cyclic GC. Leak = global list/singleton cache mein growth, unclosed files."}, {"type": "qa", "cat": "16. Advanced Java", "title": "Interview Q8 · Generics kyun aur type erasure?", "diff": "I", "note": "Generics compile-time type safety kyun dete hain, type erasure kya hai?", "answer": "<b>Generics</b> = compile-time type safety — galat type daalo toh compile error. Bina generics ke runtime ClassCastException ka risk.\n<pre><code>List&lt;String&gt; list = new ArrayList<>();</code></pre>\n<b>Type erasure:</b> compile ke baad generic info hata di jaati hai — <code>List&lt;String&gt;</code> ban jata hai raw <code>List</code>, boundaries pe casts add ho jaati hain. Isliye <code>list instanceof List&lt;String&gt;</code> legal nahi (runtime pe info nahi hai).\n<br><br>Python: dynamically typed, type hints (<code>list[str]</code>) sirf documentation/mypy ke liye — runtime enforce nahi. Generics ka fayda = less runtime bugs."}, {"cat": "17. Advanced Python", "title": "String Formatting — Deep Dive", "note": "f-string Python 3.6+ ka best feature — Java ke printf/String.format se zyada clean. % aur .format() purane style, f-string zyada readable.", "type": "code", "java": "int a = 10;\nString name = \"Vinay\";\nSystem.out.printf(\"%d apples%n\", a);\nSystem.out.println(String.format(\"%d %s\", a, name));\nSystem.out.println(String.format(\"%05d\", a));   // 00010\nSystem.out.println(String.format(\"%.2f\", 3.14159)); // 3.14", "python": "a = 10; name = \"Vinay\"\nprint(f\"{a} apples\")              # f-string 🔥 best\nprint(\"{} {}\".format(a, name))     # .format() style\nprint(\"%d %s\" % (a, name))         # % old style\n\nprint(f\"{a:05d}\")                  # 00010\nprint(f\"{3.14159:.2f}\")            # 3.14\nprint(f\"{a:>5}\")                   # right align\nprint(f\"Hello {name.upper()}\")     # expression bhi 🔥", "extra": "f-string mein koi bhi expression daal sakte ho: <code>f\"{x*y}\"</code>, <code>f\"{arr[0]}\"</code>. Alignment padding, zero-padding interview printing mein kaam aata hai. Java <code>%05d</code> = Python <code>{:05d}</code>.", "cpp": "#include <cstdio>\n#include <iostream>\n#include <iomanip>\n#include <string>\nusing namespace std;\n\nint main() {\n    int a = 10;\n    string name = \"Vinay\";\n\n    printf(\"%d apples\\n\", a);              // printf style (C)\n    printf(\"%05d\\n\", a);                   // 00010 (zero padding)\n    printf(\"%.2f\\n\", 3.14159);             // 3.14\n\n    // ya iomanip (C++ style) 🔥\n    cout << setw(5) << setfill('0') << a << \"\\n\";          // 00010\n    cout << fixed << setprecision(2) << 3.14159 << \"\\n\";   // 3.14\n    cout << setw(6) << setfill(' ') << name << \"\\n\";       // right-align\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Set & Dict Comprehensions", "note": "List comprehension ka bhai — set aur dict bhi same syntax se bante hain. Java mein iske liye hamesha loop likhna padta.", "type": "code", "java": "// java: manual loops\nSet<Integer> evens = new HashSet<>();\nfor (int x : arr) if (x % 2 == 0) evens.add(x);\n\nMap<Integer, Integer> squares = new HashMap<>();\nfor (int i = 0; i < 5; i++) squares.put(i, i * i);", "python": "evens = {x for x in arr if x % 2 == 0}       # set 🔥\nsquares = {i: i*i for i in range(5)}          # dict 🔥\n\n# dict comprehension -> frequency\nfreq = {x: arr.count(x) for x in set(arr)}\n\n# swap key/value 🔥\ninverted = {v: k for k, v in mp.items()}\n\n# conditional\neven_sq = {x: x*x for x in arr if x % 2 == 0}", "extra": "<b>Syntax yaad rakho:</b> list <code>[expr for ...]</code>, set <code>{expr for ...}</code>, dict <code>{k: v for ...}</code>. Inverted dict pattern (<code>{v: k for k,v in mp.items()}</code>) — 'reverse lookup' problems mein gold hai.", "cpp": "#include <iostream>\n#include <set>\n#include <map>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5, 4};\n\n    // set comprehension (manual) — Python {x for x in ... if} jaisa\n    set<int> evens;\n    for (int x : arr) if (x % 2 == 0) evens.insert(x);\n\n    // dict comprehension (manual)\n    map<int, int> squares;\n    for (int i = 0; i < 5; i++) squares[i] = i * i;\n\n    // dict comprehension -> frequency 🔥\n    map<int, int> freq;\n    for (int x : arr) freq[x]++;\n\n    // inverted map (reverse lookup) 🔥\n    map<int, int> inverted;\n    for (auto& [k, v] : squares) inverted[v] = k;\n\n    cout << \"evens: \";\n    for (int x : evens) cout << x << \" \";\n    cout << \"\\nsquares[3]: \" << squares[3] << \"\\n\";\n    cout << \"freq[4]: \" << freq[4] << \"\\n\";\n    cout << \"inverted[9]: \" << inverted[9] << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "*args / **kwargs & Unpacking", "note": "Variable-length arguments aur unpacking — Python ka superpower. Java varargs (int... nums) = *args jaisa.", "type": "code", "java": "static int sumAll(int... nums) {     // varargs\n    int total = 0;\n    for (int n : nums) total += n;\n    return total;\n}\nsumAll(1, 2, 3);    // 6\nsumAll(1, 2, 3, 4, 5);  // 15", "python": "def total(*nums):            # *args = tuple 🔥\n    return sum(nums)\n\ntotal(1, 2, 3)              # 6\n\ndef info(**kwargs):         # **kwargs = dict\n    for k, v in kwargs.items():\n        print(k, v)\n\ninfo(name=\"Vinay\", age=20)\n\n# unpacking tricks 🔥\na, *rest = [1, 2, 3, 4]     # a=1, rest=[2,3,4]\nfirst, *mid, last = [1,2,3,4,5]  # first=1,last=5\n\ndef f(a, b, c): return a+b+c\nf(*[1, 2, 3])               # list -> arguments", "extra": "<code>*</code> = iterable ko unpack karta (tuple/list), <code>**</code> = dict ko keyword args mein. Swap <code>a,b = b,a</code> bhi isi unpacking hai. Java <code>int... nums</code> = varargs, par **kwargs jaisa kuch Java mein nahi.", "cpp": "#include <iostream>\n#include <vector>\n#include <initializer_list>\nusing namespace std;\n\n// varargs = initializer_list (Java int... nums jaisa) 🔥\nint sumAll(initializer_list<int> nums) {\n    int total = 0;\n    for (int n : nums) total += n;\n    return total;\n}\n\nint main() {\n    cout << sumAll({1, 2, 3}) << \"\\n\";          // 6\n    cout << sumAll({1, 2, 3, 4, 5}) << \"\\n\";    // 15\n\n    // unpacking tricks — *rest wala behaviour manual 🔥\n    vector<int> v = {1, 2, 3, 4};\n    int first = v[0];\n    vector<int> rest(v.begin() + 1, v.end());   // a, *rest jaisa\n    cout << \"first=\" << first << \" rest:\";\n    for (int x : rest) cout << \" \" << x;\n    cout << \"\\n\";\n\n    //
