<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java ⇄ Python — Rosetta Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0e13;
    --panel:#12161d;
    --panel-2:#0f1319;
    --line:#232935;
    --text:#e7ecf3;
    --muted:#8a93a3;
    --muted-2:#5b6472;
    --java:#ef8b28;
    --java-dim:#3a2a17;
    --py-blue:#4b8bd4;
    --py-yellow:#f2c94c;
    --py-dim:#17263a;
    --green:#2ecc71;
    --red:#e74c3c;
    --accent-line: repeating-linear-gradient(90deg, var(--muted-2) 0 6px, transparent 6px 12px);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(239,139,40,0.07), transparent 60%),
      radial-gradient(1200px 700px at 100% 10%, rgba(75,139,212,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  code, .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
    background:rgba(11,14,19,0.85);
    backdrop-filter: blur(10px);
    gap:14px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:15px;
    padding:6px 10px; border-radius:8px;
    background:linear-gradient(135deg, var(--java-dim), var(--py-dim));
    border:1px solid var(--line);
    letter-spacing:0.5px;
  }
  .brand .mark span.j{color:var(--java);}
  .brand .mark span.p{color:var(--py-yellow);}
  .brand h1{ font-size:16px; margin:0; font-weight:600; color:var(--muted);}
  .brand h1 b{color:var(--text); font-weight:700;}
  .head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand{ cursor:pointer; }
  .brand:hover h1 b{ color:var(--java); }
  .brand .mark{ transition:.15s; }
  .brand:hover .mark{ border-color:var(--java); }

  /* ---------- Home / Front page ---------- */
  .home-hero{ text-align:center; padding:20px 0 4px 0; }
  .home-hero .home-mark{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    display:inline-block; padding:9px 16px; border-radius:10px;
    background:linear-gradient(135deg, var(--java-dim), var(--py-dim));
    border:1px solid var(--line); letter-spacing:1px; margin-bottom:20px;
  }
  .home-hero .home-mark .j{color:var(--java);} .home-hero .home-mark .p{color:var(--py-yellow);}
  .home-hero h2{ font-size:clamp(30px,5vw,46px); margin:0 0 10px 0; font-weight:700; }
  .home-hero p.lead{ color:var(--muted); font-size:15.5px; max-width:660px; margin:0 auto 24px auto; line-height:1.65; }
  .home-stats{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .home-stat{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 24px; min-width:110px;
  }
  .home-stat b{ display:block; font-size:22px; font-family:'JetBrains Mono',monospace; color:var(--py-yellow); }
  .home-stat span{ font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1px; }
  .home-chapters{ margin-top:28px; display:flex; flex-direction:column; gap:18px; }
  .home-ch{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px 18px; }
  .home-ch-head{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--java);
    text-transform:uppercase; letter-spacing:1.5px; margin-bottom:13px;
  }
  .home-ch-head .n{ color:var(--muted-2); margin-right:8px; }
  .home-ch-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:8px; }
  .home-topic{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:10px 12px; border-radius:9px; cursor:pointer; font-size:13px;
    font-family:'Space Grotesk',sans-serif; transition:.15s; line-height:1.4;
  }
  .home-topic:hover{ color:var(--text); border-color:var(--java); background:rgba(239,139,40,0.06); transform:translateY(-1px); }
  .home-topic .qn{ font-family:'JetBrains Mono',monospace; color:var(--muted-2); font-size:11px; margin-right:8px; }
  .home-topic.quiz-t{ border-left:3px solid var(--py-yellow); }
  .home-topic.quiz-t .qn{ color:var(--py-yellow); }
  .diff{
    font-family:'JetBrains Mono',monospace; font-size:11px; vertical-align:middle;
    padding:3px 10px; border-radius:6px; letter-spacing:1px; margin-left:10px;
  }
  .d-M{ color:var(--py-yellow); background:rgba(242,201,76,0.1); border:1px solid rgba(242,201,76,0.35); }
  .d-H{ color:var(--red); background:rgba(231,76,60,0.12); border:1px solid rgba(231,76,60,0.4); }
  .d-E{ color:var(--green); background:rgba(46,204,113,0.1); border:1px solid rgba(46,204,113,0.35); }
  .d-I{ color:var(--py-blue); background:rgba(75,139,212,0.1); border:1px solid rgba(75,139,212,0.4); }
  .qa-box{
    background:var(--panel-2); border:1px solid var(--line);
    border-left:3px solid var(--py-blue); border-radius:10px; padding:18px 20px;
    font-size:15px; color:var(--muted); line-height:1.8;
  }
  .qa-box b{ color:var(--text); }
  .qa-box code{ color:var(--py-yellow); font-size:13px; }
  .qa-box ul{ margin:8px 0 0 0; padding-left:20px; }
  .qa-box li{ margin-bottom:6px; }

  .score-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px;
    font-size:13px; color:var(--muted); font-family:'JetBrains Mono',monospace;
  }
  .score-pill .star{ color:var(--py-yellow); }

  .index-toggle{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; cursor:pointer;
    font-size:13px; color:var(--muted); user-select:none; text-decoration:none;
    transition:.15s;
  }
  .index-toggle:hover{ border-color:var(--muted-2); color:var(--text); }

  /* ---------- Progress ---------- */
  .progress-wrap{ padding:10px 28px 0 28px; }
  .progress-track{
    height:3px; width:100%; background:var(--line); border-radius:2px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--java), var(--py-blue));
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-meta{
    display:flex; justify-content:space-between; font-size:11px; color:var(--muted-2);
    margin-top:6px; font-family:'JetBrains Mono',monospace; letter-spacing:.5px;
  }

  /* ---------- Layout ---------- */
  .stage{
    flex:1; display:flex; width:100%; max-width:1180px; margin:0 auto;
    padding:26px 28px 90px 28px; position:relative;
  }

  /* ---------- Sidebar index (drawer) ---------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:.25s; z-index:40;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:-360px; width:340px; height:100%;
    background:var(--panel-2); border-left:1px solid var(--line);
    z-index:41; transition:right .3s cubic-bezier(.4,0,.2,1);
    overflow-y:auto; padding:20px 0 40px 0;
  }
  .drawer.open{ right:0; }
  .drawer h3{
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted-2); padding:0 20px 12px 20px; margin:0;
    border-bottom:1px solid var(--line); padding-bottom:14px;
  }
  .drawer-list{ list-style:none; margin:0; padding:8px 0; }
  .drawer-list li{
    padding:10px 20px; font-size:13.5px; color:var(--muted);
    cursor:pointer; display:flex; gap:10px; align-items:baseline;
    border-left:2px solid transparent;
    transition:.15s;
  }
  .drawer-list li:hover{ background:rgba(255,255,255,0.03); color:var(--text); }
  .drawer-list li.active{
    color:var(--text); border-left-color:var(--java); background:rgba(239,139,40,0.06);
    font-weight:600;
  }
  .drawer-list li .num{ font-family:'JetBrains Mono',monospace; color:var(--muted-2); font-size:11px; min-width:20px;}
  .drawer-list li.cat{
    text-transform:uppercase; letter-spacing:1px; font-size:10.5px; color:var(--muted-2);
    cursor:default; padding-top:16px; padding-bottom:4px;
  }
  .drawer-list li.cat:hover{ background:none; }
  .drawer-list li .badge-q{
    font-size:10px; color:var(--py-yellow); border:1px solid var(--py-dim); border-radius:4px;
    padding:1px 5px; margin-left:auto; font-family:'JetBrains Mono',monospace;
  }

  /* ---------- Slide ---------- */
  .slide{ width:100%; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted-2);
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px;
  }
  .eyebrow .ch{
    color:var(--java); background:var(--java-dim); padding:2px 8px; border-radius:6px;
    letter-spacing:.5px; margin-right:8px;
  }
  .slide h2{
    font-size:clamp(24px,3.6vw,34px); margin:0 0 8px 0; font-weight:700; line-height:1.15;
  }
  .slide .note{
    color:var(--muted); font-size:14.5px; line-height:1.65; max-width:820px; margin-bottom:26px;
  }
  .slide .note b{ color:var(--text); }

  /* ---------- Rosetta split ---------- */
  .rosetta{
    display:grid; grid-template-columns: 1fr 34px 1fr; gap:0; align-items:stretch;
  }
  .col{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 20px 18px; min-width:0;
  }
  .col.java{ border-top:3px solid var(--java); }
  .col.python{ border-top:3px solid var(--py-blue); }
  .col-head{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .dot.j{ background:var(--java); box-shadow:0 0 10px var(--java);}
  .dot.p{ background:var(--py-blue); box-shadow:0 0 10px var(--py-blue);}
  .col-head span{ font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  pre{
    margin:0; overflow-x:auto; padding:14px 16px; border-radius:10px;
    background:var(--panel-2); border:1px solid var(--line);
    font-size:13px; line-height:1.65;
  }
  pre code{ color:#d6dee8; white-space:pre; }
  .kw{color:#ef8b28;} .str{color:#8bd490;} .cm{color:#5b6472; font-style:italic;} .fn{color:#4b8bd4;} .num{color:#f2c94c;}

  .spine{ display:flex; align-items:center; justify-content:center; position:relative; }
  .spine::before{
    content:""; position:absolute; top:8%; bottom:8%; left:50%;
    width:1px; background:var(--accent-line);
  }
  .spine .glyph{
    position:relative; z-index:2; background:var(--bg);
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--muted-2);
  }

  /* ---------- Table type slides ---------- */
  .method-table{ width:100%; border-collapse:collapse; }
  .method-table th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:1px; color:var(--muted-2);
    padding:0 14px 10px 14px; font-weight:500;
  }
  .method-table td{
    padding:12px 14px; border-top:1px solid var(--line); vertical-align:top; font-size:13.5px;
  }
  .method-table tr:hover td{ background:rgba(255,255,255,0.015); }
  .method-table code{
    background:var(--panel-2); border:1px solid var(--line); padding:2px 7px; border-radius:6px;
    font-size:12.5px; color:#d6dee8;
  }
  .col.wide{ grid-column: 1 / -1; }

  .extra-box{
    margin-top:20px; padding:16px 18px; border:1px dashed var(--line); border-radius:12px;
    background:rgba(255,255,255,0.012);
  }
  .extra-box .tag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; color:var(--py-yellow); margin-bottom:8px; display:block;
  }

  /* ---------- Done / Mark ---------- */
  .done-row{ display:flex; align-items:center; gap:10px; margin-top:16px; }
  .done-btn{
    flex:1; border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:1px;
    padding:11px; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .done-btn:hover{ border-color:var(--muted-2); color:var(--text); }
  .done-btn.is-done{
    border-color:var(--green); color:#0b0e13; font-weight:700;
    background:linear-gradient(135deg,var(--green),#2ecc71);
  }
  .done-count{ color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono',monospace; }
  .done-count b{ color:var(--green); }
  .drawer-list li.done .num, .drawer-list li.done{ color:var(--green); }
  .home-topic.done{ border-color:var(--green); color:var(--green); }
  .home-topic.done .qn{ background:rgba(46,204,113,0.15); color:var(--green); }

  /* ---------- Quiz ---------- */
  .quiz-list{ display:flex; flex-direction:column; gap:18px; }
  .quiz-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 20px 18px 20px; border-top:3px solid var(--py-yellow);
  }
  .quiz-q{ font-size:15.5px; font-weight:600; line-height:1.55; margin-bottom:14px; }
  .quiz-q .qnum{
    font-family:'JetBrains Mono',monospace; color:var(--py-yellow); margin-right:8px;
    background:var(--py-dim); padding:2px 8px; border-radius:6px; font-size:12.5px;
  }
  .quiz-opts{ display:grid; gap:9px; }
  .quiz-opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:10px; cursor:pointer; font-size:14px;
    font-family:'Space Grotesk',sans-serif; transition:.15s; line-height:1.5;
  }
  .quiz-opt:hover:not(:disabled){ border-color:var(--muted-2); }
  .quiz-opt.correct{ border-color:var(--green); background:rgba(46,204,113,0.12); color:#8ff0bb; }
  .quiz-opt.wrong{ border-color:var(--red); background:rgba(231,76,60,0.12); color:#f5a5a0; text-decoration:line-through; }
  .quiz-opt:disabled{ opacity:.55; cursor:not-allowed; }
  .quiz-explain{
    display:none; margin-top:14px; padding:14px 16px; border-left:3px solid var(--green);
    background:rgba(46,204,113,0.06); border-radius:0 10px 10px 0;
    font-size:13.5px; line-height:1.65; color:var(--muted);
  }
  .quiz-explain.show{ display:block; }
  .quiz-explain b{ color:var(--text); }
  .quiz-explain .ans-tag{ color:var(--green); font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px; }

  /* ---------- Roadmap ---------- */
  .roadmap{ display:flex; flex-direction:column; gap:6px; max-width:620px; margin-top:6px; }
  .rm-step{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line);
    padding:13px 18px; border-radius:12px; transition:.15s;
  }
  .rm-step:hover{ border-color:var(--muted-2); transform:translateX(4px); }
  .rm-num{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#0b0e13;
    background:linear-gradient(135deg,var(--java),var(--py-blue));
    width:26px; height:26px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rm-name{ font-weight:600; font-size:15px; }
  .rm-sub{ font-size:12px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; margin-left:auto; }
  .rm-arrow{ text-align:center; color:var(--muted-2); font-size:13px; line-height:1; }

  /* ---------- Footer nav ---------- */
  footer{
    position:sticky; bottom:0; z-index:20;
    border-top:1px solid var(--line);
    background:rgba(11,14,19,0.9); backdrop-filter: blur(10px);
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 20px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;
    font-family:'Space Grotesk',sans-serif;
    transition:.15s;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--muted-2); transform:translateY(-1px); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .nav-btn.primary{
    background:linear-gradient(135deg, var(--java), #d9720f);
    border:none; color:#1a1206;
  }
  .dots-mini{ display:flex; gap:5px; flex-wrap:wrap; max-width:340px; justify-content:center; }
  .dots-mini span{
    width:6px; height:6px; border-radius:50%; background:var(--line); transition:.2s;
  }
  .dots-mini span.active{ background:var(--java); width:16px; border-radius:4px; }
  .hint{ font-size:11px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; display:none; }
  @media(min-width:900px){ .hint{ display:block; } }

  @media(max-width:820px){
    .rosetta{ grid-template-columns:1fr; }
    .spine{ height:34px; }
    .spine::before{ top:50%; bottom:auto; left:8%; right:8%; width:auto; height:1px; }
    .spine .glyph{ transform:rotate(90deg); }
    .drawer{ width:88%; right:-100%; }
    header{ padding:14px 16px; }
    .stage{ padding:20px 16px 90px 16px; }
    footer{ padding:12px 16px; }
    .dots-mini{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"><span class="j">JAVA</span> ⇄ <span class="p">PYTHON</span></div>
    <h1>Rosetta — <b>DSA Handbook</b></h1>
  </div>
  <div class="head-right">
    <a class="index-toggle" href="index.html" title="LeetCode 267 questions kholo" onclick="if(window.parent&&window.parent.openPage){window.parent.openPage('leetcode');}return false;">⚡ 267 Qs</a>
    <div class="index-toggle" id="homeBtn" title="Front page pe jaao">⌂ Front</div>
    <div class="score-pill"><span class="star">★</span><span id="scoreVal">0</span> / <span id="scoreTotal">0</span></div>
    <div class="index-toggle" id="drawerBtn">☰ Index <span class="hint" style="display:inline">(ya ←/→ keys)</span></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="metaLeft">SLIDE 1</span>
    <span id="metaRight">/ N</span>
  </div>
</div>

<div class="stage">
  <div class="slide" id="slide"></div>
</div>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <h3 id="drawerTitle">Complete index</h3>
  <ul class="drawer-list" id="drawerList"></ul>
</div>

<footer>
  <button class="nav-btn" id="prevBtn">← Prev</button>
  <div class="dots-mini" id="dotsMini"></div>
  <button class="nav-btn primary" id="nextBtn">Next →</button>
</footer>

<script>
/* ============================================================
   DATA — har slide ek object hai.
   type: "code"    -> java/python code block side by side
   type: "table"   -> method mapping table
   type: "quiz"    -> interactive MCQ slide (questions: [q, opts, ans, expl])
   type: "roadmap" -> full learning-flow diagram
   ============================================================ */

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const DATA = [

/* ========== FRONT PAGE (HOME) ========== */
{type:"home", title:"Front Page", note:"", java:"", python:""},

/* ========== CHAPTER 1 — SHURUAAT ========== */
{cat:"Shuruaat", title:"Print & Comments", note:"Output print karne ka pehla kadam. Java ke <b>System.out.println</b> ka Python equivalent sirf <b>print()</b> hai. Yaad rakho: Java ko semicolon (;) chahiye, Python ko nahi.",
type:"code",
java:`// single line comment
System.out.println("Hello World");   // newline ke saath
System.out.print("No newline");      // newline ke bina

System.out.printf("%d apples", 5);   // formatted print
System.out.println(1 + 2);           // expression bhi

   line comment */`,

print("Hello World")              # newline ke saath

{cat:"Shuruaat", title:"Time Complexity & Big-O (Basics)", note:"Algorithm kitni fast hai, ye batane ka standard tarika <b>Big-O notation</b> hai — input size badhne pe operations kitne grow hote hain, ye measure karta hai. Constants ignore hoti hain: <b>O(2n) = O(n)</b>, <b>O(n/2) = O(n)</b>.",
type:"table",
headers:["Big-O","Naam","Matalab (n = input size)"],
rows:[
["<code>O(1)</code>","Constant","Har baar same time — array index, hashmap get/put"],
["<code>O(log n)</code>","Logarithmic","Har step pe aadha cut — binary search, BST search"],
["<code>O(n)</code>","Linear","Ek loop — linear scan, max/min dhundna"],
["<code>O(n log n)</code>","Linearithmic","Efficient sorting — merge sort, <code>Arrays.sort()</code>, <code>sorted()</code>"],
["<code>O(n²)</code>","Quadratic","Nested loop — brute-force pairs, bubble sort"],
["<code>O(2ⁿ)</code>","Exponential","Har n pe double — subsets (recursion)"],
["<code>O(n!)</code>","Factorial","Permutations — n=10 ke baad bhag jao"]
]},
{cat:"Shuruaat", title:"Big-O in Code — O(n) vs O(n²)", note:"Same kaam, alag complexity. Nested loop hamesha O(n²) hota hai — isliye brute force se pehle socho: sorted array + two pointers? HashMap? Ye hi DSA interviews ka game hai.",
type:"code",
java:`// O(n) — ek loop, linear
for (int i = 0; i < n; i++) sum += a[i];

// O(log n) — har step pe aadha
int lo = 0, hi = n - 1;
while (lo <= hi) {
    int mid = lo + (hi - lo) / 2;
    if (a[mid] == target) break;
    else if (a[mid] < target) lo = mid + 1;
    else hi = mid - 1;
}

// O(n^2) — nested loop, quadratic
for (int i = 0; i < n; i++)
    for (int j = 0; j < n; j++)
        if (a[i] + a[j] == target) /* found */;`,
python:`# O(n) — ek loop, linear
for x in arr: total += x

# O(log n) — har step pe aadha
lo, hi = 0, n - 1
while lo <= hi:
    mid = (lo + hi) // 2
    if a[mid] == target: break
    elif a[mid] < target: lo = mid + 1
    else: hi = mid - 1

# O(n^2) — nested loop, quadratic
for i in range(n):
    for j in range(n):
        if arr[i] + arr[j] == target: pass`,
extra:"<b>Flow:</b> Space complexity bhi same way measure hoti hai — extra memory kitni li. Har question ke approach ke saath <b>Complexity</b> line likhi hogi (dono files mein), wahi isi notation mein hai."
},

/* ========== CHAPTER 2 — BASICS (CONTROL FLOW) ========== */
{cat:"Basics", title:"Operators & Division ⚠️", note:"Sabse zyada DSA bugs isi ek chhote se fark se aate hain: Java mein <code>5/2 = 2</code> (integer division), Python mein <code>5/2 = 2.5</code> (hamesha float).",
type:"code",
java:`int a = 5 / 2;      // 2   (integer division)
double b = 5.0 / 2;  // 2.5 (float division)

double p = Math.pow(2, 3);   // 8.0
int m = 10 % 3;              // 1 (remainder)
int neg = -10 % 3;           // -1 (sign same as dividend)

// pre/post increment
int i = 0; int j = i++;      // j=0, i=1 (post)`,
python:`a = 5 / 2       # 2.5 -> always float!
b = 5 // 2      # 2   -> floor division

p = 2 ** 3      # 8   -> power operator 🔥
m = 10 % 3      # 1
neg = -10 % 3   # 2 (Python remainder != Java!)

# no i++ in python, always:
i = 0
i += 1`,
extra:"⚠️ <b>Do hidden fark:</b> (1) Python ka <code>//</code> floor karta hai, Java truncate — isliye <code>-10 % 3</code> Python mein 2 deta hai, Java mein -1. (2) Power ke liye Java <code>Math.pow</code> (double deta hai), Python <code>**</code> (int deta hai). <b>Flow check:</b> integer chahiye → Python mein hamesha <code>//</code>."
},

{cat:"Basics", title:"Comparison & Logical Operators", note:"Comparison operators (<code>== != &gt; &lt; &gt;= &lt;=</code>) dono languages mein same. Sirf logical operators badalte hain: && || ! ki jagah and or not.",
type:"code",
java:`if (age >= 18 && age <= 60) {
    System.out.println("Eligible");
}
if (!flag || age == 0) { }

// note: dono ends mein braces lagte hain
boolean canVote = age >= 18;`,
python:`if age >= 18 and age <= 60:
    print("Eligible")

if not flag or age == 0:
    pass

can_vote = age >= 18

# python chaining 🔥
if 18 <= age <= 60:
    print("Eligible")`,
extra:"Python mein <b>chained comparison</b> <code>18 &lt;= age &lt;= 60</code> ek sath likh sakte ho — Java mein iske liye do conditions aur <code>&&</code> lagana padta. Aur Python ki <code>pass</code> statement empty block ke liye hoti hai (Java ke <code>{ }</code> jaisi)."
},

{cat:"Basics", title:"If-Else & Ternary", note:"elif Python ka 'else if' hai. Ternary ka order bhi ulta hai — pehle value_if_true, phir condition, phir value_if_false.",
type:"code",
java:`if (age >= 18) {
    System.out.println("Adult");
} else if (age >= 13) {
    System.out.println("Teen");
} else {
    System.out.println("Minor");
}

String result = age >= 18 ? "Adult" : "Minor";

// nested ternary
String r = age >= 18 ? "A" : (age >= 13 ? "T" : "M");`,
python:`if age >= 18:
    print("Adult")
elif age >= 13:
    print("Teen")
else:
    print("Minor")

result = "Adult" if age >= 18 else "Minor"

# nested
r = "A" if age >= 18 else ("T" if age >= 13 else "M")`,
extra:"<b>Ternary yaad rakhne ka trick:</b> Java <code>cond ? a : b</code> ko English mein padho. Python hamesha <code>value_if_true if cond else value_if_false</code> — matlab <b>result condition output</b> ke order mein. Python ke if-elif-else mein <code>switch</code> jaisa matching bhi hai (Python 3.10: <code>match</code>)."
},

{cat:"Basics", title:"Loops — for & while", note:"Java ka classic 3-part for-loop, Python mein <b>range()</b> se replace hota hai. range(start, stop, step) — stop hamesha exclusive.",
type:"code",
java:`for (int i = 0; i < 5; i++) {
    System.out.println(i);
}
for (int i = 0; i < 10; i += 2) { }   // step 2

// pichhe ki taraf
for (int i = 5; i > 0; i--) { }

int i = 0;
while (i < 5) {
    System.out.println(i);
    i++;
}`,
python:`for i in range(5):
    print(i)

for i in range(0, 10, 2):   # start, stop, step
    pass

for i in range(5, 0, -1):   # 5,4,3,2,1
    pass

i = 0
while i < 5:
    print(i)
    i += 1`,
extra:"Python mein <code>i++</code> / <code>i--</code> <b>exist nahi karte</b> — hamesha <code>i += 1</code> / <code>i -= 1</code> likho. <code>range(1,6)</code> = 1 se 5 tak (6 exclusive). <code>range(5)</code> = 0 se 4 tak. While loop ka syntax bilkul same hai dono mein."
},

{cat:"Basics", title:"Nested Loops & Patterns", note:"Pattern problems (stars, tables, matrices) nested loops se bante hain — dono languages mein structure same hai.",
type:"code",
java:`// triangle pattern
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= i; j++) {
        System.out.print("* ");
    }
    System.out.println();
}

// multiplication table
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 3; j++) {
        System.out.print((i * j) + " ");
    }
    System.out.println();
}`,
python:`for i in range(1, 4):
    for j in range(1, i + 1):
        print("* ", end="")
    print()

# python trick: string repeat 🔥
for i in range(1, 4):
    print("* " * i)

for i in range(1, 4):
    row = [str(i * j) for j in range(1, 4)]
    print(" ".join(row))`,
extra:"<b>Flow:</b> outer loop = rows, inner loop = columns. Python mein <code>print(\"* \" * i)</code> string-multiplication se pattern ek line mein ban jata hai — Java mein repeat() (Java 11+) ya loop lagana padta. Pattern questions (pyramid, diamond, hollow) try karo dono languages mein."
},

{cat:"Basics", title:"Break, Continue & for-each", note:"Enhanced for-loop (for-each) Java se Python ke direct <code>for x in arr</code> tak. Index chahiye toh Python ka <code>enumerate()</code> use karo.",
type:"code",
java:`for (int x : arr) {
    if (x == 0) continue;
    if (x == 5) break;
    System.out.println(x);
}

// index ke saath
for (int i = 0; i < arr.length; i++) {
    System.out.println(i + ": " + arr[i]);
}`,
python:`for x in arr:
    if x == 0:
        continue
    if x == 5:
        break
    print(x)

# index + value ek saath 🔥
for i, x in enumerate(arr):
    print(i, x)`,
extra:"<code>enumerate(arr)</code> Java mein manually index track karne se far better hai jab dono chahiye. Bonus: Python ka <code>for...else</code> — loop bina break ke poora chala toh else chalega. Java mein iske liye flag variable lagana padta."
},

/* ========== CHAPTER 3 — STRINGS ========== */
{cat:"Strings", title:"String Basics", note:"length, indexing, substring — DSA mein sabse zyada use hone wale operations. Python ka negative indexing aur slicing Java mein exist hi nahi karte.",
type:"code",
java:`String s = "Hello World";
int len = s.length();                  // method () lagta hai
char c = s.charAt(0);                  // 'H'
char last = s.charAt(s.length() - 1);  // no negative index

String sub = s.substring(1, 4);        // "ell" (end exclusive)
String concat = s + "!";               // concatenation

char[] chars = s.toCharArray();        // string -> char array`,
python:`s = "Hello World"
length = len(s)            # function, property nahi
c = s[0]                   # 'H'
last = s[-1]               # 'd'  🔥 negative indexing

sub = s[1:4]               # "ell" (slicing)
concat = s + "!"

chars = list(s)            # ['H','e',...]`,
extra:"<b>Flow:</b> Java <code>s.length()</code> method hai (parentheses ke saath), array ka <code>arr.length</code> property hai (bina parentheses) — ye bhol-baal interview mein chhoti si galti ban jaati hai. Python dono jagah <code>len()</code> function. Slicing <code>s[a:b]</code> mein b exclusive hota hai — <code>s[1:4]</code> = index 1,2,3."

{cat:"Strings", title:"Character Counting & String Building", note:"Frequency counting (letters) aur efficient string building — dono languages ke best practices.",
type:"code",
java:`// count lowercase letter frequency
int[] freq = new int[26];

    freq[c - 'a']++;

sb.append("a").append("b").append('c');

for ch in s:
    freq[ord(ch) - ord('a')] += 1

# efficient building -> join 🔥
chars = []
chars.append("a"); chars.append("b")
result = "".join(chars)

{cat:"Strings", title:"Palindrome Check — Full Flow", note:"Classic interview problem. Poore flow ko dono languages mein same rakhna — sirf syntax alag.",
type:"code",
java:`static boolean isPalindrome(String s) {
    int l = 0, r = s.length() - 1;
    while (l < r) {
        if (s.charAt(l) != s.charAt(r)) return false;
        l++; r--;
    }
    return true;
}
// isPalindrome("racecar") -> true`,
python:`def is_palindrome(s):
    l, r = 0, len(s) - 1
    while l < r:
        if s[l] != s[r]:
            return False
        l += 1
        r -= 1
    return True

# one-liner version 🔥
def is_pal(s):
    return s == s[::-1]`,
extra:"<b>Flow (dono languages mein same):</b> 1) do pointers l=0, r=len-1 2) jab tak l &lt; r, dono end ke chars compare karo 3) mismatch mila → false 4) warna pointers ko andar le jaao. Python one-liner <code>s == s[::-1]</code> shortcut hai — lekin interviewer pooche toh two-pointer version bhi batao."
},

{type:"lc", cat:"Arrays / Lists", title:"Q1 · Two Sum", diff:"E", note:"Array mein aise 2 numbers ke indices return karo jinka sum = target ho.",
java:`public int[] twoSum(int[] nums, int target) {
    Map<Integer,Integer> m = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int need = target - nums[i];
        if (m.containsKey(need))
            return new int[]{m.get(need), i};
        m.put(nums[i], i);
    }
    return new int[]{};
}`,
python:`def twoSum(nums, target):
    m = {}
    for i, v in enumerate(nums):
        if target - v in m:
            return [m[target - v], i]
        m[v] = i
    return []`,
extra:`<b>HashMap</b> mein har number + index rakho. Har step pe check karo ki <b>target - nums[i]</b> pehle se map mein hai toh dono indices return. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q2 · Contains Duplicate", diff:"E", note:"Array mein koi value duplicate hai ya nahi.",
java:`public boolean containsDuplicate(int[] nums) {
    Set<Integer> s = new HashSet<>();
    for (int n : nums)
        if (!s.add(n)) return true;
    return false;
}`,
python:`def containsDuplicate(nums):
    return len(set(nums)) != len(nums)`,
extra:`<b>Set</b> mein add karte jaao — dobara add hua toh duplicate. Python mein set size compare. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q3 · Valid Anagram", diff:"E", note:"Check karo dono strings same characters utni hi baar rakhti hain ya nahi.",
java:`public boolean isAnagram(String s, String t) {
    if (s.length() != t.length()) return false;
    int[] c = new int[26];
    for (int i = 0; i < s.length(); i++) {
        c[s.charAt(i)-'a']++;
        c[t.charAt(i)-'a']--;
    }
    for (int x : c) if (x != 0) return false;
    return true;
}`,
python:`from collections import Counter
def isAnagram(s, t):
    return Counter(s) == Counter(t)`,
extra:`<b>Count array (26)</b> — ek se +1, dusri se -1, sab 0 hain toh anagram. Python <b>Counter</b>. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q4 · Group Anagrams", diff:"M", note:"Strings ko group karo — anagrams same group mein hon.",
java:`public List<List<String>> groupAnagrams(String[] strs) {
    Map<String, List<String>> m = new HashMap<>();
    for (String s : strs) {
        char[] c = s.toCharArray();
        Arrays.sort(c);
        m.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);
    }
    return new ArrayList<>(m.values());
}`,
python:`from collections import defaultdict
def groupAnagrams(strs):
    m = defaultdict(list)
    for s in strs:
        m[''.join(sorted(s))].append(s)
    return list(m.values())`,
extra:`Har string ko <b>sort</b> karo, sorted form <b>key</b> bano — same anagram ek bucket. O(n·k log k).`},

{type:"lc", cat:"Arrays / Lists", title:"Q5 · Top K Frequent Elements", diff:"M", note:"Sabse zyada baar aane wale K elements return karo.",
java:`public int[] topKFrequent(int[] nums, int k) {
    Map<Integer,Integer> cnt = new HashMap<>();
    for (int n : nums) cnt.merge(n, 1, Integer::sum);
    PriorityQueue<Integer> pq = new PriorityQueue<>((a,b)->cnt.get(a)-cnt.get(b));
    for (int n : cnt.keySet()) {
        pq.offer(n);
        if (pq.size() > k) pq.poll();
    }
    int[] r = new int[k];
    for (int i = 0; i < k; i++) r[i] = pq.poll();
    return r;
}`,
python:`from collections import Counter
import heapq
def topKFrequent(nums, k):
    cnt = Counter(nums)
    return heapq.nlargest(k, cnt.keys(), key=cnt.get)`,
extra:`Frequency count, phir <b>min-heap size k</b> ya Python <b>nlargest</b>. O(n log k).`},

{type:"lc", cat:"Arrays / Lists", title:"Q6 · Product of Array Except Self", diff:"M", note:"Har index pe baaki sab elements ka product, bina division ke.",
java:`public int[] productExceptSelf(int[] nums) {
    int n = nums.length;
    int[] r = new int[n];
    r[0] = 1;
    for (int i = 1; i < n; i++)
        r[i] = r[i-1] * nums[i-1];
    int right = 1;
    for (int i = n-1; i >= 0; i--) {
        r[i] *= right;
        right *= nums[i];
    }
    return r;
}`,
python:`def productExceptSelf(nums):
    n = len(nums)
    r = [1] * n
    for i in range(1, n):
        r[i] = r[i-1] * nums[i-1]
    right = 1
    for i in range(n-1, -1, -1):
        r[i] *= right
        right *= nums[i]
    return r`,
extra:`Pehle pass <b>left products</b>, dusre pass <b>right products</b> multiply. O(n), O(1) extra.`},

{type:"lc", cat:"Arrays / Lists", title:"Q7 · Longest Consecutive Sequence", diff:"M", note:"Longest consecutive numbers ka length, O(n) mein.",
java:`public int longestConsecutive(int[] nums) {
    Set<Integer> s = new HashSet<>();
    for (int n : nums) s.add(n);
    int best = 0;
    for (int n : s) {
        if (!s.contains(n-1)) {
            int len = 1;
            while (s.contains(n+len)) len++;
            best = Math.max(best, len);
        }
    }
    return best;
}`,
python:`def longestConsecutive(nums):
    s = set(nums)
    best = 0
    for n in s:
        if n - 1 not in s:
            ln = 1
            while n + ln in s:
                ln += 1
            best = max(best, ln)
    return best`,
extra:`Sirf <b>sequence ke start</b> se count karo (n-1 exist na ho) — har element ek baar. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q8 · Maximum Subarray", diff:"M", note:"Sum sabse zyada wala contiguous subarray ka sum.",
java:`public int maxSubArray(int[] nums) {
    int best = nums[0], cur = nums[0];
    for (int i = 1; i < nums.length; i++) {
        cur = Math.max(nums[i], cur + nums[i]);
        best = Math.max(best, cur);
    }
    return best;
}`,
python:`def maxSubArray(nums):
    cur = best = nums[0]
    for v in nums[1:]:
        cur = max(v, cur + v)
        best = max(best, cur)
    return best`,
extra:`<b>Kadane's algorithm</b> — badhana hai ya naya shuru. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q9 · Subarray Sum Equals K", diff:"M", note:"Kitne contiguous subarrays ka sum exactly K hai.",
java:`public int subarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, 1);
    int sum = 0, ans = 0;
    for (int n : nums) {
        sum += n;
        ans += m.getOrDefault(sum - k, 0);
        m.merge(sum, 1, Integer::sum);
    }
    return ans;
}`,
python:`def subarraySum(nums, k):
    m = {0: 1}
    s = ans = 0
    for n in nums:
        s += n
        ans += m.get(s - k, 0)
        m[s] = m.get(s, 0) + 1
    return ans`,
extra:`<b>Prefix sum + hashmap</b>. prefixSum - k pehle aaya toh utne aur subarrays. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q10 · K-diff Pairs in an Array", diff:"M", note:"Pairs jinka difference exactly k — unique pairs.",
java:`public int findPairs(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    for (int n : nums) m.merge(n, 1, Integer::sum);
    int ans = 0;
    for (int n : m.keySet()) {
        if (k == 0) { if (m.get(n) > 1) ans++; }
        else if (m.containsKey(n + k)) ans++;
    }
    return ans;
}`,
python:`def findPairs(nums, k):
    m = {}
    for n in nums:
        m[n] = m.get(n, 0) + 1
    ans = 0
    for n in m:
        if k == 0:
            if m[n] > 1: ans += 1
        elif n + k in m:
            ans += 1
    return ans`,
extra:`<b>Frequency map</b>. k==0 pe count>1, warna har n ke liye <b>n+k</b> check.`},

{type:"lc", cat:"Arrays / Lists", title:"Q11 · Sort Colors", diff:"M", note:"0,1,2 ko in-place sort karo (Dutch flag).",
java:`public void sortColors(int[] nums) {
    int lo = 0, hi = nums.length-1, i = 0;
    while (i <= hi) {
        if (nums[i] == 0) swap(nums, lo++, i++);
        else if (nums[i] == 2) swap(nums, i, hi--);
        else i++;
    }
}
private void swap(int[] a, int i, int j) {
    int t = a[i]; a[i] = a[j]; a[j] = t;
}`,
python:`def sortColors(nums):
    lo = 0; hi = len(nums) - 1; i = 0
    while i <= hi:
        if nums[i] == 0:
            nums[lo], nums[i] = nums[i], nums[lo]
            lo += 1; i += 1
        elif nums[i] == 2:
            nums[i], nums[hi] = nums[hi], nums[i]
            hi -= 1
        else:
            i += 1`,
extra:`<b>Dutch National Flag</b> — 0 left, 2 right, 1 beech. O(n).`},

{type:"lc", cat:"Arrays / Lists", title:"Q12 · Next Permutation", diff:"M", note:"Lexicographically next permutation (in-place).",
java:`public void nextPermutation(int[] nums) {
    int i = nums.length - 2;
    while (i >= 0 && nums[i] >= nums[i+1]) i--;
    if (i >= 0) {
        int j = nums.length - 1;
        while (nums[j] <= nums[i]) j--;
        swap(nums, i, j);
    }
    reverse(nums, i+1);
}
private void reverse(int[] a, int s) {
    int i = s, j = a.length-1;
    while (i < j) swap(a, i++, j--);
}`,
python:`def nextPermutation(nums):
    i = len(nums) - 2
    while i >= 0 and nums[i] >= nums[i+1]:
        i -= 1
    if i >= 0:
        j = len(nums) - 1
        while nums[j] <= nums[i]:
            j -= 1
        nums[i], nums[j] = nums[j], nums[i]
    nums[i+1:] = reversed(nums[i+1:])`,
extra:`Right se <b>pehla dip</b>, usse chhote-bade se swap, right part <b>reverse</b>.`},

{type:"lc", cat:"Arrays / Lists", title:"Q13 · Majority Element", diff:"E", note:"Element jo n/2 se zyada baar aata hai.",
java:`public int majorityElement(int[] nums) {
    int cand = 0, cnt = 0;
    for (int n : nums) {
        if (cnt == 0) cand = n;
        cnt += (n == cand) ? 1 : -1;
    }
    return cand;
}`,
python:`def majorityElement(nums):
    cand = cnt = 0
    for n in nums:
        if cnt == 0:
            cand = n
        cnt += 1 if n == cand else -1
    return cand`,
extra:`<b>Boyer-Moore voting</b> — candidate + counter. O(n), O(1).`},

{type:"lc", cat:"Arrays / Lists", title:"Q14 · Find All Duplicates in an Array", diff:"M", note:"Jo number 2 baar aaye unhe list karo.",
java:`public List<Integer> findDuplicates(int[] nums) {
    List<Integer> r = new ArrayList<>();
    for (int n : nums) {
        int idx = Math.abs(n) - 1;
        if (nums[idx] < 0) r.add(Math.abs(n));
        nums[idx] = -nums[idx];
    }
    return r;
}`,
python:`def findDuplicates(nums):
    r = []
    for n in nums:
        idx = abs(n) - 1
        if nums[idx] < 0:
            r.append(abs(n))
        nums[idx] = -nums[idx]
    return r`,
extra:`<b>abs(value)-1</b> pe negative mark — pehle se negative = duplicate. O(n), O(1).`},

{type:"lc", cat:"Arrays / Lists", title:"Q15 · Continuous Subarray Sum", diff:"M", note:"Kya koi subarray (size ≥ 2) jiska sum k ka multiple hai.",
java:`public boolean checkSubarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, -1);
    int sum = 0;
    for (int i = 0; i < nums.length; i++) {
        sum = (sum + nums[i]) % k;
        if (m.containsKey(sum)) {
            if (i - m.get(sum) > 1) return true;
        } else m.put(sum, i);
    }
    return false;
}`,
python:`def checkSubarraySum(nums, k):
    m = {0: -1}
    s = 0
    for i, v in enumerate(nums):
        s = (s + v) % k
        if s in m:
            if i - m[s] > 1: return True
        else:
            m[s] = i
    return False`,
extra:`<b>Remainder prefix-sum map</b>. Same remainder = multiple, distance ≥ 2.`},

{type:"lc", cat:"Arrays / Lists", title:"Q16 · Insert Delete GetRandom O(1)", diff:"M", note:"Insert, remove, getRandom — teeno O(1).",
java:`class RandomizedSet {
    Map<Integer,Integer> idx = new HashMap<>();
    List<Integer> list = new ArrayList<>();
    Random rnd = new Random();
    public boolean insert(int v) {
        if (idx.containsKey(v)) return false;
        idx.put(v, list.size());
        list.add(v);
        return true;
    }
    public boolean remove(int v) {
        if (!idx.containsKey(v)) return false;
        int i = idx.remove(v);
        int last = list.remove(list.size()-1);
        if (i != list.size()) { list.set(i, last); idx.put(last, i); }
        return true;
    }
    public int getRandom() { return list.get(rnd.nextInt(list.size())); }
}`,
python:`import random
class RandomizedSet:
    def __init__(self):
        self.idx = {}
        self.list = []
    def insert(self, v):
        if v in self.idx: return False
        self.idx[v] = len(self.list)
        self.list.append(v)
        return True
    def remove(self, v):
        if v not in self.idx: return False
        i = self.idx.pop(v)
        last = self.list.pop()
        if i != len(self.list):
            self.list[i] = last
            self.idx[last] = i
        return True
    def getRandom(self):
        return random.choice(self.list)`,
extra:`<b>HashMap (value→index) + ArrayList</b>. Remove mein last element copy karke O(1).`},

{type:"lc", cat:"Arrays / Lists", title:"Q17 · Maximum Product Subarray", diff:"M", note:"Subarray jiska product sabse zyada.",
java:`public int maxProduct(int[] nums) {
    int best = nums[0], mn = nums[0], mx = nums[0];
    for (int i = 1; i < nums.length; i++) {
        int t1 = nums[i]*mn, t2 = nums[i]*mx;
        mn = Math.min(nums[i], Math.min(t1, t2));
        mx = Math.max(nums[i], Math.max(t1, t2));
        best = Math.max(best, mx);
    }
    return best;
}`,
python:`def maxProduct(nums):
    mn = mx = best = nums[0]
    for v in nums[1:]:
        a, b = v*mn, v*mx
        mn = min(v, a, b)
        mx = max(v, a, b)
        best = max(best, mx)
    return best`,
extra:`<b>min aur max dono track</b> — negative×negative = positive.`},

{type:"lc", cat:"Arrays / Lists", title:"Q18 · Set Matrix Zeroes", diff:"M", note:"Row/col jismein 0, poori row/col ko 0 banao (in-place).",
java:`public void setZeroes(int[][] m) {
    boolean fr = false, fc = false;
    for (int i = 0; i < m.length; i++)
        for (int j = 0; j < m[0].length; j++)
            if (m[i][j] == 0) {
                if (i == 0) fr = true;
                if (j == 0) fc = true;
                m[i][0] = 0; m[0][j] = 0;
            }
    for (int i = 1; i < m.length; i++)
        for (int j = 1; j < m[0].length; j++)
            if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;
    if (fr) for (int j = 0; j < m[0].length; j++) m[0][j] = 0;
    if (fc) for (int i = 0; i < m.length; i++) m[i][0] = 0;
}`,
python:`def setZeroes(m):
    R, C = len(m), len(m[0])
    fr = any(x == 0 for x in m[0])
    fc = any(m[i][0] == 0 for i in range(R))
    for i in range(R):
        for j in range(C):
            if m[i][j] == 0:
                m[i][0] = 0; m[0][j] = 0
    for i in range(1, R):
        for j in range(1, C):
            if m[i][0] == 0 or m[0][j] == 0:
                m[i][j] = 0
    if fr: m[0] = [0]*C
    if fc:
        for i in range(R): m[i][0] = 0`,
extra:`<b>Pehli row/col marker</b> use karo, phir baaki update, aakhir mein pehli row/col.`},

{type:"lc", cat:"Arrays / Lists", title:"Q19 · Rotate Image", diff:"M", note:"Matrix ko 90° clockwise rotate (in-place).",
java:`public void rotate(int[][] m) {
    int n = m.length;
    for (int i = 0; i < n; i++)
        for (int j = i; j < n; j++) {
            int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;
        }
    for (int i = 0; i < n; i++)
        for (int j = 0; j < n/2; j++) {
            int t = m[i][j]; m[i][j] = m[i][n-1-j]; m[i][n-1-j] = t;
        }
}`,
python:`def rotate(m):
    n = len(m)
    for i in range(n):
        for j in range(i, n):
            m[i][j], m[j][i] = m[j][i], m[i][j]
    for r in m:
        r.reverse()`,
extra:`<b>Transpose</b> + har <b>row reverse</b> = 90° rotate. O(n²).`},

{type:"lc", cat:"Arrays / Lists", title:"Q20 · Spiral Matrix", diff:"M", note:"Matrix elements spiral order mein.",
java:`public List<Integer> spiralOrder(int[][] m) {
    List<Integer> r = new ArrayList<>();
    int t = 0, b = m.length-1, l = 0, rt = m[0].length-1;
    while (t <= b && l <= rt) {
        for (int j = l; j <= rt; j++) r.add(m[t][j]);
        for (int i = t+1; i <= b; i++) r.add(m[i][rt]);
        if (t < b) for (int j = rt-1; j >= l; j--) r.add(m[b][j]);
        if (l < rt) for (int i = b-1; i > t; i--) r.add(m[i][l]);
        t++; b--; l++; rt--;
    }
    return r;
}`,
python:`def spiralOrder(m):
    r = []
    t, b, l, rt = 0, len(m)-1, 0, len(m[0])-1
    while t <= b and l <= rt:
        for j in range(l, rt+1): r.append(m[t][j])
        for i in range(t+1, b+1): r.append(m[i][rt])
        if t < b:
            for j in range(rt-1, l-1, -1): r.append(m[b][j])
        if l < rt:
            for i in range(b-1, t, -1): r.append(m[i][l])
        t += 1; b -= 1; l += 1; rt -= 1
    return r`,
extra:`4 <b>boundaries</b> tighten karte jaao. Har cell ek baar. O(n).`},

{cat:"OOP", title:"Inheritance & Exceptions", note:"extends → parenthesis, try-catch → try-except. Structure dono mein same rehta hai.",

class Dog(Animal):

    def speak(self):

try:

except Exception as e:

finally:

/* ========== CHAPTER 9 — DSA PATTERNS ========== */
{cat:"DSA Patterns", title:"Binary Search", note:"Manual binary search dono languages mein almost identical — bas <code>mid</code> calculation mein <code>//</code> use karna mat bhoolna.",
type:"code",
java:`int low = 0, high = arr.length - 1;
while (low <= high) {
    int mid = low + (high - low) / 2;   // overflow-safe
    if (arr[mid] == target) return mid;
    else if (arr[mid] < target) low = mid + 1;
    else high = mid - 1;
}
return -1;`,
python:`low, high = 0, len(arr) - 1
while low <= high:
    mid = (low + high) // 2      # integer division!
    if arr[mid] == target:
        return mid
    elif arr[mid] < target:
        low = mid + 1
    else:
        high = mid - 1
return -1`,
extra:"Logic <b>exactly same</b> hai. Python mein <code>(low+high)/2</code> float dega → index error. Isliye <code>//</code>. Java mein <code>low + (high-low)/2</code> overflow-safe pattern hai (low+high overflow se bachata). <code>bisect</code> module Python mein built-in binary search hai."
},

{cat:"DSA Patterns", title:"Two Pointer", note:"Sorted array ke pairs/triplets sum problems ka standard pattern — language-agnostic, logic same.",
type:"code",
java:`int left = 0, right = arr.length - 1;
while (left < right) {
    int sum = arr[left] + arr[right];
    if (sum == target) {
        System.out.println(left + " " + right);
        break;
    } else if (sum < target) {
        left++;      // sum badhao
    } else {
        right--;     // sum ghatao
    }
}`,
python:`left, right = 0, len(arr) - 1
while left < right:
    total = arr[left] + arr[right]
    if total == target:
        print(left, right)
        break
    elif total < target:
        left += 1        # sum badhao
    else:
        right -= 1       # sum ghatao`,
extra:"<b>Flow:</b> sorted array + sum target → <code>left</code> ko aage (sum badhega), <code>right</code> ko piche (sum ghatega). Ye 2-Sum (sorted), 3-Sum, container-with-most-water, trapped-rain-water sab ka base hai. Complexity O(n) — naive nested loop O(n²) se kaafi better."
},

{cat:"DSA Patterns", title:"Sliding Window", note:"Subarray/substring problems (fixed ya variable window) ka master pattern — dono languages mein same logic.",
type:"code",
java:`// fixed window of size k: max sum
int windowSum = 0;
for (int i = 0; i < k; i++) windowSum += arr[i];
int maxSum = windowSum;
for (int i = k; i < arr.length; i++) {
    windowSum += arr[i] - arr[i - k];   // slide 🔥
    maxSum = Math.max(maxSum, windowSum);
}`,
python:`# fixed window of size k: max sum
window_sum = sum(arr[:k])
max_sum = window_sum
for i in range(k, len(arr)):
    window_sum += arr[i] - arr[i - k]   # slide 🔥
    max_sum = max(max_sum, window_sum)

# variable window (longest subarray)
l = 0
for r in range(len(arr)):
    # ... window condition update
    while condition:
        l += 1        # shrink
    ans = max(ans, r - l + 1)`,
extra:"<b>Two types:</b> <b>Fixed window</b> = size pata hai, ek-add ek-remove (slide). <b>Variable window</b> = <code>right</code> expand karta, <code>left</code> shrink — longest substring without repeating chars, min window substring isi se solve hote. Complexity O(n)."
},

{cat:"DSA Patterns", title:"Recursion", note:"Recursive functions ka structure dono languages mein identical. Bas Python ki recursion depth limit ~1000 yaad rakhna.",
type:"code",
java:`static int fact(int n) {
    if (n == 0) return 1;
    return n * fact(n - 1);
}

static int fib(int n) {
    if (n <= 1) return n;
    return fib(n - 1) + fib(n - 2);
}`,
python:`def fact(n):
    if n == 0:
        return 1
    return n * fact(n - 1)

def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

# deep recursion ke liye
import sys
sys.setrecursionlimit(10000)`,
extra:"<b>Flow:</b> base case (stop) + recursive case (self-call). Python default recursion depth ~1000 hai — usse zyada gaya toh RecursionError. <code>sys.setrecursionlimit()</code> se badha sakte ho, lekin iterative/memoized solution hamesha better hai large input ke liye."
},

{cat:"DSA Patterns", title:"BFS & DFS — Graph Traversal", note:"Tree/Graph traversal ka core. BFS = queue, DFS = stack/recursion. Dono languages mein structure same.",
type:"code",
java:`// BFS (shortest path in unweighted)
Queue<Integer> q = new LinkedList<>();
q.add(start);
boolean[] vis = new boolean[n];
vis[start] = true;
while (!q.isEmpty()) {
    int u = q.poll();
    for (int v : adj[u]) {
        if (!vis[v]) { vis[v] = true; q.add(v); }
    }
}

// DFS (recursive)
void dfs(int u, boolean[] vis) {
    vis[u] = true;
    for (int v : adj[u]) if (!vis[v]) dfs(v, vis);
}`,
python:`# BFS 🔥
from collections import deque
q = deque([start])
vis = {start}
while q:
    u = q.popleft()
    for v in adj[u]:
        if v not in vis:
            vis.add(v)
            q.append(v)

# DFS (recursive)
def dfs(u, vis=None):
    if vis is None: vis = set()
    vis.add(u)
    for v in adj[u]:
        if v not in vis:
            dfs(v, vis)`,
extra:"<b>BFS vs DFS:</b> BFS queue se level-by-level jaata (shortest path), DFS recursion/stack se deep jaata. Java set vs array: boolean[] O(1) memory efficient. Python <code>vis = {start}</code> set fast hai. Island count, rotting oranges, word ladder sab isi template pe."
},

{cat:"DSA Patterns", title:"Backtracking", note:"Subsets, permutations, combinations, N-Queens — sabka base template. Explore → choice → undo (backtrack).",
type:"code",
java:`// subsets template
void backtrack(int start, List<Integer> cur) {
    result.add(new ArrayList<>(cur));
    for (int i = start; i < n; i++) {
        cur.add(nums[i]);            // choose
        backtrack(i + 1, cur);       // explore
        cur.remove(cur.size() - 1);  // undo 🔥
    }
}`,
python:`# subsets template 🔥
def backtrack(start, cur):
    result.append(cur[:])        # copy!
    for i in range(start, n):
        cur.append(nums[i])      # choose
        backtrack(i + 1, cur)    # explore
        cur.pop()                # undo

# one-liner subsets
subsets = [[]]
for x in nums:
    subsets += [s + [x] for s in subsets]`,
extra:"<b>Backtracking ka core = choose → explore → undo.</b> Python mein <code>result.append(cur[:])</code> — <b>cur[:] copy zaroori hai</b>, warna saari entries same list reference hongi. Permutations mein <code>i=0</code> se loop + used[] set, combinations mein <code>i+1</code> se. N-Queens, sudoku solver isi template pe."
},

{cat:"DSA Patterns", title:"Memoization / DP Intro", note:"Recursion + cache = memoization. Python ka @lru_cache dekhte hi DP questions easy lagne lagte hain.",
type:"code",
java:`// top-down with memo array
int[] memo = new int[n + 1];
Arrays.fill(memo, -1);

int fib(int n) {
    if (n <= 1) return n;
    if (memo[n] != -1) return memo[n];
    return memo[n] = fib(n-1) + fib(n-2);
}`,
python:`from functools import lru_cache

@lru_cache(None)          # 🔥 one-liner memoization
def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

# manual dict cache bhi theek
memo = {}
def fib2(n):
    if n <= 1: return n
    if n in memo: return memo[n]
    memo[n] = fib2(n-1) + fib2(n-2)
    return memo[n]`,
extra:"<b>Flow:</b> recursive solution likho → state = (params) → cache laga do → O(2^n) se O(n). <code>@lru_cache(None)</code> args ke tuple ko key banata hai. Java mein memo array pehle -1 fill karo, phir check. Bottom-up DP (iterative) memory better deta hai lekin top-down samajhna easy."
},

{type:"lc", cat:"DSA Patterns", title:"Q21 · Valid Palindrome", diff:"E", note:"Palindrome check — sirf alphanumeric, case-insensitive.",
java:`public boolean isPalindrome(String s) {
    int i = 0, j = s.length()-1;
    while (i < j) {
        while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;
        while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;
        if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) return false;
        i++; j--;
    }
    return true;
}`,
python:`def isPalindrome(s):
    i, j = 0, len(s)-1
    while i < j:
        while i < j and not s[i].isalnum(): i += 1
        while i < j and not s[j].isalnum(): j -= 1
        if s[i].lower() != s[j].lower():
            return False
        i += 1; j -= 1
    return True`,

java:`public int characterReplacement(String s, int k) {

{cat:"Trees", title:"Level Order (BFS) Traversal", note:"Queue se level-by-level traverse karo. Har level ke nodes ek saath. Isi se minimum depth aur 'print levels' wale questions solve hote hain.",
type:"code",
java:`List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> res = new ArrayList<>();
    if (root == null) return res;
    Queue<TreeNode> q = new LinkedList<>();
    q.add(root);
    while (!q.isEmpty()) {
        int size = q.size();          // current level count 🔥
        List<Integer> level = new ArrayList<>();
        for (int i = 0; i < size; i++) {
            TreeNode cur = q.poll();
            level.add(cur.val);
            if (cur.left != null) q.add(cur.left);
            if (cur.right != null) q.add(cur.right);
        }
        res.add(level);
    }
    return res;
}`,
python:`from collections import deque

def levelOrder(root):
    res = []
    if not root: return res
    q = deque([root])
    while q:
        level = []
        for _ in range(len(q)):   # current level count 🔥
            cur = q.popleft()
            level.append(cur.val)
            if cur.left: q.append(cur.left)
            if cur.right: q.append(cur.right)
        res.append(level)
    return res`,
extra:"<b>Key pattern:</b> loop se pehle <code>size = q.size()</code> le lo — usi level ke nodes hain. Baad mein queue mein aaye nodes agle level ke hain. Right side view, zigzag, max level sum — sab isi template pe."
},

{cat:"Trees", title:"Max Depth & Balanced Check", note:"Recursion se height = 1 + max(left, right). Balanced = har node pe left-right height diff ek se zyada nahi.",
type:"code",
java:`int maxDepth(TreeNode root) {

    return 1 + Math.max(maxDepth(root.left),
                        maxDepth(root.right));

// balanced: har node pe |lh - rh| <= 1
int check(TreeNode n) {              // -1 = unbalanced
    if (n == null) return 0;
    int l = check(n.left);
    int r = check(n.right);
    if (l == -1 || r == -1) return -1;
    if (Math.abs(l - r) > 1) return -1;
    return 1 + Math.max(l, r);
}`,

# balanced: har node pe |lh - rh| <= 1
def check(n):                        # -1 = unbalanced
    if not n: return 0
    l = check(n.left)
    r = check(n.right)
    if l == -1 or r == -1: return -1
    if abs(l - r) > 1: return -1
    return 1 + max(l, r)`,

{cat:"Trees", title:"Binary Search Tree — Insert & Search", note:"BST = left child chhota, right child bada. Har step pe aadha tree discard — O(log n) average. Inorder = sorted order.",
type:"code",
java:`TreeNode insert(TreeNode root, int val) {
    if (root == null) return new TreeNode(val);
    if (val < root.val) root.left = insert(root.left, val);
    else root.right = insert(root.right, val);
    return root;
}

boolean search(TreeNode root, int val) {
    if (root == null) return false;
    if (val == root.val) return true;
    if (val < root.val) return search(root.left, val);
    return search(root.right, val);
}

// inorder -> sorted array
void inorder(TreeNode n, List<Integer> out) {

    inorder(n.left, out);
    out.add(n.val);
    inorder(n.right, out);
}`,
python:`def insert(root, val):
    if not root: return TreeNode(val)
    if val < root.val:
        root.left = insert(root.left, val)
    else:
        root.right = insert(root.right, val)
    return root

def search(root, val):
    if not root: return False
    if val == root.val: return True
    if val < root.val: return search(root.left, val)
    return search(root.right, val)

# inorder -> sorted list
def inorder(n):
    return inorder(n.left) + [n.val] + inorder(n.right) if n else []`,
extra:"<b>BST ka khel:</b> insertion updated root return karta hai (reference issue bachta). Search binary search jaisa hi hai. Kth smallest = inorder ka kth element. Worst case (skewed) O(n) — isliye balanced trees (AVL/Red-Black) aate hain."
},

{cat:"Graphs", title:"Graph BFS — Level by Level", note:"BFS = queue. Level order guarantee — isliye <b>shortest path (unweighted)</b> aur minimum steps wale questions mein use hota.",
type:"code",
java:`int[] bfs(int start, int n, List<List<Integer>> adj) {
    boolean[] vis = new boolean[n];
    int[] dist = new int[n];
    Arrays.fill(dist, -1);
    Queue<Integer> q = new LinkedList<>();

    vis[start] = true;
    q.add(start);
    dist[start] = 0;

    while (!q.isEmpty()) {
        int u = q.poll();
        for (int v : adj.get(u)) {
            if (!vis[v]) {
                vis[v] = true;
                dist[v] = dist[u] + 1;   // level 🔥
                q.add(v);
            }
        }
    }
    return dist;   // start se distances
}`,
python:`from collections import deque

def bfs(start, n, adj):
    dist = [-1]*n
    q = deque([start])
    dist[start] = 0

    while q:
        u = q.popleft()
        for v in adj[u]:
            if dist[v] == -1:          # unvisited
                dist[v] = dist[u] + 1  # level 🔥
                q.append(v)
    return dist   # start se distances`,
extra:"<b>Pattern:</b> visited + queue + level tracking. Unweighted graph mein BFS jis node pe pehli baar pahuche, wahi shortest distance hai. Java: boolean[] vis, Python: <code>dist[v] == -1</code> hi visited check hai."
},

{cat:"Graphs", title:"DFS & Number of Islands", note:"DFS har component ko pura explore karta hai. Islands = connected components count — grid pe 4-direction DFS.",
type:"code",
java:`// grid mein islands count (grid = 2D char array)
int numIslands(char[][] grid) {
    int m = grid.length, n = grid[0].length, cnt = 0;
    for (int i = 0; i < m; i++)
        for (int j = 0; j < n; j++)
            if (grid[i][j] == '1') { cnt++; dfs(grid, i, j); }
    return cnt;
}

void dfs(char[][] g, int i, int j) {
    if (i < 0 || j < 0 || i >= g.length || j >= g[0].length
        || g[i][j] != '1') return;
    g[i][j] = '0';        // visited mark 🔥
    dfs(g, i+1, j); dfs(g, i-1, j);
    dfs(g, i, j+1); dfs(g, i, j-1);
}`,
python:`def numIslands(grid):
    def dfs(i, j):
        if (i < 0 or j < 0 or i >= len(grid)
                or j >= len(grid[0]) or grid[i][j] != '1'):
            return
        grid[i][j] = '0'        # visited mark 🔥
        dfs(i+1, j); dfs(i-1, j)
        dfs(i, j+1); dfs(i, j-1)

    cnt = 0
    for i in range(len(grid)):
        for j in range(len(grid[0])):
            if grid[i][j] == '1':
                cnt += 1
                dfs(i, j)
    return cnt`,
extra:"<b>Grid = graph.</b> Har cell ek node, 4 neighbours edges. Island = connected component. <b>Visit ko in-place mark</b> karo (grid[i][j]='0') taaki revisits na ho. DFS recursion, BFS queue — dono templates se islands count hota hai."
},

{cat:"Graphs", title:"Topological Sort — Kahn's Algorithm", note:"DAG (directed acyclic graph) ke nodes ko aise order karo ki har edge u→v mein u pehle aaye. Kahn's = in-degree counting + queue. Course schedule / dependency problems isi pe.",
type:"code",
java:`// indegree count karo
int[] indeg = new int[n];
for (int u = 0; u < n; u++)
    for (int v : adj.get(u)) indeg[v]++;

Queue<Integer> q = new LinkedList<>();
for (int i = 0; i < n; i++) if (indeg[i] == 0) q.add(i);

List<Integer> order = new ArrayList<>();
while (!q.isEmpty()) {
    int u = q.poll();
    order.add(u);
    for (int v : adj.get(u))
        if (--indeg[v] == 0) q.add(v);
}
// order.size() != n => cycle hai 🔥`,
python:`from collections import deque

indeg = [0]*n
for u in range(n):
    for v in adj[u]:
        indeg[v] += 1

q = deque(i for i in range(n) if indeg[i] == 0)
order = []
while q:
    u = q.popleft()
    order.append(u)
    for v in adj[u]:
        indeg[v] -= 1
        if indeg[v] == 0:
            q.append(v)
# len(order) != n => cycle hai 🔥`,
extra:"<b>Flow:</b> indegree = kitne edges us node pe aate hain. Zero-indegree nodes pehle aate hain. Unke edges hatane pe agle zero hote. <b>Order mein saare nodes nahi aaye toh cycle hai</b> — topological sort sirf DAG pe chalta. Python: <code>deque(generator)</code> ek line mein."
},

{cat:"Graphs", title:"Dijkstra — Shortest Path (Weighted)", note:"Weighted graph mein ek node se sabse kam-cost path. <b>Min-heap</b> se hamesha smallest distance wala node process karo. Negative weights pe kaam nahi karta (Bellman-Ford use karo).",
type:"code",
java:`int[] dijkstra(int src, int n, List<List<int[]>> adj) {
    int[] dist = new int[n];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[src] = 0;
    // {distance, node} — min-heap
    PriorityQueue<int[]> pq = new PriorityQueue<>((a,b)->a[0]-b[0]);
    pq.add(new int[]{0, src});

    while (!pq.isEmpty()) {
        int[] top = pq.poll();
        int d = top[0], u = top[1];
        if (d > dist[u]) continue;    // stale entry skip
        for (int[] e : adj.get(u)) {
            int v = e[0], w = e[1];
            if (dist[u] + w < dist[v]) {
                dist[v] = dist[u] + w;
                pq.add(new int[]{dist[v], v});
            }
        }
    }
    return dist;
}`,
python:`import heapq

def dijkstra(src, n, adj):
    INF = float('inf')
    dist = [INF]*n
    dist[src] = 0
    pq = [(0, src)]          # (distance, node) 🔥

    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]: continue    # stale entry skip
        for v, w in adj[u]:
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
                heapq.heappush(pq, (dist[v], v))
    return dist`,
extra:"<b>Core idea:</b> min-heap se smallest-distance node nikalo, uske neighbours relax karo. <code>if d > dist[u]: continue</code> purani entries skip karne ke liye. Java: PriorityQueue, Python: <code>heapq</code>. O(E log V)."
},

/* ========== CHAPTER 12 — SORTING ========== */
{cat:"Sorting", title:"Bubble & Selection Sort", note:"O(n²) ke dono classics. Bubble = adjacent swaps, selection = har position pe smallest dhoondo. Interview code aata hai; real code mein built-in sort.",
type:"code",
java:`// bubble sort — adjacent compare & swap
void bubbleSort(int[] a) {
    int n = a.length;
    for (int i = 0; i < n-1; i++)
        for (int j = 0; j < n-1-i; j++)
            if (a[j] > a[j+1]) {
                int t = a[j]; a[j] = a[j+1]; a[j+1] = t;
            }
}

// selection sort — har i pe smallest select
void selectionSort(int[] a) {
    int n = a.length;
    for (int i = 0; i < n-1; i++) {
        int m = i;
        for (int j = i+1; j < n; j++)
            if (a[j] < a[m]) m = j;
        int t = a[i]; a[i] = a[m]; a[m] = t;
    }
}`,
python:`# bubble sort — adjacent compare & swap
def bubble_sort(a):
    n = len(a)
    for i in range(n-1):
        for j in range(n-1-i):
            if a[j] > a[j+1]:
                a[j], a[j+1] = a[j+1], a[j]

# selection sort — har i pe smallest select
def selection_sort(a):
    n = len(a)
    for i in range(n-1):
        m = i
        for j in range(i+1, n):
            if a[j] < a[m]: m = j
        a[i], a[m] = a[m], a[i]`,
extra:"<b>Flow:</b> Bubble har pass sabse bada element end pe le jaata (j loop n-1-i). Selection har iteration mein smallest dhoondh kar usse sahi jagah rakh deta. Python swap: <code>a[i], a[m] = a[m], a[i]</code> — Java mein temp chahiye. Dono O(n²); bubble stable, selection nahi."
},

{cat:"Sorting", title:"Insertion Sort", note:"Cards jaisa — har element ko sorted part mein sahi jagah daalo. Chhoti arrays / almost-sorted data ke liye best case O(n).",
type:"code",
java:`void insertionSort(int[] a) {
    int n = a.length;
    for (int i = 1; i < n; i++) {
        int key = a[i];
        int j = i - 1;
        while (j >= 0 && a[j] > key) {
            a[j+1] = a[j];     // shift right 🔥
            j--;
        }
        a[j+1] = key;
    }
}`,
python:`def insertion_sort(a):
    for i in range(1, len(a)):
        key = a[i]
        j = i - 1
        while j >= 0 and a[j] > key:
            a[j+1] = a[j]    # shift right 🔥
            j -= 1
        a[j+1] = key`,
extra:"<b>Idea:</b> left part hamesha sorted. key ko left ke elements se compare karo, bade walon ko right shift, phir key ko khali jagah daalo. Best case (already sorted) O(n) — interview mein ye point bolna. Stable aur in-place."
},

{cat:"Sorting", title:"Merge Sort — Divide & Conquer", note:"List ko aadha-aadha todo, sort karo, phir merge karo. O(n log n) guaranteed, stable. Extra O(n) space.",
type:"code",
java:`void mergeSort(int[] a, int lo, int hi) {
    if (lo >= hi) return;
    int mid = lo + (hi - lo) / 2;
    mergeSort(a, lo, mid);
    mergeSort(a, mid + 1, hi);
    merge(a, lo, mid, hi);
}

void merge(int[] a, int lo, int mid, int hi) {
    int[] tmp = new int[hi - lo + 1];
    int i = lo, j = mid + 1, k = 0;
    while (i <= mid && j <= hi)
        tmp[k++] = a[i] <= a[j] ? a[i++] : a[j++];
    while (i <= mid) tmp[k++] = a[i++];
    while (j <= hi)  tmp[k++] = a[j++];
    for (int p = 0; p < tmp.length; p++)
        a[lo + p] = tmp[p];
}`,
python:`def merge_sort(a):
    if len(a) <= 1: return a
    mid = len(a) // 2
    left = merge_sort(a[:mid])
    right = merge_sort(a[mid:])
    return merge(left, right)

def merge(x, y):
    i = j = 0
    out = []
    while i < len(x) and j < len(y):
        if x[i] <= y[j]:
            out.append(x[i]); i += 1
        else:
            out.append(y[j]); j += 1
    return out + x[i:] + y[j:]`,
extra:"<b>Divide & Conquer:</b> split (log n levels) + merge (O(n) har level) = O(n log n). <code>lo + (hi-lo)/2</code> overflow-safe mid hai. Python nayi list banata; Java in-place + temp array. Stable — equal elements ka order preserve."
},

{cat:"Sorting", title:"Quick Sort — Partition Magic", note:"Har baar ek pivot choose karo, chhote left, bade right. Average O(n log n), worst O(n²) (sorted array + bad pivot). Partition = core logic.",
type:"code",
java:`void quickSort(int[] a, int lo, int hi) {
    if (lo >= hi) return;
    int p = partition(a, lo, hi);
    quickSort(a, lo, p - 1);
    quickSort(a, p + 1, hi);
}

int partition(int[] a, int lo, int hi) {
    int pivot = a[hi];          // last element pivot
    int i = lo;                 // boundary of small
    for (int j = lo; j < hi; j++) {
        if (a[j] <= pivot) {
            int t = a[i]; a[i] = a[j]; a[j] = t;
            i++;
        }
    }
    int t = a[i]; a[i] = a[hi]; a[hi] = t;
    return i;                   // pivot ki final position
}`,
python:`def quick_sort(a):
    if len(a) <= 1: return a
    p = a[len(a)//2]          # mid pivot
    left  = [x for x in a if x < p]
    mid   = [x for x in a if x == p]
    right = [x for x in a if x > p]
    return quick_sort(left) + mid + quick_sort(right)`,
extra:"<b>Partition idea:</b> pivot ke chhote left, bade right — phir dono taraf recursively. Interview mein Lomuto (last pivot) ya Hoare partition likhte hain. Python comprehension version super-readable — par recursion depth limit ka dhyan rakho. Average O(n log n)."
},

/* ========== CHAPTER 13 — DYNAMIC PROGRAMMING ========== */
{cat:"DP", title:"DP Mindset — Top-Down vs Bottom-Up", note:"DP = bade problem ko chhote subproblems mein todo + unke results reuse karo. Do styles: <b>top-down</b> (memoized recursion) aur <b>bottom-up</b> (iterative table). Example: Stair Climb.",
type:"code",
java:`// climb stairs: n steps, 1 ya 2 step
// TOP-DOWN (memoized recursion)
int climb(int n, int[] memo) {
    if (n <= 1) return 1;
    if (memo[n] != 0) return memo[n];
    return memo[n] = climb(n-1, memo) + climb(n-2, memo);
}

// BOTTOM-UP (iterative) 🔥 interview favourite
int climbStairs(int n) {
    int a = 1, b = 1;        // dp[0]=1, dp[1]=1
    for (int i = 2; i <= n; i++) {
        int c = a + b;       // dp[i] = dp[i-1] + dp[i-2]
        a = b; b = c;
    }
    return b;
}`,
python:`# TOP-DOWN (memoized recursion)
from functools import lru_cache

@lru_cache(None)
def climb(n):
    if n <= 1: return 1
    return climb(n-1) + climb(n-2)

# BOTTOM-UP (iterative) 🔥 interview favourite
def climbStairs(n):
    a = b = 1                # dp[0]=1, dp[1]=1
    for _ in range(2, n+1):
        a, b = b, a + b      # dp[i] = dp[i-1] + dp[i-2]
    return b`,
extra:"<b>DP checklist:</b> 1) state define karo (<code>dp[i]</code> = i steps ke liye ways) 2) transition likho (<code>dp[i] = dp[i-1]+dp[i-2]</code>) 3) base case. Top-down easy samajhne ke liye, bottom-up efficient. Stair climb sirf Fibonacci hai."
},

{cat:"DP", title:"House Robber — 1D DP", note:"Adjacent houses nahi loot sakte. Max money kya nikal sakte ho. Decision: current house lo ya chhodo — har step pe dono ka best.",
type:"code",
java:`int rob(int[] nums) {
    int prev = 0, cur = 0;
    for (int x : nums) {
        int next = Math.max(cur, prev + x);
        prev = cur;
        cur = next;
    }
    return cur;
}

// ek step detail: dp[i] = max(dp[i-1], dp[i-2] + nums[i])`,
python:`def rob(nums):
    prev = cur = 0
    for x in nums:
        cur, prev = max(cur, prev + x), cur
    return cur

# ek step detail: dp[i] = max(dp[i-1], dp[i-2] + nums[i])`,
extra:"<b>Decision at each house:</b> skip karo (cur) ya looto (prev + x) — dono mein max. Sirf 2 variables se O(1) space, O(n) time. Ye 'take or skip' pattern ka base hai — circular version mein pehla/aakhri hatakar do baar chalao."
},

{cat:"DP", title:"Coin Change — Minimum Coins", note:"Diye hue coins se amount banane ke minimum coins. Har coin ki unlimited supply. dp[amount] = minimum coins us amount ke liye.",
type:"code",
java:`int coinChange(int[] coins, int amount) {
    int[] dp = new int[amount + 1];
    Arrays.fill(dp, amount + 1);   // infinity
    dp[0] = 0;
    for (int i = 1; i <= amount; i++) {
        for (int c : coins) {
            if (c <= i)
                dp[i] = Math.min(dp[i], dp[i - c] + 1);
        }
    }
    return dp[amount] > amount ? -1 : dp[amount];
}`,
python:`def coinChange(coins, amount):
    INF = float('inf')
    dp = [INF]*(amount+1)
    dp[0] = 0
    for i in range(1, amount+1):
        for c in coins:
            if c <= i:
                dp[i] = min(dp[i], dp[i-c] + 1)
    return dp[amount] if dp[amount] != INF else -1`,
extra:"<b>State:</b> dp[i] = i amount banane ke minimum coins. <b>Transition:</b> har coin c ke liye dp[i] = min(dp[i], dp[i-c]+1). Unbounded knapsack jaisa — coin ko baar-baar use kar sakte. Amount outer loop (coin order irrelevant for minimum)."
},

{cat:"DP", title:"LCS — Longest Common Subsequence (2D)", note:"Do strings ka sabse lamba common subsequence. 2D table — dp[i][j] = first i chars aur first j chars ka LCS. Edit distance ka cousin.",
type:"code",
java:`int lcs(String s1, String s2) {
    int m = s1.length(), n = s2.length();
    int[][] dp = new int[m+1][n+1];
    for (int i = 1; i <= m; i++) {
        for (int j = 1; j <= n; j++) {
            if (s1.charAt(i-1) == s2.charAt(j-1))
                dp[i][j] = dp[i-1][j-1] + 1;   // match 🔥
            else
                dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
    }
    return dp[m][n];
}`,
python:`def lcs(s1, s2):
    m, n = len(s1), len(s2)
    dp = [[0]*(n+1) for _ in range(m+1)]
    for i in range(1, m+1):
        for j in range(1, n+1):
            if s1[i-1] == s2[j-1]:
                dp[i][j] = dp[i-1][j-1] + 1   # match 🔥
            else:
                dp[i][j] = max(dp[i-1][j], dp[i][j-1])
    return dp[m][n]`,
extra:"<b>2D DP pattern:</b> characters match ho toh diagonal se +1; nahi toh upar/left ka max. Ye table-filling pattern LCS, Edit Distance, Longest Palindromic Subsequence sab mein same hai. <b>Python gotcha:</b> <code>[[0]*(n+1) for _ in range(m+1)]</code> — har row alag list (na ki shared)."
},

{cat:"DP", title:"0/1 Knapsack", note:"Har item ek baar hi liya ja sakta hai (0/1). Weight capacity ke andar max value. 2D DP ya 1D optimization.",
type:"code",
java:`// weights[], values[], capacity W
int knapsack(int[] w, int[] v, int W) {
    int n = w.length;
    int[] dp = new int[W + 1];
    for (int i = 0; i < n; i++) {
        for (int c = W; c >= w[i]; c--) {   // right-to-left 🔥
            dp[c] = Math.max(dp[c], dp[c - w[i]] + v[i]);
        }
    }
    return dp[W];
}`,
python:`# weights[], values[], capacity W
def knapsack(w, v, W):
    dp = [0]*(W+1)
    for i in range(len(w)):
        for c in range(W, w[i]-1, -1):   # right-to-left 🔥
            dp[c] = max(dp[c], dp[c - w[i]] + v[i])
    return dp[W]`,
extra:"<b>1D optimization:</b> 2D table ko ek row rakhkar optimize — par capacity loop <b>reverse</b> chahiye taaki har item ek baar use ho (0/1). Reverse na karo toh unbounded ho jaata (coin change wala). Ye 'use once vs unlimited' ka classic interview point hai."
},
