{cat:"Greedy", title:"Activity Selection / Interval Scheduling", note:"Maximum meetings jo overlap na karein. Trick: <b>end time ke hisaab se sort</b> karo, phir greedy select karo — sabse pehle khatam hone wala hamesha safe choice.",
type:"code",
java:`int maxMeetings(int[][] intervals) {
    Arrays.sort(intervals, (a, b) -> a[1] - b[1]); // end sort
    int count = 1;
    int end = intervals[0][1];
    for (int i = 1; i < intervals.length; i++) {
        if (intervals[i][0] >= end) {   // overlap nahi 🔥
            count++;
            end = intervals[i][1];
        }
    }
    return count;
}`,
python:`def max_meetings(intervals):
    intervals.sort(key=lambda x: x[1])   # end sort
    count = 1
    end = intervals[0][1]
    for s, e in intervals[1:]:
        if s >= end:                     # overlap nahi 🔥
            count += 1
            end = e
    return count`,
extra:"<b>Proof of greediness:</b> jo meeting sabse pehle khatam hoti, usko lo — baaki har solution mein usko swap kar sakte ho bina count kharab kiye. End-time sort hi iska core hai. Non-overlapping intervals / room booking same pattern. O(n log n)."
},

{cat:"Greedy", title:"Jump Game — Max Reach", note:"Har index pe utna jump kar sakte ho. Kya aakhri index tak pahunch sakte ho? Trick: max reach track karo — greedy O(n).",
type:"code",
java:`boolean canJump(int[] nums) {
    int reach = 0;
    for (int i = 0; i < nums.length; i++) {
        if (i > reach) return false;      // pahunch nahi sakte
        reach = Math.max(reach, i + nums[i]); // max extend 🔥
    }
    return true;
}`,
python:`def canJump(nums):
    reach = 0
    for i, n in enumerate(nums):
        if i > reach: return False        # pahunch nahi sakte
        reach = max(reach, i + n)         # max extend 🔥
    return True`,
extra:"<b>Idea:</b> reach = ab tak kitna door ja sakte hain. Har index pe reach update karo. Agar kisi index tak reach nahi pahunchi (i > reach) toh return false. Minimum jumps wala version (Jump Game II) mein greedy level tracking — interview favourite."
},

{cat:"Greedy", title:"Fractional Knapsack & Coin Problem", note:"Fractional knapsack (item toote sakte hain) greedy se solve hota — value/weight ratio sort. 0/1 wala DP chahiye.",
type:"code",
java:`// fractional knapsack: ratio pe sort 🔥
double fractional(int[][] items, int W) {
    // items = {weight, value}
    Arrays.sort(items, (a, b) ->
        Double.compare((double)b[1]/b[0], (double)a[1]/a[0]));
    double total = 0;
    for (int[] it : items) {
        if (W >= it[0]) { total += it[1]; W -= it[0]; }
        else { total += (double)it[1] * W / it[0]; break; }
    }
    return total;
}`,
python:`# fractional knapsack: ratio pe sort 🔥
def fractional(items, W):
    # items = (weight, value)
    items.sort(key=lambda x: x[1]/x[0], reverse=True)
    total = 0
    for w, v in items:
        if W >= w:
            total += v; W -= w
        else:
            total += v * W / w; break
    return total`,
extra:"<b>Sort by ratio</b> (value/weight) descending, phir bharo. Item toot sakta isliye greedy theek. <b>Compare with 0/1 knapsack:</b> wahan items nahi toote sakte — greedy fail, DP chahiye. Ye contrast interview ka golden question hai."
},

/* ========== CHAPTER 15 — TRIE ========== */
{cat:"Trie", title:"Trie — Concept & Node", note:"Trie = prefix tree. Har node ek character represent karta hai aur children map rakhta hai. Insert/search/prefix O(length of word). Autocomplete, spell checker, word dictionary isi pe bante.",
type:"code",
java:`class TrieNode {
    TrieNode[] children = new TrieNode[26]; // a-z
    boolean isEnd = false;
}

class Trie {
    TrieNode root = new TrieNode();

    void insert(String w) {
        TrieNode cur = root;
        for (char c : w.toCharArray()) {
            int i = c - 'a';
            if (cur.children[i] == null)
                cur.children[i] = new TrieNode();
            cur = cur.children[i];
        }
        cur.isEnd = true;   // word pura 🔥
    }
}`,
python:`class TrieNode:
    def __init__(self):
        self.children = {}   # char -> TrieNode
        self.is_end = False

class Trie:
    def __init__(self):
        self.root = TrieNode()

    def insert(self, w):
        cur = self.root
        for c in w:
            if c not in cur.children:
                cur.children[c] = TrieNode()
            cur = cur.children[c]
        cur.is_end = True    # word pura 🔥`,
extra:"<b>Trie vs HashMap:</b> dict prefix search nahi kar sakta; trie prefix match O(L) mein. Array vs dict: Java mein 26-sized array (fast, space waste), Python dict (sparse-friendly). Node mein count bhi rakh sakte ho prefix-frequency ke liye."
},

{cat:"Trie", title:"Search, Prefix & Delete", note:"search() check karta hai poori word + isEnd. startsWith() sirf path check. Ek helper se dono — isEnd ignore karke.",
type:"code",
java:`boolean search(String w) {
    TrieNode cur = find(w);
    return cur != null && cur.isEnd;
}

boolean startsWith(String p) {
    return find(p) != null;
}

TrieNode find(String s) {
    TrieNode cur = root;
    for (char c : s.toCharArray()) {
        int i = c - 'a';
        if (cur.children[i] == null) return null;
        cur = cur.children[i];
    }
    return cur;
}`,
python:`def search(self, w):
    cur = self._find(w)
    return cur is not None and cur.is_end

def startsWith(self, p):
    return self._find(p) is not None

def _find(self, s):
    cur = self.root
    for c in s:
        if c not in cur.children: return None
        cur = cur.children[c]
    return cur`,
extra:"<b>search vs startsWith:</b> dono same path follow karte — sirf last node ka <code>isEnd</code> check karna hai ya nahi. Isliye helper <code>find()</code> dono ke liye. Delete rare hai interviews mein — recursion se children khali hone pe node hatao."
},

{cat:"Trie", title:"Prefix Count & Autocomplete", note:"Har node mein count rakho — har insert mein path ke har node ka count++. Prefix kitne words mein hai = us node ka count. Autocomplete = prefix node se saare words collect.",
type:"code",
java:`class TrieNode {
    TrieNode[] children = new TrieNode[26];
    boolean isEnd = false;
    int count = 0;            // prefix frequency 🔥
}

void insert(String w) {
    TrieNode cur = root;
    for (char c : w.toCharArray()) {
        int i = c - 'a';
        if (cur.children[i] == null)
            cur.children[i] = new TrieNode();
        cur = cur.children[i];
        cur.count++;          // har path pe +1
    }
    cur.isEnd = true;
}

int prefixCount(String p) {
    TrieNode cur = root;
    for (char c : p.toCharArray()) {
        int i = c - 'a';
        if (cur.children[i] == null) return 0;
        cur = cur.children[i];
    }
    return cur.count;         // is prefix wale words 🔥
}`,
python:`class TrieNode:
    def __init__(self):
        self.children = {}
        self.is_end = False
        self.count = 0            # prefix frequency 🔥

def insert(self, w):
    cur = self.root
    for c in w:
        if c not in cur.children:
            cur.children[c] = TrieNode()
        cur = cur.children[c]
        cur.count += 1            # har path pe +1
    cur.is_end = True

def prefix_count(self, p):
    cur = self.root
    for c in p:
        if c not in cur.children: return 0
        cur = cur.children[c]
    return cur.count`,
extra:"<b>Count trick:</b> insert ke path ke har node pe count++ — prefixCount O(L) mein. DFS se prefix node se aage chalo = autocomplete suggestions. Word Search II (board) mein trie + grid DFS — hard problem isi pe banti."
},

extra:"<b>Interview gotcha:</b> Java aur Python dono 'pass by value' hain — par object variables ki value = reference hoti hai. Isliye mutable object (array/list/dict) andar se change karne pe caller ko bhi dikhta hai. Immutable (int/String/tuple) hamesha safe."
},

{cat:"Java Extras", title:"String Pool & StringBuilder", note:"Java mein String literals String Pool mein share hote hain (== reference check). StringBuilder mutable hai, String immutable. Python mein == hamesha value compare karta hai.",
type:"code",
java:`String a = "hello";
String b = "hello";
System.out.println(a == b);    // TRUE (same pool ref)
String c = new String("hello");
System.out.println(a == c);    // false (naya object)

// StringBuilder (mutable, O(n) building) 🔥
StringBuilder sb = new StringBuilder("Hello");
sb.append(" World");           // Hello World
sb.insert(5, ",");             // Hello, World
sb.delete(5, 6);               // Hello World
sb.replace(0, 1, "J");         // Jello World
sb.reverse();                  // dlroW olleJ
sb.toString();`,
python:`# python strings bhi immutable hain
a = "hello"; b = "hello"
print(a == b)        # True — value compare hamesha
print(a is b)        # True (CPython may intern)

# python mein == kabhi reference nahi compare karta 🔥
# isliye a==b confusion nahi

# string building — list + join() = StringBuilder
parts = ["Hello", "World"]
",".join(parts)              # "Hello,World"

s = "hello"
s.upper(); s[1:3]; s.replace("l","L")   # naye strings`,

},

{cat:"Java Extras", title:"Wrapper Classes & Autoboxing", note:"Java ke primitives (int, char...) ka object version hota hai (Integer, Character...) — autoboxing automatically convert karta hai. Python mein sab kuch object hai, wrappers ki zarurat hi nahi.",

{cat:"Java Extras", title:"Access Modifiers & Packages", note:"Java ka public/private/protected/default — compiler-enforced hai. Python mein sab public, sirf conventions hain. Packages = Python modules.",
type:"code",
java:`package com.example.car;      // package declaration

public class Car {
    private int speed;          // sirf is class ke andar
    protected String name;      // package + subclasses
    int color;                  // default: sirf package
    public void drive() { }     // sab jagah

    public int getSpeed() { return speed; }
}
// import com.example.car.Car;`,
python:`# python modules = java packages
# car.py file mein:
class Car:
    def __init__(self):
        self.speed = 0        # public
        self._name = "x"      # "protected" — convention
        self.__color = "red"  # "private" — name mangling

# from car import Car
# import car
# car.Car()

# __color actually _Car__color ban jaata 🔥
# baahar se direct access hard hota hai`,
extra:"<b>Access modifier hierarchy:</b> public (sab) &gt; protected (package + subclass) &gt; default (package) &gt; private (class). Python mein <code>_x</code> = 'mat chhoo' convention, <code>__x</code> = name-mangling se effectively private."
},

{cat:"Java Extras", title:"Exception Handling — Full Detail", note:"throw = exception create karna, throws = method signature mein declare, custom exceptions apni class se. Python mein throw → raise.",
type:"code",
java:`// custom exception
class MyException extends Exception {
    MyException(String msg) { super(msg); }
}

public int divide(int a, int b) throws MyException {
    if (b == 0) throw new MyException("zero!");
    return a / b;
}

try {
    int x = divide(10, 0);
} catch (MyException e) {          // specific pehle
    System.out.println(e.getMessage());
} catch (Exception e) {            // generic baad mein
    e.printStackTrace();
} finally {                        // hamesha chalega
    System.out.println("done");
}`,
python:`class MyError(Exception):
    def __init__(self, msg):
        super().__init__(msg)

def divide(a, b):
    if b == 0:
        raise MyError("zero!")      # throw ka equivalent
    return a / b

try:
    x = divide(10, 0)
except MyError as e:                # specific pehle
    print(e)                        # str(e) = message
except Exception as e:              # generic baad
    print(e)
finally:                            # hamesha chalega
    print("done")`,
extra:"<b>Multiple catch:</b> specific exception pehle, Exception (parent) last mein — warna specific kabhi reach nahi hoga (compile error Java mein). <code>throws</code> Java mein compile-time declaration hai; Python mein sab runtime. Custom exception dono mein same pattern."
},

{cat:"Java Extras", title:"Comparable vs Comparator", note:"Comparable = natural order (1 sort order), Comparator = custom order (lambda). Python mein key= hi comparator ka kaam karta hai.",
type:"code",
java:`class Student implements Comparable<Student> {
    int marks;
    String name;
    public int compareTo(Student o) {
        return this.marks - o.marks;   // natural: marks se
    }
}
Arrays.sort(students);    // compareTo use hoga

// Comparator = custom (lambda) 🔥
Arrays.sort(students, (a, b) -> b.marks - a.marks); // desc
Arrays.sort(students, Comparator.comparingInt(s -> s.marks));
// overflow-safe: Integer.compare(a,b) use karo`,
python:`# natural order: python objects compare by ==, <, >
students.sort()                    # agar __lt__ define ho

# custom = key= hamesha 🔥
students.sort(key=lambda s: s.marks)              # asc
students.sort(key=lambda s: s.marks, reverse=True) # desc

# multi-key: marks, phir name
students.sort(key=lambda s: (s.marks, s.name))

# old-style comparator (agar chahiye toh)
from functools import cmp_to_key
students.sort(key=cmp_to_key(lambda a, b: a.marks - b.marks))`,
extra:"<b>Flow:</b> Comparable implement karo → <code>compareTo</code> likho → Collections.sort() natural order. Alag order chahiye → Comparator lambda. Python mein kabhi overthink mat karo — <code>key=lambda</code> hi enough hai. Interview mein Java ka comparator lambda pattern zaroor aata hai."
},

{cat:"Java Extras", title:"Generics & Type Safety", note:"Java generics compile-time type safety dete hain — galat type pe compile error. Python dynamically typed hai, type hints sirf documentation.",

# mypy se static check kar sakte ho (external tool)`,

{cat:"Java Extras", title:"TreeSet / TreeMap / LinkedHashMap", note:"Sorted aur ordered collections. Java ke TreeSet (sorted set) aur TreeMap (sorted keys) — Python mein built-in sorted set nahi, sorted() se simulate karo. LinkedHashMap insertion-order = Python default dict.",
type:"code",

ts.add(30); ts.add(10); ts.add(20);  // sorted!
ts.first();    // 10
ts.last();     // 30
ts.lower(25);  // 20 (just below)
ts.higher(25); // 30 (just above)
ts.ceiling(25);// 30 (>=)
ts.floor(25);  // 20 (<=)

TreeMap<String, Integer> tm = new TreeMap<>(); // sorted keys
LinkedHashMap<String,Integer> lhm =
    new LinkedHashMap<>();   // insertion order`,

ts = sorted(set([30, 10, 20]))    # [10, 20, 30]

# sorted dict (by key)
tm = dict(sorted(mp.items()))

# insertion order = python dict DEFAULT 🔥

d["b"] = 1; d["a"] = 2
list(d)          # ['b', 'a'] — order preserved

i = bisect.bisect_left(arr, 25)    # insertion point`,

},

{cat:"Java Extras", title:"Stream API Basics", note:"Java Streams = functional processing (filter/map/sort). Python comprehension usse bhi chhota hai. Placement ke liye basic understanding enough.",
type:"code",
java:`List<Integer> nums = Arrays.asList(1,2,3,4,5);
List<Integer> evens = nums.stream()
    .filter(n -> n % 2 == 0)
    .collect(Collectors.toList());

int sum = nums.stream().mapToInt(Integer::intValue).sum();
int max = nums.stream().max(Integer::compare).get();

List<String> names = list.stream()
    .filter(s -> s.length() > 3)
    .sorted()
    .map(String::toUpperCase)
    .collect(Collectors.toList());`,
python:`nums = [1, 2, 3, 4, 5]
evens = [n for n in nums if n % 2 == 0]   # 🔥 comprehension

total = sum(nums)
mx = max(nums)

result = [s.upper() for s in names
          if len(s) > 3]
result.sort()          # stream().sorted() jaisa

# ya method chain style

                filter(lambda s: len(s) > 3, names)))`,

{cat:"Java Extras", title:"Enums — Constant Groups", note:"Java enum = strongly-typed constant group (compile-time safe). Python 3.4+ ka <code>Enum</code> same kaam karta hai — names ko auto/auto numbers milte hain, iteration aur lookup dono supported.",
type:"code",
java:`// Java enum — class jaisa hi powerful
enum Day {
    MON("Monday"), TUE("Tuesday"), SAT("Saturday");
    private final String full;
    Day(String full) { this.full = full; }  // constructor
    public String full() { return full; }
}

Day d = Day.MON;
d.name();        // "MON"
d.ordinal();     // 0 (order)
Day.valueOf("TUE");  // lookup by name

// iteration
for (Day x : Day.values()) { ... }

// switch enum
switch (d) {
    case MON: ... break;
    default: ...
}`,
python:`from enum import Enum

class Day(Enum):
    MON = 1
    TUE = 2
    SAT = 6

d = Day.MON
d.name        # "MON"
d.value       # 1
Day(6)        # lookup by value -> Day.SAT
Day["TUE"]    # lookup by name -> Day.TUE

for x in Day:
    print(x)   # iterate all members

# function-call syntax
if d is Day.MON: ...`,
extra:"<b>Interview:</b> enum comparison hamesha <code>==</code> / <code>is</code> se — string se compare mat karo (typo = bug). Python <code>IntEnum</code> = int ke saath compatible, <code>auto()</code> = khud numbering. Java enum extra fields + methods le sakta hai."
},

{cat:"Java Extras", title:"Date & Time API", note:"Java 8+ ka <code>java.time</code> — LocalDate/LocalTime immutable hain. Python ka <code>datetime</code> module same kaam karta hai. Dono mein timezone handling important hai.",
type:"code",
java:`import java.time.*;

LocalDate today = LocalDate.now();
LocalDate d = LocalDate.of(2024, 5, 10);
d.plusDays(5);         // 15 May
d.minusMonths(1);      // 10 Apr
d.isAfter(today);      // false

LocalDateTime now = LocalDateTime.now();
now.format(DateTimeFormatter.ofPattern("dd-MM-yyyy"));

// difference
long days = ChronoUnit.DAYS.between(d, today);

// timestamp (epoch millis)
long millis = System.currentTimeMillis();`,
python:`from datetime import datetime, date, timedelta

today = date.today()
d = date(2024, 5, 10)
d + timedelta(days=5)        # 15 May
d - timedelta(days=30)       # 10 Apr
d > today                    # False

now = datetime.now()
now.strftime("%d-%m-%Y")     # formatting

# difference
diff = today - d             # timedelta
diff.days

# timestamp (epoch seconds)
ts = datetime.now().timestamp()`,
extra:"<b>Interview:</b> Java <code>SimpleDateFormat</code> thread-safe nahi hai (shared static use mat karo) — <code>DateTimeFormatter</code> safe hai. Python <code>strftime</code> codes: <code>%Y</code>=year, <code>%m</code>=month, <code>%d</code>=day. Timezone: Java <code>ZonedDateTime</code>, Python <code>datetime.now(timezone.utc)</code>."
},

{cat:"Java Extras", title:"Big Numbers — Precision", note:"Java int/long overflow se bachne ke liye <code>BigInteger</code> (unlimited) aur exact decimal ke liye <code>BigDecimal</code>. Python ka int unlimited hai (auto), <code>Decimal</code> exact decimals deta hai.",
type:"code",
java:`import java.math.BigInteger;
import java.math.BigDecimal;

BigInteger a = new BigInteger("99999999999999999999");
BigInteger b = BigInteger.valueOf(2);
BigInteger sum = a.add(b);          // add, subtract, multiply, divide

BigDecimal x = new BigDecimal("0.1");
BigDecimal y = new BigDecimal("0.2");
x.add(y).doubleValue();              // 0.3 (exact!)

double a2 = 0.1 + 0.2;               // 0.30000000000000004 bug!

// compare
a.compareTo(b);                      // -1, 0, 1`,
python:`# int is unlimited — koi overflow nahi
a = 99999999999999999999
b = 2
print(a + b)                         # 100000000000000000001

from decimal import Decimal
x = Decimal("0.1")
y = Decimal("0.2")
print(x + y)                         # 0.3 exact

# float floating-point bug
print(0.1 + 0.2)                     # 0.30000000000000004

# precision set karo
from decimal import getcontext
getcontext().prec = 28`,
extra:"<b>Interview:</b> money/precision problems mein <code>double</code> kabhi use mat karo — <code>BigDecimal</code> (Java) / <code>Decimal</code> (Python) lo. Large factorials/combinations (nCr) mein <code>BigInteger</code>/Python int zaroori. <code>compareTo()</code> = <code>==</code> ka safe version."
},

{cat:"Java Extras", title:"Optional — Null Handling", note:"Java <code>Optional</code> = null ko explicitly represent karna (null-pointer se bachna). Python mein None hota hai — <code>is None</code> check se. Dono ka goal: 'value ho ya na ho' ko type-safe tarike se handle karna.",
type:"code",
java:`import java.util.Optional;

Optional<String> name = Optional.of("Vinay");
Optional<String> empty = Optional.empty();

// null-safe access
name.isPresent();             // true
name.get();                   // "Vinay"
name.orElse("Guest");         // default
name.orElseThrow(() -> new IllegalStateException());

// map / filter chain (stream jaisa)
name.map(String::toUpperCase).orElse("?");

// Optional.ofNullable(userName) — null ho sakta hai
Optional<String> v = Optional.ofNullable(getName());`,
python:`# None is the "Optional" — explicit check
name = "Vinay"          # ya None
if name is None:
    v = "Guest"
else:
    v = name

# walrus / conditional (one-liner)
v = name or "Guest"          # "" bhi fallback hoga

# safe navigation via getattr
d.get("key", "default")

# py3.10+: match None pattern
match name:
    case None: v = "Guest"
    case _:    v = name`,
extra:"<b>Interview:</b> <code>orElse</code> eager hai (hamesha evaluate), <code>orElseGet</code> lazy. Python <code>or</code> sirf falsy (None, \"\", 0, []) pe fallback deta hai — <code>is None</code> strict check chahiye toh use that. Java Optional koi serializable nahi, field me rakhna anti-pattern hai."
},

{cat:"Java Extras", title:"Records & var — Boilerplate Katao", note:"Java 16+ ka <code>record</code> = immutable data class — toString/equals/hashCode auto ban jaate hain. Python ka <code>@dataclass</code> same kaam karta hai. <code>var</code> (Java 10+) = type inference ka chhota sa shortcut.",
type:"code",
java:`// record — immutable data carrier (Java 16+)
record Point(int x, int y) { }
Point p = new Point(3, 4);
p.x();           // accessor (p.x() nahi p.x)
p.toString();    // Point[x=3, y=4] auto

// compact constructor — validation
record User(String name, int age) {
    User {
        if (age < 0) throw new IllegalArgumentException();
    }
}

// var — local type inference (Java 10+)
var list = new ArrayList<String>();   // type inferred`,
python:`from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

p = Point(3, 4)
p.x                  # attribute
str(p)               # Point(x=3, y=4) auto

# frozen=True = immutable (record jaisa)
@dataclass(frozen=True)
class User:
    name: str
    age: int
    def __post_init__(self):
        if self.age < 0:
            raise ValueError("age < 0")`,
extra:"<b>Interview:</b> record immutable hai — fields <code>private final</code>. Python <code>@dataclass(frozen=True)</code> = immutable, <code>@dataclass(order=True)</code> = comparison methods auto. Records/dataclasses map/serialization ke liye ideal hain."
},

{cat:"Java Extras", title:"Method References & Function Passing", note:"Java method reference <code>::</code> — lambda ka chhota form (System.out::println = x -> System.out.println(x)). Python mein functions pehle class citizens hain — directly pass karo, lambda optional.",
type:"code",
java:`import java.util.*;
import java.util.function.*;

// method reference: Class::method
List<String> names = Arrays.asList("a", "bb", "ccc");
names.sort(String::compareTo);            // :: = lambda shortcut
names.forEach(System.out::println);       // (x) -> println(x)

// function interfaces
Function<String, Integer> f = String::length;
f.apply("abc");                           // 3

Supplier<Double> r = Math::random;
BiFunction<Integer,Integer,Integer> add =
    (a, b) -> a + b;                      // lambda`,
python:`# functions are first-class — direct pass
names = ["a", "bb", "ccc"]
names.sort(key=len)            # len = function reference
print(*names, sep="\\n")        # for-each

# lambda / named function dono OK
f = len
f("abc")                        # 3

import random, math
import functools

nums = [1, 2, 3]
sum(nums)                       # built-in hi function hai

# partial — function + fixed args (curry jaisa)
add = lambda a, b: a + b
add5 = functools.partial(add, 5)
add5(3)                         # 8`,
extra:"<b>Interview:</b> Java mein method reference 4 types hain — <code>Instance::method</code>, <code>Class::staticMethod</code>, <code>Class::instanceMethod</code>, <code>Class::new</code> (constructor). Python mein sab simple function references hain. <code>functools.partial</code> = Java currying ke nearest cousin."
},

/* ========== INTERVIEW Q&A — JAVA (non-LeetCode topics) ========== */

{type:"qa", cat:"Java Extras", title:"Interview Q1 · HashMap kaise kaam karta hai?", diff:"I", note:"Java HashMap ki internal working explain karo — get/put ki time complexity kya hai?",
answer:`<b>Internal structure:</b> Array of <code>Node&lt;K,V&gt;</code> buckets. Har bucket ek linked list (ya tree) hai.
<ul>
<li><code>put(k,v)</code>: k ka <code>hashCode()</code> nikaalo, phir <code>hash % capacity</code> se bucket index nikaal kar wahan node daalo.</li>
<li><code>get(k)</code>: same bucket mein hash + <code>equals()</code> se node dhoondo.</li>
<li>2 equals-objects ka hashCode SAME hona chahiye (contract) — warna lookup fail ho jayega.</li>
<li>Ek bucket mein 8+ nodes (treeify_threshold) hote hi linked list → <b>Red-Black tree</b> ban jata hai (worst case O(log n)).</li>
<li>Load factor 0.75 — 75% full hone pe capacity double (rehash).</li>
</ul>
<b>Time:</b> average O(1), worst O(n)/O(log n). <b>vs Python dict:</b> dict = insertion-ordered, HashMap unordered; dict ki keys immutable honi chahiye (hashable), HashMap mein koi bhi object.`},

{type:"qa", cat:"Java Extras", title:"Interview Q2 · String, StringBuilder, StringBuffer ka fark?", diff:"I", note:"Dono mutable string classes mein kya difference hai, aur String immutable kyun hai?",
answer:`<b>String</b> = immutable (har operation naya object). Isliye loop mein string concat karna O(n²) hota hai — har baar naya object + copy.
<br><br><b>StringBuilder</b> = mutable, <b>synchronized nahi</b> — single-thread mein fastest.
<br><b>StringBuffer</b> = mutable, <b>synchronized</b> — multi-thread safe par thoda slow.
<br><br><b>String immutable kyun?</b> — String Pool mein shared hone ki wajah se (security, caching, thread-safety). 
<br><br>Python mein strings bhi <b>immutable</b> hain; mutable version <code>list</code> of chars ya <code>io.StringIO</code> use hota hai.`},

{type:"qa", cat:"Java Extras", title:"Interview Q3 · equals() vs == aur hashCode() contract?", diff:"I", note:"Object comparison mein == aur equals() ka fark, aur equals-hashCode contract kya bolta hai?",
answer:`<b>==</b> = reference compare (same object hai ya nahi). Primitive pe value compare.
<br><b>equals()</b> = value/logical compare — default Object.equals() bhi reference hi hota hai, isliye override karna padta hai.
<br><br><b>Contract:</b> agar <code>a.equals(b)</code> true hai, toh <code>a.hashCode() == b.hashCode()</code> bhi true hona chahiye. Inverse zaroori nahi (hash collision ho sakta hai).
<br><br>Python: <code>==</code> = value (Java ke equals jaisa), <code>is</code> = reference (Java ke == jaisa). Python objects ka default <code>__eq__</code> bhi identity hi hai.`},

{type:"qa", cat:"Java Extras", title:"Interview Q4 · Overloading vs Overriding?", diff:"I", note:"Compile-time vs runtime polymorphism ka fark explain karo.",
answer:`<b>Overloading</b> = same naam, alag parameters (same class). Compile-time resolve hota hai. Return type se overload nahi hota.
<pre><code>void print(int a){...}
void print(String s){...}</code></pre>
<b>Overriding</b> = child class parent ka method same signature se re-define karta hai. Runtime resolve hota hai (dynamic dispatch). @Override annotation recommended.
<br><br>Python: overloading nahi hoti — same naam ka method last wala hi rehta hai; <code>*args</code> se simulate karo. Overriding Python mein bhi hoti hai.`},

{type:"qa", cat:"Java Extras", title:"Interview Q5 · Exception: checked vs unchecked?", diff:"I", note:"Checked aur unchecked exceptions mein fark, aur kya 'finally' guarantee karta hai?",
answer:`<b>Checked</b> = compiler force karta hai handle karo (try-catch ya throws) — e.g. <code>IOException</code>, <code>SQLException</code>. Python mein iska exact equivalent nahi.
<br><b>Unchecked</b> = runtime pe aati hain, handle karna optional — e.g. <code>NullPointerException</code>, <code>ArithmeticException</code>. Python ki saari exceptions isi jaisi hain.
<br><br><b>finally</b> = exception aaye ya nahi, hamesha chalta hai (resource close ke liye). Java 7+ mein <code>try-with-resources</code> auto close karta hai.
<br><br>Python: <code>try/except/else/finally</code> — <code>raise</code> (Java throw), custom exception = class Exception ko inherit karo.`},

{type:"qa", cat:"Java Extras", title:"Interview Q6 · Thread vs Process, aur synchronized?", diff:"I", note:"Process aur thread mein fark, synchronized keyword kya karta hai?",
answer:`<b>Process</b> = apni memory + resources (heavy). <b>Thread</b> = same process ke andar, shared memory (light, communication aasan par race conditions risk).
<br><br><b>synchronized</b> = ek time pe ek hi thread method/block mein — <b>monitor lock (intrinsic lock)</b> pe. Critical section safe.
<ul>
<li><code>synchronized void m()</code> — instance lock</li>
<li><code>synchronized static void m()</code> — class lock</li>
</ul>
<b>vs Python:</b> <b>GIL</b> (Global Interpreter Lock) CPU-bound threads ko parallel nahi chalne deta — I/O-bound ke liye threads, CPU-bound ke liye multiprocessing. Java threads truly parallel hain (multi-core).`},

{type:"qa", cat:"Java Extras", title:"Interview Q7 · Garbage Collection kya hai?", diff:"I", note:"Java mein GC kaise kaam karta hai, aur memory leak kab hota hai?",
answer:`<b>GC</b> = unused objects ki memory automatically free karta hai (manual free nahi, C/C++ ke opposite). Reachability se decide hota hai — koi thread object ko reference nahi kar raha toh mark-and-sweep.
<br><br>Heap ke generations: Young (Eden + Survivor) → Old. Minor GC (young) + Major GC (old). <b>Stop-the-world</b> pauses kaam karte hain.
<br><br><b>Memory leak kab?</b> — static collections mein objects rakhe raho, unclosed resources (streams/connections), listener/observer remove na karo, hashmap keys jo equals/hashCode break karein.
<br><br>Python: reference counting + cyclic GC. Leak = global list/singleton cache mein growth, unclosed files.`},

{type:"qa", cat:"Java Extras", title:"Interview Q8 · Generics kyun aur type erasure?", diff:"I", note:"Generics compile-time type safety kyun dete hain, type erasure kya hai?",
answer:`<b>Generics</b> = compile-time type safety — galat type daalo toh compile error. Bina generics ke runtime ClassCastException ka risk.
<pre><code>List&lt;String&gt; list = new ArrayList<>();</code></pre>
<b>Type erasure:</b> compile ke baad generic info hata di jaati hai — <code>List&lt;String&gt;</code> ban jata hai raw <code>List</code>, boundaries pe casts add ho jaati hain. Isliye <code>list instanceof List&lt;String&gt;</code> legal nahi (runtime pe info nahi hai).
<br><br>Python: dynamically typed, type hints (<code>list[str]</code>) sirf documentation/mypy ke liye — runtime enforce nahi. Generics ka fayda = less runtime bugs.`},

{cat:"Python Extras", title:"Scope — global / nonlocal", note:"Python ki scope chain LEGB hai: Local → Enclosing → Global → Built-in. Java mein class fields + method scope, global keyword nahi hota.",

{type:"qa", cat:"Python Extras", title:"Interview Q1 · Decorator kaise kaam karta hai?", diff:"I", note:"Decorator kya hota hai, @ symbol se kya hota hai — ek example se samjhao.",
answer:`<b>Decorator</b> = ek function jo dusre function ko wrap karke behavior add karta hai. <code>@mydecorator</code> bas shorthand hai:
<pre><code>@timer
def fetch(): ...

# equivalent:
fetch = timer(fetch)</code></pre>
Example:
<pre><code>def timer(fn):
    def wrapper(*args, **kwargs):
        t = time.time()
        r = fn(*args, **kwargs)
        print("took", time.time()-t)
        return r
    return wrapper</code></pre>
<b>Famous built-ins:</b> <code>@lru_cache</code> (memoization), <code>@staticmethod</code>, <code>@property</code>, <code>@classmethod</code>.
<br><br>Java mein equivalent = <b>annotations</b> (@Override, @FunctionalInterface) — par unka behavior framework/compiler decide karta hai, Python jaise function-wrap nahi.`},

{type:"qa", cat:"Python Extras", title:"Interview Q2 · Generator vs Iterator vs List?", diff:"I", note:"Generator, iterator aur list mein fark — memory pe kya asar hota hai?",
answer:`<b>Iterator</b> = <code>__iter__()</code> + <code>__next__()</code> wala object. <code>list</code>, <code>set</code>, <code>dict</code> sab iterable hain.
<br><b>Generator</b> = <code>yield</code> wala function. Lazy — ek-ek value pe demand pe banata hai, saari ek saath memory mein nahi.
<pre><code>def fib():
    a, b = 0, 1
    while True:
        yield a
        a, b = b, a+b</code></pre>
<ul>
<li><b>List:</b> saara data memory mein — fast random access, par bada data = heavy.</li>
<li><b>Generator:</b> ek value at a time — memory-efficient, par sirf forward, ek baar.</li>
<li><b>Iterators (DSA):</b> stream processing, large files, infinite sequences.</li>
</ul>
Java mein generator nahi, par <b>Stream API lazy</b> hai aur iterator pattern same concept deta hai.`},

{type:"qa", cat:"Python Extras", title:"Interview Q3 · GIL kya hai — threads ka fark?", diff:"I", note:"GIL ka asar Python threading pe kya hota hai, multiprocessing kab use karein?",
answer:`<b>GIL</b> (Global Interpreter Lock) = ek time pe ek hi thread Python bytecode execute kar sakta hai. Isliye:
<ul>
<li><b>CPU-bound</b> tasks (loops, calculations) — threads se koi speedup NAHI. Use <b>multiprocessing</b> (Process pool).</li>
<li><b>I/O-bound</b> tasks (network, files, sleep) — threads useful hain, kyunki I/O wait ke time lock release ho jata hai. Use <b>threading</b> ya asyncio.</li>
</ul>
Java/GIL nahi — multiple cores pe threads truly parallel. Python 3.13+ optional free-threaded mode aaya hai.
<br><br><b>Global variables + threads</b> = race condition — <code>threading.Lock()</code> se protect karo (Java synchronized jaisa).`},

{type:"qa", cat:"Python Extras", title:"Interview Q4 · list vs tuple — kab kya use karein?", diff:"I", note:"List aur tuple mein fundamental fark kya hai?",
answer:`<b>Tuple</b> = <b>immutable</b> (bana ke change nahi kar sakte), hashable (dict key ban sakta hai). Fixed, logical grouping ke liye — e.g. coordinate <code>(x, y)</code>, function se multiple returns.
<br><b>List</b> = <b>mutable</b> — append/pop/sort sab hota hai. Dynamic collection ke liye.
<br><br>Implementation: tuple slightly lighter + faster (fixed size, no overalloc).
<br><br>DSA use: tuple = immutable key in hashmap (e.g. DP states, graph edges). Java mein immutable key ke liye <b>record</b> ya custom class (equals+hashCode) chahiye — Python ki tuple yahan superpower hai.
<br><br>Note: <code>hash((1,[2,3]))</code> ❌ error — nested mutable list tuple ko unhashable banata hai.`},

{type:"qa", cat:"Python Extras", title:"Interview Q5 · Shallow vs Deep Copy?", diff:"I", note:"copy.copy() aur copy.deepcopy() mein fark — DSA mein kab zyada problem hoti hai?",
answer:`<b>Shallow copy</b> (<code>copy.copy</code>) = naya outer container, par nested objects WAHI references. Inner change outer copy mein bhi dikhta hai.
<pre><code>a = [[1,2],[3,4]]
b = a.copy()          # shallow
b[0][0] = 99          # a[0][0] bhi 99 ho jayega!❌</code></pre>
<b>Deep copy</b> (<code>copy.deepcopy</code>) = har nested level naya object — poora independent.
<br><br><b>DSA bug source:</b> backtracking/subset solutions mein list ko result mein append karte time:
<pre><code>res.append(path[:])     # ✅ copy
res.append(path)        # ❌ wahi reference — baad mein mutate ho jayega</code></pre>
Java: <code>clone()</code> shallow, <code>copyOf</code> / serialization deep. Matrix/list problems mein <code>deepcopy</code> ya manual copy yahi pattern.`},

{type:"qa", cat:"Python Extras", title:"Interview Q6 · MRO & Multiple Inheritance?", diff:"I", note:"Multiple inheritance mein Python kiska method call karta hai — MRO kaise decide hota hai?",
answer:`<b>MRO</b> (Method Resolution Order) = C3 linearization algorithm se decide hota hai. <code>ClassName.__mro__</code> se dekh sakte ho.
<pre><code>class A: ...
class B(A): ...
class C(A): ...
class D(B, C): ...   # D -> B -> C -> A -> object</code></pre>
<b>Diamond problem</b> — A, B, C sab define karein toh D ko konsa milega? C3 algorithm ensure karta hai: left-to-right, parent baad mein, ek baar hi.
<br><br>Python DSA mein zyada matter nahi karta, par <b>dataclasses + inheritance</b> aur custom classes mein order samajhna useful hai.
<br><br>Java: single inheritance + interface default methods — diamond conflict pe explicit <code>super</code>/interface choice.`},

{type:"qa", cat:"Python Extras", title:"Interview Q7 · with statement / context manager kya karta hai?", diff:"I", note:"with open(...) ka kya matlab hai, and context manager kaise banta hai?",
answer:`<b>with</b> = context manager — enter/exit ko auto-handle karta hai, resource close guaranteed.
<pre><code>with open("f.txt") as f:
    data = f.read()
# yahan tak pauncho toh file close ho chuki hai ✓</code></pre>
Java equivalent = <b>try-with-resources</b>.
<br><br>Apna context manager:
<pre><code>class Timer:
    def __enter__(self):
        self.t = time.time(); return self
    def __exit__(self, *exc):
        print("took", time.time()-self.t)
        return False   # False = exception ko propagate do

with Timer():
    expensive_thing()</code></pre>
Ya decorator se: <code>@contextmanager</code> + <code>yield</code>.
<br><br>DSA use: file/DB/socket leaks se bachne ke liye — file mein 1M lines read karo toh lazy + with best.`},

{type:"qa", cat:"Python Extras", title:"Interview Q8 · *args / **kwargs kab use karein?", diff:"I", note:"*args aur **kwargs kya hain, aur function signature mein kya fark padta hai?",
answer:`<b>*args</b> = saare extra positional arguments ek tuple mein collect karte hain.
<br><b>**kwargs</b> = saare extra keyword arguments ek dict mein.
<pre><code>def f(a, *args, b=10, **kwargs): ...</code></pre>
<ul>
<li>Jaise DSA helper functions mein variable args: <code>min(a, b, c, d)</code></li>
<li>Wrapper/decorator mein pass-through: <code>def wrapper(*args, **kwargs)</code></li>
<li>Unpacking: <code>nums = [1,2,3]; foo(*nums)</code></li>
</ul>
Java equivalent = <b>varargs</b> <code>int... nums</code> (positional only). Keyword arguments ka equivalent nahi.
<br><br>Java ke <code>min(int... a)</code> vs Python <code>min(*a)</code> — same concept, Python mein kwargs ka extra power.`},

/* ---------- Done / progress tracking ---------- */
const doneKey = 'dsa_done_rosetta';
function getDone(){
  try { const v = JSON.parse(localStorage.getItem(doneKey) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function isDone(i){ return getDone().indexOf(i) !== -1; }
function toggleDone(i){
  const d = getDone(); const idx = d.indexOf(i);
  if(idx === -1){ d.push(i); } else { d.splice(idx, 1); }
  try { localStorage.setItem(doneKey, JSON.stringify(d)); } catch(e){}
}

function highlightCode(code){
  return esc(code)
    .replace(/(#.*$|\/\/.*$)/gm,'<span class="cm">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="str">$1</span>')
    .replace(/\b(class|def|return|if|elif|else|for|in|while|import|from|try|except|finally|new|static|void|int|double|float|char|boolean|String|long|public|private|self|None|True|False|break|continue|lambda|with|as|pass|extends|super|is)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
}

function buildDrawer(){
  document.getElementById('drawerTitle').textContent = 'Complete index — ' + catList.length + ' chapters';
  let html = '';

  DATA.forEach((d,i)=>{
    if(d.type === 'home') return;
    if(d.cat !== lastCat){
      html += `<li class="cat">${d.cat}</li>`;
      lastCat = d.cat;
    }
    const quizBadge = d.type === 'quiz' ? '<span class="badge-q">Q</span>' : '';
    html += `<li data-i="${i}"${isDone(i) ? ' class="done"' : ''}><span class="num">${String(i).padStart(2,'0')}</span>${d.title}${quizBadge}</li>`;
  });
  drawerList.innerHTML = html;
  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.addEventListener('click', ()=>{ goTo(parseInt(li.dataset.i)); closeDrawer(); });

  } else if(d.type === 'roadmap'){
    bodyHtml = `<div class="roadmap">${catList.map((c,i)=>`
      <div class="rm-step">
        <div class="rm-num">${i+1}</div>
        <div class="rm-name">${c}</div>
        <div class="rm-sub">${DATA.filter(x=>x.cat===c).length} slides</div>
      </div>
      ${i < catList.length - 1 ? '<div class="rm-arrow">↓</div>' : ''}`).join('')}</div>`;
  }

  const extraTag = d.type === 'quiz' ? 'Explanation hint' : (d.type === 'lc' ? 'Approach — kaise solve kiya' : (d.type === 'qa' ? 'Aur detail' : 'Note'));
  const extraHtml = d.extra ? `<div class="extra-box"><span class="tag">${extraTag}</span>${d.extra}</div>` : '';

  if(d.type === 'home'){
    slideEl.innerHTML = buildHomeHtml();
  } else {
    const ch = catList.indexOf(d.cat) + 1;
    const badge = d.diff ? `<span class="diff d-${d.diff}">${d.diff === 'H' ? 'HARD' : (d.diff === 'I' ? 'INTERVIEW' : (d.diff === 'E' ? 'EASY' : 'MEDIUM'))}</span>` : '';
    slideEl.innerHTML = `
      <div class="eyebrow"><span class="ch">Ch ${ch}/${catList.length}</span>${d.cat} · ${String(current+1).padStart(2,'0')} / ${String(DATA.length).padStart(2,'0')}</div>
      <h2>${d.title}${badge}</h2>
      <p class="note">${d.note}</p>
      ${bodyHtml}
      ${extraHtml}
      <div class="done-row">
        <button class="done-btn${isDone(current) ? ' is-done' : ''}" data-i="${current}">${isDone(current) ? '✓ DONE — dabao to unmark' : 'Mark Done ✓'}</button>
        <span class="done-count"><b>${getDone().length}</b> / ${DATA.length} done</span>
      </div>
    `;
  }

  progressFill.style.width = ((current+1)/DATA.length*100) + '%';
  metaLeft.textContent = 'SLIDE ' + (current+1);
  metaRight.textContent = '/ ' + DATA.length + ' · ' + getDone().length + ' ✓';
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === DATA.length - 1 ? 'Restart ↺' : 'Next →';

  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.classList.toggle('active', parseInt(li.dataset.i) === current);
    li.classList.toggle('done', isDone(parseInt(li.dataset.i)));
  });
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.i) === current);
  });

  const activeLi = drawerList.querySelector('li.active');
  if(activeLi) activeLi.scrollIntoView({block:'nearest'});

  bindQuiz();
  bindHome();
  bindDone();
  window.scrollTo({top:0, behavior:'smooth'});
}

function bindDone(){
  const btn = slideEl.querySelector('.done-btn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    toggleDone(current);
    render();
  });
}

function bindHome(){
  if(DATA[current].type !== 'home') return;
  slideEl.querySelectorAll('.home-topic').forEach(btn=>{
    btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.i)));
  });
}

function bindQuiz(){
  const d = DATA[current];
  if(d.type !== 'quiz') return;
  slideEl.querySelectorAll('.quiz-box').forEach(box=>{
    const qi = parseInt(box.dataset.q);
    const q = d.questions[qi];
    box.querySelectorAll('.quiz-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const oi = parseInt(btn.dataset.i);
        if(oi === q.ans){
          btn.classList.add('correct');
          box.querySelectorAll('.quiz-opt').forEach(b=>b.disabled = true);
          box.querySelector('.quiz-explain').classList.add('show');
          if(!box.dataset.done){
            box.dataset.done = '1';
            score++;
            scoreVal.textContent = score;
          }
        } else {
          btn.classList.add('wrong');
          btn.disabled = true;
        }
      });
    });
  });
}

function goTo(i){
  current = Math.max(0, Math.min(DATA.length-1, i));
  render();
}

nextBtn.addEventListener('click', ()=>{
  if(current === DATA.length - 1){ goTo(0); }
  else{ goTo(current+1); }
});
prevBtn.addEventListener('click', ()=> goTo(current-1));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
  if(e.key === 'Escape') closeDrawer();
});

const drawerBtn = document.getElementById('drawerBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
drawerBtn.addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawer);

const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', ()=> goTo(0));
document.querySelector('.brand').addEventListener('click', ()=> goTo(0));

buildDrawer();
buildDotsMini();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
