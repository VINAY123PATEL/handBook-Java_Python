 tuple unpacking (structured binding)\n    pair<int, int> p = {1, 2};\n    auto [a, b] = p;                            // a, b = b, a jaisa\n    cout << a + b << \"\\n\";                      // 3\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "map / filter / reduce", "note": "Functional tools — Java streams ke map/filter/reduce se mile-jhule. Python mein comprehension zyada pythonic hai, par ye bhi aate hain.", "type": "code", "java": "List<Integer> doubled = nums.stream()\n    .map(n -> n * 2).collect(Collectors.toList());\nList<Integer> evens = nums.stream()\n    .filter(n -> n % 2 == 0).collect(Collectors.toList());\nint sum = nums.stream().reduce(0, Integer::sum);", "python": "nums = [1, 2, 3, 4]\ndoubled = list(map(lambda n: n * 2, nums))\nevens   = list(filter(lambda n: n % 2 == 0, nums))\n\nfrom functools import reduce\ntotal   = reduce(lambda a, b: a + b, nums)\n\n# pythonic preferance: comprehension 🔥\ndoubled = [n * 2 for n in nums]\nevens   = [n for n in nums if n % 2 == 0]\n\n# multiple lists zip\nfor a, b in zip([1,2],[3,4]): print(a + b)", "extra": "map = apply function to each, filter = condition se select, reduce = accumulate. Comprehension in sabse zyada readable. <code>zip()</code> two lists ko pair karta hai — interview mein 5-6 questions mein kaam aata.", "cpp": "#include <iostream>\n#include <vector>\n#include <numeric>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> nums = {1, 2, 3, 4};\n\n    // map — n * 2\n    vector<int> doubled;\n    for (int n : nums) doubled.push_back(n * 2);\n\n    // filter — even\n    vector<int> evens;\n    for (int n : nums) if (n % 2 == 0) evens.push_back(n);\n\n    // reduce — total\n    int total = accumulate(nums.begin(), nums.end(), 0,\n                           [](int a, int b) { return a + b; });\n\n    // zip — two lists pair 🔥\n    vector<int> lhs = {1, 2}, rhs = {3, 4};\n    cout << \"zip: \";\n    for (size_t i = 0; i < lhs.size(); i++) cout << lhs[i] + rhs[i] << \" \";\n    cout << \"\\nmapped: \";\n    for (int n : doubled) cout << n << \" \";\n    cout << \"\\nfiltered: \";\n    for (int n : evens) cout << n << \" \";\n    cout << \"\\ntotal: \" << total << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Scope — global / nonlocal", "note": "Python ki scope chain LEGB hai: Local → Enclosing → Global → Built-in. Java mein class fields + method scope, global keyword nahi hota.", "type": "code", "java": "class Counter {\n    static int count = 0;     // class-level \"global\"\n\n    void inc() { count++; }   // modify allowed\n    void dec() { count--; }\n}", "python": "x = 10                       # module-level global\n\ndef read():\n    print(x)                  # global READ allowed\n\ndef modify():\n    x = 20                    # naya LOCAL banaya (global nahi!)\n    print(x)                  # 20 (local)\n\ndef modify_global():\n    global x                  # global wale ko target 🔥\n    x = 20\n\ndef outer():\n    x = 5                     # enclosing scope\n    def inner():\n        nonlocal x            # enclosing ko modify 🔥\n        x += 1", "extra": "<b>Classic interview trap:</b> bina <code>global</code> ke function ke andar <code>x = 20</code> global ko nahi badalta — naya local variable banta hai! <code>nonlocal</code> nested function ke enclosing scope ko modify karta. Java mein is concept ki zarurat kam (class fields static hoti hain).", "cpp": "#include <iostream>\nusing namespace std;\n\nint x = 10;                        // global (module-level jaisa)\n\nvoid read()   { cout << x << \"\\n\"; }              // global READ allowed\nvoid modify() { int x = 20; cout << x << \"\\n\"; }  // naya LOCAL (global nahi!)\nvoid modify_global() { x = 20; }                  // global wale ko target 🔥\n\n// lambda capture by reference = Python nonlocal jaisa 🔥\nvoid outer() {\n    int x = 5;                        // enclosing scope\n    auto change = [&]() { x += 1; };  // enclosing ko modify\n    change();\n    cout << x << \"\\n\";                // 6\n}\n\nint main() {\n    read();              // 10\n    modify();            // 20 (local) — global abhi bhi 10\n    cout << x << \"\\n\";   // 10 (global badla nahi!)\n    modify_global();\n    cout << x << \"\\n\";   // 20\n    outer();             // 6\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Modules & Built-in Libraries", "note": "Python ki built-in libraries DSA mein time bachati hain — Java ke equivalent ek nazar mein.", "type": "table", "headers": ["Module", "Java", "Python"], "rows": [["Math", "<code>Math.sqrt(), Math.pow()</code>", "<code>math.sqrt(), a**b</code>"], ["Random", "<code>new Random().nextInt(n)</code>", "<code>random.randint(0,n)</code>"], ["Binary search", "<code>Arrays.binarySearch()</code>", "<code>bisect.bisect_left()</code>"], ["Priority queue", "<code>PriorityQueue&lt;&gt;</code>", "<code>heapq</code>"], ["Frequency", "<code>HashMap + loop</code>", "<code>collections.Counter</code>"], ["Default dict", "<code>getOrDefault()</code>", "<code>collections.defaultdict</code>"], ["Deque", "<code>ArrayDeque&lt;&gt;</code>", "<code>collections.deque</code>"], ["Permutations", "Manual", "<code>itertools.permutations()</code>"], ["Combinations", "Manual", "<code>itertools.combinations()</code>"]], "extra": "<code>from collections import Counter, defaultdict, deque</code> aur <code>import heapq, bisect</code> — ye 6 imports interview mein 80% boilerplate khatam kar dete hain. itertools permutations/combinations backtracking ka shortcut."}, {"cat": "17. Advanced Python", "title": "File Handling & JSON", "note": "Python ka with open() — context manager auto file close karta hai. JSON = dict ↔ string conversion. Java mein I/O verbose hai.", "type": "code", "java": "// Java file reading (verbose)\ntry (BufferedReader br = new BufferedReader(\n        new FileReader(\"file.txt\"))) {\n    String line;\n    while ((line = br.readLine()) != null) {\n        System.out.println(line);\n    }\n} catch (IOException e) { e.printStackTrace(); }\n\n// JSON needs external lib (Jackson/Gson)", "python": "# 🔥 context manager: auto-close\nwith open(\"file.txt\") as f:\n    data = f.read()          # poori file string\n    # f.readlines() -> list of lines\n\nwith open(\"out.txt\", \"w\") as f:\n    f.write(\"Hello\")\n\nimport json\ndata = json.loads('{\"name\": \"Vinay\"}')  # str -> dict\nout  = json.dumps(data, indent=2)       # dict -> str\nprint(data[\"name\"])", "extra": "<code>with open(...) as f:</code> file ko auto-close karta hai — try/finally ki zarurat nahi. JSON API work ka base hai (MERN mein zaroor aayega). Java mein try-with-resources bhi same auto-close deta hai, par boilerplate zyada.", "cpp": "#include <iostream>\n#include <fstream>\n#include <sstream>\n#include <string>\nusing namespace std;\n\nint main() {\n    ofstream(\"file.txt\") << \"line1\\nline2\\n\";   // demo file banao\n\n    // context manager = RAII 🔥 — scope khatam = auto-close\n    {\n        ifstream f(\"file.txt\");\n        stringstream ss;\n        ss << f.rdbuf();              // poora file ek string\n        string data = ss.str();\n        cout << data;\n    }   // yahan auto-close (try/finally ki zarurat nahi)\n\n    // write\n    {\n        ofstream out(\"out.txt\");\n        out << \"Hello\\n\";\n    }\n\n    // JSON — C++ built-in nahi; nlohmann/json use karo.\n    // Simple dict-style data:\n    string json = \"{\\\"name\\\": \\\"Vinay\\\"}\";\n    size_t i = json.find(\"Vinay\");\n    cout << \"parsed name: \" << json.substr(i, 5) << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Regular Expressions (regex)", "note": "Pattern matching — validation, parsing, string cleaning. Python ki raw strings r\"...\" escape headaches khatam karti hain.", "type": "code", "java": "import java.util.regex.*;\nPattern p = Pattern.compile(\"\\\\d+\");\nMatcher m = p.matcher(\"abc123\");\nm.find();            // true\nm.group();           // \"123\"\n\nString s = \"a1b2\".replaceAll(\"\\\\d\", \"#\");  // \"a#b#\"\n// note: java mein \\\\ double-escape hota hai 🔥", "python": "import re\nre.search(r\"\\d+\", \"abc123\")      # match object / None\nre.findall(r\"\\d+\", \"a1b2\")       # ['1', '2']\nre.sub(r\"\\d\", \"#\", \"a1b2\")       # 'a#b#'\nre.fullmatch(r\"\\d+\", \"123\")      # poora match?\nre.match(r\"\\d+\", \"123abc\")       # start se match\n\n# common patterns\nr\"\\d+\"   # digits       r\"\\w+\"  # word chars\nr\"[a-z]\"  # lowercase     r\"\\s\"   # whitespace", "extra": "Python ki <b>raw strings</b> (<code>r\"\\d\"</code>) mein backslash escape nahi hota — Java mein <code>\"\\\\d\"</code> double-escape likhna padta hai, bada headache. DSA mein regex rarely aata hai — validation problems (valid number, IP) mein use hota.", "cpp": "#include <iostream>\n#include <regex>\n#include <string>\nusing namespace std;\n\nint main() {\n    // C++ regex — raw string R\"(...)\" = Python r\"...\" jaisa 🔥\n    // (Java mein \\\\\\\\ double-escape karna padta tha)\n    regex digits(R\"(\\d+)\");\n    smatch m;\n    string hay = \"abc123\";\n    bool found = regex_search(hay, m, digits);\n    cout << found << \"\\n\";              // 1 (find)\n    cout << m.str() << \"\\n\";            // \"123\" (group)\n\n    cout << regex_replace(\"a1b2\", regex(R\"(\\d)\"), \"#\") << \"\\n\";  // a#b#\n    cout << regex_match(\"123\", regex(R\"(\\d+)\")) << \"\\n\";         // 1\n    cout << regex_match(\"123abc\", regex(R\"(\\d+)\")) << \"\\n\";      // 0\n\n    // findall — loop se\n    string s = \"a1b2\";\n    regex r(R\"(\\d+)\");\n    for (sregex_iterator it(s.begin(), s.end(), r), end;\n         it != end; ++it)\n        cout << (*it).str() << \" \";\n    cout << \"\\n\";                       // 1 2\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Iterators & Generators", "note": "Generator = lazy function jo yield se value ek-ek karke deta hai — memory efficient. Java streams bhi lazy hain.", "type": "code", "java": "List<Integer> list = Arrays.asList(1, 2, 3);\nIterator<Integer> it = list.iterator();\nwhile (it.hasNext()) {\n    int x = it.next();\n}\n\n// java: generators nahi, par streams lazy hain\nlist.stream().limit(2).forEach(System.out::println);", "python": "it = iter([1, 2, 3])     # iter() -> iterator\nnext(it)                  # 1\nnext(it)                  # 2\n\n# generator function 🔥\ndef numbers():\n    yield 1               # ek-ek karke\n    yield 2\n    yield 3\n\nfor n in numbers():\n    print(n)\n\n# generator expression (lazy)\nsq = (x*x for x in range(1000000))   # list nahi, lazy!\nsum(sq)                              # 333332833333500...", "extra": "Generator hamesha ek value memory mein rakhta hai — 1 million numbers bina generator ke list banane pe ~8MB, generator pe ~8 bytes. Interview question: '1 se 10^9 tak sum karo bina memory overflow ke' → generator. <code>yield</code> function ko suspend/resume karta hai.", "cpp": "#include <iostream>\n#include <vector>\n#include <optional>\nusing namespace std;\n\n// generator (simple) — har call pe agla value 🔥 (lazy, ek value memory)\nclass Numbers {\n    int cur = 1;\npublic:\n    optional<int> next() {\n        return cur <= 3 ? optional<int>(cur++) : nullopt;\n    }\n};\n\nint main() {\n    vector<int> list = {1, 2, 3};\n\n    // iterators 🔥\n    int x = 0;\n    for (auto it = list.begin(); it != list.end(); ++it) x = *it;\n    cout << \"last via iterator: \" << x << \"\\n\";   // 3\n\n    // generator demo\n    Numbers g;\n    cout << \"generator: \";\n    while (auto v = g.next()) cout << *v << \" \";\n    cout << \"\\n\";\n\n    // lazy sum — list/tuple nahi, ek-ek karke (memory efficient)\n    long long sq = 0;\n    for (long long i = 1; i <= 1000000; i++) sq += i * i;\n    cout << \"sum of squares: \" << sq << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Decorators", "note": "Decorator = function ko wrap karke behavior add karna. @lru_cache, @staticmethod, @property — sab decorators hain.", "type": "code", "java": "// Java annotations: @Override, @Deprecated, @FunctionalInterface\n// custom annotations + reflection = heavy machinery\n@Override\npublic String toString() { ... }\n\n// decorators jaisa behavior: manual wrapper\npublic static int[] log(String msg, Supplier<Integer> fn) {\n    System.out.println(msg);\n    return new int[]{fn.get()};\n}", "python": "def timer(fn):                     # decorator definition\n    def wrapper(*args, **kwargs):\n        print(\"start\")\n        result = fn(*args, **kwargs)\n        print(f\"took time\")\n        return result\n    return wrapper\n\n@timer                           # 🔥 syntax sugar\ndef add(a, b):\n    return a + b\n\nadd(1, 2)    # start / end print + 3 return\n\n# famous ones:\n@lru_cache(None)     # memoization\n@staticmethod        # no self\n@classmethod         # gets cls\n@property            # getter syntax", "extra": "Decorator = ek function jo doosra function return karta hai, jo original ko 'wrap' karta hai. DSA mein sabse useful hai <code>@lru_cache</code> (DP memoization one-liner). Java mein is concept ke liye annotations + reflection hota — kaafi heavy.", "cpp": "#include <iostream>\n#include <functional>\nusing namespace std;\n\nint add2(int a, int b) { return a + b; }\n\n// decorator: function jo function return kare = function wrapper 🔥\n// Python: @timer humare @timer decorator jaisa\nfunction<int(int, int)> timer(function<int(int, int)> fn) {\n    return [fn](int a, int b) {\n        cout << \"start\\n\";\n        int r = fn(a, b);\n        cout << \"took time\\n\";\n        return r;\n    };\n}\n\nint main() {\n    // @timer → timer(add2) 🔥 (Decoration manual syntax)\n    auto add = timer(add2);\n    cout << \"result: \" << add(1, 2) << \"\\n\";   // start / took time / 3\n\n    // memoization (@lru_cache jaisa) — C++ mein manually map se\n    // fibonacci(40) jaisi calls cache karke use hota hai\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Class Methods & Magic Methods", "note": "@staticmethod = no self, @classmethod = gets cls, instance method = self. Magic methods = Java ke toString/equals/hashCode ka dunder version.", "type": "code", "java": "class Student {\n    static int total = 0;              // class variable\n    static void reset() { total = 0; } // static method\n\n    String name;\n    Student(String name) { this.name = name; }\n\n    @Override public String toString() { return name; }\n    @Override public boolean equals(Object o) {\n        return name.equals(((Student) o).name);\n    }\n}", "python": "class Student:\n    total = 0                 # class variable\n\n    def __init__(self, name):\n        self.name = name\n        Student.total += 1\n\n    @staticmethod\n    def helper(x):            # no self/cls\n        return x * 2\n\n    @classmethod\n    def count(cls):           # gets cls\n        return cls.total\n\n    def __str__(self):        # Java toString()\n        return self.name\n\n    def __eq__(self, other):  # Java equals()\n        return self.name == other.name\n\n    def __len__(self):        # len(obj) works\n        return len(self.name)", "extra": "<b>Dunder mapping:</b> <code>__init__</code>=constructor, <code>__str__</code>=toString, <code>__eq__</code>=equals, <code>__repr__</code>=debug print. Instance method ko self chahiye, @staticmethod nahi, @classmethod ko cls milta. Ye OOP interview ke staple hain.", "cpp": "#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Student {\npublic:\n    static int total;                // class variable (Java static field)\n    static void reset() { total = 0; }        // static method\n\n    string name;\n    Student(const string& name) : name(name) { total++; }\n\n    // toString (Java toString / Python __str__ jaisa)\n    friend ostream& operator<<(ostream& os, const Student& s) {\n        return os << s.name;\n    }\n    // equals (Java equals / Python __eq__ jaisa)\n    bool operator==(const Student& o) const { return name == o.name; }\n    // len (Python __len__ jaisa)\n    size_t length() const { return name.size(); }\n};\nint Student::total = 0;              // static definition zaroori\n\nint main() {\n    Student a(\"Vinay\"), b(\"Vinay\");\n    cout << a << \"\\n\";                     // toString -> Vinay\n    cout << (a == b) << \"\\n\";              // equals -> 1\n    cout << a.length() << \"\\n\";            // len -> 5\n    cout << \"total: \" << Student::total << \"\\n\";   // 2\n    Student::reset();\n    cout << \"after reset: \" << Student::total << \"\\n\";  // 0\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "datetime — Time Handling", "note": "Python ka <code>datetime</code> module Java 8+ ke <code>java.time</code> jaisa hi hai — date, time aur timedelta sab immutable. Formatting <code>strftime</code> se, parsing <code>strptime</code> se.", "type": "code", "java": "import java.time.*;\n\nLocalDate d = LocalDate.of(2024, 5, 10);\nd.plusDays(5);             // 15 May\nLocalDate today = LocalDate.now();\nd.isAfter(today);          // false\nlong days = ChronoUnit.DAYS.between(d, today);\n\nLocalDateTime now = LocalDateTime.now();\nnow.format(DateTimeFormatter.ofPattern(\"dd-MM-yyyy HH:mm\"));", "python": "from datetime import date, datetime, timedelta\n\nd = date(2024, 5, 10)\nd + timedelta(days=5)       # 15 May\ntoday = date.today()\nd > today                   # False\ndiff = today - d            # timedelta\ndiff.days                   # difference in days\n\nnow = datetime.now()\nnow.strftime(\"%d-%m-%Y %H:%M\")   # format\ndt = datetime.strptime(\"10-05-2024\", \"%d-%m-%Y\")  # parse\n\n# Unix timestamp\nfrom datetime import timezone\nepoch = now.timestamp()          # float seconds", "extra": "<b>Interview:</b> <code>strftime</code> codes: <code>%Y</code>=year, <code>%m</code>=month, <code>%d</code>=day, <code>%H</code>=hour, <code>%M</code>=minute, <code>%S</code>=second. Java <code>SimpleDateFormat</code> thread-safe nahi (shared static = bug), <code>DateTimeFormatter</code> safe hai. Timezone: Java <code>ZonedDateTime</code>, Python <code>datetime.now(timezone.utc)</code>.", "cpp": "#include <iostream>\n#include <ctime>\n#include <iomanip>\n#include <chrono>\nusing namespace std;\n\nint main() {\n    // date = 2024, 5, 10 (Python date(2024,5,10) jaisa)\n    tm d = {};\n    d.tm_year = 2024 - 1900; d.tm_mon = 4; d.tm_mday = 10;\n    time_t base = mktime(&d);\n\n    // + timedelta(days=5) — mktime normalize karta hai\n    tm plus = d; plus.tm_mday += 5;\n    time_t p5 = mktime(&plus);\n    cout << \"plus 5 days: \" << put_time(localtime(&p5), \"%d-%m-%Y\") << \"\\n\";\n\n    time_t now = time(nullptr);\n    cout << \"d > today: \" << (base > now) << \"\\n\";      // False (0)\n\n    // difference in days\n    long diff = static_cast<long>(difftime(now, base) / 86400.0);\n    cout << \"diff.days: \" << diff << \"\\n\";\n\n    // format\n    cout << put_time(localtime(&now), \"%d-%m-%Y %H:%M\") << \"\\n\";\n\n    // parse — Unix strptime, Windows pe manual parse karna padta\n    // timestamp (epoch)\n    long long epoch = chrono::duration_cast<chrono::milliseconds>(\n        chrono::system_clock::now().time_since_epoch()).count();\n    cout << \"epoch ms: \" << epoch << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "random — Numbers & Shuffling", "note": "Python <code>random</code> module — Java ke <code>java.util.Random</code> ka equivalent. DSA mein shuffle, sample, random index ye sab mock tests aur online judges ke liye kaam aate hain.", "type": "code", "java": "import java.util.*;\n\nRandom r = new Random();\nr.nextInt();                 // any int\nr.nextInt(10);               // 0..9\nr.nextInt(6) + 1;            // 1..6 (dice)\nr.nextDouble();              // 0.0..1.0\nr.nextBoolean();\n\n// shuffle a list\nList<Integer> l = new ArrayList<>(List.of(1,2,3,4));\nCollections.shuffle(l, r);", "python": "import random\n\nrandom.randint(1, 6)         # 1..6 (dice) inclusive\nrandom.randrange(10)         # 0..9\nrandom.choice([1,2,3])       # random element\nrandom.uniform(0.0, 1.0)     # float 0..1\nrandom.random()              # float 0.0..1.0\n\n# sampling & shuffle\nrandom.sample([1,2,3,4], 2)  # 2 unique items\nrandom.shuffle([1,2,3,4])    # in-place shuffle\nimport secrets               # security ke liye\nsecrets.randbelow(10)", "extra": "<b>Interview:</b> Java <code>ThreadLocalRandom.current()</code> multi-threaded code mein use karo (fast, no shared state). Python <code>random.shuffle</code> in-place hai, <code>sample</code> bina duplicate. Security/OTP ke liye <code>random</code> nahi — <code>secrets</code> module (cryptographically secure).", "cpp": "#include <iostream>\n#include <random>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    mt19937 rng(12345);   // Mersenne Twister (Java Random jaisa) — seeded\n\n    uniform_int_distribution<int> dice(1, 6);        // 1..6 (inclusive)\n    uniform_int_distribution<int> r10(0, 9);         // 0..9\n    uniform_real_distribution<double> uni(0.0, 1.0); // 0.0..1.0\n    bernoulli_distribution coin;                     // boolean\n\n    cout << \"dice: \" << dice(rng) << \"\\n\";\n    cout << \"0..9: \" << r10(rng) << \"\\n\";\n    cout << \"uni:  \" << uni(rng) << \"\\n\";\n    cout << \"coin: \" << coin(rng) << \"\\n\";\n\n    // shuffle (Collections.shuffle jaisa) — in-place 🔥\n    vector<int> l = {1, 2, 3, 4};\n    shuffle(l.begin(), l.end(), rng);\n    cout << \"shuffled: \";\n    for (int x : l) cout << x << \" \";\n    cout << \"\\n\";\n\n    // sample — k items unique (Python random.sample jaisa)\n    // C++17: Fisher-Yates partial karke\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "functools & itertools — Power Tools", "note": "Python ke 2 power modules — Java ka koi exact equivalent nahi par streams + Collections se mile-jhule kaam karte hain. <code>itertools</code> = lazy combinators, <code>functools</code> = function utilities.", "type": "code", "java": "// Java equivalents (manual / streams)\nList<Integer> nums = List.of(1, 2, 3);\n\n// permutations/combinations: koi built-in nahi\n// manually recursion se karna padta\n\n// accumulate (prefix sum) — stream\nint[] pref = new int[3];\nint run = 0;\nfor (int i = 0; i < 3; i++)\n    pref[i] = (run += nums.get(i));\n\n// partial (curry) — manual lambda\njava.util.function.Function<Integer,Integer> add5 =\n    x -> x + 5;", "python": "from itertools import product, permutations, combinations, accumulate, chain, groupby\nimport functools\n\nlist(product([1,2],[3,4]))        # [(1,3),(1,4),(2,3),(2,4)]\nlist(permutations([1,2,3], 2))    # order matter\nlist(combinations([1,2,3], 2))    # order nahi matter\nlist(accumulate([1,2,3,4]))       # prefix sum [1,3,6,10]\nlist(chain([1,2],[3,4]))          # flat combine\n\n# groupby — sorted input pe groups\nfrom itertools import groupby\nfor k, g in groupby(\"aaabbbcc\"):\n    print(k, list(g))\n\n# functools\nfrom functools import partial, reduce, lru_cache\nadd = lambda a, b: a + b\nadd5 = partial(add, 5); add5(3)   # 8\nreduce(lambda a,b: a+b, [1,2,3])  # 6", "extra": "<b>Interview:</b> <code>product</code> = nested loops ka shortcut, <code>permutations</code>/<code>combinations</code> = backtracking ka shortcut (small n), <code>accumulate</code> = prefix sums, <code>groupby</code> = sorted data groups. Backtracking questions (subsets, permutations) mein ye test-case generator bante hain.", "cpp": "#include <iostream>\n#include <vector>\n#include <numeric>\n#include <algorithm>\n#include <functional>\nusing namespace std;\n\nint main() {\n    // product([1,2],[3,4]) — nested loops 🔥\n    cout << \"product: \";\n    for (int a : {1, 2})\n        for (int b : {3, 4})\n            cout << \"(\" << a << \",\" << b << \") \";\n    cout << \"\\n\";\n\n    // permutations — next_permutation 🔥\n    vector<int> p = {1, 2, 3};\n    cout << \"perms: \";\n    sort(p.begin(), p.end());\n    do {\n        cout << p[0] << p[1] << p[2] << \" \";\n    } while (next_permutation(p.begin(), p.end()));\n    cout << \"\\n\";\n\n    // accumulate = prefix sum\n    vector<int> nums = {1, 2, 3, 4};\n    partial_sum(nums.begin(), nums.end(), nums.begin());   // in-place\n    cout << \"prefix: \";\n    for (int x : nums) cout << x << \" \";\n    cout << \"\\n\";\n\n    // partial (curry) = bind 🔥\n    auto add5 = bind(plus<int>(), 5, placeholders::_1);\n    cout << \"add5(3): \" << add5(3) << \"\\n\";       // 8\n\n    // reduce\n    int total = accumulate(nums.begin(), nums.end(), 0, plus<int>());\n    cout << \"total: \" << total << \"\\n\";\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "CSV & Data Files", "note": "CSV = tabular data ka universal format. Python ka <code>csv</code> module built-in hai. Java mein <code>BufferedReader</code> se manual parsing ya external lib (OpenCSV/Apache Commons) — Python zyada clean hai.", "type": "code", "java": "// Java — manual CSV parsing\ntry (BufferedReader br = new BufferedReader(\n        new FileReader(\"data.csv\"))) {\n    String line;\n    while ((line = br.readLine()) != null) {\n        String[] parts = line.split(\",\");\n        System.out.println(parts[0]);\n    }\n} catch (IOException e) { e.printStackTrace(); }", "python": "import csv\n\n# read\nwith open(\"data.csv\") as f:\n    for row in csv.reader(f):      # list per row\n        print(row[0])\n\n# dict reader — header se keys\nwith open(\"data.csv\") as f:\n    for row in csv.DictReader(f):\n        print(row[\"name\"])\n\n# write\nwith open(\"out.csv\", \"w\", newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"name\", \"age\"])\n    w.writerow([\"Vinay\", 20])\n\n# DictWriter\nwith open(\"out.csv\", \"w\", newline=\"\") as f:\n    w = csv.DictWriter(f, fieldnames=[\"name\", \"age\"])\n    w.writeheader()\n    w.writerow({\"name\": \"Vinay\", \"age\": 20})", "extra": "<b>Interview:</b> <code>csv.reader</code> = list rows, <code>DictReader</code> = dict rows (header = keys). Comma-ke-andar-comma handle <code>csv</code> module khud karta hai — manual <code>split(\",\")</code> bugs deta hai. Java <code>split(\",\")</code> quoted fields pe fail hota hai — OpenCSV use karo.", "cpp": "#include <iostream>\n#include <fstream>\n#include <sstream>\n#include <string>\nusing namespace std;\n\nint main() {\n    ofstream(\"data.csv\") << \"name,age\\nVinay,20\\nRahul,25\\n\";\n\n    // read — row by row, split by comma 🔥\n    ifstream f(\"data.csv\");\n    string line;\n    bool header = true;\n    while (getline(f, line)) {\n        if (header) { header = false; continue; }   // DictReader: header = keys\n        stringstream ss(line);\n        string name, age;\n        getline(ss, name, ',');\n        getline(ss, age, ',');\n        cout << \"row: \" << name << \" -> \" << age << \"\\n\";\n    }\n\n    // write (csv.writer jaisa)\n    ofstream out(\"out.csv\");\n    out << \"name,age\\nVinay,20\\n\";\n    out.close();\n\n    // note: comma-ke-andar-comma handle line.split(\",\") nahi karta —\n    // real CSV library (csv.hpp) needed\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "APIs & HTTP — requests", "note": "Backend/API work ka base — HTTP methods, status codes, JSON. Python ka <b>requests</b> module; Java ka <b>HttpClient</b>.", "type": "code", "java": "// Java 11+ HttpClient\nimport java.net.http.*;\nimport java.net.URI;\n\nHttpClient client = HttpClient.newHttpClient();\nHttpRequest req = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://api.example.com/users\"))\n    .GET().build();\n\nHttpResponse<String> res =\n    client.send(req, HttpResponse.BodyHandlers.ofString());\nSystem.out.println(res.statusCode());  // 200, 404...\nSystem.out.println(res.body());\n\n// POST with JSON\n// .POST(BodyPublishers.ofString(json))\n// + .header(\"Content-Type\", \"application/json\")", "python": "import requests\n\n# GET\nres = requests.get(\"https://api.example.com/users\")\nprint(res.status_code)     # 200, 404, 500...\ndata = res.json()          # response -> dict 🔥\n\n# POST (naya data banao)\nres = requests.post(\"https://api.example.com/users\",\n                    json={\"name\": \"Vinay\"})\n\n# PUT (update) / DELETE\nrequests.put(url, json={\"name\": \"New\"})\nrequests.delete(url + \"/1\")\n\n# params\nrequests.get(url, params={\"page\": 2, \"limit\": 10})", "extra": "<b>HTTP methods:</b> GET = read, POST = create, PUT = update, DELETE = delete. <b>Status codes:</b> 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 404 Not Found, 500 Server Error. <code>res.json()</code> se API response directly dict/dict-list ban jata hai.", "cpp": "// C++17 mein koi built-in HTTP/JSON lib nahi hai —\n// libcurl / cpp-httplib / CPR use karo (Python requests, Java HttpClient jaisa)\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // HTTP methods yaad rakho:\n    cout << \"GET = read\\n\";\n    cout << \"POST = create\\n\";\n    cout << \"PUT = update\\n\";\n    cout << \"DELETE = delete\\n\";\n\n    // Status codes:\n    cout << \"200 OK | 201 Created | 400 Bad Request\\n\";\n    cout << \"401 Unauthorized | 404 Not Found | 500 Server Error\\n\";\n\n    // Real code (cpp-httplib):\n    // httplib::Client cli(\"https://api.example.com\");\n    // auto res = cli.Get(\"/users\");       // statusCode/res.body\n    // cli.Post(\"/users\", jsonBody, \"application/json\");\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Async Python — asyncio", "note": "I/O-bound tasks (network, file) ko bina block kiye chalana. Python mein <b>async/await</b>; Java mein <b>CompletableFuture</b>. Placement ke liye basics enough.", "type": "code", "java": "// Java async: CompletableFuture\nCompletableFuture.supplyAsync(() -> {\n    return fetchData();       // background thread pe\n}).thenAccept(data -> {\n    System.out.println(data); // result milte hi\n});\n\n// ya ExecutorService (thread pool)\nExecutorService pool = Executors.newFixedThreadPool(4);\npool.submit(() -> System.out.println(\"async task\"));", "python": "import asyncio\n\nasync def fetch_data(url):\n    await asyncio.sleep(1)   # I/O wait (non-blocking)\n    return f\"data from {url}\"\n\nasync def main():\n    # do tasks PARALLEL mein 🔥\n    r1, r2 = await asyncio.gather(\n        fetch_data(\"api/a\"),\n        fetch_data(\"api/b\")\n    )\n    print(r1, r2)\n\nasyncio.run(main())          # entry point\n\n# real world: aiohttp / httpx for async HTTP", "extra": "<b>async def</b> = async function, <b>await</b> = result ka wait, <b>asyncio.gather()</b> = multiple tasks ek saath. Ye CPU-heavy ke liye nahi hai (woh multiprocessing) — I/O-bound ke liye hai. Java mein <code>CompletableFuture</code> similar kaam karta hai.", "cpp": "#include <iostream>\n#include <future>\n#include <thread>\n#include <chrono>\n#include <string>\nusing namespace std;\n\nstring fetchData(const string& url) {\n    this_thread::sleep_for(chrono::milliseconds(100));   // I/O wait (non-blocking)\n    return \"data from \" + url;\n}\n\nint main() {\n    // std::async = CompletableFuture jaisa 🔥 (background pe chalti hai)\n    future<string> f1 = async(launch::async, [] { return fetchData(\"api/a\"); });\n    future<string> f2 = async(launch::async, [] { return fetchData(\"api/b\"); });\n\n    // gather jaisa — dono tasks PARALLEL, result collect karo\n    string r1 = f1.get();\n    string r2 = f2.get();\n    cout << r1 << \", \" << r2 << \"\\n\";\n\n    // ExecutorService (thread pool) → std::async + launch::async hi kaafi\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Sawaal 17 — Python Extras ke Questions", "note": "Comprehensions, generators, decorators, scope test karo.", "type": "quiz", "questions": [{"q": "Dict comprehension ka syntax?", "opts": ["<code>{x for x in arr}</code>", "<code>{k: v for ...}</code>", "<code>[k: v for ...]</code>", "<code>(k: v for ...)</code>"], "ans": 1, "expl": "<code>{k: v for x in iterable}</code> dict banata hai. <code>{expr for x in ...}</code> set banata. <code>[...]</code> list. Colon (:) dict ka sign hai."}, {"q": "<code>def f(*args):</code> — args kya hota hai?", "opts": ["List", "Dict", "Tuple", "Set"], "ans": 2, "expl": "*args saare positional arguments ko <b>tuple</b> mein collect karta hai. **kwargs ko <b>dict</b> milta hai."}, {"q": "Generator function mein return ke bajaye kaunsa keyword?", "opts": ["<code>next</code>", "<code>yield</code>", "<code>stop</code>", "<code>emit</code>"], "ans": 1, "expl": "<code>yield</code> value ek-ek karke deta hai aur function suspend ho jaata hai — memory efficient (lazy)."}, {"q": "<code>with open(\"f.txt\") as f:</code> ka kya faida?", "opts": ["Fast hai", "Auto-close hota hai", "Compress karta hai", "Read-only hai"], "ans": 1, "expl": "Context manager file ko automatically close karta hai — bina with ke try/finally mein close() manually karna padta."}, {"q": "Bina <code>global</code> keyword ke function ke andar <code>x = 20</code> likhne se?", "opts": ["Global x badal jaata", "Naya local x banta hai", "Error", "Nothing"], "ans": 1, "expl": "Classic trap! Assignment hamesha local scope mein naya variable banati hai. Global modify karna ho toh <code>global x</code> pehle likho."}, {"q": "<code>@lru_cache(None)</code> kis DSA pattern ka shortcut hai?", "opts": ["Binary search", "Memoization (DP)", "Two pointer", "Backtracking"], "ans": 1, "expl": "Ye decorator function results cache karta hai — recursion ko exponential se polynomial banata hai. DP top-down ka one-liner."}]}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q1 · Decorator kaise kaam karta hai?", "diff": "I", "note": "Decorator kya hota hai, @ symbol se kya hota hai — ek example se samjhao.", "answer": "<b>Decorator</b> = ek function jo dusre function ko wrap karke behavior add karta hai. <code>@mydecorator</code> bas shorthand hai:\n<pre><code>@timer\ndef fetch(): ...\n\n# equivalent:\nfetch = timer(fetch)</code></pre>\nExample:\n<pre><code>def timer(fn):\n    def wrapper(*args, **kwargs):\n        t = time.time()\n        r = fn(*args, **kwargs)\n        print(\"took\", time.time()-t)\n        return r\n    return wrapper</code></pre>\n<b>Famous built-ins:</b> <code>@lru_cache</code> (memoization), <code>@staticmethod</code>, <code>@property</code>, <code>@classmethod</code>.\n<br><br>Java mein equivalent = <b>annotations</b> (@Override, @FunctionalInterface) — par unka behavior framework/compiler decide karta hai, Python jaise function-wrap nahi."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q2 · Generator vs Iterator vs List?", "diff": "I", "note": "Generator, iterator aur list mein fark — memory pe kya asar hota hai?", "answer": "<b>Iterator</b> = <code>__iter__()</code> + <code>__next__()</code> wala object. <code>list</code>, <code>set</code>, <code>dict</code> sab iterable hain.\n<br><b>Generator</b> = <code>yield</code> wala function. Lazy — ek-ek value pe demand pe banata hai, saari ek saath memory mein nahi.\n<pre><code>def fib():\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a+b</code></pre>\n<ul>\n<li><b>List:</b> saara data memory mein — fast random access, par bada data = heavy.</li>\n<li><b>Generator:</b> ek value at a time — memory-efficient, par sirf forward, ek baar.</li>\n<li><b>Iterators (DSA):</b> stream processing, large files, infinite sequences.</li>\n</ul>\nJava mein generator nahi, par <b>Stream API lazy</b> hai aur iterator pattern same concept deta hai."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q3 · GIL kya hai — threads ka fark?", "diff": "I", "note": "GIL ka asar Python threading pe kya hota hai, multiprocessing kab use karein?", "answer": "<b>GIL</b> (Global Interpreter Lock) = ek time pe ek hi thread Python bytecode execute kar sakta hai. Isliye:\n<ul>\n<li><b>CPU-bound</b> tasks (loops, calculations) — threads se koi speedup NAHI. Use <b>multiprocessing</b> (Process pool).</li>\n<li><b>I/O-bound</b> tasks (network, files, sleep) — threads useful hain, kyunki I/O wait ke time lock release ho jata hai. Use <b>threading</b> ya asyncio.</li>\n</ul>\nJava/GIL nahi — multiple cores pe threads truly parallel. Python 3.13+ optional free-threaded mode aaya hai.\n<br><br><b>Global variables + threads</b> = race condition — <code>threading.Lock()</code> se protect karo (Java synchronized jaisa)."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q4 · list vs tuple — kab kya use karein?", "diff": "I", "note": "List aur tuple mein fundamental fark kya hai?", "answer": "<b>Tuple</b> = <b>immutable</b> (bana ke change nahi kar sakte), hashable (dict key ban sakta hai). Fixed, logical grouping ke liye — e.g. coordinate <code>(x, y)</code>, function se multiple returns.\n<br><b>List</b> = <b>mutable</b> — append/pop/sort sab hota hai. Dynamic collection ke liye.\n<br><br>Implementation: tuple slightly lighter + faster (fixed size, no overalloc).\n<br><br>DSA use: tuple = immutable key in hashmap (e.g. DP states, graph edges). Java mein immutable key ke liye <b>record</b> ya custom class (equals+hashCode) chahiye — Python ki tuple yahan superpower hai.\n<br><br>Note: <code>hash((1,[2,3]))</code> ❌ error — nested mutable list tuple ko unhashable banata hai."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q5 · Shallow vs Deep Copy?", "diff": "I", "note": "copy.copy() aur copy.deepcopy() mein fark — DSA mein kab zyada problem hoti hai?", "answer": "<b>Shallow copy</b> (<code>copy.copy</code>) = naya outer container, par nested objects WAHI references. Inner change outer copy mein bhi dikhta hai.\n<pre><code>a = [[1,2],[3,4]]\nb = a.copy()          # shallow\nb[0][0] = 99          # a[0][0] bhi 99 ho jayega!❌</code></pre>\n<b>Deep copy</b> (<code>copy.deepcopy</code>) = har nested level naya object — poora independent.\n<br><br><b>DSA bug source:</b> backtracking/subset solutions mein list ko result mein append karte time:\n<pre><code>res.append(path[:])     # ✅ copy\nres.append(path)        # ❌ wahi reference — baad mein mutate ho jayega</code></pre>\nJava: <code>clone()</code> shallow, <code>copyOf</code> / serialization deep. Matrix/list problems mein <code>deepcopy</code> ya manual copy yahi pattern."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q6 · MRO & Multiple Inheritance?", "diff": "I", "note": "Multiple inheritance mein Python kiska method call karta hai — MRO kaise decide hota hai?", "answer": "<b>MRO</b> (Method Resolution Order) = C3 linearization algorithm se decide hota hai. <code>ClassName.__mro__</code> se dekh sakte ho.\n<pre><code>class A: ...\nclass B(A): ...\nclass C(A): ...\nclass D(B, C): ...   # D -> B -> C -> A -> object</code></pre>\n<b>Diamond problem</b> — A, B, C sab define karein toh D ko konsa milega? C3 algorithm ensure karta hai: left-to-right, parent baad mein, ek baar hi.\n<br><br>Python DSA mein zyada matter nahi karta, par <b>dataclasses + inheritance</b> aur custom classes mein order samajhna useful hai.\n<br><br>Java: single inheritance + interface default methods — diamond conflict pe explicit <code>super</code>/interface choice."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q7 · with statement / context manager kya karta hai?", "diff": "I", "note": "with open(...) ka kya matlab hai, and context manager kaise banta hai?", "answer": "<b>with</b> = context manager — enter/exit ko auto-handle karta hai, resource close guaranteed.\n<pre><code>with open(\"f.txt\") as f:\n    data = f.read()\n# yahan tak pauncho toh file close ho chuki hai ✓</code></pre>\nJava equivalent = <b>try-with-resources</b>.\n<br><br>Apna context manager:\n<pre><code>class Timer:\n    def __enter__(self):\n        self.t = time.time(); return self\n    def __exit__(self, *exc):\n        print(\"took\", time.time()-self.t)\n        return False   # False = exception ko propagate do\n\nwith Timer():\n    expensive_thing()</code></pre>\nYa decorator se: <code>@contextmanager</code> + <code>yield</code>.\n<br><br>DSA use: file/DB/socket leaks se bachne ke liye — file mein 1M lines read karo toh lazy + with best."}, {"type": "qa", "cat": "17. Advanced Python", "title": "Interview Q8 · *args / **kwargs kab use karein?", "diff": "I", "note": "*args aur **kwargs kya hain, aur function signature mein kya fark padta hai?", "answer": "<b>*args</b> = saare extra positional arguments ek tuple mein collect karte hain.\n<br><b>**kwargs</b> = saare extra keyword arguments ek dict mein.\n<pre><code>def f(a, *args, b=10, **kwargs): ...</code></pre>\n<ul>\n<li>Jaise DSA helper functions mein variable args: <code>min(a, b, c, d)</code></li>\n<li>Wrapper/decorator mein pass-through: <code>def wrapper(*args, **kwargs)</code></li>\n<li>Unpacking: <code>nums = [1,2,3]; foo(*nums)</code></li>\n</ul>\nJava equivalent = <b>varargs</b> <code>int... nums</code> (positional only). Keyword arguments ka equivalent nahi.\n<br><br>Java ke <code>min(int... a)</code> vs Python <code>min(*a)</code> — same concept, Python mein kwargs ka extra power."}, {"cat": "17. Advanced Python", "title": "Exception Handling — Python Detail", "note": "Python mein exception handling same concept hai Java se, lekin syntax alag hai. <code>except</code> blocks multiple ho sakte hain, <code>raise</code> se khud exception throw karte hain, aur <code>finally</code> hamesha chalega.", "type": "code", "java": "// Java: try-catch-finally + checked exceptions\ntry {\n    int x = Integer.parseInt(\"abc\");\n} catch (NumberFormatException e) {\n    System.out.println(\"Invalid number\");\n} catch (Exception e) {\n    System.out.println(\"General error\");\n} finally {\n    System.out.println(\"Always runs\");\n}\n\n// custom exception\nclass MyException extends Exception {\n    MyException(String msg) { super(msg); }\n}\nthrow new MyException(\"error\");", "python": "# Python: try-except-else-finally (no checked exceptions)\ntry:\n    x = int(\"abc\")\nexcept ValueError as e:\n    print(f\"Invalid: {e}\")\nexcept Exception as e:\n    print(f\"General: {e}\")\nelse:\n    print(\"No error!\")       # runs only if NO exception\nfinally:\n    print(\"Always runs\")\n\n# raise = throw\nraise ValueError(\"kuch galat hai\")\n\n# custom exception\nclass MyError(Exception):\n    pass\nraise MyError(\"custom error\")", "extra": "<b>Key differences:</b> (1) Python mein <b>checked exceptions nahi hain</b> — koi bhi exception kabhi bhi aa sakta hai. (2) <code>else</code> block sirf tab chalta hai jab koi exception na aaye — useful for 'success' code. (3) <code>except Exception as e</code> mein <code>as e</code> se error message milta hai. (4) <code>raise</code> = Java ka <code>throw</code>.", "cpp": "#include <iostream>\n#include <string>\n#include <stdexcept>\nusing namespace std;\n\n// custom exception (Python class MyError(Exception) jaisa)\nclass MyError : public runtime_error {\npublic:\n    MyError(const string& msg) : runtime_error(msg) {}\n};\n\nint main() {\n    try {\n        stoi(\"abc\");                       // throws invalid_argument\n    } catch (const invalid_argument& e) {\n        cout << \"Invalid: \" << e.what() << \"\\n\";\n    } catch (const exception& e) {\n        cout << \"General: \" << e.what() << \"\\n\";\n    }\n\n    // Python ka else block = try ke success path (no exception hua)\n    bool ok = false;\n    try {\n        if (stoi(\"10\") > 0) ok = true;\n    } catch (...) {}\n    if (ok) cout << \"No error!\\n\";         // Python else jaisa 🔥\n\n    // raise = throw\n    try {\n        throw MyError(\"custom error\");\n    } catch (const MyError& e) {\n        cout << \"caught: \" << e.what() << \"\\n\";\n    }\n\n    // Python finally = C++ RAII (destructor hamesha run hota) —\n    // isliye C++ mein finally keyword nahi hai\n    return 0;\n}"}, {"cat": "17. Advanced Python", "title": "Python Built-in Functions — Master Table", "note": "Python ke saare important built-in functions ek jagah — interview mein sirf <code>len()</code>, <code>sorted()</code>, <code>map()</code> se kaam nahi chalega.", "type": "table", "headers": ["Function", "Kaam", "Example"], "rows": [["<code>len(x)</code>", "Length", "<code>len([1,2,3])</code> → 3"], ["<code>type(x)</code>", "Type check", "<code>type(5)</code> → &lt;class 'int'&gt;"], ["<code>isinstance(x,T)</code>", "Type check (recommended)", "<code>isinstance(5, int)</code> → True"], ["<code>id(x)</code>", "Memory address", "<code>id(a) == id(b)</code> → same object?"], ["<code>abs(x)</code>", "Absolute value", "<code>abs(-5)</code> → 5"], ["<code>max(x)</code> / <code>min(x)</code>", "Max/Min", "<code>max([3,1,4])</code> → 4"], ["<code>sum(x)</code>", "Sum", "<code>sum([1,2,3])</code> → 6"], ["<code>sorted(x)</code>", "New sorted list", "<code>sorted([3,1])</code> → [1,3]"], ["<code>enumerate(x)</code>", "Index + value", "<code>list(enumerate('abc'))</code> → [(0,'a'),...]"], ["<code>zip(a,b)</code>", "Pair elements", "<code>list(zip([1,2],[3,4]))</code> → [(1,3),(2,4)]"], ["<code>any(x)</code> / <code>all(x)</code>", "Bool check", "<code>any([0,0,1])</code> → True"], ["<code>reversed(x)</code>", "Reverse iterator", "<code>list(reversed([1,2]))</code> → [2,1]"], ["<code>input()</code>", "User input", "Returns string"], ["<code>print()</code>", "Output", "<code>print(a, b, sep=',')</code>"], ["<code>range()</code>", "Number sequence", "<code>range(1,10,2)</code> → 1,3,5,7,9"], ["<code>map(fn,x)</code>", "Apply function", "<code>list(map(str,[1,2]))</code> → ['1','2']"], ["<code>filter(fn,x)</code>", "Filter items", "<code>list(filter(None,[0,1]))</code> → [1]"], ["<code>chr() / ord()</code>", "Char ↔ ASCII", "<code>chr(65)</code> → 'A', <code>ord('A')</code> → 65"], ["<code>divmod(a,b)</code>", "Quotient + remainder", "<code>divmod(7,2)</code> → (3,1)"], ["<code>globals() / locals()</code>", "Scope variables", "Debugging mein useful"]]}, {"cat": "12. Collections", "title": "Heap Deep Dive — Kth Largest & Top K", "note": "Heap DSA mein sabse zyada use hota hai — Kth largest, Top K, Median finding, Merge K sorted lists. Java <code>PriorityQueue</code> aur Python <code>heapq</code> dono min-heap by default.", "type": "code", "java": "// Kth largest element\nPriorityQueue<Integer> minH = new PriorityQueue<>();\nfor (int x : arr) {\n    minH.offer(x);\n    if (minH.size() > k) minH.poll();\n}\nint kthLargest = minH.peek();  // O(n log k)\n\n// Max Heap — Collections.reverseOrder()\nPriorityQueue<Integer> maxH =\n    new PriorityQueue<>(Collections.reverseOrder());\nmaxH.offer(3); maxH.offer(1); maxH.offer(5);\nmaxH.peek();  // 5 (largest)\n\n// Kth smallest — use max heap\nPriorityQueue<Integer> kSmall =\n    new PriorityQueue<>(Collections.reverseOrder());", "python": "import heapq\n\n# Kth largest element\nmin_h = []\nfor x in arr:\n    heapq.heappush(min_h, x)\n    if len(min_h) > k:\n        heapq.heappop(min_h)\nkth_largest = min_h[0]  # O(n log k)\n\n# Max heap trick: negate values\nmax_h = []\nheapq.heappush(max_h, -3)\nheapq.heappush(max_h, -1)\nheapq.heappush(max_h, -5)\nlargest = -max_h[0]     # 5\n\n# Kth smallest — use min heap directly\nk_small = []            # same as Kth largest logic\n\n# Top K frequent — use Counter + heap\nfrom collections import Counter\ncnt = Counter(arr)\ntop_k = heapq.nlargest(k, cnt.items(), key=lambda x: x[1])", "extra": "<b>Pattern yaad rakho:</b> Kth largest → min heap of size k. Kth smallest → max heap of size k (ya negate values in Python). <code>heapq.nlargest(k, arr)</code> = shortcut. Merge K sorted → heap mein sab lists ke first elements daalo, smallest nikalte jao. Time: O(n log k).", "cpp": "#include <iostream>\n#include <queue>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {3, 1, 5, 2, 4};\n    int k = 3;\n\n    // Kth largest — MIN heap of size k 🔥, O(n log k)\n    priority_queue<int, vector<int>, greater<int>> minH;\n    for (int x : arr) {\n        minH.push(x);\n        if (minH.size() > static_cast<size_t>(k)) minH.pop();\n    }\n    cout << \"kth largest (\" << k << \"): \" << minH.top() << \"\\n\";  // 3\n\n    // Max heap — default priority_queue (Collections.reverseOrder jaisa)\n    priority_queue<int> maxH;\n    maxH.push(3); maxH.push(1); maxH.push(5);\n    cout << \"max: \" << maxH.top() << \"\\n\";                 // 5\n\n    // Kth smallest — MAX heap of size k\n    priority_queue<int> kSmall;\n    for (int x : arr) {\n        kSmall.push(x);\n        if (kSmall.size() > static_cast<size_t>(k)) kSmall.pop();\n    }\n    cout << \"kth smallest (\" << k << \"): \" << kSmall.top() << \"\\n\";  // 3\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Recursion Patterns — Subsets, Permutations, Combinations", "note": "Interview mein recursion ke 3 classic patterns: subsets (include/exclude), permutations (swap), combinations (pick/skip). In teeno ko yaad karo — 80% backtracking problems isi se bante hain.", "type": "code", "java": "// Subsets — har element include ya exclude\nvoid subsets(int[] arr, int i, List<Integer> cur) {\n    if (i == arr.length) {\n        System.out.println(cur);\n        return;\n    }\n    cur.add(arr[i]);            // include\n    subsets(arr, i + 1, cur);\n    cur.remove(cur.size()-1);   // exclude\n    subsets(arr, i + 1, cur);\n}\n\n// Permutations — har position pe ek element fix\nvoid permute(int[] arr, int l) {\n    if (l == arr.length - 1) {\n        System.out.println(Arrays.toString(arr));\n        return;\n    }\n    for (int i = l; i < arr.length; i++) {\n        int temp = arr[l]; arr[l] = arr[i]; arr[i] = temp;\n        permute(arr, l + 1);\n        temp = arr[l]; arr[l] = arr[i]; arr[i] = temp; // undo\n    }\n}\n\n// Combinations — nCr — pick k from n\nvoid comb(int[] arr, int i, int k, List<Integer> cur) {\n    if (k == 0) { System.out.println(cur); return; }\n    if (i == arr.length) return;\n    cur.add(arr[i]);\n    comb(arr, i+1, k-1, cur);\n    cur.remove(cur.size()-1);\n    comb(arr, i+1, k, cur);\n}", "python": "# Subsets — har element include ya exclude\ndef subsets(arr, i=0, cur=[]):\n    if i == len(arr):\n        print(cur)\n        return\n    subsets(arr, i+1, cur + [arr[i]])  # include\n    subsets(arr, i+1, cur)             # exclude\n\n# Permutations — har position pe ek element fix\ndef permute(arr, l=0):\n    if l == len(arr) - 1:\n        print(arr)\n        return\n    for i in range(l, len(arr)):\n        arr[l], arr[i] = arr[i], arr[l]   # swap\n        permute(arr, l + 1)\n        arr[l], arr[i] = arr[i], arr[l]   # undo\n\n# Combinations — nCr — pick k from n\ndef comb(arr, i=0, k=0, cur=[]):\n    if k == len(cur):\n        print(cur)\n        return\n    if i == len(arr):\n        return\n    comb(arr, i+1, k, cur + [arr[i]])  # pick\n    comb(arr, i+1, k, cur)             # skip\n\n# Python shortcut: itertools\nfrom itertools import combinations, permutations\nlist(combinations([1,2,3], 2))   # [(1,2),(1,3),(2,3)]\nlist(permutations([1,2,3], 2))  # [(1,2),(1,3),...]", "extra": "<b>3 patterns yaad karo:</b> (1) <b>Subsets</b> = 2ⁿ outcomes — har element ke liye include/exclude ka choice. (2) <b>Permutations</b> = n! outcomes — har position pe ek element fix karo by swapping. (3) <b>Combinations</b> = nCr — pick/skip approach. Interview mein ye patterns directly apply hote hain — N-Queens, Sudoku, Rat in Maze sab subsets/permutations ke variations hain.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// Subsets — har element include ya exclude (2^n outcomes)\nvoid subsets(const vector<int>& arr, int i, vector<int> cur) {\n    if (i == static_cast<int>(arr.size())) {\n        for (int x : cur) cout << x << \" \";\n        cout << \"| \";\n        return;\n    }\n    cur.push_back(arr[i]);                 // include\n    subsets(arr, i + 1, cur);\n    cur.pop_back();                        // exclude\n    subsets(arr, i + 1, cur);\n}\n\n// Permutations — har position pe ek element fix by swap (n!)\nvoid permute(vector<int> arr, int l) {\n    if (l == static_cast<int>(arr.size()) - 1) {\n        cout << \"(\";\n        for (int x : arr) cout << x;\n        cout << \") \";\n        return;\n    }\n    for (int i = l; i < static_cast<int>(arr.size()); i++) {\n        swap(arr[l], arr[i]);              // fix\n        permute(arr, l + 1);\n        swap(arr[l], arr[i]);              // undo 🔥\n    }\n}\n\n// Combinations — nCr — pick k from n (pick/skip)\nvoid comb(const vector<int>& arr, int i, int k, vector<int> cur) {\n    if (static_cast<int>(cur.size()) == k) {\n        for (int x : cur) cout << x << \" \";\n        cout << \"| \";\n        return;\n    }\n    if (i == static_cast<int>(arr.size())) return;\n    cur.push_back(arr[i]);                 // pick\n    comb(arr, i + 1, k, cur);\n    cur.pop_back();\n    comb(arr, i + 1, k, cur);              // skip\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3};\n    cout << \"subsets:     \";\n    subsets(arr, 0, {});\n    cout << \"\\npermutations: \";\n    permute(arr, 0);\n    cout << \"\\ncombo(2):    \";\n    comb(arr, 0, 2, {});\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "16. Advanced Java", "title": "File Handling — Java & Python", "note": "Java ka file handling verbose hai (BufferedReader/Writer), Python ka simple (<code>open()</code>). DSA mein file handling rarely use hota hai, lekin coding interviews mein aata hai.", "type": "code", "java": "import java.io.*;\nimport java.util.Scanner;\n\n// Reading — BufferedReader (fast)\nBufferedReader br = new BufferedReader(\n    new FileReader(\"file.txt\"));\nString line;\nwhile ((line = br.readLine()) != null) {\n    System.out.println(line);\n}\nbr.close();\n\n// Reading — Scanner\nScanner sc = new Scanner(new File(\"file.txt\"));\nwhile (sc.hasNextLine()) {\n    System.out.println(sc.nextLine());\n}\n\n// Writing — BufferedWriter\nBufferedWriter bw = new BufferedWriter(\n    new FileWriter(\"output.txt\"));\nbw.write(\"Hello World\");\nbw.newLine();\nbw.close();\n\n// try-with-resources (auto close)\ntry (BufferedReader r = new BufferedReader(\n        new FileReader(\"file.txt\"))) {\n    System.out.println(r.readLine());\n}", "python": "# Reading — with auto-closes file\nwith open(\"file.txt\") as f:\n    data = f.read()            # poora file\nwith open(\"file.txt\") as f:\n    lines = f.readlines()      # list of lines\nwith open(\"file.txt\") as f:\n    for line in f:             # memory efficient\n        print(line.strip())\n\n# Writing\nwith open(\"output.txt\", \"w\") as f:\n    f.write(\"Hello World\\n\")\n\n# Append mode\nwith open(\"log.txt\", \"a\") as f:\n    f.write(\"new entry\\n\")\n\n# JSON read/write\nimport json\nwith open(\"data.json\") as f:\n    d = json.load(f)\nwith open(\"data.json\", \"w\") as f:\n    json.dump(d, f, indent=2)\n\n# CSV\nimport csv\nwith open(\"data.csv\") as f:\n    reader = csv.reader(f)\n    for row in reader:\n        print(row)", "extra": "<b>Java vs Python:</b> Java ka <code>try-with-resources</code> auto-close karta hai (Python ka <code>with</code> statement same kaam karta hai). DSA mein <code>Scanner</code> / <code>BufferedReader</code> input lene ke liye use hota hai — <code>Scanner</code> slow hai, <code>BufferedReader</code> fast. Python mein <code>open()</code> + <code>with</code> sabke liye kaafi hai.", "cpp": "#include <iostream>\n#include <fstream>\n#include <sstream>\n#include <string>\nusing namespace std;\n\nint main() {\n    ofstream(\"file.txt\") << \"Hello World\\nLine 2\\n\";   // demo file\n\n    // Reading — ifstream + getline (line by line, memory efficient)\n    {\n        ifstream f(\"file.txt\");\n        string line;\n        while (getline(f, line)) cout << line << \"\\n\";\n    }   // RAII = auto close (Python with jaisa) 🔥\n\n    // Poora file ek string mein\n    {\n        ifstream f(\"file.txt\");\n        stringstream ss;\n        ss << f.rdbuf();\n        cout << \"POORA: \" << ss.str();\n    }\n\n    // Writing\n    {\n        ofstream out(\"output.txt\");\n        out << \"Hello World\\n\";\n    }\n\n    // Append mode\n    {\n        ofstream log(\"log.txt\", ios::app);\n        log << \"new entry\\n\";\n    }\n\n    // Scanner-style input (>> se ints read karo) 🔥\n    ofstream(\"nums.txt\") << \"42 7 99\\n\";\n    ifstream fs(\"nums.txt\");\n    int a, b, c;\n    fs >> a >> b >> c;\n    cout << \"sum: \" << a + b + c << \"\\n\";   // 148\n    return 0;\n}"}, {"cat": "24. Interview & Revision", "title": "Master Table — Sab Kuch Ek Saath", "note": "Poori handbook ka summary — interview ke pehle last-minute revision ke liye.", "type": "table", "headers": ["Java", "Python"], "rows": [["<code>System.out.println(x)</code>", "<code>print(x)</code>"], ["<code>Scanner</code>", "<code>input()</code>"], ["<code>int[]</code> / <code>ArrayList</code>", "<code>list</code>"], ["<code>HashMap</code>", "<code>dict</code>"], ["<code>HashSet</code>", "<code>set</code>"], ["<code>Stack</code>", "<code>list</code> (append/pop)"], ["<code>Queue</code> / <code>Deque</code>", "<code>collections.deque</code>"], ["<code>PriorityQueue</code>", "<code>heapq</code> (min-heap)"], ["<code>Arrays.sort()</code>", "<code>arr.sort()</code> / <code>sorted(arr)</code>"], ["<code>arr.length</code> / <code>s.length()</code>", "<code>len(arr)</code> / <code>len(s)</code>"], ["<code>s.charAt(i)</code>", "<code>s[i]</code>"], ["<code>s.substring(a,b)</code>", "<code>s[a:b]</code>"], ["<code>Integer.parseInt()</code>", "<code>int()</code>"], ["<code>Math.pow()</code>", "<code>**</code>"], ["<code>null</code> / <code>true</code> / <code>false</code>", "<code>None</code> / <code>True</code> / <code>False</code>"], ["<code>this</code>", "<code>self</code>"], ["<code>extends</code>", "<code>(ParentClass)</code>"], ["<code>try/catch</code>", "<code>try/except</code>"], ["<code>int x = 5 / 2</code> → 2", "<code>x = 5 / 2</code> → 2.5, <code>5 // 2</code> → 2"], ["<code>i++</code>", "<code>i += 1</code> (i++ nahi hai)"], ["<code>for (int x : arr)</code>", "<code>for x in arr:</code>"], ["<code>cond ? a : b</code>", "<code>a if cond else b</code>"], ["<code>TreeNode</code> (left/right)", "<code>class TreeNode</code>"], ["<code>PriorityQueue</code> (Dijkstra)", "<code>heapq</code> (distance, node)"], ["<code>Arrays.fill(dp, INF)</code>", "<code>dp = [INF]*n</code>"]]}, {"cat": "24. Interview & Revision", "title": "Final Mock Test — Mixed Questions", "note": "Poori handbook se random questions — exam jaisa. Sab sawalon ke sahi jawab dene ki koshish karo!", "type": "quiz", "questions": [{"q": "<code>s = \"hello\"; print(s[::-1])</code> kya print hoga?", "opts": ["\"olleh\"", "\"hello\"", "\"lleh\"", "Error"], "ans": 0, "expl": "[::-1] reverse slicing → \"olleh\". String, list, tuple — sabpe chalta hai."}, {"q": "Java <code>Arrays.sort(arr, Collections.reverseOrder())</code> ka Python equivalent?", "opts": ["<code>arr.sort()</code>", "<code>arr.sort(reverse=True)</code>", "<code>reversed(arr)</code>", "<code>sort(arr, desc)</code>"], "ans": 1, "expl": "<code>reverse=True</code> parameter descending sort karta hai. <code>reversed()</code> sort nahi, reverse iteration hai."}, {"q": "<code>null</code> ka Python equivalent kya hai?", "opts": ["<code>NULL</code>", "<code>None</code>", "<code>nil</code>", "<code>undefined</code>"], "ans": 1, "expl": "Python <code>None</code> — capital N ke saath. Check: <code>if x is None:</code> (identity) vs <code>x == None</code> (avoid)."}, {"q": "Frequency counting ka Python idiom?", "opts": ["<code>mp.add(x)</code>", "<code>mp[x] = mp.get(x, 0) + 1</code>", "<code>mp[x]++</code>", "<code>mp.push(x)</code>"], "ans": 1, "expl": "<code>mp.get(x, 0) + 1</code> — missing key pe 0 se shuru. Java: <code>put(x, getOrDefault(x,0)+1)</code>. Counter bhi hai: <code>Counter(arr)</code>."}, {"q": "Python mein <code>5 // 2</code> aur Java mein <code>5 / 2</code> ka result?", "opts": ["Dono 2", "2 aur 2.5", "2.5 aur 2", "Dono 2.5"], "ans": 0, "expl": "Python <code>//</code> = 2 (floor division). Java <code>/</code> integer operands pe truncate karke 2 deta hai."}, {"q": "<code>for k, v in mp.items():</code> ka Java equivalent?", "opts": ["<code>for(k, v) : map</code>", "<code>for(Map.Entry e : map.entrySet())</code>", "<code>for v : map.values()</code>", "<code>map.loop(k, v)</code>"], "ans": 1, "expl": "Java mein entrySet() + Map.Entry se key-value dono milte hain. Python ka items() dict ko (key, value) pairs deta hai."}, {"q": "Python sliding window fixed sum mein slide kaise hota hai?", "opts": ["<code>window += arr[r]</code>", "<code>window += arr[i] - arr[i-k]</code>", "<code>window = arr[i]</code>", "<code>window.pop()</code>"], "ans": 1, "expl": "Naya element add, purana hatao: <code>window += arr[i] - arr[i - k]</code>. O(1) slide — naive re-sum O(k) nahi."}, {"q": "Java StringBuilder ka Python equivalent pattern?", "opts": ["String direct", "<code>chars list + \"\".join()</code>", "<code>strbuilder()</code>", "<code>concat_all()</code>"], "ans": 1, "expl": "Loop mein string + karna O(n²) hai. Python: chars list mein append karke <code>\"\".join(chars)</code> — O(n), Java ke StringBuilder jaisa."}]}, {"cat": "24. Interview & Revision", "title": "Roadmap — Apna Learning Flow", "note": "Poore handbook ka flow. Jaise jaise chapters karo, Java-Python dono ka mental model ek saath build hota hai. Last mein Mock Test aur Master Table se revision karo.", "type": "roadmap", "extra": "<b>Tip:</b> Har chapter ke baad Sawaal solve karo. Galat jawab pe explanation padho — wahi asli seekh hai. Interview se pehle Master Table + Mock Test double check karo."}];

/* ============================================================
   RENDER LOGIC
   ============================================================ */
let current = 0;
let score = 0;
const slideEl = document.getElementById('slide');
const drawerList = document.getElementById('drawerList');
const dotsMini = document.getElementById('dotsMini');
const progressFill = document.getElementById('progressFill');
const metaLeft = document.getElementById('metaLeft');
const metaRight = document.getElementById('metaRight');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const scoreVal = document.getElementById('scoreVal');
const scoreTotal = document.getElementById('scoreTotal');

const catList = [...new Set(DATA.filter(d => d.type !== 'home').map(d => d.cat))];
const totalQ = DATA.reduce((s, d) => s + (d.type === 'quiz' ? d.questions.length : 0), 0);
scoreTotal.textContent = totalQ;

/* ---------- Done / progress tracking ---------- */
const doneKey = 'dsa_done_rosetta';
function getDone(){
  try { const v = JSON.parse(localStorage.getItem(doneKey) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function isDone(i){ return getDone().indexOf(i) !== -1; }
function toggleDone(i){
  const d = getDone(); const idx = d.indexOf(i);
  if(idx === -1){ d.push(i); } else { d.splice(idx, 1); }
  try { localStorage.setItem(doneKey, JSON.stringify(d)); } catch(e){}
}

function highlightCode(code){
  var s = esc(code), toks = [], ti = 0;
  function tok(h){ var id='\x01PH'+ti+'\x01'; toks.push([id,h]); ti++; return id; }
  s = s.replace(/(#.*$|\/\/.*$)/gm, function(m){ return tok('<span class="cm">'+m+'</span>'); });
  s = s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, function(m){ return tok('<span class="str">'+m+'</span>'); });
  s = s.replace(/\b(class|def|return|if|elif|else|for|in|while|import|from|try|except|finally|new|static|void|int|double|float|char|boolean|String|long|public|private|self|None|True|False|break|continue|lambda|with|as|pass|extends|super|is)\b/g, function(m){ return tok('<span class="kw">'+m+'</span>'); });
  s = s.replace(/\b(\d+\.?\d*)\b/g, function(m){ return tok('<span class="num">'+m+'</span>'); });
  toks.forEach(function(t){ s = s.split(t[0]).join(t[1]); });
  return s;
}

function buildDrawer(){
  document.getElementById('drawerTitle').textContent = 'Complete index — ' + catList.length + ' chapters';
  let html = '';
  let lastCat = '';
  DATA.forEach((d,i)=>{
    if(d.type === 'home') return;
    if(d.cat !== lastCat){
      html += `<li class="cat">${d.cat}</li>`;
      lastCat = d.cat;
    }
    const quizBadge = d.type === 'quiz' ? '<span class="badge-q">Q</span>' : '';
    html += `<li data-i="${i}"${isDone(i) ? ' class="done"' : ''}><span class="num">${String(i).padStart(2,'0')}</span>${d.title}${quizBadge}</li>`;
  });
  drawerList.innerHTML = html;
  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.addEventListener('click', ()=>{ goTo(parseInt(li.dataset.i)); closeDrawer(); });
  });
}

function buildDotsMini(){
  let dots = '';
  DATA.forEach((d,i)=>{ if(d.type !== 'home') dots += `<span data-i="${i}"></span>`; });
  dotsMini.innerHTML = dots;
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.addEventListener('click', ()=> goTo(parseInt(s.dataset.i)) );
  });
}

function buildHomeHtml(){
  let html = `
    <div class="home-hero">
      <div class="home-mark"><span class="j">JAVA</span> ⇄ <span class="p">PYTHON</span></div>
      <h2>Rosetta DSA Handbook</h2>
      <p class="lead">Java aur Python dono ek saath — DSA topics, code comparison aur practice questions. Neeche topic pe click karo aur seedha wahan chale jaao. <b>← / →</b> keys se navigate karo, <b>☰ Index</b> se koi bhi slide.</p>
      <div class="home-stats">
        <div class="home-stat"><b>${catList.length}</b><span>Chapters</span></div>
        <div class="home-stat"><b>${DATA.length - 1}</b><span>Slides</span></div>
        <div class="home-stat"><b>${totalQ}</b><span>Questions</span></div>
        <div class="home-stat"><b>${getDone().length}</b><span>Done ✓</span></div>
      </div>
    </div>
    <div class="home-chapters">`;
  catList.forEach((c, ci)=>{
    html += `<div class="home-ch">
      <div class="home-ch-head"><span class="n">Ch ${ci+1} / ${catList.length}</span>${c}</div>
      <div class="home-ch-grid">`;
    DATA.forEach((d, i)=>{
      if(d.type === 'home' || d.cat !== c) return;
      const quizCls = d.type === 'quiz' ? ' quiz-t' : '';
      const doneCls = isDone(i) ? ' done' : '';
      const qn = d.type === 'quiz' ? 'Q' : String(i).padStart(2,'0');
      html += `<button class="home-topic${quizCls}${doneCls}" data-i="${i}"><span class="qn">${qn}</span>${d.title}</button>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

function render(){
  const d = DATA[current];

  let bodyHtml = '';
  if(d.type === 'code' || d.type === 'lc'){
    bodyHtml = `
      <div class="rosetta">
        <div class="col java">
          <div class="col-head"><span class="dot j"></span><span>Java</span></div>
          <pre><code>${highlightCode(d.java)}</code></pre>
        </div>
        ${d.cpp ? `
        <div class="spine"><div class="glyph">⇄</div></div>
        <div class="col cpp">
          <div class="col-head"><span class="dot c"></span><span>C++</span></div>
          <pre><code>${highlightCode(d.cpp)}</code></pre>
        </div>` : ''}
        <div class="spine"><div class="glyph">⇄</div></div>
        <div class="col python">
          <div class="col-head"><span class="dot p"></span><span>Python</span></div>
          <pre><code>${highlightCode(d.python)}</code></pre>
        </div>
      </div>`;
  } else if(d.type === 'qa'){
    bodyHtml = `<div class="qa-box">${d.answer}</div>`;
  } else if(d.type === 'table'){
    const headRow = d.headers.map(h=>`<th>${h}</th>`).join('');
    const rows = d.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    bodyHtml = `
      <div class="col wide">
        <table class="method-table">
          <thead><tr>${headRow}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } else if(d.type === 'quiz'){
    bodyHtml = `<div class="quiz-list">${d.questions.map((qq,qi)=>`
      <div class="quiz-box" data-q="${qi}">
        <div class="quiz-q"><span class="qnum">Q${qi+1}</span>${qq.q}</div>
        <div class="quiz-opts">
          ${qq.opts.map((o,oi)=>`<button class="quiz-opt" data-i="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}
        </div>
        <div class="quiz-explain"><span class="ans-tag">Sahi jawab: ${String.fromCharCode(65+qq.ans)}</span>${qq.expl}</div>
      </div>`).join('')}</div>`;
  } else if(d.type === 'roadmap'){
    bodyHtml = `<div class="roadmap">${catList.map((c,i)=>`
      <div class="rm-step">
        <div class="rm-num">${i+1}</div>
        <div class="rm-name">${c}</div>
        <div class="rm-sub">${DATA.filter(x=>x.cat===c).length} slides</div>
      </div>
      ${i < catList.length - 1 ? '<div class="rm-arrow">↓</div>' : ''}`).join('')}</div>`;
  }

  const extraTag = d.type === 'quiz' ? 'Explanation hint' : (d.type === 'lc' ? 'Approach — kaise solve kiya' : (d.type === 'qa' ? 'Aur detail' : 'Note'));
  const extraHtml = d.extra ? `<div class="extra-box"><span class="tag">${extraTag}</span>${d.extra}</div>` : '';

  if(d.type === 'home'){
    slideEl.innerHTML = buildHomeHtml();
  } else {
    const ch = catList.indexOf(d.cat) + 1;
    const badge = d.diff ? `<span class="diff d-${d.diff}">${d.diff === 'H' ? 'HARD' : (d.diff === 'I' ? 'INTERVIEW' : (d.diff === 'E' ? 'EASY' : 'MEDIUM'))}</span>` : '';
    slideEl.innerHTML = `
      <div class="eyebrow"><span class="ch">Ch ${ch}/${catList.length}</span>${d.cat} · ${String(current+1).padStart(2,'0')} / ${String(DATA.length).padStart(2,'0')}</div>
      <h2>${d.title}${badge}</h2>
      <p class="note">${d.note}</p>
      ${bodyHtml}
      ${extraHtml}
      <div class="done-row">
        <button class="done-btn${isDone(current) ? ' is-done' : ''}" data-i="${current}">${isDone(current) ? '✓ DONE — dabao to unmark' : 'Mark Done ✓'}</button>
        <span class="done-count"><b>${getDone().length}</b> / ${DATA.length} done</span>
      </div>
    `;
  }

  progressFill.style.width = ((current+1)/DATA.length*100) + '%';
  metaLeft.textContent = 'SLIDE ' + (current+1);
  metaRight.textContent = '/ ' + DATA.length + ' · ' + getDone().length + ' ✓';
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === DATA.length - 1 ? 'Restart ↺' : 'Next →';

  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.classList.toggle('active', parseInt(li.dataset.i) === current);
    li.classList.toggle('done', isDone(parseInt(li.dataset.i)));
  });
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.i) === current);
  });

  const activeLi = drawerList.querySelector('li.active');
  if(activeLi) activeLi.scrollIntoView({block:'nearest'});

  bindQuiz();
  bindHome();
  bindDone();
  window.scrollTo({top:0, behavior:'smooth'});
}

function bindDone(){
  const btn = slideEl.querySelector('.done-btn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    toggleDone(current);
    render();
  });
}

function bindHome(){
  if(DATA[current].type !== 'home') return;
  slideEl.querySelectorAll('.home-topic').forEach(btn=>{
    btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.i)));
  });
}

function bindQuiz(){
  const d = DATA[current];
  if(d.type !== 'quiz') return;
  slideEl.querySelectorAll('.quiz-box').forEach(box=>{
    const qi = parseInt(box.dataset.q);
    const q = d.questions[qi];
    box.querySelectorAll('.quiz-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const oi = parseInt(btn.dataset.i);
        if(oi === q.ans){
          btn.classList.add('correct');
          box.querySelectorAll('.quiz-opt').forEach(b=>b.disabled = true);
          box.querySelector('.quiz-explain').classList.add('show');
          if(!box.dataset.done){
            box.dataset.done = '1';
            score++;
            scoreVal.textContent = score;
          }
        } else {
          btn.classList.add('wrong');
          btn.disabled = true;
        }
      });
    });
  });
}

function goTo(i){
  current = Math.max(0, Math.min(DATA.length-1, i));
  render();
}

nextBtn.addEventListener('click', ()=>{
  if(current === DATA.length - 1){ goTo(0); }
  else{ goTo(current+1); }
});
prevBtn.addEventListener('click', ()=> goTo(current-1));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
  if(e.key === 'Escape') closeDrawer();
});

const drawerBtn = document.getElementById('drawerBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
drawerBtn.addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawer);

const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', ()=> goTo(0));
document.querySelector('.brand').addEventListener('click', ()=> goTo(0));

buildDrawer();
buildDotsMini();
render();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');

  .lock-box .err{color:#ff6b6b;font-size:12px;min-height:16px;margin-top:8px;}
  .lock-btn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#7c5cff,#e8590c);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  .lock-btn:active{transform:translateY(1px);}
</style>
<div id="lockOv" class="lock-ov">
  <div class="lock-box">
    <h2>DSA Hub</h2>
    <p>Apna PIN daalein</p>
    <input type="password" id="lockPin" autocomplete="off" placeholder="* * * *" maxlength="8">
    <div class="err" id="lockErr"></div>
    <button class="lock-btn" id="lockGo" type="button">Unlock</button>
  </div>
</div>
<script>
(function(){
  var LS="dsaPinUnlock";
  try{ if(localStorage.getItem(LS)==="2005"){return;} }catch(e){}
  var ov=document.getElementById("lockOv"),
      pin=document.getElementById("lockPin"),
      err=document.getElementById("lockErr"),
      go=document.getElementById("lockGo");
  var submit=function(){
    if(pin.value==="2005"){
      try{ localStorage.setItem(LS,"2005"); }catch(e){}
      ov.style.display="none";
    } else {
      err.textContent="Galat PIN, dobara try karo";
      pin.value=""; pin.focus();
      setTimeout(function(){ err.textContent=""; },2200);
    }
  };
  go.addEventListener("click",submit);
  pin.addEventListener("keydown",function(e){ if(e.key==="Enter"){ submit(); } });
  pin.focus();
})();
</script>
</body>
</html>
