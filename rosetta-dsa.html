ap size 2\n    priority_queue<pair<int, int>, vector<pair<int, int>>, greater<pair<int, int>>> pq;\n    for (auto& e : freq) {\n        pq.push({e.second, e.first});          // (count, value)\n        if (pq.size() > 2) pq.pop();\n    }\n\n    cout << \"top-2 frequent: \";\n    while (!pq.empty()) { cout << pq.top().second << \" \"; pq.pop(); }\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "18. Utility & Tricks", "title": "Sorting — Full Comparison", "note": "Sorting sabse zyada poocha jaane wala topic hai. Java comparator vs Python key — dono ko ek saath samjho.", "type": "code", "java": "Arrays.sort(arr);                       // ascending\nArrays.sort(arr, Collections.reverseOrder());\n\n// list of pairs: sort by first, then second\nArrays.sort(intervals, (a, b) -> {\n    if (a[0] != b[0]) return a[0] - b[0];\n    return a[1] - b[1];\n});\n// or Integer.compare(a[0], b[0]) to avoid overflow\n\nlist.sort(Comparator.comparingInt(a -> a[0]));", "python": "arr.sort()                          # ascending\narr.sort(reverse=True)             # descending\n\n# sort by first, then second 🔥\nintervals.sort(key=lambda x: (x[0], x[1]))\n\n# sort by second element descending\narr.sort(key=lambda x: x[1], reverse=True)\n\n# sort strings by length\nwords.sort(key=len)\n\n# stable sort (Python guarantee)", "extra": "<b>Key takeaways:</b> Python ka <code>sort</code> <b>stable</b> hai (equal elements ka order preserve) aur <code>key=lambda</code> se custom comparison chhota hota hai. Java mein <code>Integer.compare(a,b)</code> use karo instead of <code>a - b</code> (overflow ka risk). Multi-key sort Python mein tuple: <code>key=lambda x: (x[0], x[1])</code>.", "cpp": "#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <functional>\n#include <string>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {3, 1, 2};\n    sort(arr.begin(), arr.end());                      // ascending\n    cout << \"asc: \"; for (int x : arr) cout << x << \" \"; cout << \"\\n\";   // 1 2 3\n\n    sort(arr.begin(), arr.end(), greater<int>());      // descending\n    cout << \"desc: \"; for (int x : arr) cout << x << \" \"; cout << \"\\n\";  // 3 2 1\n\n    // sort by first, then second (multi-key)\n    vector<vector<int>> intervals = {{3, 1}, {1, 2}, {1, 1}};\n    sort(intervals.begin(), intervals.end(), [](const vector<int>& a, const vector<int>& b) {\n        if (a[0] != b[0]) return a[0] < b[0];\n        return a[1] < b[1];\n    });\n    cout << \"multi: \";\n    for (auto& iv : intervals) cout << iv[0] << \",\" << iv[1] << \" \";\n    cout << \"\\n\";   // 1,1 1,2 3,1\n\n    // sort strings by length\n    vector<string> words = {\"xyz\", \"a\", \"abcde\"};\n    sort(words.begin(), words.end(), [](const string& a, const string& b) {\n        return a.size() < b.size();\n    });\n    cout << \"len: \"; for (auto& w : words) cout << w << \" \"; cout << \"\\n\";\n\n    // stable sort equal order preserve karta hai\n    stable_sort(arr.begin(), arr.end());\n    return 0;\n}"}, {"cat": "18. Utility & Tricks", "title": "Sawaal 8 — Utility ke Questions", "note": "Math, Counter, sorting test karo.", "type": "quiz", "questions": [{"q": "Python mein power operator kaunsa hai?", "opts": ["<code>Math.pow</code>", "<code>**</code>", "<code>^</code>", "<code>pow2()</code>"], "ans": 1, "expl": "<code>2 ** 3</code> = 8. <code>^</code> Python mein XOR hai — pow nahi! Java mein <code>Math.pow(a,b)</code> double return karta."}, {"q": "<code>Counter(arr).most_common(2)</code> kya return karta hai?", "opts": ["2 sabse kam frequent", "2 sabse zyada frequent elements", "Sab elements", "Sorted list"], "ans": 1, "expl": "most_common(k) = top k frequent elements (frequency ke sath pairs mein). Ye top-k pattern Python ka sabse bada shortcut hai."}, {"q": "<code>defaultdict(int)</code> mein missing key access karo toh?", "opts": ["Error", "None", "0", "-1"], "ans": 2, "expl": "defaultdict missing key pe factory function call karta hai — int() = 0. Isliye <code>dd[x] += 1</code> bina check ke chalta hai."}, {"q": "<code>intervals.sort(key=lambda x: (x[0], x[1]))</code> kya karta hai?", "opts": ["Sirf first se sort", "Pehle first, phir second se sort", "Descending sort", "Kuch nahi"], "ans": 1, "expl": "Tuple key se multi-level sort hota hai — pehle x[0], tie pe x[1]. Java mein iske liye nested comparator logic likhni padti."}, {"q": "Java <code>Math.abs(x)</code> ka Python equivalent?", "opts": ["<code>math.abs(x)</code>", "<code>abs(x)</code>", "<code>x.abs()</code>", "<code>positive(x)</code>"], "ans": 1, "expl": "<code>abs()</code> Python built-in hai — import bhi nahi chahiye. max/min bhi built-in hain."}, {"q": "Python mein GCD nikalne ka built-in?", "opts": ["<code>math.gcd(a,b)</code>", "<code>gcd(a,b)</code> built-in", "<code>a.gcd(b)</code>", "<code>Math.gcd(a,b)</code>"], "ans": 0, "expl": "<code>math.gcd(a,b)</code> — import math karke. Java mein <code>BigInteger</code> ka gcd() hai, koi native math gcd nahi."}]}, {"cat": "20. DSA Introduction", "title": "DSA Kya Hai? — Data Structures & Algorithms", "note": "DSA = programming ki backbone. Data Structures = data ko organize kaise karein. Algorithms = problem solve kaise karein efficiently.", "type": "table", "headers": ["Term", "Kya Hai?", "Real Life Example"], "rows": [["Data Structure", "Data ko organize karne ka tarika", "Almirah mein kapde fold karke rakhna"], ["Algorithm", "Problem solve karne ka step-by-step tarika", "Recipe for cooking"], ["Time Complexity", "Kitna time lagega", "1 km walk = 15 min"], ["Space Complexity", "Kitni memory lagegi", "Kitne kapde rakh sakte ho"], ["Optimization", "Best solution dhundhna", "Sabse kam time mein pahunchna"]], "extra": "<b>Why DSA?</b> Without DSA: code chal jayega but slow. With DSA: code fast, efficient, interview clear. 1 million records pe linear search = 1 second. Binary search = 0.001 seconds. Fark samjho."}, {"cat": "20. DSA Introduction", "title": "Data Structures — Kaun Si Kab Use Karein?", "note": "Ye table yaad rakhna — interview mein ye poochte hain. Kaun si data structure kis problem ke liye best hai.", "type": "table", "headers": ["Data Structure", "Use Case", "Insert", "Search", "Delete", "Python", "Java"], "rows": [["Array", "Fixed size, index-based", "O(1)", "O(1) index", "O(n)", "list", "Array"], ["Dynamic Array", "Variable size list", "O(1)*", "O(n)", "O(n)", "list", "ArrayList"], ["Linked List", "Frequent insert/delete", "O(1)*", "O(n)", "O(1)*", "collections.deque", "LinkedList"], ["Stack", "LIFO — undo, brackets", "O(1)", "O(n)", "O(1)", "list/deque", "Stack/Deque"], ["Queue", "FIFO — scheduling", "O(1)", "O(n)", "O(1)", "deque", "ArrayDeque"], ["Hash Map", "Key-value lookup", "O(1)*", "O(1)*", "O(1)*", "dict", "HashMap"], ["Hash Set", "Unique elements", "O(1)*", "O(1)*", "O(1)*", "set", "HashSet"], ["Binary Tree", "Sorted data, hierarchy", "O(log n)*", "O(log n)*", "O(log n)*", "—", "TreeMap"], ["Heap", "Min/Max repeatedly", "O(log n)", "O(1) min/max", "O(log n)", "heapq", "PriorityQueue"], ["Trie", "Prefix search, autocomplete", "O(m)", "O(m)", "O(m)", "—", "—"]], "extra": "<b>* = amortized/balanced case.</b> Interview mein ye table yaad rakhna bahut helpful hai. Problem aaye to pehle identify karo kaun sa DS best hai, phir code karo."}, {"cat": "20. DSA Introduction", "title": "Algorithms — Types & When to Use", "note": "Algorithms ke main types: Searching, Sorting, Greedy, DP, Backtracking. Har type ka apna use case hai.", "type": "table", "headers": ["Algorithm Type", "Kab Use Karein?", "Example Problems", "Complexity"], "rows": [["Linear Search", "Chhota array, sorted nahi", "Find element in array", "O(n)"], ["Binary Search", "Sorted array", "Search in sorted array", "O(log n)"], ["Two Pointer", "Sorted array, pairs dhundhna", "Two Sum, 3Sum", "O(n)"], ["Sliding Window", "Subarray/substring problems", "Max sum subarray of size k", "O(n)"], ["Recursion", "Tree, backtracking, divide & conquer", "Factorial, Fibonacci", "O(2^n)"], ["Dynamic Programming", "Repeated subproblems", "Fibonacci, Knapsack, LCS", "Varies"], ["Greedy", "Locally optimal = globally optimal", "Activity Selection, Huffman", "O(n log n)"], ["Backtracking", "All solutions dhundhna", "N-Queens, Sudoku", "O(n!)"], ["Divide & Conquer", "Array ko todo mein todna", "Merge Sort, Quick Sort", "O(n log n)"], ["Graph Algorithms", "Network, path finding", "BFS, DFS, Dijkstra", "Varies"]], "extra": "<b>Problem solving approach:</b> (1) Problem samjho. (2) Input/output identify karo. (3) Brute force socho. (4) Optimize karo using patterns. (5) Code karo. Ye 5 steps interview mein follow karo."}, {"cat": "21. Complexity", "title": "Time Complexity — Big O Notation", "note": "Big O = code kitna slow/fast hai input size ke hisaab se. Interview mein 100% poochte hain — ye samajhna zaroori hai.", "type": "table", "headers": ["Big O", "Name", "Example", "10 items", "1000 items"], "rows": [["O(1)", "Constant", "Array access by index", "1", "1"], ["O(log n)", "Logarithmic", "Binary Search", "3", "10"], ["O(n)", "Linear", "Single loop", "10", "1000"], ["O(n log n)", "Linearithmic", "Merge Sort", "33", "10000"], ["O(n²)", "Quadratic", "Nested loops", "100", "1000000"], ["O(n³)", "Cubic", "Triple nested loops", "1000", "10^9"], ["O(2ⁿ)", "Exponential", "All subsets", "1024", "10^301"], ["O(n!)", "Factorial", "All permutations", "3628800", "Impossible"]], "extra": "<b>Rule:</b> O(1) > O(log n) > O(n) > O(n log n) > O(n²) > O(n³) > O(2ⁿ) > O(n!). Interview mein O(n²) se kam hona chahiye 90% problems mein. O(2ⁿ) aur O(n!) sirf chhote inputs pe kaam karta hai."}, {"cat": "21. Complexity", "title": "Time Complexity — Kaise Calculate Karein?", "note": "Code dekho aur Big O figure out karo. Rule: loops, nested loops, recursion, aur operations count karo.", "type": "code", "java": "// JAVA — Complexity Analysis\n\n// O(1) — Constant\nint getFirst(int[] arr) {\n    return arr[0];  // sirf 1 operation\n}\n\n// O(n) — Linear\nint findMax(int[] arr) {\n    int max = arr[0];\n    for (int i = 1; i < arr.length; i++) {  // n iterations\n        if (arr[i] > max) max = arr[i];\n    }\n    return max;\n}\n\n// O(n²) — Quadratic\nvoid printPairs(int[] arr) {\n    for (int i = 0; i < arr.length; i++)        // n\n        for (int j = 0; j < arr.length; j++)    // × n\n            System.out.println(arr[i] + arr[j]);\n}\n\n// O(log n) — Logarithmic\nint binarySearch(int[] arr, int target) {\n    int lo = 0, hi = arr.length - 1;\n    while (lo <= hi) {           // log n iterations\n        int mid = (lo + hi) / 2;\n        if (arr[mid] == target) return mid;\n        else if (arr[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}", "python": "# PYTHON — Complexity Analysis\n\n# O(1) — Constant\ndef get_first(arr):\n    return arr[0]  # sirf 1 operation\n\n# O(n) — Linear\ndef find_max(arr):\n    mx = arr[0]\n    for x in arr[1:]:  # n iterations\n        if x > mx:\n            mx = x\n    return mx\n\n# O(n²) — Quadratic\ndef print_pairs(arr):\n    for i in arr:        # n\n        for j in arr:    # × n\n            print(i, j)\n\n# O(log n) — Logarithmic\ndef binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:         # log n iterations\n        mid = (lo + hi) // 2\n        if arr[mid] == target: return mid\n        elif arr[mid] < target: lo = mid + 1\n        else: hi = mid - 1\n    return -1", "extra": "<b>Quick tips:</b> (1) Single loop = O(n). (2) Nested loop = O(n²). (3) Loop jo har iteration mein half kare = O(log n). (4) Recursion with 2 branches = O(2ⁿ). (5) Function call inside loop = O(n × function_complexity).", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// O(1) — Constant\nint getFirst(vector<int>& arr) {\n    return arr[0];  // sirf 1 operation\n}\n\n// O(n) — Linear\nint findMax(vector<int>& arr) {\n    int mx = arr[0];\n    for (int i = 1; i < (int)arr.size(); i++) {  // n iterations\n        if (arr[i] > mx) mx = arr[i];\n    }\n    return mx;\n}\n\n// O(n^2) — Quadratic\nvoid printPairs(vector<int>& arr) {\n    for (int x : arr)         // n\n        for (int y : arr)     // × n\n            cout << x + y << \" \";\n    cout << \"\\n\";\n}\n\n// O(log n) — Logarithmic\nint binarySearch(vector<int>& arr, int target) {\n    int lo = 0, hi = (int)arr.size() - 1;\n    while (lo <= hi) {         // log n iterations\n        int mid = lo + (hi - lo) / 2;\n        if (arr[mid] == target) return mid;\n        else if (arr[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\n\nint main() {\n    vector<int> arr = {1, 3, 5, 7, 9};\n    cout << getFirst(arr) << \"\\n\";        // 1\n    cout << findMax(arr) << \"\\n\";         // 9\n    cout << binarySearch(arr, 7) << \"\\n\"; // 3\n    printPairs(arr);                      // 25 prints\n    return 0;\n}"}, {"cat": "21. Complexity", "title": "Space Complexity — Memory Kitna Lagega?", "note": "Sirf time nahi, memory bhi dekho. Space complexity = program kitni extra memory use karta hai input ke alawa.", "type": "code", "java": "// JAVA — SPACE COMPLEXITY\n\n// O(1) — constant extra space\nint sum(int[] arr) {\n    int total = 0;           // 1 variable\n    for (int x : arr) total += x;\n    return total;\n}\n\n// O(n) — linear extra space\nint[] copy(int[] arr) {\n    int[] result = new int[arr.length];  // n extra space\n    for (int i = 0; i < arr.length; i++)\n        result[i] = arr[i];\n    return result;\n}\n\n// O(n) — recursion stack\nint factorial(int n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);  // n stack frames\n}\n\n// O(1) — iterative instead of recursion\nint factorialIter(int n) {\n    int result = 1;\n    for (int i = 2; i <= n; i++) result *= i;\n    return result;\n}", "python": "# PYTHON — SPACE COMPLEXITY\n\n# O(1) — constant extra space\ndef total(arr):\n    t = 0           # 1 variable\n    for x in arr:\n        t += x\n    return t\n\n# O(n) — linear extra space\ndef copy(arr):\n    result = [0] * len(arr)  # n extra space\n    for i in range(len(arr)):\n        result[i] = arr[i]\n    return result\n\n# O(n) — recursion stack\ndef factorial(n):\n    if n <= 1: return 1\n    return n * factorial(n - 1)  # n stack frames\n\n# O(1) — iterative\ndef factorial_iter(n):\n    result = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result", "extra": "<b>Rules:</b> (1) Variable declare karo = O(1). (2) Array/list banaya same size = O(n). (3) Recursion depth n = O(n) stack space. (4) HashMap banaya n items = O(n). (5) Extra space avoid karo — in-place operations prefer karo.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// O(1) — constant extra space\nint sumTotal(vector<int>& arr) {\n    int t = 0;           // 1 variable\n    for (int x : arr) t += x;\n    return t;\n}\n\n// O(n) — linear extra space\nvector<int> copyArr(vector<int>& arr) {\n    vector<int> result(arr.size());   // n extra space\n    for (int i = 0; i < (int)arr.size(); i++)\n        result[i] = arr[i];\n    return result;\n}\n\n// O(n) — recursion stack\nint factorialRec(int n) {\n    if (n <= 1) return 1;\n    return n * factorialRec(n - 1);   // n stack frames\n}\n\n// O(1) — iterative instead of recursion\nint factorialIter(int n) {\n    int result = 1;\n    for (int i = 2; i <= n; i++) result *= i;\n    return result;\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4};\n    cout << sumTotal(arr) << \"\\n\";        // 10\n    cout << copyArr(arr)[3] << \"\\n\";      // 4\n    cout << factorialRec(5) << \"\\n\";      // 120\n    cout << factorialIter(5) << \"\\n\";     // 120\n    return 0;\n}"}, {"cat": "21. Complexity", "title": "Best, Average, Worst Case", "note": "Ek algorithm ka performance input pe depend karta hai. Worst case = sabse kharaab scenario. Interview mein ye poochte hain.", "type": "table", "headers": ["Algorithm", "Best Case", "Average Case", "Worst Case", "Space"], "rows": [["Linear Search", "O(1)", "O(n)", "O(n)", "O(1)"], ["Binary Search", "O(1)", "O(log n)", "O(log n)", "O(1)"], ["Bubble Sort", "O(n)", "O(n²)", "O(n²)", "O(1)"], ["Merge Sort", "O(n log n)", "O(n log n)", "O(n log n)", "O(n)"], ["Quick Sort", "O(n log n)", "O(n log n)", "O(n²)", "O(log n)"], ["Insertion Sort", "O(n)", "O(n²)", "O(n²)", "O(1)"], ["HashMap get", "O(1)", "O(1)", "O(n)", "—"], ["BST Search", "O(log n)", "O(log n)", "O(n)", "O(1)"]], "extra": "<b>Interview tip:</b> Worst case batao pehle, average case batao baad mein. Worst case kab aata hai — ye explain karo. Quick Sort ka worst case O(n²) hai but average O(n log n) hai — isliye practically fast hai."}, {"cat": "21. Complexity", "title": "Complexity Cheat Sheet — Quick Reference", "note": "Ye slide interview ke 5 minute pehle revise karo. Sab kuch ek jagah.", "type": "table", "headers": ["Complexity", "Good For", "Bad For", "Example"], "rows": [["O(1)", "Constant ops", "—", "arr[i]"], ["O(log n)", "Large inputs", "—", "Binary search"], ["O(n)", "Linear scan", "Very large n", "Find max"], ["O(n log n)", "Sorting", "Memory tight", "Merge sort"], ["O(n²)", "Small n only", "n > 10000", "Bubble sort"], ["O(2ⁿ)", "Tiny n only", "n > 20", "Brute force subsets"], ["O(n!)", "Tiny n only", "n > 10", "Permutations"]], "extra": "<b>Golden rules:</b> (1) O(1) aur O(log n) = Excellent. (2) O(n) aur O(n log n) = Good. (3) O(n²) = Acceptable for small input. (4) O(2ⁿ) aur O(n!) = Only for n < 20. Interview mein optimal solution do — O(n log n) ya better."}, {"cat": "22. DSA Patterns", "title": "Binary Search", "note": "Manual binary search dono languages mein almost identical — bas <code>mid</code> calculation mein <code>//</code> use karna mat bhoolna.", "type": "code", "java": "int low = 0, high = arr.length - 1;\nwhile (low <= high) {\n    int mid = low + (high - low) / 2;   // overflow-safe\n    if (arr[mid] == target) return mid;\n    else if (arr[mid] < target) low = mid + 1;\n    else high = mid - 1;\n}\nreturn -1;", "python": "low, high = 0, len(arr) - 1\nwhile low <= high:\n    mid = (low + high) // 2      # integer division!\n    if arr[mid] == target:\n        return mid\n    elif arr[mid] < target:\n        low = mid + 1\n    else:\n        high = mid - 1\nreturn -1", "extra": "Logic <b>exactly same</b> hai. Python mein <code>(low+high)/2</code> float dega → index error. Isliye <code>//</code>. Java mein <code>low + (high-low)/2</code> overflow-safe pattern hai (low+high overflow se bachata). <code>bisect</code> module Python mein built-in binary search hai.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 3, 5, 7, 9};\n    int target = 5;\n\n    int low = 0, high = (int)arr.size() - 1;\n    while (low <= high) {\n        int mid = low + (high - low) / 2;   // overflow-safe\n        if (arr[mid] == target) {\n            cout << mid << \"\\n\";            // 2\n            break;\n        } else if (arr[mid] < target) low = mid + 1;\n        else high = mid - 1;\n    }\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Two Pointer", "note": "Sorted array ke pairs/triplets sum problems ka standard pattern — language-agnostic, logic same.", "type": "code", "java": "int left = 0, right = arr.length - 1;\nwhile (left < right) {\n    int sum = arr[left] + arr[right];\n    if (sum == target) {\n        System.out.println(left + \" \" + right);\n        break;\n    } else if (sum < target) {\n        left++;      // sum badhao\n    } else {\n        right--;     // sum ghatao\n    }\n}", "python": "left, right = 0, len(arr) - 1\nwhile left < right:\n    total = arr[left] + arr[right]\n    if total == target:\n        print(left, right)\n        break\n    elif total < target:\n        left += 1        # sum badhao\n    else:\n        right -= 1       # sum ghatao", "extra": "<b>Flow:</b> sorted array + sum target → <code>left</code> ko aage (sum badhega), <code>right</code> ko piche (sum ghatega). Ye 2-Sum (sorted), 3-Sum, container-with-most-water, trapped-rain-water sab ka base hai. Complexity O(n) — naive nested loop O(n²) se kaafi better.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 2, 3, 6, 8, 11};   // sorted array\n    int target = 10;\n\n    int left = 0, right = (int)arr.size() - 1;\n    while (left < right) {\n        int total = arr[left] + arr[right];\n        if (total == target) {\n            cout << left << \" \" << right << \"\\n\";   // 1 4 (2+8)\n            break;\n        } else if (total < target) {\n            left++;      // sum badhao\n        } else {\n            right--;     // sum ghatao\n        }\n    }\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Sliding Window", "note": "Subarray/substring problems (fixed ya variable window) ka master pattern — dono languages mein same logic.", "type": "code", "java": "// fixed window of size k: max sum\nint windowSum = 0;\nfor (int i = 0; i < k; i++) windowSum += arr[i];\nint maxSum = windowSum;\nfor (int i = k; i < arr.length; i++) {\n    windowSum += arr[i] - arr[i - k];   // slide 🔥\n    maxSum = Math.max(maxSum, windowSum);\n}", "python": "# fixed window of size k: max sum\nwindow_sum = sum(arr[:k])\nmax_sum = window_sum\nfor i in range(k, len(arr)):\n    window_sum += arr[i] - arr[i - k]   # slide 🔥\n    max_sum = max(max_sum, window_sum)\n\n# variable window (longest subarray)\nl = 0\nfor r in range(len(arr)):\n    # ... window condition update\n    while condition:\n        l += 1        # shrink\n    ans = max(ans, r - l + 1)", "extra": "<b>Two types:</b> <b>Fixed window</b> = size pata hai, ek-add ek-remove (slide). <b>Variable window</b> = <code>right</code> expand karta, <code>left</code> shrink — longest substring without repeating chars, min window substring isi se solve hote. Complexity O(n).", "cpp": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 4, 2, 10, 23, 3, 1, 0, 20};\n    int k = 4;\n\n    // fixed window of size k: max sum\n    int windowSum = 0;\n    for (int i = 0; i < k; i++) windowSum += arr[i];\n    int maxSum = windowSum;\n    for (int i = k; i < (int)arr.size(); i++) {\n        windowSum += arr[i] - arr[i - k];   // slide\n        maxSum = max(maxSum, windowSum);\n    }\n    cout << maxSum << \"\\n\";   // 39\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Recursion", "note": "Recursive functions ka structure dono languages mein identical. Bas Python ki recursion depth limit ~1000 yaad rakhna.", "type": "code", "java": "static int fact(int n) {\n    if (n == 0) return 1;\n    return n * fact(n - 1);\n}\n\nstatic int fib(int n) {\n    if (n <= 1) return n;\n    return fib(n - 1) + fib(n - 2);\n}", "python": "def fact(n):\n    if n == 0:\n        return 1\n    return n * fact(n - 1)\n\ndef fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\n# deep recursion ke liye\nimport sys\nsys.setrecursionlimit(10000)", "extra": "<b>Flow:</b> base case (stop) + recursive case (self-call). Python default recursion depth ~1000 hai — usse zyada gaya toh RecursionError. <code>sys.setrecursionlimit()</code> se badha sakte ho, lekin iterative/memoized solution hamesha better hai large input ke liye.", "cpp": "#include <iostream>\nusing namespace std;\n\n// base case + recursive case\nint fact(int n) {\n    if (n == 0) return 1;           // base case\n    return n * fact(n - 1);         // recursive call\n}\n\nint fib(int n) {\n    if (n <= 1) return n;           // base case\n    return fib(n - 1) + fib(n - 2); // two branches\n}\n\nint main() {\n    cout << fact(5) << \"\\n\";   // 120\n    cout << fib(10) << \"\\n\";   // 55\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "BFS & DFS — Graph Traversal", "note": "Tree/Graph traversal ka core. BFS = queue, DFS = stack/recursion. Dono languages mein structure same.", "type": "code", "java": "// BFS (shortest path in unweighted)\nQueue<Integer> q = new LinkedList<>();\nq.add(start);\nboolean[] vis = new boolean[n];\nvis[start] = true;\nwhile (!q.isEmpty()) {\n    int u = q.poll();\n    for (int v : adj[u]) {\n        if (!vis[v]) { vis[v] = true; q.add(v); }\n    }\n}\n\n// DFS (recursive)\nvoid dfs(int u, boolean[] vis) {\n    vis[u] = true;\n    for (int v : adj[u]) if (!vis[v]) dfs(v, vis);\n}", "python": "# BFS 🔥\nfrom collections import deque\nq = deque([start])\nvis = {start}\nwhile q:\n    u = q.popleft()\n    for v in adj[u]:\n        if v not in vis:\n            vis.add(v)\n            q.append(v)\n\n# DFS (recursive)\ndef dfs(u, vis=None):\n    if vis is None: vis = set()\n    vis.add(u)\n    for v in adj[u]:\n        if v not in vis:\n            dfs(v, vis)", "extra": "<b>BFS vs DFS:</b> BFS queue se level-by-level jaata (shortest path), DFS recursion/stack se deep jaata. Java set vs array: boolean[] O(1) memory efficient. Python <code>vis = {start}</code> set fast hai. Island count, rotting oranges, word ladder sab isi template pe.", "cpp": "#include <iostream>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nvoid dfs(int u, vector<bool>& vis, vector<vector<int>>& adj) {\n    vis[u] = true;\n    cout << u << \" \";\n    for (int v : adj[u])\n        if (!vis[v]) dfs(v, vis, adj);\n}\n\nint main() {\n    int n = 5;\n    vector<vector<int>> adj(n);\n    adj[0] = {1, 2};\n    adj[1] = {0, 3, 4};\n    adj[2] = {0};\n    adj[3] = {1};\n    adj[4] = {1};\n\n    // BFS (shortest path in unweighted)\n    queue<int> q;\n    q.push(0);\n    vector<bool> vis(n, false);\n    vis[0] = true;\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        cout << u << \" \";\n        for (int v : adj[u])\n            if (!vis[v]) { vis[v] = true; q.push(v); }\n    }\n    cout << \"\\n\";   // 0 1 2 3 4\n\n    // DFS (recursive)\n    vector<bool> vis2(n, false);\n    dfs(0, vis2, adj);\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Backtracking", "note": "Subsets, permutations, combinations, N-Queens — sabka base template. Explore → choice → undo (backtrack).", "type": "code", "java": "// subsets template\nvoid backtrack(int start, List<Integer> cur) {\n    result.add(new ArrayList<>(cur));\n    for (int i = start; i < n; i++) {\n        cur.add(nums[i]);            // choose\n        backtrack(i + 1, cur);       // explore\n        cur.remove(cur.size() - 1);  // undo 🔥\n    }\n}", "python": "# subsets template 🔥\ndef backtrack(start, cur):\n    result.append(cur[:])        # copy!\n    for i in range(start, n):\n        cur.append(nums[i])      # choose\n        backtrack(i + 1, cur)    # explore\n        cur.pop()                # undo\n\n# one-liner subsets\nsubsets = [[]]\nfor x in nums:\n    subsets += [s + [x] for s in subsets]", "extra": "<b>Backtracking ka core = choose → explore → undo.</b> Python mein <code>result.append(cur[:])</code> — <b>cur[:] copy zaroori hai</b>, warna saari entries same list reference hongi. Permutations mein <code>i=0</code> se loop + used[] set, combinations mein <code>i+1</code> se. N-Queens, sudoku solver isi template pe.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvector<vector<int>> result;\nvector<int> nums;\n\n// subsets template\nvoid backtrack(int start, vector<int>& cur) {\n    result.push_back(cur);              // cur copy (cur[:] jaisa)\n    for (int i = start; i < (int)nums.size(); i++) {\n        cur.push_back(nums[i]);         // choose\n        backtrack(i + 1, cur);          // explore\n        cur.pop_back();                 // undo\n    }\n}\n\nint main() {\n    nums = {1, 2, 3};\n    vector<int> cur;\n    backtrack(0, cur);\n\n    for (auto& s : result) {\n        cout << \"[\";\n        for (int x : s) cout << x << \" \";\n        cout << \"] \";\n    }\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Memoization / DP Intro", "note": "Recursion + cache = memoization. Python ka @lru_cache dekhte hi DP questions easy lagne lagte hain.", "type": "code", "java": "// top-down with memo array\nint[] memo = new int[n + 1];\nArrays.fill(memo, -1);\n\nint fib(int n) {\n    if (n <= 1) return n;\n    if (memo[n] != -1) return memo[n];\n    return memo[n] = fib(n-1) + fib(n-2);\n}", "python": "from functools import lru_cache\n\n@lru_cache(None)          # 🔥 one-liner memoization\ndef fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\n# manual dict cache bhi theek\nmemo = {}\ndef fib2(n):\n    if n <= 1: return n\n    if n in memo: return memo[n]\n    memo[n] = fib2(n-1) + fib2(n-2)\n    return memo[n]", "extra": "<b>Flow:</b> recursive solution likho → state = (params) → cache laga do → O(2^n) se O(n). <code>@lru_cache(None)</code> args ke tuple ko key banata hai. Java mein memo array pehle -1 fill karo, phir check. Bottom-up DP (iterative) memory better deta hai lekin top-down samajhna easy.", "cpp": "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nint memo[100];\n\n// top-down DP — memo array pehle -1 fill karo\nint fib(int n) {\n    if (n <= 1) return n;\n    if (memo[n] != -1) return memo[n];\n    return memo[n] = fib(n - 1) + fib(n - 2);\n}\n\nint main() {\n    fill(memo, memo + 100, -1);\n    cout << fib(10) << \"\\n\";   // 55\n    return 0;\n}"}, {"cat": "22. DSA Patterns", "title": "Sawaal 9 — DSA Patterns ke Questions", "note": "Binary search, pointers, recursion, BFS/DFS, DP test karo.", "type": "quiz", "questions": [{"q": "Binary search mein Python mein mid kaise calculate karenge?", "opts": ["<code>(l + h) / 2</code>", "<code>(l + h) // 2</code>", "<code>(l + h) % 2</code>", "<code>mid(l,h)</code>"], "ans": 1, "expl": "<code>//</code> integer division hai — index ke liye zaroori. <code>/</code> float dega aur arr[3.5] error aayega."}, {"q": "Python ki default recursion depth limit kya hai?", "opts": ["~100", "~1000", "~1000000", "Infinite"], "ans": 1, "expl": "Default ~1000. Isse zyada recursion pe RecursionError. <code>sys.setrecursionlimit(10000)</code> ya iterative solution use karo."}, {"q": "Two pointer pattern kab use hota hai?", "opts": ["Unsorted array pe", "Sorted array ke pairs/triplets", "Sirf strings pe", "Kisi bhi graph pe"], "ans": 1, "expl": "Sorted array + sum-target problems (2-Sum, 3-Sum) mein left-right pointers se O(n) mein solve hota. Naive loop O(n²) hota."}, {"q": "BFS traversal mein kaunsa data structure use hota hai?", "opts": ["Stack", "Queue", "HashMap", "TreeSet"], "ans": 1, "expl": "BFS = queue (level by level). Python: <code>collections.deque</code> — popleft() O(1). DFS = stack ya recursion."}, {"q": "<code>@lru_cache(None)</code> kya karta hai?", "opts": ["Code speed up", "Recursion results cache karna (memoization)", "Import karwata hai", "Loop banata hai"], "ans": 1, "expl": "Ye decorator function ke results ko args ke basis pe cache karta hai — repeated recursive calls O(1) mein return ho jaati hain. DP ka sabse easy form."}, {"q": "Backtracking mein <code>result.append(cur[:])</code> mein <code>cur[:]</code> kyun?", "opts": ["Fast hai", "Copy chahiye warna saari entries same list hongi", "Syntax requirement", "Isse remove hota hai"], "ans": 1, "expl": "cur ko baad mein modify karte ho (pop). Copy na karo toh result mein cur ka reference hoga jo badalta rahega. <code>cur[:]</code> = shallow copy."}]}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q21 · Valid Palindrome", "diff": "E", "note": "Palindrome check — sirf alphanumeric, case-insensitive.", "java": "public boolean isPalindrome(String s) {\n    int i = 0, j = s.length()-1;\n    while (i < j) {\n        while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;\n        while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;\n        if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) return false;\n        i++; j--;\n    }\n    return true;\n}", "python": "def isPalindrome(s):\n    i, j = 0, len(s)-1\n    while i < j:\n        while i < j and not s[i].isalnum(): i += 1\n        while i < j and not s[j].isalnum(): j -= 1\n        if s[i].lower() != s[j].lower():\n            return False\n        i += 1; j -= 1\n    return True", "extra": "<b>Two pointers</b> dono ends se, non-alphanumeric skip, lowercase compare.", "cpp": "bool isPalindrome(string s) {\n    int i = 0, j = (int)s.size() - 1;\n    while (i < j) {\n        while (i < j && !isalnum((unsigned char)s[i])) i++;\n        while (i < j && !isalnum((unsigned char)s[j])) j--;\n        if (tolower((unsigned char)s[i]) != tolower((unsigned char)s[j])) return false;\n        i++; j--;\n    }\n    return true;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q22 · Two Sum II", "diff": "M", "note": "Sorted array mein 2 numbers = target, 1-indexed indices.", "java": "public int[] twoSum(int[] nums, int target) {\n    int i = 0, j = nums.length-1;\n    while (i < j) {\n        int sum = nums[i] + nums[j];\n        if (sum == target) return new int[]{i+1, j+1};\n        if (sum < target) i++; else j--;\n    }\n    return new int[]{};\n}", "python": "def twoSum(nums, target):\n    i, j = 0, len(nums)-1\n    while i < j:\n        s = nums[i] + nums[j]\n        if s == target: return [i+1, j+1]\n        if s < target: i += 1\n        else: j -= 1\n    return []", "extra": "Sorted hai — chhota sum = left++, bada = right--. O(n).", "cpp": "vector<int> twoSum(vector<int>& nums, int target) {\n    int i = 0, j = (int)nums.size() - 1;\n    while (i < j) {\n        int sum = nums[i] + nums[j];\n        if (sum == target) return {i + 1, j + 1};\n        if (sum < target) i++; else j--;\n    }\n    return {};\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q23 · 3Sum", "diff": "M", "note": "Saare unique triplets jinka sum = 0.", "java": "public List<List<Integer>> threeSum(int[] nums) {\n    Arrays.sort(nums);\n    List<List<Integer>> r = new ArrayList<>();\n    for (int i = 0; i < nums.length-2; i++) {\n        if (i > 0 && nums[i] == nums[i-1]) continue;\n        int lo = i+1, hi = nums.length-1;\n        while (lo < hi) {\n            int s = nums[i] + nums[lo] + nums[hi];\n            if (s == 0) {\n                r.add(Arrays.asList(nums[i], nums[lo], nums[hi]));\n                while (lo < hi && nums[lo] == nums[lo+1]) lo++;\n                while (lo < hi && nums[hi] == nums[hi-1]) hi--;\n                lo++; hi--;\n            } else if (s < 0) lo++;\n            else hi--;\n        }\n    }\n    return r;\n}", "python": "def threeSum(nums):\n    nums.sort()\n    r = []\n    for i in range(len(nums)-2):\n        if i > 0 and nums[i] == nums[i-1]: continue\n        lo, hi = i+1, len(nums)-1\n        while lo < hi:\n            s = nums[i] + nums[lo] + nums[hi]\n            if s == 0:\n                r.append([nums[i], nums[lo], nums[hi]])\n                while lo < hi and nums[lo] == nums[lo+1]: lo += 1\n                while lo < hi and nums[hi] == nums[hi-1]: hi -= 1\n                lo += 1; hi -= 1\n            elif s < 0: lo += 1\n            else: hi -= 1\n    return r", "extra": "Sort + fix 1 + two-pointer. Duplicates skip.", "cpp": "vector<vector<int>> threeSum(vector<int>& nums) {\n    sort(nums.begin(), nums.end());\n    vector<vector<int>> r;\n    for (int i = 0; i + 2 < (int)nums.size(); i++) {\n        if (i > 0 && nums[i] == nums[i - 1]) continue;\n        int lo = i + 1, hi = (int)nums.size() - 1;\n        while (lo < hi) {\n            int s = nums[i] + nums[lo] + nums[hi];\n            if (s == 0) {\n                r.push_back({nums[i], nums[lo], nums[hi]});\n                while (lo < hi && nums[lo] == nums[lo + 1]) lo++;\n                while (lo < hi && nums[hi] == nums[hi - 1]) hi--;\n                lo++; hi--;\n            } else if (s < 0) lo++;\n            else hi--;\n        }\n    }\n    return r;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q24 · 3Sum Closest", "diff": "M", "note": "Triplet jiska sum target ke sabse kareeb — sum.", "java": "public int threeSumClosest(int[] nums, int target) {\n    Arrays.sort(nums);\n    int best = nums[0] + nums[1] + nums[2];\n    for (int i = 0; i < nums.length-2; i++) {\n        int lo = i+1, hi = nums.length-1;\n        while (lo < hi) {\n            int s = nums[i] + nums[lo] + nums[hi];\n            if (Math.abs(s-target) < Math.abs(best-target)) best = s;\n            if (s == target) return s;\n            if (s < target) lo++; else hi--;\n        }\n    }\n    return best;\n}", "python": "def threeSumClosest(nums, target):\n    nums.sort()\n    best = nums[0] + nums[1] + nums[2]\n    for i in range(len(nums)-2):\n        lo, hi = i+1, len(nums)-1\n        while lo < hi:\n            s = nums[i] + nums[lo] + nums[hi]\n            if abs(s-target) < abs(best-target):\n                best = s\n            if s == target: return s\n            if s < target: lo += 1\n            else: hi -= 1\n    return best", "extra": "Har sum pe <b>difference compare</b> karke closest update karo.", "cpp": "int threeSumClosest(vector<int>& nums, int target) {\n    sort(nums.begin(), nums.end());\n    int best = nums[0] + nums[1] + nums[2];\n    for (int i = 0; i + 2 < (int)nums.size(); i++) {\n        int lo = i + 1, hi = (int)nums.size() - 1;\n        while (lo < hi) {\n            int s = nums[i] + nums[lo] + nums[hi];\n            if (abs(s - target) < abs(best - target)) best = s;\n            if (s == target) return s;\n            if (s < target) lo++; else hi--;\n        }\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q25 · 4Sum", "diff": "M", "note": "Saare unique quadruplets jinka sum target ho.", "java": "public List<List<Integer>> fourSum(int[] nums, int target) {\n    Arrays.sort(nums);\n    List<List<Integer>> r = new ArrayList<>();\n    for (int i = 0; i < nums.length-3; i++) {\n        if (i > 0 && nums[i] == nums[i-1]) continue;\n        for (int j = i+1; j < nums.length-2; j++) {\n            if (j > i+1 && nums[j] == nums[j-1]) continue;\n            int lo = j+1, hi = nums.length-1;\n            while (lo < hi) {\n                long s = (long)nums[i] + nums[j] + nums[lo] + nums[hi];\n                if (s == target) {\n                    r.add(Arrays.asList(nums[i], nums[j], nums[lo], nums[hi]));\n                    while (lo < hi && nums[lo] == nums[lo+1]) lo++;\n                    while (lo < hi && nums[hi] == nums[hi-1]) hi--;\n                    lo++; hi--;\n                } else if (s < target) lo++;\n                else hi--;\n            }\n        }\n    }\n    return r;\n}", "python": "def fourSum(nums, target):\n    nums.sort()\n    r = []\n    for i in range(len(nums)-3):\n        if i > 0 and nums[i] == nums[i-1]: continue\n        for j in range(i+1, len(nums)-2):\n            if j > i+1 and nums[j] == nums[j-1]: continue\n            lo, hi = j+1, len(nums)-1\n            while lo < hi:\n                s = nums[i] + nums[j] + nums[lo] + nums[hi]\n                if s == target:\n                    r.append([nums[i], nums[j], nums[lo], nums[hi]])\n                    while lo < hi and nums[lo] == nums[lo+1]: lo += 1\n                    while lo < hi and nums[hi] == nums[hi-1]: hi -= 1\n                    lo += 1; hi -= 1\n                elif s < target: lo += 1\n                else: hi -= 1\n    return r", "extra": "3Sum extension — 2 fix karo, 2 two-pointer. Har level duplicates skip.", "cpp": "vector<vector<int>> fourSum(vector<int>& nums, int target) {\n    sort(nums.begin(), nums.end());\n    vector<vector<int>> r;\n    for (int i = 0; i + 3 < (int)nums.size(); i++) {\n        if (i > 0 && nums[i] == nums[i - 1]) continue;\n        for (int j = i + 1; j + 2 < (int)nums.size(); j++) {\n            if (j > i + 1 && nums[j] == nums[j - 1]) continue;\n            int lo = j + 1, hi = (int)nums.size() - 1;\n            while (lo < hi) {\n                long long s = (long long)nums[i] + nums[j] + nums[lo] + nums[hi];\n                if (s == target) {\n                    r.push_back({nums[i], nums[j], nums[lo], nums[hi]});\n                    while (lo < hi && nums[lo] == nums[lo + 1]) lo++;\n                    while (lo < hi && nums[hi] == nums[hi - 1]) hi--;\n                    lo++; hi--;\n                } else if (s < target) lo++;\n                else hi--;\n            }\n        }\n    }\n    return r;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q26 · Container With Most Water", "diff": "M", "note": "Do lines jo max area water hold karein.", "java": "public int maxArea(int[] h) {\n    int i = 0, j = h.length-1, best = 0;\n    while (i < j) {\n        best = Math.max(best, (j-i) * Math.min(h[i], h[j]));\n        if (h[i] < h[j]) i++; else j--;\n    }\n    return best;\n}", "python": "def maxArea(h):\n    i, j, best = 0, len(h)-1, 0\n    while i < j:\n        best = max(best, (j-i) * min(h[i], h[j]))\n        if h[i] < h[j]: i += 1\n        else: j -= 1\n    return best", "extra": "<b>Chhota wall</b> wali side move karo — wahi limit karta hai.", "cpp": "int maxArea(vector<int>& h) {\n    int i = 0, j = (int)h.size() - 1, best = 0;\n    while (i < j) {\n        best = max(best, (j - i) * min(h[i], h[j]));\n        if (h[i] < h[j]) i++; else j--;\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q27 · Boats to Save People", "diff": "M", "note": "Boat max 2 log + weight limit — minimum boats.", "java": "public int numRescueBoats(int[] p, int limit) {\n    Arrays.sort(p);\n    int i = 0, j = p.length-1, boats = 0;\n    while (i <= j) {\n        if (p[i] + p[j] <= limit) i++;\n        j--; boats++;\n    }\n    return boats;\n}", "python": "def numRescueBoats(p, limit):\n    p.sort()\n    i, j, boats = 0, len(p)-1, 0\n    while i <= j:\n        if p[i] + p[j] <= limit: i += 1\n        j -= 1\n        boats += 1\n    return boats", "extra": "<b>Heaviest + lightest</b> pair (greedy two-pointer).", "cpp": "int numRescueBoats(vector<int>& p, int limit) {\n    sort(p.begin(), p.end());\n    int i = 0, j = (int)p.size() - 1, boats = 0;\n    while (i <= j) {\n        if (p[i] + p[j] <= limit) i++;\n        j--; boats++;\n    }\n    return boats;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q28 · Squares of a Sorted Array", "diff": "E", "note": "Sorted array ke squares, sorted order mein.", "java": "public int[] sortedSquares(int[] nums) {\n    int n = nums.length, i = 0, j = n-1;\n    int[] r = new int[n];\n    for (int k = n-1; k >= 0; k--) {\n        if (Math.abs(nums[i]) > Math.abs(nums[j])) r[k] = nums[i]*nums[i++];\n        else r[k] = nums[j]*nums[j--];\n    }\n    return r;\n}", "python": "def sortedSquares(nums):\n    i, j = 0, len(nums)-1\n    r = []\n    while i <= j:\n        if abs(nums[i]) > abs(nums[j]):\n            r.append(nums[i]*nums[i]); i += 1\n        else:\n            r.append(nums[j]*nums[j]); j -= 1\n    return r[::-1]", "extra": "Bada square <b>ends</b> se aata hai — end se fill karo. O(n).", "cpp": "vector<int> sortedSquares(vector<int>& nums) {\n    int n = nums.size(), i = 0, j = n - 1;\n    vector<int> r(n);\n    for (int k = n - 1; k >= 0; k--) {\n        if (abs(nums[i]) > abs(nums[j])) {\n            r[k] = nums[i] * nums[i]; i++;\n        } else {\n            r[k] = nums[j] * nums[j]; j--;\n        }\n    }\n    return r;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q29 · Partition Labels", "diff": "M", "note": "Partitions banao — har char ek partition mein, max partitions.", "java": "public List<Integer> partitionLabels(String s) {\n    int[] last = new int[26];\n    for (int i = 0; i < s.length(); i++) last[s.charAt(i)-'a'] = i;\n    List<Integer> r = new ArrayList<>();\n    int start = 0, end = 0;\n    for (int i = 0; i < s.length(); i++) {\n        end = Math.max(end, last[s.charAt(i)-'a']);\n        if (i == end) { r.add(i-start+1); start = i+1; }\n    }\n    return r;\n}", "python": "def partitionLabels(s):\n    last = {c: i for i, c in enumerate(s)}\n    r = []\n    start = end = 0\n    for i, c in enumerate(s):\n        end = max(end, last[c])\n        if i == end:\n            r.append(i - start + 1)\n            start = i + 1\n    return r", "extra": "Har char ka <b>last index</b>; end extend; i == end toh partition.", "cpp": "vector<int> partitionLabels(string s) {\n    int last[26];\n    for (int i = 0; i < (int)s.size(); i++) last[s[i] - 'a'] = i;\n    vector<int> r;\n    int start = 0, end = 0;\n    for (int i = 0; i < (int)s.size(); i++) {\n        end = max(end, last[s[i] - 'a']);\n        if (i == end) { r.push_back(i - start + 1); start = i + 1; }\n    }\n    return r;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q30 · Longest Substring Without Repeating Characters", "diff": "M", "note": "Sabse lamba substring bina repeat characters ke.", "java": "public int lengthOfLongestSubstring(String s) {\n    Map<Character,Integer> m = new HashMap<>();\n    int left = 0, best = 0;\n    for (int right = 0; right < s.length(); right++) {\n        char c = s.charAt(right);\n        if (m.containsKey(c)) left = Math.max(left, m.get(c)+1);\n        m.put(c, right);\n        best = Math.max(best, right-left+1);\n    }\n    return best;\n}", "python": "def lengthOfLongestSubstring(s):\n    m = {}\n    left = best = 0\n    for right, c in enumerate(s):\n        if c in m:\n            left = max(left, m[c] + 1)\n        m[c] = right\n        best = max(best, right - left + 1)\n    return best", "extra": "<b>Sliding window</b> — char ka last index map; repeat pe left shift.", "cpp": "int lengthOfLongestSubstring(string s) {\n    unordered_map<char, int> m;\n    int left = 0, best = 0;\n    for (int right = 0; right < (int)s.size(); right++) {\n        char c = s[right];\n        if (m.count(c)) left = max(left, m[c] + 1);\n        m[c] = right;\n        best = max(best, right - left + 1);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q31 · Longest Repeating Character Replacement", "diff": "M", "note": "Max K replacements — sabse lamba substring same char ka.", "java": "public int characterReplacement(String s, int k) {\n    int[] cnt = new int[26];\n    int left = 0, best = 0, maxFreq = 0;\n    for (int right = 0; right < s.length(); right++) {\n        maxFreq = Math.max(maxFreq, ++cnt[s.charAt(right)-'a']);\n        if (right-left+1 - maxFreq > k) {\n            cnt[s.charAt(left++)-'a']--;\n        }\n        best = Math.max(best, right-left+1);\n    }\n    return best;\n}", "python": "def characterReplacement(s, k):\n    cnt = {}\n    left = best = maxF = 0\n    for right, c in enumerate(s):\n        cnt[c] = cnt.get(c, 0) + 1\n        maxF = max(maxF, cnt[c])\n        if right-left+1 - maxF > k:\n            cnt[s[left]] -= 1\n            left += 1\n        best = max(best, right-left+1)\n    return best", "extra": "Rule: <b>length - maxFreq ≤ k</b>, warna left shrink.", "cpp": "int characterReplacement(string s, int k) {\n    int cnt[26] = {};\n    int left = 0, best = 0, maxFreq = 0;\n    for (int right = 0; right < (int)s.size(); right++) {\n        maxFreq = max(maxFreq, ++cnt[s[right] - 'a']);\n        if (right - left + 1 - maxFreq > k) {\n            cnt[s[left] - 'a']--;\n            left++;\n        }\n        best = max(best, right - left + 1);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q32 · Permutation in String", "diff": "M", "note": "Kya s1 ka koi permutation s2 ka substring hai.", "java": "public boolean checkInclusion(String s1, String s2) {\n    int[] need = new int[26], have = new int[26];\n    for (char c : s1.toCharArray()) need[c-'a']++;\n    int left = 0;\n    for (int right = 0; right < s2.length(); right++) {\n        have[s2.charAt(right)-'a']++;\n        if (right-left+1 > s1.length()) have[s2.charAt(left++)-'a']--;\n        if (right-left+1 == s1.length() && Arrays.equals(need, have)) return true;\n    }\n    return false;\n}", "python": "def checkInclusion(s1, s2):\n    need = {}\n    for c in s1: need[c] = need.get(c, 0) + 1\n    left = 0\n    have = {}\n    for right, c in enumerate(s2):\n        have[c] = have.get(c, 0) + 1\n        if right-left+1 > len(s1):\n            have[s2[left]] -= 1\n            if have[s2[left]] == 0: del have[s2[left]]\n            left += 1\n        if have == need: return True\n    return False", "extra": "<b>Fixed window</b> (len s1), counts compare karo.", "cpp": "bool checkInclusion(string s1, string s2) {\n    int need[26] = {}, have[26] = {};\n    for (char c : s1) need[c - 'a']++;\n    int left = 0;\n    for (int right = 0; right < (int)s2.size(); right++) {\n        have[s2[right] - 'a']++;\n        if (right - left + 1 > (int)s1.size()) have[s2[left++] - 'a']--;\n        if (right - left + 1 == (int)s1.size()) {\n            bool same = true;\n            for (int i = 0; i < 26; i++)\n                if (need[i] != have[i]) { same = false; break; }\n            if (same) return true;\n        }\n    }\n    return false;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q33 · Minimum Size Subarray Sum", "diff": "M", "note": "Sum ≥ target wala sabse chhota subarray.", "java": "public int minSubArrayLen(int target, int[] nums) {\n    int left = 0, sum = 0, best = Integer.MAX_VALUE;\n    for (int right = 0; right < nums.length; right++) {\n        sum += nums[right];\n        while (sum >= target) {\n            best = Math.min(best, right-left+1);\n            sum -= nums[left++];\n        }\n    }\n    return best == Integer.MAX_VALUE ? 0 : best;\n}", "python": "def minSubArrayLen(target, nums):\n    left = s = 0\n    best = float('inf')\n    for right, v in enumerate(nums):\n        s += v\n        while s >= target:\n            best = min(best, right-left+1)\n            s -= nums[left]\n            left += 1\n    return 0 if best == float('inf') else best", "extra": "Sum ≥ target hote hi <b>shrink</b>, minimum track karo.", "cpp": "int minSubArrayLen(int target, vector<int>& nums) {\n    int left = 0, sum = 0, best = INT_MAX;\n    for (int right = 0; right < (int)nums.size(); right++) {\n        sum += nums[right];\n        while (sum >= target) {\n            best = min(best, right - left + 1);\n            sum -= nums[left++];\n        }\n    }\n    return best == INT_MAX ? 0 : best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q34 · Fruit Into Baskets", "diff": "M", "note": "Max 2 distinct fruits — sabse lambi window.", "java": "public int totalFruit(int[] fruits) {\n    Map<Integer,Integer> m = new HashMap<>();\n    int left = 0, best = 0;\n    for (int right = 0; right < fruits.length; right++) {\n        m.merge(fruits[right], 1, Integer::sum);\n        while (m.size() > 2) {\n            m.merge(fruits[left], -1, Integer::sum);\n            if (m.get(fruits[left]) == 0) m.remove(fruits[left]);\n            left++;\n        }\n        best = Math.max(best, right-left+1);\n    }\n    return best;\n}", "python": "def totalFruit(fruits):\n    m = {}\n    left = best = 0\n    for right, f in enumerate(fruits):\n        m[f] = m.get(f, 0) + 1\n        while len(m) > 2:\n            m[fruits[left]] -= 1\n            if m[fruits[left]] == 0: del m[fruits[left]]\n            left += 1\n        best = max(best, right-left+1)\n    return best", "extra": "Window mein <b>max 2 types</b>; size > 2 toh left shrink.", "cpp": "int totalFruit(vector<int>& fruits) {\n    unordered_map<int, int> m;\n    int left = 0, best = 0;\n    for (int right = 0; right < (int)fruits.size(); right++) {\n        m[fruits[right]]++;\n        while ((int)m.size() > 2) {\n            m[fruits[left]]--;\n            if (m[fruits[left]] == 0) m.erase(fruits[left]);\n            left++;\n        }\n        best = max(best, right - left + 1);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q35 · Max Consecutive Ones III", "diff": "M", "note": "Max K zeros flip karke longest 1s streak.", "java": "public int longestOnes(int[] nums, int k) {\n    int left = 0, zero = 0, best = 0;\n    for (int right = 0; right < nums.length; right++) {\n        if (nums[right] == 0) zero++;\n        while (zero > k) {\n            if (nums[left++] == 0) zero--;\n        }\n        best = Math.max(best, right-left+1);\n    }\n    return best;\n}", "python": "def longestOnes(nums, k):\n    left = zero = best = 0\n    for right, v in enumerate(nums):\n        if v == 0: zero += 1\n        while zero > k:\n            if nums[left] == 0: zero -= 1\n            left += 1\n        best = max(best, right-left+1)\n    return best", "extra": "Window mein <b>zeros ≤ k</b>; zyada ho toh left badhao.", "cpp": "int longestOnes(vector<int>& nums, int k) {\n    int left = 0, zero = 0, best = 0;\n    for (int right = 0; right < (int)nums.size(); right++) {\n        if (nums[right] == 0) zero++;\n        while (zero > k) {\n            if (nums[left++] == 0) zero--;\n        }\n        best = max(best, right - left + 1);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q36 · Longest Subarray of 1's After Deleting One", "diff": "M", "note": "Ek element delete karke longest 1s subarray.", "java": "public int longestSubarray(int[] nums) {\n    int left = 0, zero = 0, best = 0;\n    for (int right = 0; right < nums.length; right++) {\n        if (nums[right] == 0) zero++;\n        while (zero > 1) {\n            if (nums[left++] == 0) zero--;\n        }\n        best = Math.max(best, right-left);\n    }\n    return best;\n}", "python": "def longestSubarray(nums):\n    left = zero = best = 0\n    for right, v in enumerate(nums):\n        if v == 0: zero += 1\n        while zero > 1:\n            if nums[left] == 0: zero -= 1\n            left += 1\n        best = max(best, right-left)\n    return best", "extra": "Window mein <b>at most 1 zero</b>; answer = length - 1.", "cpp": "int longestSubarray(vector<int>& nums) {\n    int left = 0, zero = 0, best = 0;\n    for (int right = 0; right < (int)nums.size(); right++) {\n        if (nums[right] == 0) zero++;\n        while (zero > 1) {\n            if (nums[left++] == 0) zero--;\n        }\n        best = max(best, right - left);\n    }\n    return best;\n}"}, {"type": "lc", "cat": "22. DSA Patterns", "title": "Q37 · Maximum Points from Cards", "diff": "M", "note": "Start/end se K cards — maximum points.", "java": "public int maxScore(int[] card, int k) {\n    int n = card.length;\n    int sum = 0;\n    for (int i = 0; i < k; i++) sum += card[i];\n    int best = sum;\n    for (int i = 0; i < k; i++) {\n        sum += card[n-1-i] - card[k-1-i];\n        best = Math.max(best, sum);\n    }\n    return best;\n}", "python": "def maxScore(card, k):\n    s = sum(card[:k])\n    best = s\n    for i in range(k):\n        s += card[len(card)-1-i] - card[k-1-i]\n        best = max(best, s)\n    return best", "extra": "Left ke K lo, phir <b>left hatao right add</b> karo — O(k).", "cpp": "int maxScore(vector<int>& card, int k) {\n    int n = card.size();\n    int sum = 0;\n    for (int i = 0; i < k; i++) sum += card[i];\n    int best = sum;\n    for (int i = 0; i < k; i++) {\n        sum += card[n - 1 - i] - card[k - 1 - i];\n        best = max(best, sum);\n    }\n    return best;\n}"}, {"cat": "23. Advanced DSA", "title": "Tree Node & Binary Tree", "note": "Tree = hierarchical structure. Har node ke paas <b>value + children</b>. Binary tree mein max 2 children (left/right). Sabse upar wala = root, bina child wale = leaf.", "type": "code", "java": "class TreeNode {\n    int val;\n    TreeNode left, right;\n    TreeNode(int val) { this.val = val; }\n}\n\n// sample binary tree\nTreeNode root = new TreeNode(1);\nroot.left = new TreeNode(2);\nroot.right = new TreeNode(3);\nroot.left.left = new TreeNode(4);", "python": "class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n# sample binary tree\nroot = TreeNode(1)\nroot.left = TreeNode(2)\nroot.right = TreeNode(3)\nroot.left.left = TreeNode(4)", "extra": "<b>Interview flow:</b> Tree = <code>Node</code> + <code>left/right pointers</code>. Java class fields explicitly; Python <code>__init__</code> mein. Traversal har problem ka base hai — pehle isi ka solid pattern banao.", "cpp": "#include <iostream>\nusing namespace std;\n\n// TreeNode = ek node jisme value + left/right pointers\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int val) : val(val), left(nullptr), right(nullptr) {}\n};\n\nint main() {\n    // sample binary tree\n    TreeNode* root = new TreeNode(1);\n    root->left = new TreeNode(2);\n    root->right = new TreeNode(3);\n    root->left->left = new TreeNode(4);\n\n    cout << root->val << \" \" << root->left->val << \" \"\n         << root->right->val << \" \" << root->left->left->val << \"\\n\";\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "Traversals — Pre / In / Post Order", "note": "Teeno order yaad rakhna aasan: <b>root kaha process hota hai</b>. Pre = root-pehle, In = root-beech, Post = root-aakhri.", "type": "code", "java": "void preorder(TreeNode n) {        // Root → Left → Right\n    if (n == null) return;\n    System.out.print(n.val + \" \");\n    preorder(n.left);\n    preorder(n.right);\n}\n\nvoid inorder(TreeNode n) {         // Left → Root → Right\n    if (n == null) return;\n    inorder(n.left);\n    System.out.print(n.val + \" \");\n    inorder(n.right);\n}\n\nvoid postorder(TreeNode n) {       // Left → Right → Root\n    if (n == null) return;\n    postorder(n.left);\n    postorder(n.right);\n    System.out.print(n.val + \" \");\n}", "python": "def preorder(n):        # Root → Left → Right\n    if not n: return\n    print(n.val, end=\" \")\n    preorder(n.left)\n    preorder(n.right)\n\ndef inorder(n):         # Left → Root → Right\n    if not n: return\n    inorder(n.left)\n    print(n.val, end=\" \")\n    inorder(n.right)\n\ndef postorder(n):       # Left → Right → Root\n    if not n: return\n    postorder(n.left)\n    postorder(n.right)\n    print(n.val, end=\" \")", "extra": "<b>Yaad rakhne ka trick:</b> naam hi batata hai root kab aata hai — <b>pre</b>-order mein root <b>pehle</b>, <b>in</b>-order mein root <b>beech</b>, <b>post</b>-order mein root <b>baad</b> mein. Inorder BST mein sorted order deta hai — interview favourite.", "cpp": "#include <iostream>\nusing namespace std;\n\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int val) : val(val), left(nullptr), right(nullptr) {}\n};\n\nvoid preorder(TreeNode* n) {        // Root → Left → Right\n    if (!n) return;\n    cout << n->val << \" \";\n    preorder(n->left);\n    preorder(n->right);\n}\n\nvoid inorder(TreeNode* n) {         // Left → Root → Right\n    if (!n) return;\n    inorder(n->left);\n    cout << n->val << \" \";\n    inorder(n->right);\n}\n\nvoid postorder(TreeNode* n) {       // Left → Right → Root\n    if (!n) return;\n    postorder(n->left);\n    postorder(n->right);\n    cout << n->val << \" \";\n}\n\nint main() {\n    TreeNode* root = new TreeNode(1);\n    root->left = new TreeNode(2);\n    root->right = new TreeNode(3);\n    root->left->left = new TreeNode(4);\n\n    cout << \"Pre:  \";\n    preorder(root);\n    cout << \"\\n\";\n    cout << \"In:   \";\n    inorder(root);\n    cout << \"\\n\";\n    cout << \"Post: \";\n    postorder(root);\n    cout << \"\\n\";\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "Level Order (BFS) Traversal", "note": "Queue se level-by-level traverse karo. Har level ke nodes ek saath. Isi se minimum depth aur 'print levels' wale questions solve hote hain.", "type": "code", "java": "List<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> res = new ArrayList<>();\n    if (root == null) return res;\n    Queue<TreeNode> q = new LinkedList<>();\n    q.add(root);\n    while (!q.isEmpty()) {\n        int size = q.size();          // current level count 🔥\n        List<Integer> level = new ArrayList<>();\n        for (int i = 0; i < size; i++) {\n            TreeNode cur = q.poll();\n            level.add(cur.val);\n            if (cur.left != null) q.add(cur.left);\n            if (cur.right != null) q.add(cur.right);\n        }\n        res.add(level);\n    }\n    return res;\n}", "python": "from collections import deque\n\ndef levelOrder(root):\n    res = []\n    if not root: return res\n    q = deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):   # current level count 🔥\n            cur = q.popleft()\n            level.append(cur.val)\n            if cur.left: q.append(cur.left)\n            if cur.right: q.append(cur.right)\n        res.append(level)\n    return res", "extra": "<b>Key pattern:</b> loop se pehle <code>size = q.size()</code> le lo — usi level ke nodes hain. Baad mein queue mein aaye nodes agle level ke hain. Right side view, zigzag, max level sum — sab isi template pe.", "cpp": "#include <iostream>\n#include <queue>\n#include <vector>\nusing namespace std;\n\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int val) : val(val), left(nullptr), right(nullptr) {}\n};\n\nvector<vector<int>> levelOrder(TreeNode* root) {\n    vector<vector<int>> res;\n    if (!root) return res;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        int size = (int)q.size();          // current level count 🔥\n        vector<int> level;\n        for (int i = 0; i < size; i++) {\n            TreeNode* cur = q.front();\n            q.pop();\n            level.push_back(cur->val);\n            if (cur->left) q.push(cur->left);\n            if (cur->right) q.push(cur->right);\n        }\n        res.push_back(level);\n    }\n    return res;\n}\n\nint main() {\n    TreeNode* root = new TreeNode(3);\n    root->left = new TreeNode(9);\n    root->right = new TreeNode(20);\n    root->right->left = new TreeNode(15);\n    root->right->right = new TreeNode(7);\n\n    for (auto& level : levelOrder(root)) {\n        for (int v : level) cout << v << \" \";\n        cout << \"\\n\";\n    }\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "Max Depth & Balanced Check", "note": "Recursion se height = 1 + max(left, right). Balanced = har node pe left-right height diff ek se zyada nahi.", "type": "code", "java": "int maxDepth(TreeNode root) {\n    if (root == null) return 0;\n    return 1 + Math.max(maxDepth(root.left),\n                        maxDepth(root.right));\n}\n\n// balanced: har node pe |lh - rh| <= 1\nint check(TreeNode n) {              // -1 = unbalanced\n    if (n == null) return 0;\n    int l = check(n.left);\n    int r = check(n.right);\n    if (l == -1 || r == -1) return -1;\n    if (Math.abs(l - r) > 1) return -1;\n    return 1 + Math.max(l, r);\n}", "python": "def maxDepth(root):\n    if not root: return 0\n    return 1 + max(maxDepth(root.left), maxDepth(root.right))\n\n# balanced: har node pe |lh - rh| <= 1\ndef check(n):                        # -1 = unbalanced\n    if not n: return 0\n    l = check(n.left)\n    r = check(n.right)\n    if l == -1 or r == -1: return -1\n    if abs(l - r) > 1: return -1\n    return 1 + max(l, r)", "extra": "<b>Flow:</b> max depth trivial recursion. Balanced check ka trick — height aur balanced ek saath return karo, unbalanced ka signal -1. Python <code>if not root</code> hi null check kar deta hai.", "cpp": "#include <algorithm>\n#include <cstdlib>\n#include <iostream>\nusing namespace std;\n\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int val) : val(val), left(nullptr), right(nullptr) {}\n};\n\nint maxDepth(TreeNode* root) {\n    if (!root) return 0;\n    return 1 + max(maxDepth(root->left), maxDepth(root->right));\n}\n\n// balanced: har node pe |lh - rh| <= 1\nint check(TreeNode* n) {                  // -1 = unbalanced\n    if (!n) return 0;\n    int l = check(n->left);\n    int r = check(n->right);\n    if (l == -1 || r == -1) return -1;\n    if (abs(l - r) > 1) return -1;\n    return 1 + max(l, r);\n}\n\nint main() {\n    TreeNode* root = new TreeNode(1);\n    root->left = new TreeNode(2);\n    root->right = new TreeNode(3);\n    root->left->left = new TreeNode(4);\n\n    cout << \"maxDepth = \" << maxDepth(root) << \"\\n\";\n    cout << \"balanced? \" << (check(root) != -1 ? \"haan\" : \"nahi\") << \"\\n\";\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "Binary Search Tree — Insert & Search", "note": "BST = left child chhota, right child bada. Har step pe aadha tree discard — O(log n) average. Inorder = sorted order.", "type": "code", "java": "TreeNode insert(TreeNode root, int val) {\n    if (root == null) return new TreeNode(val);\n    if (val < root.val) root.left = insert(root.left, val);\n    else root.right = insert(root.right, val);\n    return root;\n}\n\nboolean search(TreeNode root, int val) {\n    if (root == null) return false;\n    if (val == root.val) return true;\n    if (val < root.val) return search(root.left, val);\n    return search(root.right, val);\n}\n\n// inorder -> sorted array\nvoid inorder(TreeNode n, List<Integer> out) {\n    if (n == null) return;\n    inorder(n.left, out);\n    out.add(n.val);\n    inorder(n.right, out);\n}", "python": "def insert(root, val):\n    if not root: return TreeNode(val)\n    if val < root.val:\n        root.left = insert(root.left, val)\n    else:\n        root.right = insert(root.right, val)\n    return root\n\ndef search(root, val):\n    if not root: return False\n    if val == root.val: return True\n    if val < root.val: return search(root.left, val)\n    return search(root.right, val)\n\n# inorder -> sorted list\ndef inorder(n):\n    return inorder(n.left) + [n.val] + inorder(n.right) if n else []", "extra": "<b>BST ka khel:</b> insertion updated root return karta hai (reference issue bachta). Search binary search jaisa hi hai. Kth smallest = inorder ka kth element. Worst case (skewed) O(n) — isliye balanced trees (AVL/Red-Black) aate hain.", "cpp": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int val) : val(val), left(nullptr), right(nullptr) {}\n};\n\nTreeNode* insert(TreeNode* root, int val) {\n    if (!root) return new TreeNode(val);\n    if (val < root->val) root->left = insert(root->left, val);\n    else root->right = insert(root->right, val);\n    return root;\n}\n\nbool search(TreeNode* root, int val) {\n    if (!root) return false;\n    if (val == root->val) return true;\n    if (val < root->val) return search(root->left, val);\n    return search(root->right, val);\n}\n\n// inorder -> sorted array\nvoid inorder(TreeNode* n, vector<int>& out) {\n    if (!n) return;\n    inorder(n->left, out);\n    out.push_back(n->val);\n    inorder(n->right, out);\n}\n\nint main() {\n    TreeNode* root = nullptr;\n    for (int x : {5, 3, 7, 2, 4}) root = insert(root, x);\n\n    vector<int> sorted;\n    inorder(root, sorted);\n    for (int v : sorted) cout << v << \" \";\n    cout << \"\\n\";\n\n    cout << \"search(4): \" << (search(root, 4) ? \"mil gaya\" : \"nahi mila\") << \"\\n\";\n    cout << \"search(6): \" << (search(root, 6) ? \"mil gaya\" : \"nahi mila\") << \"\\n\";\n    return 0;\n}"}, {"type": "lc", "cat": "23. Advanced DSA", "title": "Q43 · Invert Binary Tree", "diff": "E", "note": "Har node ke left aur right subtree ko swap karo.", "java": "static TreeNode invertTree(TreeNode root) {\n    if (root == null) return null;\n    TreeNode temp = root.left;\n    root.left = invertTree(root.right);\n    root.right = invertTree(temp);\n    return root;\n}", "python": "def invert_tree(root):\n    if not root:\n        return None\n    root.left, root.right = invert_tree(root.right), invert_tree(root.left)\n    return root", "extra": "<b>Recursion:</b> Base case: null. Har node pe left aur right ko swap karo, phir recursively dono subtrees ko invert karo. O(n) time. Ye \"Google interview question\" famous hai — simple recursion.", "cpp": "struct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nTreeNode* invertTree(TreeNode* root) {\n    if (!root) return nullptr;\n    TreeNode* temp = root->left;\n    root->left = invertTree(root->right);\n    root->right = invertTree(temp);\n    return root;\n}"}, {"type": "lc", "cat": "23. Advanced DSA", "title": "Q44 · Maximum Depth of Binary Tree", "diff": "E", "note": "Tree ki sabse lambi root-to-leaf path ka length.", "java": "static int maxDepth(TreeNode root) {\n    if (root == null) return 0;\n    return 1 + Math.max(\n        maxDepth(root.left),\n        maxDepth(root.right));\n}", "python": "def max_depth(root):\n    if not root:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))", "extra": "<b>Post-order DFS:</b> null pe 0, warna 1 + max(left, right). O(n) time, O(h) space. BFS bhi ho sakta hai (level count).", "cpp": "struct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nint maxDepth(TreeNode* root) {\n    if (!root) return 0;\n    return 1 + max(maxDepth(root->left), maxDepth(root->right));\n}"}, {"type": "lc", "cat": "23. Advanced DSA", "title": "Q45 · Level Order Traversal (BFS)", "diff": "M", "note": "Tree ke nodes ko level by level print karo — har level alag list mein.", "java": "static List<List<Integer>> levelOrder(TreeNode root) {\n    List<List<Integer>> result = new ArrayList<>();\n    if (root == null) return result;\n    Queue<TreeNode> q = new LinkedList<>();\n    q.offer(root);\n    while (!q.isEmpty()) {\n        int size = q.size();\n        List<Integer> level = new ArrayList<>();\n        for (int i = 0; i < size; i++) {\n            TreeNode node = q.poll();\n            level.add(node.val);\n            if (node.left != null) q.offer(node.left);\n            if (node.right != null) q.offer(node.right);\n        }\n        result.add(level);\n    }\n    return result;\n}", "python": "from collections import deque\ndef level_order(root):\n    if not root: return []\n    result, q = [], deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        result.append(level)\n    return result", "extra": "<b>BFS pattern:</b> Queue mein root daalo, har level ke liye size note karo, utne nodes process karo, unke children queue mein. O(n) time. Ye pattern Zigzag, Right Side View, Bottom View sab mein use hota hai.", "cpp": "struct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nvector<vector<int>> levelOrder(TreeNode* root) {\n    vector<vector<int>> result;\n    if (!root) return result;\n    queue<TreeNode*> q;\n    q.push(root);\n    while (!q.empty()) {\n        int size = (int)q.size();\n        vector<int> level;\n        for (int i = 0; i < size; i++) {\n            TreeNode* node = q.front();\n            q.pop();\n            level.push_back(node->val);\n            if (node->left) q.push(node->left);\n            if (node->right) q.push(node->right);\n        }\n        result.push_back(level);\n    }\n    return result;\n}"}, {"type": "lc", "cat": "23. Advanced DSA", "title": "Q46 · Lowest Common Ancestor (LCA)", "diff": "M", "note": "Do nodes ka sabse neeche ka common ancestor dhundho.", "java": "static TreeNode lowestCommonAncestor(TreeNode root,\n        TreeNode p, TreeNode q) {\n    if (root == null || root == p || root == q)\n        return root;\n    TreeNode left = lowestCommonAncestor(root.left, p, q);\n    TreeNode right = lowestCommonAncestor(root.right, p, q);\n    if (left != null && right != null) return root;\n    return left != null ? left : right;\n}", "python": "def lca(root, p, q):\n    if not root or root == p or root == q:\n        return root\n    left = lca(root.left, p, q)\n    right = lca(root.right, p, q)\n    if left and right:\n        return root\n    return left or right", "extra": "<b>Key insight:</b> Agar dono nodes left subtree mein hain → left. Agar dono right mein → right. Agar ek left, ek right → current root LCA hai. O(n) time. BST mein simpler approach bhi hai (values compare karke).", "cpp": "struct TreeNode {\n    int val;\n    TreeNode* left;\n    TreeNode* right;\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\n};\n\nTreeNode* lowestCommonAncestor(TreeNode* root, TreeNode* p, TreeNode* q) {\n    if (!root || root == p || root == q) return root;\n    TreeNode* left = lowestCommonAncestor(root->left, p, q);\n    TreeNode* right = lowestCommonAncestor(root->right, p, q);\n    if (left && right) return root;\n    return left ? left : right;\n}"}, {"cat": "23. Advanced DSA", "title": "Sawaal 10 — Trees ke Questions", "note": "Node, traversals, BFS, BST test karo.", "type": "quiz", "questions": [{"q": "Preorder traversal ka order kya hai?", "opts": ["Left → Root → Right", "Root → Left → Right", "Left → Right → Root", "Right → Left → Root"], "ans": 1, "expl": "Pre-order: Root pehle, phir left, phir right. Naam se yaad rakho — root <b>pre</b> (pehle)."}, {"q": "Tree ki height nikalne ka recursion formula?", "opts": ["1 + max(left, right)", "max(left, right) - 1", "left + right", "1 + left.right"], "ans": 0, "expl": "Har level +1. Null node height 0 deta hai. Max of left/right + 1."}, {"q": "Level order traversal kaunsa data structure use karta hai?", "opts": ["Stack", "Queue", "PriorityQueue", "TreeSet"], "ans": 1, "expl": "BFS = queue. Queue se node nikalo, uske children queue mein daalo. Level-wise traversal milta."}, {"q": "BST mein search ki time complexity (balanced)?", "opts": ["O(n)", "O(log n)", "O(1)", "O(n²)"], "ans": 1, "expl": "Har step pe left/right decide hota — aadha tree discard. Depth ~log n. Worst (skewed) O(n)."}, {"q": "BST ka inorder traversal kya deta hai?", "opts": ["Reverse sorted", "Sorted order", "Preorder", "Kuch nahi"], "ans": 1, "expl": "Inorder (Left → Root → Right) hamesha <b>ascending</b> order deta hai — ye BST ki guarantee hai."}, {"q": "Dono subtrees ki height ka diff kab tak OK (balanced)?", "opts": ["0", "1", "2", "3"], "ans": 1, "expl": "Balanced condition: |left - right| &lt;= 1. Isse zyada = unbalanced."}]}, {"cat": "23. Advanced DSA", "title": "Graph Representation — List vs Matrix", "note": "Graph = nodes (vertices) + edges. Do standard tarike: <b>adjacency list</b> (har node ki neighbours ki list) aur <b>adjacency matrix</b> (n×n table). List zyada popular hai.", "type": "code", "java": "// ADJACENCY LIST (recommended 🔥)\nList<List<Integer>> adj = new ArrayList<>();\nfor (int i = 0; i < n; i++) adj.add(new ArrayList<>());\nadj.get(u).add(v);      // edge u -> v\nadj.get(v).add(u);      // undirected: dono side\n\n// ADJACENCY MATRIX (dense graphs)\nboolean[][] mat = new boolean[n][n];\nmat[u][v] = true;       // edge u -> v\n\n// Weighted edge: int[][] ya List<int[]>", "python": "# ADJACENCY LIST (recommended 🔥)\nadj = [[] for _ in range(n)]\nadj[u].append(v)        # edge u -> v\nadj[v].append(u)        # undirected: dono side\n\n# with dict (labels/weights)\ng = {i: [] for i in range(n)}\ng[u].append((v, w))     # weighted edge\n\n# ADJACENCY MATRIX\nmat = [[False]*n for _ in range(n)]\nmat[u][v] = True", "extra": "<b>Kab kaunsa:</b> List = sparse graphs (edges kam) — space O(V+E). Matrix = dense — O(V²) space lekin edge check O(1). Interview mein 90% baar adjacency list hi use hoti. Python dict-of-lists labels ke liye better.", "cpp": "#include <iostream>\n#include <utility>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n = 5;\n\n    // ADJACENCY LIST (recommended 🔥)\n    vector<vector<int>> adj(n);\n    int u = 1, v = 3;\n    adj[u].push_back(v);      // edge u -> v\n    adj[v].push_back(u);      // undirected: dono side\n\n    // ADJACENCY MATRIX (dense graphs)\n    vector<vector<bool>> mat(n, vector<bool>(n, false));\n    mat[u][v] = true;         // edge u -> v\n\n    cout << \"edge 1->3 present: \" << mat[1][3] << \"\\n\";\n    cout << \"adj[1]: \";\n    for (int x : adj[1]) cout << x << \" \";\n    cout << \"\\n\";\n\n    // Weighted edge: vector<vector<pair<int,int>>>\n    vector<vector<pair<int, int>>> wadj(n);\n    wadj[u].push_back({v, 7});      // edge 1->3 weight 7\n    cout << \"weight(1->3): \" << wadj[1][0].second << \"\\n\";\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "Graph BFS — Level by Level", "note": "BFS = queue. Level order guarantee — isliye <b>shortest path (unweighted)</b> aur minimum steps wale questions mein use hota.", "type": "code", "java": "int[] bfs(int start, int n, List<List<Integer>> adj) {\n    boolean[] vis = new boolean[n];\n    int[] dist = new int[n];\n    Arrays.fill(dist, -1);\n    Queue<Integer> q = new LinkedList<>();\n\n    vis[start] = true;\n    q.add(start);\n    dist[start] = 0;\n\n    while (!q.isEmpty()) {\n        int u = q.poll();\n        for (int v : adj.get(u)) {\n            if (!vis[v]) {\n                vis[v] = true;\n                dist[v] = dist[u] + 1;   // level 🔥\n                q.add(v);\n            }\n        }\n    }\n    return dist;   // start se distances\n}", "python": "from collections import deque\n\ndef bfs(start, n, adj):\n    dist = [-1]*n\n    q = deque([start])\n    dist[start] = 0\n\n    while q:\n        u = q.popleft()\n        for v in adj[u]:\n            if dist[v] == -1:          # unvisited\n                dist[v] = dist[u] + 1  # level 🔥\n                q.append(v)\n    return dist   # start se distances", "extra": "<b>Pattern:</b> visited + queue + level tracking. Unweighted graph mein BFS jis node pe pehli baar pahuche, wahi shortest distance hai. Java: boolean[] vis, Python: <code>dist[v] == -1</code> hi visited check hai.", "cpp": "#include <iostream>\n#include <queue>\n#include <vector>\nusing namespace std;\n\nvector<int> bfs(int start, int n, vector<vector<int>>& adj) {\n    vector<bool> vis(n, false);\n    vector<int> dist(n, -1);\n    queue<int> q;\n\n    vis[start] = true;\n    q.push(start);\n    dist[start] = 0;\n\n    while (!q.empty()) {\n        int u = q.front();\n        q.pop();\n        for (int v : adj[u]) {\n            if (!vis[v]) {\n                vis[v] = true;\n                dist[v] = dist[u] + 1;   // level 🔥\n                q.push(v);\n            }\n        }\n    }\n    return dist;   // start se distances\n}\n\nint main() {\n    int n = 5;\n    vector<vector<int>> adj(n);\n    adj[0].push_back(1);\n    adj[1].push_back(0);\n    adj[1].push_back(2);\n    adj[2].push_back(1);\n    adj[2].push_back(3);\n    adj[3].push_back(2);\n    // node 4 disconnected hai\n\n    vector<int> dist = bfs(0, n, adj);\n    for (int i = 0; i < n; i++) cout << \"0 -> \" << i << \" = \" << dist[i] << \"\\n\";\n    return 0;\n}"}, {"cat": "23. Advanced DSA", "title": "DFS & Number of Islands", "note": "DFS har component ko pura explore karta hai. Islands = connected components count — grid pe 4-direction DFS.", "type": "code", "java": "// grid mein islands count (grid = 2D char array)\nint numIslands(char[][] grid) {\n    int m = grid.length, n = grid[0].length, cnt = 0;\n    for (int i = 0; i < m; i++)\n        for (int j = 0; j < n; j++)\n            if (grid[i][j] == '1') { cnt++; dfs(grid, i, j); }\n    return cnt;\n}\n\nvoid dfs(char[][] g, int i, int j) {\n    if (i < 0 || j < 0 || i >= g.length || j >= g[0].length\n        || g[i][j] != '1') return;\n    g[i][j] = '0';        // visited mark 🔥\n    dfs(g, i+1, j); dfs(g, i-1, j);\n    dfs(g, i, j+1); dfs(g, i, j-1);\n}", "python": "def numIslands(grid):\n    def dfs(i, j):\n        if (i < 0 or j < 0 or i >= len(grid)\n                or j >= len(grid[0])
