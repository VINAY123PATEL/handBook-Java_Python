<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java ⇄ Python ⇄ C++ — Rosetta DSA Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0e13;
    --panel:#12161d;
    --panel-2:#0f1319;
    --line:#232935;
    --text:#e7ecf3;
    --muted:#8a93a3;
    --muted-2:#5b6472;
    --java:#ef8b28;
    --java-dim:#3a2a17;
    --py-blue:#4b8bd4;
    --py-yellow:#f2c94c;
    --py-dim:#17263a;
    --cpp:#a78bfa;
    --cpp-dim:#2a2140;
    --green:#2ecc71;
    --red:#e74c3c;
    --accent-line: repeating-linear-gradient(90deg, var(--muted-2) 0 6px, transparent 6px 12px);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(239,139,40,0.07), transparent 60%),
      radial-gradient(1200px 700px at 100% 10%, rgba(75,139,212,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  code, .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
    background:rgba(11,14,19,0.85);
    backdrop-filter: blur(10px);
    gap:14px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:15px;
    padding:6px 10px; border-radius:8px;
    background:linear-gradient(135deg, var(--java-dim), var(--py-dim));
    border:1px solid var(--line);
    letter-spacing:0.5px;
  }
  .brand .mark span.j{color:var(--java);}
  .brand .mark span.p{color:var(--py-yellow);}
  .brand .mark span.c{color:var(--py-blue);}
  .brand h1{ font-size:16px; margin:0; font-weight:600; color:var(--muted);}
  .brand h1 b{color:var(--text); font-weight:700;}
  .head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand{ cursor:pointer; }
  .brand:hover h1 b{ color:var(--java); }
  .brand .mark{ transition:.15s; }
  .brand:hover .mark{ border-color:var(--java); }

  /* ---------- Home / Front page ---------- */
  .home-hero{ text-align:center; padding:20px 0 4px 0; }
  .home-hero .home-mark{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    display:inline-block; padding:9px 16px; border-radius:10px;
    background:linear-gradient(135deg, var(--java-dim), var(--py-dim));
    border:1px solid var(--line); letter-spacing:1px; margin-bottom:20px;
  }
  .home-hero .home-mark .j{color:var(--java);} .home-hero .home-mark .p{color:var(--py-yellow);}
  .home-hero h2{ font-size:clamp(30px,5vw,46px); margin:0 0 10px 0; font-weight:700; }
  .home-hero p.lead{ color:var(--muted); font-size:15.5px; max-width:660px; margin:0 auto 24px auto; line-height:1.65; }
  .home-stats{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .home-stat{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 24px; min-width:110px;
  }
  .home-stat b{ display:block; font-size:22px; font-family:'JetBrains Mono',monospace; color:var(--py-yellow); }
  .home-stat span{ font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1px; }
  .home-chapters{ margin-top:28px; display:flex; flex-direction:column; gap:18px; }
  .home-ch{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px 18px; }
  .home-ch-head{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--java);
    text-transform:uppercase; letter-spacing:1.5px; margin-bottom:13px;
  }
  .home-ch-head .n{ color:var(--muted-2); margin-right:8px; }
  .home-ch-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:8px; }
  .home-topic{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:10px 12px; border-radius:9px; cursor:pointer; font-size:13px;
    font-family:'Space Grotesk',sans-serif; transition:.15s; line-height:1.4;
  }
  .home-topic:hover{ color:var(--text); border-color:var(--java); background:rgba(239,139,40,0.06); transform:translateY(-1px); }
  .home-topic .qn{ font-family:'JetBrains Mono',monospace; color:var(--muted-2); font-size:11px; margin-right:8px; }
  .home-topic.quiz-t{ border-left:3px solid var(--py-yellow); }
  .home-topic.quiz-t .qn{ color:var(--py-yellow); }
  .diff{
    font-family:'JetBrains Mono',monospace; font-size:11px; vertical-align:middle;
    padding:3px 10px; border-radius:6px; letter-spacing:1px; margin-left:10px;
  }
  .d-M{ color:var(--py-yellow); background:rgba(242,201,76,0.1); border:1px solid rgba(242,201,76,0.35); }
  .d-H{ color:var(--red); background:rgba(231,76,60,0.12); border:1px solid rgba(231,76,60,0.4); }
  .d-E{ color:var(--green); background:rgba(46,204,113,0.1); border:1px solid rgba(46,204,113,0.35); }
  .d-I{ color:var(--py-blue); background:rgba(75,139,212,0.1); border:1px solid rgba(75,139,212,0.4); }
  .qa-box{
    background:var(--panel-2); border:1px solid var(--line);
    border-left:3px solid var(--py-blue); border-radius:10px; padding:18px 20px;
    font-size:15px; color:var(--muted); line-height:1.8;
  }
  .qa-box b{ color:var(--text); }
  .qa-box code{ color:var(--py-yellow); font-size:13px; }
  .qa-box ul{ margin:8px 0 0 0; padding-left:20px; }
  .qa-box li{ margin-bottom:6px; }

  .score-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px;
    font-size:13px; color:var(--muted); font-family:'JetBrains Mono',monospace;
  }
  .score-pill .star{ color:var(--py-yellow); }

  .index-toggle{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; cursor:pointer;
    font-size:13px; color:var(--muted); user-select:none; text-decoration:none;
    transition:.15s;
  }
  .index-toggle:hover{ border-color:var(--muted-2); color:var(--text); }

  /* ---------- Progress ---------- */
  .progress-wrap{ padding:10px 28px 0 28px; }
  .progress-track{
    height:3px; width:100%; background:var(--line); border-radius:2px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--java), var(--py-blue));
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-meta{
    display:flex; justify-content:space-between; font-size:11px; color:var(--muted-2);
    margin-top:6px; font-family:'JetBrains Mono',monospace; letter-spacing:.5px;
  }

  /* ---------- Layout ---------- */
  .stage{
    flex:1; display:flex; width:100%; max-width:1180px; margin:0 auto;
    padding:26px 28px 90px 28px; position:relative;
  }

  /* ---------- Sidebar index (drawer) ---------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:.25s; z-index:40;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:-360px; width:340px; height:100%;
    background:var(--panel-2); border-left:1px solid var(--line);
    z-index:41; transition:right .3s cubic-bezier(.4,0,.2,1);
    overflow-y:auto; padding:20px 0 40px 0;
  }
  .drawer.open{ right:0; }
  .drawer h3{
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted-2); padding:0 20px 12px 20px; margin:0;
    border-bottom:1px solid var(--line); padding-bottom:14px;
  }
  .drawer-list{ list-style:none; margin:0; padding:8px 0; }
  .drawer-list li{
    padding:10px 20px; font-size:13.5px; color:var(--muted);
    cursor:pointer; display:flex; gap:10px; align-items:baseline;
    border-left:2px solid transparent;
    transition:.15s;
  }
  .drawer-list li:hover{ background:rgba(255,255,255,0.03); color:var(--text); }
  .drawer-list li.active{
    color:var(--text); border-left-color:var(--java); background:rgba(239,139,40,0.06);
    font-weight:600;
  }
  .drawer-list li .num{ font-family:'JetBrains Mono',monospace; color:var(--muted-2); font-size:11px; min-width:20px;}
  .drawer-list li.cat{
    text-transform:uppercase; letter-spacing:1px; font-size:10.5px; color:var(--muted-2);
    cursor:default; padding-top:16px; padding-bottom:4px;
  }
  .drawer-list li.cat:hover{ background:none; }
  .drawer-list li .badge-q{
    font-size:10px; color:var(--py-yellow); border:1px solid var(--py-dim); border-radius:4px;
    padding:1px 5px; margin-left:auto; font-family:'JetBrains Mono',monospace;
  }

  /* ---------- Slide ---------- */
  .slide{ width:100%; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted-2);
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px;
  }
  .eyebrow .ch{
    color:var(--java); background:var(--java-dim); padding:2px 8px; border-radius:6px;
    letter-spacing:.5px; margin-right:8px;
  }
  .slide h2{
    font-size:clamp(24px,3.6vw,34px); margin:0 0 8px 0; font-weight:700; line-height:1.15;
  }
  .slide .note{
    color:var(--muted); font-size:14.5px; line-height:1.65; max-width:820px; margin-bottom:26px;
  }
  .slide .note b{ color:var(--text); }

  /* ---------- Rosetta split ---------- */
  .rosetta{
    display:grid; grid-template-columns: 1fr 30px 1fr 30px 1fr; gap:0; align-items:stretch;
  }
  .col{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 20px 18px; min-width:0;
  }
  .col.java{ border-top:3px solid var(--java); }
  .col.python{ border-top:3px solid var(--py-blue); }
  .col.cpp{ border-top:3px solid var(--cpp); }
  .col-head{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .dot{ width:9px; height:9px; border-radius:50%; }
  .dot.j{ background:var(--java); box-shadow:0 0 10px var(--java);}
  .dot.p{ background:var(--py-blue); box-shadow:0 0 10px var(--py-blue);}
  .dot.c{ background:var(--cpp); box-shadow:0 0 10px var(--cpp);}
  .col-head span{ font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  pre{
    margin:0; overflow-x:auto; padding:14px 16px; border-radius:10px;
    background:var(--panel-2); border:1px solid var(--line);
    font-size:13px; line-height:1.65;
  }
  pre code{ color:#d6dee8; white-space:pre; }
  .kw{color:#ef8b28;} .str{color:#8bd490;} .cm{color:#5b6472; font-style:italic;} .fn{color:#4b8bd4;} .num{color:#f2c94c;}

  .spine{ display:flex; align-items:center; justify-content:center; position:relative; }
  .spine::before{
    content:""; position:absolute; top:8%; bottom:8%; left:50%;
    width:1px; background:var(--accent-line);
  }
  .spine .glyph{
    position:relative; z-index:2; background:var(--bg);
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--muted-2);
  }

  /* ---------- Table type slides ---------- */
  .method-table{ width:100%; border-collapse:collapse; }
  .method-table th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:1px; color:var(--muted-2);
    padding:0 14px 10px 14px; font-weight:500;
  }
  .method-table td{
    padding:12px 14px; border-top:1px solid var(--line); vertical-align:top; font-size:13.5px;
  }
  .method-table tr:hover td{ background:rgba(255,255,255,0.015); }
  .method-table code{
    background:var(--panel-2); border:1px solid var(--line); padding:2px 7px; border-radius:6px;
    font-size:12.5px; color:#d6dee8;
  }
  .col.wide{ grid-column: 1 / -1; }

  .extra-box{
    margin-top:20px; padding:16px 18px; border:1px dashed var(--line); border-radius:12px;
    background:rgba(255,255,255,0.012);
  }
  .extra-box .tag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:1px; color:var(--py-yellow); margin-bottom:8px; display:block;
  }

  /* ---------- Done / Mark ---------- */
  .done-row{ display:flex; align-items:center; gap:10px; margin-top:16px; }
  .done-btn{
    flex:1; border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:1px;
    padding:11px; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .done-btn:hover{ border-color:var(--muted-2); color:var(--text); }
  .done-btn.is-done{
    border-color:var(--green); color:#0b0e13; font-weight:700;
    background:linear-gradient(135deg,var(--green),#2ecc71);
  }
  .done-count{ color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono',monospace; }
  .done-count b{ color:var(--green); }
  .drawer-list li.done .num, .drawer-list li.done{ color:var(--green); }
  .home-topic.done{ border-color:var(--green); color:var(--green); }
  .home-topic.done .qn{ background:rgba(46,204,113,0.15); color:var(--green); }

  /* ---------- Quiz ---------- */
  .quiz-list{ display:flex; flex-direction:column; gap:18px; }
  .quiz-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 20px 18px 20px; border-top:3px solid var(--py-yellow);
  }
  .quiz-q{ font-size:15.5px; font-weight:600; line-height:1.55; margin-bottom:14px; }
  .quiz-q .qnum{
    font-family:'JetBrains Mono',monospace; color:var(--py-yellow); margin-right:8px;
    background:var(--py-dim); padding:2px 8px; border-radius:6px; font-size:12.5px;
  }
  .quiz-opts{ display:grid; gap:9px; }
  .quiz-opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:10px; cursor:pointer; font-size:14px;
    font-family:'Space Grotesk',sans-serif; transition:.15s; line-height:1.5;
  }
  .quiz-opt:hover:not(:disabled){ border-color:var(--muted-2); }
  .quiz-opt.correct{ border-color:var(--green); background:rgba(46,204,113,0.12); color:#8ff0bb; }
  .quiz-opt.wrong{ border-color:var(--red); background:rgba(231,76,60,0.12); color:#f5a5a0; text-decoration:line-through; }
  .quiz-opt:disabled{ opacity:.55; cursor:not-allowed; }
  .quiz-explain{
    display:none; margin-top:14px; padding:14px 16px; border-left:3px solid var(--green);
    background:rgba(46,204,113,0.06); border-radius:0 10px 10px 0;
    font-size:13.5px; line-height:1.65; color:var(--muted);
  }
  .quiz-explain.show{ display:block; }
  .quiz-explain b{ color:var(--text); }
  .quiz-explain .ans-tag{ color:var(--green); font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px; }

  /* ---------- Roadmap ---------- */
  .roadmap{ display:flex; flex-direction:column; gap:6px; max-width:620px; margin-top:6px; }
  .rm-step{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line);
    padding:13px 18px; border-radius:12px; transition:.15s;
  }
  .rm-step:hover{ border-color:var(--muted-2); transform:translateX(4px); }
  .rm-num{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#0b0e13;
    background:linear-gradient(135deg,var(--java),var(--py-blue));
    width:26px; height:26px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rm-name{ font-weight:600; font-size:15px; }
  .rm-sub{ font-size:12px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; margin-left:auto; }
  .rm-arrow{ text-align:center; color:var(--muted-2); font-size:13px; line-height:1; }

  /* ---------- Footer nav ---------- */
  footer{
    position:sticky; bottom:0; z-index:20;
    border-top:1px solid var(--line);
    background:rgba(11,14,19,0.9); backdrop-filter: blur(10px);
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 20px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;
    font-family:'Space Grotesk',sans-serif;
    transition:.15s;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--muted-2); transform:translateY(-1px); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .nav-btn.primary{
    background:linear-gradient(135deg, var(--java), #d9720f);
    border:none; color:#1a1206;
  }
  .dots-mini{ display:flex; gap:5px; flex-wrap:wrap; max-width:340px; justify-content:center; }
  .dots-mini span{
    width:6px; height:6px; border-radius:50%; background:var(--line); transition:.2s;
  }
  .dots-mini span.active{ background:var(--java); width:16px; border-radius:4px; }
  .hint{ font-size:11px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; display:none; }
  @media(min-width:900px){ .hint{ display:block; } }

  @media(max-width:820px){
    .rosetta{ grid-template-columns:1fr; }
    .spine{ height:34px; }
    .spine::before{ top:50%; bottom:auto; left:8%; right:8%; width:auto; height:1px; }
    .spine .glyph{ transform:rotate(90deg); }
    .drawer{ width:88%; right:-100%; }
    header{ padding:14px 16px; }
    .stage{ padding:20px 16px 90px 16px; }
    footer{ padding:12px 16px; }
    .dots-mini{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"><span class="j">JAVA</span> ⇄ <span class="p">PYTHON</span> ⇄ <span class="c">C++</span></div>
    <h1>Rosetta — <b>DSA Handbook</b></h1>
  </div>
  <div class="head-right">
    <a class="index-toggle" href="index.html" title="LeetCode 267 questions kholo" onclick="if(window.parent&&window.parent.openPage){window.parent.openPage('leetcode');}return false;">⚡ 267 Qs</a>
    <div class="index-toggle" id="homeBtn" title="Front page pe jaao">⌂ Front</div>
    <div class="score-pill"><span class="star">★</span><span id="scoreVal">0</span> / <span id="scoreTotal">0</span></div>
    <div class="index-toggle" id="drawerBtn">☰ Index <span class="hint" style="display:inline">(ya ←/→ keys)</span></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="metaLeft">SLIDE 1</span>
    <span id="metaRight">/ N</span>
  </div>
</div>

<div class="stage">
  <div class="slide" id="slide"></div>
</div>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <h3 id="drawerTitle">Complete index</h3>
  <ul class="drawer-list" id="drawerList"></ul>
</div>

<footer>
  <button class="nav-btn" id="prevBtn">← Prev</button>
  <div class="dots-mini" id="dotsMini"></div>
  <button class="nav-btn primary" id="nextBtn">Next →</button>
</footer>

<script>
/* ============================================================
   DATA — har slide ek object hai.
   type: "code"    -> java/python code block side by side
   type: "table"   -> method mapping table
   type: "quiz"    -> interactive MCQ slide (questions: [q, opts, ans, expl])
   type: "roadmap" -> full learning-flow diagram
   ============================================================ */

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const DATA = [{"type": "home", "title": "Front Page", "note": "", "java": "", "python": ""}, {"cat": "00. Programming Introduction", "title": "Programming Kya Hai?", "note": "Programming ka matlab hai computer ko instructions dena — step by step command. Ye koi magic nahi hai, bas ek language hai jo computer samajhta hai.", "type": "table", "headers": ["Concept", "Kya Hai?", "Example"], "rows": [["Program", "Ek set of instructions jo koi kaam karta hai", "Recipe for making chai"], ["Source Code", "Human-readable instructions", "print('Hello')"], ["Compiler", "Source code ko machine code mein convert karta hai", "Java: javac Main.java"], ["Interpreter", "Code line by line execute karta hai", "Python: python main.py"], ["Bug", "Code mein galti", "Typo, logic error"], ["Debug", "Bug dhundhna aur fix karna", "IDE debugger use karna"]], "extra": "<b>Hinglish mein:</b> Programming = computer ko bolna ki ye kar, wo kar. Pehle tum likhte ho (source code), phir computer padhta hai aur karta hai. Compiler ya interpreter ye kaam karta hai."}, {"cat": "00. Programming Introduction", "title": "Compiler vs Interpreter — Dono Kaise Kaam Karte Hain?", "note": "Dono ka kaam same hai — source code ko computer ki language mein convert karna. Fark sirf process mein hai.", "type": "code", "java": "// COMPILER (Java)\n// Step 1: Source code likho\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n    }\n}\n\n// Step 2: Compiler compile karega\n// javac Main.java\n\n// Step 3: Bytecode bane ga\n// Main.class (bytecode file)\n\n// Step 4: JVM chalayega\n// java Main\n// Output: Hello", "python": "# INTERPRETER (Python)\n# Step 1: Source code likho\nprint(\"Hello\")\n\n# Step 2: Interpreter directly chalata hai\n# python main.py\n# Output: Hello\n\n# Koi alag compilation step nahi\n# Line by line execute hota hai\n\n# Python internally CPython use karta hai\n# jo bytecode banata hai (.pyc files)\n# but tumhe ye dikhta nahi", "extra": "<b>Key difference:</b> Java = Compile phir Run (2 steps). Python = Direct Run (1 step). Java ka compiler errors compile time pe dikhata hai. Python ka errors run time pe dikhte hain.", "cpp": "// COMPILER (C++)\n// Step 1: Source code likho\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello\" << endl;\n    return 0;\n}\n\n// Step 2: Compiler compile karega\n// g++ main.cpp -o main.exe\n\n// Step 3: Machine code / executable bane ga\n// main.exe (binary file)\n\n// Step 4: OS directly chalayega\n// ./main.exe\n// Output: Hello\n// Koi JVM / VM beech mein nahi — native machine code"}, {"cat": "00. Programming Introduction", "title": "IDE / Editor — Coding Kahan Karte Hain?", "note": "IDE = Integrated Development Environment. Ye tumhara coding workspace hai — jahan code likhte ho, run karte ho, debug karte ho.", "type": "table", "headers": ["Tool", "Type", "Java Support", "Python Support", "Best For"], "rows": [["VS Code", "Editor + Extensions", "Haan", "Haan", "Dono ke liye best free option"], ["IntelliJ IDEA", "Full IDE", "Best in class", "Nahi", "Java development"], ["PyCharm", "Full IDE", "Nahi", "Best in class", "Python development"], ["Eclipse", "Full IDE", "Haan", "Haan", "Purane projects"], ["Online: Replit", "Browser-based", "Haan", "Haan", "Quick practice"], ["Notepad++", "Lightweight editor", "Basic", "Basic", "Sirf text editing"]], "extra": "<b>Beginner advice:</b> Agar dono seekh rahe ho to VS Code use karo — ek hi tool mein Java aur Python dono chal jayega. Agar sirf Java hai to IntelliJ, sirf Python hai to PyCharm."}, {"cat": "01. Java & Python Introduction", "title": "Java Kya Hai?", "note": "Java 1995 mein bani thi James Gosling ne Sun Microsystems mein. motto tha: <b>\"Write Once, Run Anywhere\"</b> — ek baar likho, har jagah chalao.", "type": "table", "headers": ["Fact", "Detail"], "rows": [["Creator", "James Gosling"], ["Year", "1995"], ["Company", "Sun Microsystems (now Oracle)"], ["Type", "Static, Compiled (to bytecode)"], ["Platform", "JVM (Java Virtual Machine)"], ["Motto", "Write Once, Run Anywhere (WORA)"], ["Latest LTS", "Java 21 (2023)"], ["Used in", "Enterprise apps, Android, Banking, Web backends"]], "extra": "<b>Why Java?</b> C++ bahut complex tha. Java ne C++ ki power rakhi but complexity kam ki. Memory management automatic hai (garbage collection). Security bahut strong hai."}, {"cat": "01. Java & Python Introduction", "title": "Python Kya Hai?", "note": "Python 1991 mein bani thi Guido van Rossum ne. motto: <b>\"Batteries Included\"</b> aur <b>\"Simple is Better Than Complex\"</b>. Duniya ki sabse popular beginner language.", "type": "table", "headers": ["Fact", "Detail"], "rows": [["Creator", "Guido van Rossum"], ["Year", "1991"], ["Type", "Dynamic, Interpreted"], ["Platform", "CPython, PyPy, Jython"], ["Motto", "Batteries Included / Simple is Better"], ["Latest", "Python 3.12 (2023)"], ["Used in", "AI/ML, Data Science, Web, Automation, Scripts"]], "extra": "<b>Why Python?</b> Syntax bahut simple hai — padho to English lagta hai. Data Science aur AI mein king hai. Rapid prototyping ke liye best. Disadvantage = Java se slow hai (general purpose mein)."}, {"cat": "01. Java & Python Introduction", "title": "Java & Python Ka Flow — Kaise Chalte Hain?", "note": "Java 2-step process: compile + run. Python 1-step: direct run. Dono ultimately machine instructions banate hain.", "type": "code", "java": "// JAVA KA FLOW\n// Step 1: .java file likho\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello Java\");\n    }\n}\n\n// Step 2: Compile\n// javac Main.java  -->  Main.class (bytecode)\n\n// Step 3: Run via JVM\n// java Main\n// Output: Hello Java\n\n// JVM bytecode ko machine code mein convert karta hai\n// Tumhara program HAR operating system pe chalta hai\n// kyunki JVM alag-alag OS ke liye hai", "python": "# PYTHON KA FLOW\n# Step 1: .py file likho\nprint(\"Hello Python\")\n\n# Step 2: Run directly\n# python main.py\n# Output: Hello Python\n\n# Internally:\n# 1. CPython source code padhta hai\n# 2. Bytecode banata hai (__pycache__/.pyc)\n# 3. Python Virtual Machine execute karta hai\n# But tumhe ye sab dikhta nahi — ek step mein ho jata hai", "extra": "<b>Interview point:</b> Java mein bytecode + JVM architecture hai isliye WORA possible hai. Python mein bhi bytecode banta hai internally, but Python interpreter system-specific hota hai.", "cpp": "// C++ KA FLOW\n// Step 1: .cpp file likho\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello C++\" << endl;\n    return 0;\n}\n\n// Step 2: Compile\n// g++ main.cpp -o main.exe  -->  machine code (a.exe)\n\n// Step 3: Run\n// ./main.exe\n// Output: Hello C++\n\n// Compiler machine code directly banata hai (OS-specific)\n// Java JVM (bytecode), Python interpreter (bytecode) hai\n// — lekin C++ compiler sab kuch compile time pe kar deta hai"}, {"cat": "02. Java vs Python — Big Picture", "title": "Java vs Python — Complete Comparison", "note": "Ye sabse important slide hai — isko yaad rakhna. Java aur Python ka complete comparison side by side.", "type": "table", "headers": ["Feature", "Java", "Python"], "rows": [["Creator", "James Gosling", "Guido van Rossum"], ["Year", "1995", "1991"], ["Typing", "Static (type declare karna padta hai)", "Dynamic (type automatic detect)"], ["Execution", "Compile + JVM", "Interpreter (CPython)"], ["Syntax", "Verbose (zyada likhna padta hai)", "Concise (kam likho, zyada karo)"], ["Speed", "Fast (compiled bytecode)", "Slow (interpreted)"], ["Memory", "Garbage Collection", "Garbage Collection"], ["OOP", "Pure OOP", "OOP + Functional + Procedural"], ["Multiple Inheritance", "Nahi (sirf interface)", "Haan"], ["Null", "null", "None"], ["Print", "System.out.println()", "print()"], ["Comment", "// and /* */", "# and triple quotes"], ["Semicolon", "Zaroori hai", "Nahi chahiye"], ["Braces", "Zaroori hai", "Indentation se hota hai"], ["Main method", "Zaroori hai (entry point)", "Nahi chahiye"]], "extra": "<b>Golden rule:</b> Java = Strict teacher (sab kuch bolke karo). Python = Chill friend (jo karna hai karo, result aa jayega). Java strict hai isliye badi team mein achha hai. Python flexible hai isliye scripting aur rapid dev mein best hai."}, {"cat": "02. Java vs Python — Big Picture", "title": "Typing — Static vs Dynamic (Deep Dive)", "note": "Java = static typing = variable ka type pehle se fixed. Python = dynamic typing = type run time pe decide hota hai. Ye sabse bada difference hai.", "type": "code", "java": "// JAVA — STATIC TYPING\n// Variable ka type FIXED hota hai\nint age = 25;          // int type\nString name = \"Vinay\"; // String type\ndouble pi = 3.14;      // double type\n\n// Type change nahi kar sakte\nage = \"hello\";  // ERROR! incompatible types\n\n// Type SAFETY — galti compile time pe pakad mein aati hai\nint x = 10;\nboolean flag = x;  // ERROR! int ≠ boolean\n\n// Explicit casting zaroori hai\ndouble d = 3.14;\nint i = (int) d;  // 3 — decimal cut gaya", "python": "# PYTHON — DYNAMIC TYPING\n# Variable ka type RUN TIME pe decide hota hai\nage = 25           # int\nname = \"Vinay\"     # str\npi = 3.14          # float\n\n# Type CHANGE kar sakte ho\nage = \"hello\"      # ab age string hai — koi error nahi!\n\n# No type safety — galti run time pe milegi\nx = 10\nflag = x           # koi error nahi!\nprint(type(flag))  # <class 'int'>\n\n# Type check manually karna padta hai\nx = 10\nisinstance(x, int)  # True\n\n# Python mein type hint de sakte ho (optional)\ndef add(a: int, b: int) -> int:\n    return a + b\n# But ye RUNTIME pe enforce nahi hota", "extra": "<b>Interview:</b> Static = compile time check, safe but verbose. Dynamic = run time check, flexible but error-prone. Java mein <code>int x = \"hello\"</code> compile nahi hoga. Python mein ho jayega — error baad mein aayega.", "cpp": "// C++ — STATIC TYPING\n// Variable ka type FIXED hota hai\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    int age = 25;          // int type\n    string name = \"Vinay\"; // string type\n    double pi = 3.14;      // double type\n\n    // Type change nahi kar sakte\n    // age = \"hello\";      // ERROR! incompatible types\n\n    // Type SAFETY — galti compile time pe pakad mein aati hai\n    int x = 10;\n    // int* p = x;         // ERROR! int ≠ pointer\n\n    // Explicit casting zaroori hai\n    double d = 3.14;\n    int i = (int)d;          // 3 — decimal cut gaya (static_cast<int> bhi chalega)\n\n    cout << age << \" \" << name << \" \" << pi << endl;\n    cout << x << \" \" << i << endl;\n    return 0;\n}"}, {"cat": "02. Java vs Python — Big Picture", "title": "Syntax Comparison — Side by Side", "note": "Har concept ka Java aur Python version — dekho kitna fark hai. Java mein zyada likhna padta hai, Python mein concise hai.", "type": "code", "java": "// JAVA SYNTAX\npublic class Main {\n    public static void main(String[] args) {\n        // Variable\n        int age = 25;\n        String name = \"Vinay\";\n\n        // If-else\n        if (age >= 18) {\n            System.out.println(\"Adult\");\n        } else {\n            System.out.println(\"Minor\");\n        }\n\n        // For loop\n        for (int i = 0; i < 5; i++) {\n            System.out.println(i);\n        }\n\n        // Array\n        int[] arr = {1, 2, 3, 4, 5};\n\n        // Method\n        int result = add(2, 3);\n    }\n\n    static int add(int a, int b) {\n        return a + b;\n    }\n}", "python": "# PYTHON SYNTAX\n# Koi class/main nahi chahiye — directly likho\n\n# Variable\nage = 25\nname = \"Vinay\"\n\n# If-else\nif age >= 18:\n    print(\"Adult\")\nelse:\n    print(\"Minor\")\n\n# For loop\nfor i in range(5):\n    print(i)\n\n# List (array equivalent)\narr = [1, 2, 3, 4, 5]\n\n# Function\ndef add(a, b):\n    return a + b\n\nresult = add(2, 3)", "extra": "<b>Summary:</b> Java = boilerplate zyada (class, main, semicolons, braces). Python = minimal boilerplate. Java mein 20 line ka program Python mein 5 line mein ho jata hai.", "cpp": "// C++ SYNTAX\n// Python ki tarah main() zaroori hai, Java ki tarah boilerplate bhi\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint add(int a, int b) {\n    return a + b;\n}\n\nint main() {\n    // Variable\n    int age = 25;\n    string name = \"Vinay\";\n\n    // If-else\n    if (age >= 18) {\n        cout << \"Adult\" << endl;\n    } else {\n        cout << \"Minor\" << endl;\n    }\n\n    // For loop\n    for (int i = 0; i < 5; i++) {\n        cout << i << endl;\n    }\n\n    // Array\n    int arr[] = {1, 2, 3, 4, 5};\n\n    // Function call\n    int result = add(2, 3);\n    cout << \"result: \" << result << \", arr[0]: \" << arr[0] << endl;\n    return 0;\n}"}, {"cat": "02. Java vs Python — Big Picture", "title": "Kab Java Use Karein, Kab Python?", "note": "Dono powerful hain — fark hai use case mein. Java = Enterprise, Python = Data/AI. Dono seekho, dono ka jagah hai.", "type": "table", "headers": ["Use Case", "Better Choice", "Reason"], "rows": [["Enterprise Web App", "Java", "Type safety, performance, scalability"], ["Android App", "Java/Kotlin", "Android SDK Java-based"], ["Banking System", "Java", "Security, multithreading, reliability"], ["Data Science / AI", "Python", "NumPy, Pandas, TensorFlow, PyTorch"], ["Web Scraping", "Python", "BeautifulSoup, Scrapy"], ["Automation / Scripts", "Python", "Simple syntax, fast development"], ["Machine Learning", "Python", "sklearn, Keras, PyTorch"], ["Microservices", "Both", "Java: Spring Boot, Python: Flask/FastAPI"], ["Competitive Programming", "Both", "Java: speed, Python: concise"], ["Quick Prototyping", "Python", "Kam code, tez development"], ["System Programming", "Neither", "Use C/C++/Rust"]], "extra": "<b>Advice:</b> Agar tum student ho — dono seekho. Java se DSA/CP karo (speed better hai). Python se projects/Data Science karo. Job market mein dono ki demand hai."}, {"cat": "02. Java vs Python — Big Picture", "title": "Java Mein Hai Python Mein Nahi", "note": "Kuch features sirf Java mein hain — Python mein direct equivalent nahi. Ye interview mein bahut poochte hain.", "type": "table", "headers": ["Java Feature", "Kya Hai?", "Python Equivalent"], "rows": [["Primitive types", "int, char, boolean, byte, float, double", "Sab objects hain Python mein (int, float, str, bool)"], ["Method Overloading", "Same method name, different parameters", "Nahi hota Python mein (*args se simulate)"], ["Checked Exceptions", "try-catch MANDATORY for IOException etc.", "Nahi hota — sab unchecked hain"], ["Interfaces", "interface keyword", "ABC / Protocol (closest)"], ["switch statement", "Classic switch", "match-case (Python 3.10+)"], ["do-while loop", "do { } while();", "Nahi hota (while True + break)"], ["Static keyword", "static method, static variable", "@classmethod / @staticmethod (different semantics)"], ["Generics", "List<Integer>", "Type hints (runtime pe enforce nahi)"], ["Access Modifiers", "public, private, protected", "_private convention (enforce nahi)"], ["JVM", "Java Virtual Machine", "CPython interpreter (different architecture)"], ["Enums", "Full-featured enums", "Enum class (less powerful)"], ["Annotations", "@Override, @Deprecated etc.", "Decorators (different purpose)"], ["char type", "16-bit Unicode char", "str (sab strings hain)"]], "extra": "<b>Remember:</b> Java strict hai — safety ke liye. Python flexible hai — convenience ke liye. Interview mein ye table aata hai to points milte hain."}, {"cat": "02. Java vs Python — Big Picture", "title": "Python Mein Hai Java Mein Nahi", "note": "Python ke features jo Java mein direct nahi hain. Ye features Python ko powerful banate hain.", "type": "table", "headers": ["Python Feature", "Kya Hai?", "Java Equivalent"], "rows": [["List Comprehension", "[x*2 for x in arr]", "Arrays.stream(arr).map(x->x*2)"], ["Dictionary Comprehension", "{k:v for k,v in d.items()}", "Stream + Collectors.toMap()"], ["Multiple Assignment", "a, b, c = 1, 2, 3", "Alag-alag declare karo"], ["Tuple Unpacking", "a, b = (1, 2)", "No direct equivalent"], ["Dynamic Typing", "x = 1; x = \"hi\"", "Nahi hota — type fixed"], ["Multiple Inheritance", "class C(A, B)", "Sirf interface se partly"], ["Duck Typing", "if hasattr(obj, 'method')", "instanceof check"], ["Generator", "yield keyword", "Spliterator (complex)"], ["Decorators", "@decorator syntax", "Annotations (different)"], ["Lambda multi-line", "lambda x: (x*2 if x>0 else x)", "Not possible in Java lambda"], ["Indentation as syntax", "Block = indentation", "Braces { } zaroori"], ["No main() needed", "Directly code likho", "public static void main zaroori"], ["Slicing", "arr[1:3]", "subList(1, 3)"], ["Chaining comparisons", "1 < x < 10", "x > 1 && x < 10"]], "extra": "<b>Remember:</b> Python ki power readability mein hai. List comprehension, dynamic typing, duck typing — sab code ko concise banate hain. But Java ki strictness bhi zaroori hai badi projects mein."}, {"cat": "03. Basics", "title": "Print & Comments", "note": "Output print karne ka pehla kadam. Java ke <b>System.out.println</b> ka Python equivalent sirf <b>print()</b> hai. Yaad rakho: Java ko semicolon (;) chahiye, Python ko nahi.", "type": "code", "java": "// single line comment\nSystem.out.println(\"Hello World\");   // newline ke saath\nSystem.out.print(\"No newline\");      // newline ke bina\n\nSystem.out.printf(\"%d apples\", 5);   // formatted print\nSystem.out.println(1 + 2);           // expression bhi\n\n/* multi\n   line comment */", "python": "# single line comment\nprint(\"Hello World\")              # newline ke saath\nprint(\"No newline\", end=\"\")       # newline ke bina\n\nprint(f\"{5} apples\")               # f-string formatting\nprint(1 + 2)                       # expression bhi\n\n\"\"\"\nmulti line comment / docstring\n\"\"\"", "extra": "<b>Flow:</b> Java = verbose, Python = minimal. Python mein <code>print(a, b, c)</code> ek saath multiple cheezein comma se print karta hai. Java mein iske liye concatenation ya printf lagta hai. F-string <code>f\"{var}\"</code> Python 3.6+ ka best feature hai — Java ke <code>System.out.printf</code> se zyada clean.", "cpp": "// C++ PRINT & COMENTS\n#include <cstdio>\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // single line comment\n    cout << \"Hello World\" << endl;   // newline ke saath\n    cout << \"No newline\";            // newline ke bina (endl nahi lagaya)\n\n    printf(\"%d apples\\n\", 5);        // formatted print (C style)\n\n    cout << 1 + 2 << endl;           // expression bhi\n    \n    /* multi\n       line comment */\n    return 0;\n}"}, {"cat": "03. Basics", "title": "Variables & Data Types", "note": "Java <b>strongly-typed</b> hai — variable banate waqt type likhna padta hai. Python <b>dynamically-typed</b> hai — type khud infer hota hai aur badal sakta hai.", "type": "code", "java": "int age = 20;                  // primitive types\ndouble price = 10.5;\nchar grade = 'A';\nboolean flag = true;\n\nString name = \"Vinay\";          // reference type\nlong big = 10000000000L;        // L suffix zaroori\nfloat f = 3.14f;                 // f suffix zaroori\n\nfinal int MAX = 100;            // constant (final)", "python": "age = 20                    # no type declaration\nprice = 10.5\ngrade = 'A'                    # ' ya \" dono theek\nname = \"Vinay\"\nflag = True                    # capital T, True/False\n\nbig = 10000000000              # int unbounded hai\nf = 3.14                       # float = double precision\n\nMAX = 100                      # convention: constant UPPERCASE\n\nx = 10; x = \"hi\"               # allowed — dynamic typing", "extra": "<b>Flow:</b> Python mein <code>type(x)</code> se type check karo; Java mein <code>x.getClass()</code>. Java ka ek variable apna type <b>kabhi nahi</b> badal sakta; Python ka bilkul badal sakta hai. Boolean in Python capital <code>True/False</code>, Java lowercase <code>true/false</code>.", "cpp": "// C++ VARIABLES & DATA TYPES\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    int age = 20;                  // primitive types\n    double price = 10.5;\n    char grade = 'A';\n    bool flag = true;\n\n    string name = \"Vinay\";          // <string> se\n    long long big = 10000000000LL;  // bade numbers ke liye long long + LL suffix\n    float f = 3.14f;                 // f suffix zaroori\n\n    const int MAX = 100;            // constant (const keyword)\n\n    // dynamic typing nahi hoti — ab age string nahi ban sakta\n    cout << age << \" \" << price << \" \" << grade << \" \" << flag << endl;\n    cout << name << \" \" << big << \" \" << f << \" \" << MAX << endl;\n    return 0;\n}"}, {"cat": "03. Basics", "title": "Data Type Mapping", "note": "Java ke saare primitive/reference types Python mein kis naam se jaante hain — ek nazar mein.", "type": "table", "headers": ["Java", "Python", "Note"], "rows": [["<code>int</code>", "<code>int</code>", "Python ka int unbounded (overflow nahi hota)"], ["<code>long</code>", "<code>int</code>", "Alag type ki zarurat nahi"], ["<code>float</code> / <code>double</code>", "<code>float</code>", "Python mein sirf float (double precision)"], ["<code>char</code>", "<code>str</code> (length 1)", "Python mein alag char type nahi"], ["<code>String</code>", "<code>str</code>", "Dono immutable"], ["<code>boolean</code>", "<code>bool</code>", "True/False capital hote hain"], ["<code>int[]</code>", "<code>list</code>", "Java array fixed, list dynamic"], ["<code>ArrayList</code>", "<code>list</code>", ""], ["<code>HashSet</code>", "<code>set</code>", ""], ["<code>HashMap</code>", "<code>dict</code>", ""], ["<code>Stack</code>", "<code>list</code>", "append()/pop()"], ["<code>PriorityQueue</code>", "<code>heapq</code>", "Min-heap default"], ["<code>null</code>", "<code>None</code>", ""], ["<code>this</code>", "<code>self</code>", ""]]}, {"cat": "03. Basics", "title": "Input Lena", "note": "Scanner class ka Python equivalent sirf <b>input()</b> hai — jo hamesha String return karta hai, isliye number ke liye int()/float() wrap karna padta hai.", "type": "code", "java": "import java.util.Scanner;\nScanner sc = new Scanner(System.in);\n\nString name = sc.nextLine();      // poori line\nint age = sc.nextInt();           // int value\ndouble x = sc.nextDouble();       // double value\n\n// loop se kai saare ints\nint n = sc.nextInt();\nfor (int i = 0; i < n; i++) {\n    int v = sc.nextInt();\n}", "python": "name = input(\"Enter name: \")   # prompt bhi de sakte ho\nage = int(input())\nx = float(input())\n\n# multiple ints ek line mein 🔥\na, b = map(int, input().split())\n\n# n ints ek saath list mein\narr = list(map(int, input().split()))", "extra": "<b>Competitive programming flow:</b> fastest pattern hai <code>a, b = map(int, input().split())</code>. Java mein <code>sc.nextInt()</code> newline ko skip karta hai; Python <code>input()</code> hamesha <b>poori line</b> leta hai — isliye split() karke alag karna padta hai.", "cpp": "// C++ INPUT\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string name;\n    int age = 0;\n    double x = 0.0;\n\n    getline(cin, name);      // poori line\n    cin >> age;              // int value\n    cin >> x;                // double value\n\n    // loop se kai saare ints\n    int n = 0;\n    cin >> n;\n    for (int i = 0; i < n; i++) {\n        int v = 0;\n        cin >> v;\n        cout << v << \" \";\n    }\n    cout << endl;\n    return 0;\n}"}, {"cat": "03. Basics", "title": "Scanner Methods — Full List", "note": "Java Scanner ke saare input methods ek jagah. Python mein sab kuch <b>input()</b> se hota hai — hamesha String milta hai, isliye convert karna padta hai.", "type": "table", "headers": ["Java Scanner", "Python", "Kya leta hai"], "rows": [["<code>sc.nextLine()</code>", "<code>input()</code>", "Poori line (String)"], ["<code>sc.next()</code>", "<code>input().split()[0]</code>", "Ek token / word"], ["<code>sc.nextInt()</code>", "<code>int(input())</code>", "Integer"], ["<code>sc.nextLong()</code>", "<code>int(input())</code>", "Bada integer"], ["<code>sc.nextFloat()</code>", "<code>float(input())</code>", "Float"], ["<code>sc.nextDouble()</code>", "<code>float(input())</code>", "Double"], ["<code>sc.nextBoolean()</code>", "<code>input().lower() == 'true'</code>", "Boolean"], ["<code>sc.hasNext()</code>", "—", "Koi aur token bacha hai?"], ["<code>sc.hasNextInt()</code>", "—", "Agla token int hai?"]]}, {"cat": "03. Basics", "title": "Type Conversion", "note": "String ↔ number ↔ char conversions — dono languages mein kaise.", "type": "table", "headers": ["Kaam", "Java", "Python"], "rows": [["String → int", "<code>Integer.parseInt(s)</code>", "<code>int(s)</code>"], ["String → double", "<code>Double.parseDouble(s)</code>", "<code>float(s)</code>"], ["Number → String", "<code>String.valueOf(x)</code>", "<code>str(x)</code>"], ["int → char", "<code>(char)(65)</code>", "<code>chr(65)</code>"], ["char → int (ascii)", "<code>(int)'A'</code>", "<code>ord('A')</code>"], ["char digit → int", "<code>Character.getNumericValue(c)</code>", "<code>int(c)</code>"], ["List ↔ Array", "<code>toArray() / Arrays.asList()</code>", "<code>list(arr)</code> / <code>tuple(l)</code>"]]}, {"cat": "03. Basics", "title": "Type Casting — Widening & Narrowing", "note": "Java mein primitive conversion do tarah: <b>widening</b> (chhota → bada, automatic) aur <b>narrowing</b> (bada → chhota, explicit cast). Python mein bas constructor call hota hai.", "type": "code", "java": "// widening: automatic (chhota -> bada)\nint i = 10;\nlong l = i;        // int -> long (auto)\nfloat f = l;       // long -> float (auto)\ndouble d = f;      // float -> double (auto)\n\n// narrowing: explicit cast zaroori\ndouble x = 9.7;\nint y = (int) x;   // 9 (fraction kaat diya) ⚠️\n\n// char <-> int\nchar c = 'A';\nint ascii = (int) c;      // 65\nchar back = (char) 66;    // 'B'\n\n// String <-> int\nint n = Integer.parseInt(\"42\");\nString s = String.valueOf(42);", "python": "# Python: sab constructor se (no cast keyword)\ni = int(9.7)       # 9 (truncate)\nf = float(10)      # 10.0\n\n# char <-> int (ASCII)\nc = chr(65)        # 'A'\nn = ord('A')       # 65\n\n# String <-> int\nn = int(\"42\")\ns = str(42)\n\n# careful: int(\"3.5\") -> ValueError ❌\n# use float first: int(float(\"3.5\")) -> 3", "extra": "<b>Flow:</b> widening hamesha safe hai (data loss nahi) — isliye automatic. Narrowing mein data loss ho sakta hai (9.7 → 9) — isliye explicit <code>(int)</code> cast. Python mein sab kuch <code>int()</code>/<code>float()</code>/<code>str()</code> se hota hai.", "cpp": "// C++ TYPE CASTING\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    // widening: automatic (chhota -> bada)\n    int i = 10;\n    long long l = i;      // int -> long long (auto)\n    float f = l;          // long long -> float (auto)\n    double d = f;         // float -> double (auto)\n\n    // narrowing: explicit cast zaroori\n    double x = 9.7;\n    int y = (int)x;       // 9 (fraction kaat diya)\n\n    // char <-> int\n    char c = 'A';\n    int ascii = (int)c;      // 65\n    char back = (char)66;    // 'B'\n\n    // String <-> int\n    int n = stoi(\"42\");\n    string s = to_string(42);\n\n    cout << l << \" \" << f << \" \" << d << endl;\n    cout << y << \" \" << ascii << \" \" << back << endl;\n    cout << n << \" \" << s << endl;\n    return 0;\n}"}, {"cat": "03. Basics", "title": "Time Complexity & Big-O (Basics)", "note": "Algorithm kitni fast hai, ye batane ka standard tarika <b>Big-O notation</b> hai — input size badhne pe operations kitne grow hote hain, ye measure karta hai. Constants ignore hoti hain: <b>O(2n) = O(n)</b>, <b>O(n/2) = O(n)</b>.", "type": "table", "headers": ["Big-O", "Naam", "Matalab (n = input size)"], "rows": [["<code>O(1)</code>", "Constant", "Har baar same time — array index, hashmap get/put"], ["<code>O(log n)</code>", "Logarithmic", "Har step pe aadha cut — binary search, BST search"], ["<code>O(n)</code>", "Linear", "Ek loop — linear scan, max/min dhundna"], ["<code>O(n log n)</code>", "Linearithmic", "Efficient sorting — merge sort, <code>Arrays.sort()</code>, <code>sorted()</code>"], ["<code>O(n²)</code>", "Quadratic", "Nested loop — brute-force pairs, bubble sort"], ["<code>O(2ⁿ)</code>", "Exponential", "Har n pe double — subsets (recursion)"], ["<code>O(n!)</code>", "Factorial", "Permutations — n=10 ke baad bhag jao"]]}, {"cat": "03. Basics", "title": "Big-O in Code — O(n) vs O(n²)", "note": "Same kaam, alag complexity. Nested loop hamesha O(n²) hota hai — isliye brute force se pehle socho: sorted array + two pointers? HashMap? Ye hi DSA interviews ka game hai.", "type": "code", "java": "// O(n) — ek loop, linear\nfor (int i = 0; i < n; i++) sum += a[i];\n\n// O(log n) — har step pe aadha\nint lo = 0, hi = n - 1;\nwhile (lo <= hi) {\n    int mid = lo + (hi - lo) / 2;\n    if (a[mid] == target) break;\n    else if (a[mid] < target) lo = mid + 1;\n    else hi = mid - 1;\n}\n\n// O(n^2) — nested loop, quadratic\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        if (a[i] + a[j] == target) /* found */;", "python": "# O(n) — ek loop, linear\nfor x in arr: total += x\n\n# O(log n) — har step pe aadha\nlo, hi = 0, n - 1\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    if a[mid] == target: break\n    elif a[mid] < target: lo = mid + 1\n    else: hi = mid - 1\n\n# O(n^2) — nested loop, quadratic\nfor i in range(n):\n    for j in range(n):\n        if arr[i] + arr[j] == target: pass", "extra": "<b>Flow:</b> Space complexity bhi same way measure hoti hai — extra memory kitni li. Har question ke approach ke saath <b>Complexity</b> line likhi hogi (dono files mein), wahi isi notation mein hai.", "cpp": "// BIG-O IN C++ CODE\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> a = {1, 3, 5, 7, 9};\n    int n = (int)a.size();\n    int target = 5;\n    int sum = 0;\n\n    // O(n) — ek loop, linear\n    for (int i = 0; i < n; i++) sum += a[i];\n\n    // O(log n) — har step pe aadha\n    int lo = 0, hi = n - 1;\n    bool found = false;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (a[mid] == target) { found = true; break; }\n        else if (a[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n\n    // O(n^2) — nested loop, quadratic\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++)\n            if (a[i] + a[j] == target) { /* found */ }\n\n    cout << \"sum: \" << sum << \", found: \" << found << endl;\n    return 0;\n}"}, {"cat": "03. Basics", "title": "Sawaal 1 — Shuruaat ke Questions", "note": "Abhi seekhe hue concepts test karo. Option pe click karo — sahi jawab pe green aur explanation khul jaayega. Score upar header mein update hota hai.", "type": "quiz", "questions": [{"q": "Java mein <code>int x = 7 / 2;</code> — x ki value kya hogi?", "opts": ["3.5", "3", "2", "Error"], "ans": 1, "expl": "Java integer division <b>truncate</b> karta hai (fraction kaat deta hai) → 7/2 = 3. Float chahiye toh 7.0/2 likho."}, {"q": "Python mein <code>print(7 / 2)</code> kya print karega?", "opts": ["3", "2.5", "3.5", "3.0"], "ans": 2, "expl": "Python mein <code>/</code> hamesha float deta hai → 3.5. Integer chahiye toh <code>//</code> use karo (3 aayega)."}, {"q": "Python mein <code>x = 5</code> ke baad <code>x = \"hello\"</code> likhna allowed hai?", "opts": ["Ha", "Nahi", "Sirf import ke baad", "Compile error"], "ans": 0, "expl": "Python dynamic typing support karta hai — variable kisi bhi waqt type badal sakta hai. Java mein ye compile error hota."}, {"q": "<code>a, b = map(int, input().split())</code> se kya milega?", "opts": ["Ek integer", "String ka pair", "Do integers", "List"], "ans": 2, "expl": "<code>input()</code> line leta hai, <code>split()</code> tokens banata hai, <code>map(int,...)</code> har token ko int me convert karta hai, phir <code>a, b</code> mein unpack hota hai."}, {"q": "Java mein String '5' ko int mein convert kaise karenge?", "opts": ["<code>(int) s</code>", "<code>Integer.parseInt(s)</code>", "<code>s.toInt()</code>", "<code>int(s)</code>"], "ans": 1, "expl": "Java ka conversion method hai <code>Integer.parseInt(s)</code>. Python mein direct <code>int(s)</code> hota hai."}, {"q": "Java <code>boolean</code> aur Python <code>bool</code> ka kya fark hai?", "opts": ["Koi fark nahi", "Capital True/False vs lowercase true/false", "Python mein bool nahi hai", "Java mein bool nahi hai"], "ans": 1, "expl": "Python: <code>True</code>/<code>False</code> (capital). Java: <code>true</code>/<code>false</code> (lowercase). Ye typo interview mein chhota sa bada bug ban sakta hai."}]}, {"cat": "07. Conditions & Loops", "title": "Operators & Division ⚠️", "note": "Sabse zyada DSA bugs isi ek chhote se fark se aate hain: Java mein <code>5/2 = 2</code> (integer division), Python mein <code>5/2 = 2.5</code> (hamesha float).", "type": "code", "java": "int a = 5 / 2;      // 2   (integer division)\ndouble b = 5.0 / 2;  // 2.5 (float division)\n\ndouble p = Math.pow(2, 3);   // 8.0\nint m = 10 % 3;              // 1 (remainder)\nint neg = -10 % 3;           // -1 (sign same as dividend)\n\n// pre/post increment\nint i = 0; int j = i++;      // j=0, i=1 (post)", "python": "a = 5 / 2       # 2.5 -> always float!\nb = 5 // 2      # 2   -> floor division\n\np = 2 ** 3      # 8   -> power operator 🔥\nm = 10 % 3      # 1\nneg = -10 % 3   # 2 (Python remainder != Java!)\n\n# no i++ in python, always:\ni = 0\ni += 1", "extra": "⚠️ <b>Do hidden fark:</b> (1) Python ka <code>//</code> floor karta hai, Java truncate — isliye <code>-10 % 3</code> Python mein 2 deta hai, Java mein -1. (2) Power ke liye Java <code>Math.pow</code> (double deta hai), Python <code>**</code> (int deta hai). <b>Flow check:</b> integer chahiye → Python mein hamesha <code>//</code>.", "cpp": "// OPERATORS & DIVISION\n#include <cmath>\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 5 / 2;        // 2   (integer division)\n    double b = 5.0 / 2;   // 2.5 (float division)\n\n    double p = pow(2, 3);    // 8.0 (cmath)\n    int m = 10 % 3;          // 1 (remainder)\n    int neg = -10 % 3;       // -1 (sign same as dividend — Java jaisa)\n\n    // pre/post increment\n    int i = 0;\n    int j = i++;             // j=0, i=1 (post)\n\n    cout << a << \" \" << b << \" \" << p << \" \" << m << \" \" << neg << endl;\n    cout << \"i=\" << i << \" j=\" << j << endl;\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Comparison & Logical Operators", "note": "Comparison operators (<code>== != &gt; &lt; &gt;= &lt;=</code>) dono languages mein same. Sirf logical operators badalte hain: && || ! ki jagah and or not.", "type": "code", "java": "if (age >= 18 && age <= 60) {\n    System.out.println(\"Eligible\");\n}\nif (!flag || age == 0) { }\n\n// note: dono ends mein braces lagte hain\nboolean canVote = age >= 18;", "python": "if age >= 18 and age <= 60:\n    print(\"Eligible\")\n\nif not flag or age == 0:\n    pass\n\ncan_vote = age >= 18\n\n# python chaining 🔥\nif 18 <= age <= 60:\n    print(\"Eligible\")", "extra": "Python mein <b>chained comparison</b> <code>18 &lt;= age &lt;= 60</code> ek sath likh sakte ho — Java mein iske liye do conditions aur <code>&&</code> lagana padta. Aur Python ki <code>pass</code> statement empty block ke liye hoti hai (Java ke <code>{ }</code> jaisi).", "cpp": "// COMPARISON & LOGICAL OPERATORS\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int age = 25;\n    bool flag = true;\n\n    if (age >= 18 && age <= 60) {\n        cout << \"Eligible\" << endl;\n    }\n    if (!flag || age == 0) { }\n\n    bool canVote = age >= 18;\n    cout << \"canVote: \" << canVote << endl;\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Membership & Identity Operators", "note": "Python ke do special operator groups jo Java mein alag tareeke se hote hain: <b>in / not in</b> (membership) aur <b>is / is not</b> (identity).", "type": "code", "java": "// Java: membership = contains() / search\nboolean inList = list.contains(5);\nboolean inMap  = map.containsKey(\"key\");\nboolean inSet  = set.contains(10);\nboolean inStr  = s.contains(\"lo\");\n\n// Java: identity = reference compare\n// == primitives pe value, objects pe REFERENCE!\nString a = new String(\"hi\");\nString b = new String(\"hi\");\na == b;              // false (alag objects) ⚠️\na.equals(b);         // true (value) ✅", "python": "# membership: in / not in 🔥\n5 in [1, 2, 3]            # True\n\"lo\" in \"hello\"           # True\n\"key\" in {\"key\": 1}      # True (keys check hota hai)\n5 not in [1, 2, 3]        # False\n\n# identity: is / is not (reference)\nx = None\nx is None                # True (None check ka tarika!)\nx is not None            # False\n\n# list == vs is\na = [1, 2]; b = [1, 2]\na == b                   # True (value)\na is b                   # False (alag objects)", "extra": "<b>None check</b> hamesha <code>is None</code> se karo, <code>== None</code> se nahi. Java mein strings compare karte waqt <code>equals()</code> use karo, <code>==</code> nahi (reference compare hota hai). Python ka <code>in</code> list pe O(n), set/dict pe O(1) hai.", "cpp": "// MEMBERSHIP & IDENTITY (C++ style)\n#include <algorithm>\n#include <iostream>\n#include <string>\n#include <unordered_map>\n#include <unordered_set>\n#include <vector>\nusing namespace std;\n\nint main() {\n    // membership = find() / count()\n    vector<int> list = {1, 2, 3, 4, 5};\n    bool inList = find(list.begin(), list.end(), 5) != list.end();\n\n    unordered_map<string, int> map = {{\"key\", 1}};\n    bool inMap = map.count(\"key\") > 0;\n\n    unordered_set<int> set = {10, 20};\n    bool inSet = set.count(10) > 0;\n\n    string s = \"hello\";\n    bool inStr = s.find(\"lo\") != string::npos;\n\n    cout << inList << \" \" << inMap << \" \" << inSet << \" \" << inStr << endl;\n\n    // C++ strings pe == VALUE compare karta hai (Java ke equals() jaisa)\n    string a = \"hi\";\n    string b = \"hi\";\n    cout << (a == b ? \"equal (value)\" : \"not equal\") << endl;\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "If-Else & Ternary", "note": "elif Python ka 'else if' hai. Ternary ka order bhi ulta hai — pehle value_if_true, phir condition, phir value_if_false.", "type": "code", "java": "if (age >= 18) {\n    System.out.println(\"Adult\");\n} else if (age >= 13) {\n    System.out.println(\"Teen\");\n} else {\n    System.out.println(\"Minor\");\n}\n\nString result = age >= 18 ? \"Adult\" : \"Minor\";\n\n// nested ternary\nString r = age >= 18 ? \"A\" : (age >= 13 ? \"T\" : \"M\");", "python": "if age >= 18:\n    print(\"Adult\")\nelif age >= 13:\n    print(\"Teen\")\nelse:\n    print(\"Minor\")\n\nresult = \"Adult\" if age >= 18 else \"Minor\"\n\n# nested\nr = \"A\" if age >= 18 else (\"T\" if age >= 13 else \"M\")", "extra": "<b>Ternary yaad rakhne ka trick:</b> Java <code>cond ? a : b</code> ko English mein padho. Python hamesha <code>value_if_true if cond else value_if_false</code> — matlab <b>result condition output</b> ke order mein. Python ke if-elif-else mein <code>switch</code> jaisa matching bhi hai (Python 3.10: <code>match</code>).", "cpp": "// IF-ELSE & TERNARY\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    int age = 25;\n\n    if (age >= 18) {\n        cout << \"Adult\" << endl;\n    } else if (age >= 13) {\n        cout << \"Teen\" << endl;\n    } else {\n        cout << \"Minor\" << endl;\n    }\n\n    string result = age >= 18 ? \"Adult\" : \"Minor\";\n\n    // nested ternary\n    string r = age >= 18 ? \"A\" : (age >= 13 ? \"T\" : \"M\");\n\n    cout << result << \" \" << r << endl;\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Loops — for & while", "note": "Java ka classic 3-part for-loop, Python mein <b>range()</b> se replace hota hai. range(start, stop, step) — stop hamesha exclusive.", "type": "code", "java": "for (int i = 0; i < 5; i++) {\n    System.out.println(i);\n}\nfor (int i = 0; i < 10; i += 2) { }   // step 2\n\n// pichhe ki taraf\nfor (int i = 5; i > 0; i--) { }\n\nint i = 0;\nwhile (i < 5) {\n    System.out.println(i);\n    i++;\n}", "python": "for i in range(5):\n    print(i)\n\nfor i in range(0, 10, 2):   # start, stop, step\n    pass\n\nfor i in range(5, 0, -1):   # 5,4,3,2,1\n    pass\n\ni = 0\nwhile i < 5:\n    print(i)\n    i += 1", "extra": "Python mein <code>i++</code> / <code>i--</code> <b>exist nahi karte</b> — hamesha <code>i += 1</code> / <code>i -= 1</code> likho. <code>range(1,6)</code> = 1 se 5 tak (6 exclusive). <code>range(5)</code> = 0 se 4 tak. While loop ka syntax bilkul same hai dono mein.", "cpp": "// LOOPS — FOR & WHILE\n#include <iostream>\nusing namespace std;\n\nint main() {\n    for (int i = 0; i < 5; i++) {\n        cout << i << endl;\n    }\n    for (int i = 0; i < 10; i += 2) { }   // step 2\n\n    // pichhe ki taraf\n    for (int i = 5; i > 0; i--) { }\n\n    int i = 0;\n    while (i < 5) {\n        cout << i << endl;\n        i++;\n    }\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Nested Loops & Patterns", "note": "Pattern problems (stars, tables, matrices) nested loops se bante hain — dono languages mein structure same hai.", "type": "code", "java": "// triangle pattern\nfor (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= i; j++) {\n        System.out.print(\"* \");\n    }\n    System.out.println();\n}\n\n// multiplication table\nfor (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        System.out.print((i * j) + \" \");\n    }\n    System.out.println();\n}", "python": "for i in range(1, 4):\n    for j in range(1, i + 1):\n        print(\"* \", end=\"\")\n    print()\n\n# python trick: string repeat 🔥\nfor i in range(1, 4):\n    print(\"* \" * i)\n\nfor i in range(1, 4):\n    row = [str(i * j) for j in range(1, 4)]\n    print(\" \".join(row))", "extra": "<b>Flow:</b> outer loop = rows, inner loop = columns. Python mein <code>print(\"* \" * i)</code> string-multiplication se pattern ek line mein ban jata hai — Java mein repeat() (Java 11+) ya loop lagana padta. Pattern questions (pyramid, diamond, hollow) try karo dono languages mein.", "cpp": "// NESTED LOOPS & PATTERNS\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // triangle pattern\n    for (int i = 1; i <= 3; i++) {\n        for (int j = 1; j <= i; j++) {\n            cout << \"* \";\n        }\n        cout << endl;\n    }\n\n    // multiplication table\n    for (int i = 1; i <= 3; i++) {\n        for (int j = 1; j <= 3; j++) {\n            cout << (i * j) << \" \";\n        }\n        cout << endl;\n    }\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Break, Continue & for-each", "note": "Enhanced for-loop (for-each) Java se Python ke direct <code>for x in arr</code> tak. Index chahiye toh Python ka <code>enumerate()</code> use karo.", "type": "code", "java": "for (int x : arr) {\n    if (x == 0) continue;\n    if (x == 5) break;\n    System.out.println(x);\n}\n\n// index ke saath\nfor (int i = 0; i < arr.length; i++) {\n    System.out.println(i + \": \" + arr[i]);\n}", "python": "for x in arr:\n    if x == 0:\n        continue\n    if x == 5:\n        break\n    print(x)\n\n# index + value ek saath 🔥\nfor i, x in enumerate(arr):\n    print(i, x)", "extra": "<code>enumerate(arr)</code> Java mein manually index track karne se far better hai jab dono chahiye. Bonus: Python ka <code>for...else</code> — loop bina break ke poora chala toh else chalega. Java mein iske liye flag variable lagana padta.", "cpp": "// BREAK, CONTINUE & FOR-EACH\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> arr = {1, 0, 2, 5, 3};\n\n    // range-based for = for-each\n    for (int x : arr) {\n        if (x == 0) continue;\n        if (x == 5) break;\n        cout << x << endl;\n    }\n\n    // index ke saath\n    for (int i = 0; i < (int)arr.size(); i++) {\n        cout << i << \": \" << arr[i] << endl;\n    }\n    return 0;\n}"}, {"cat": "07. Conditions & Loops", "title": "Sawaal 2 — Control Flow ke Questions", "note": "Operators, conditions aur loops test karo.", "type": "quiz", "questions": [{"q": "<code>range(1, 6)</code> konsi values deta hai?", "opts": ["1 se 6 (6 included)", "1,2,3,4,5", "0 se 5", "1,2,3,4"], "ans": 1, "expl": "range stop value ko <b>exclude</b> karta hai. Isliye 1,2,3,4,5 — 6 nahi aata. <code>range(5)</code> = 0,1,2,3,4."}, {"q": "Python mein integer division ka operator konsa hai?", "opts": ["<code>/</code>", "<code>//</code>", "<code>%</code>", "<code>div</code>"], "ans": 1, "expl": "<code>/</code> float deta hai, <code>//</code> integer/floor deta hai. Java mein <code>/</code> dono ka kaam karta hai — yehi confusion ka root hai."}, {"q": "Python ternary syntax kaunsa sahi hai?", "opts": ["<code>cond ? a : b</code>", "<code>a if cond else b</code>", "<code>if cond then a else b</code>", "<code>a else cond b</code>"], "ans": 1, "expl": "Python: <code>value_if_true if condition else value_if_false</code>. Java ka <code>cond ? a : b</code> Python mein nahi chalta."}, {"q": "Java <code>for (int i=5; i>0; i--)</code> ka Python equivalent?", "opts": ["<code>for i in range(5,0,-1)</code>", "<code>for i in range(0,5)</code>", "<code>for i in range(5)</code>", "<code>while i<5</code>"], "ans": 0, "expl": "<code>range(start, stop, step)</code> mein step -1 hone se reverse hota hai: 5,4,3,2,1. Stop 0 hai toh 0 exclude."}, {"q": "<code>for i, x in enumerate(arr)</code> se i aur x mein kya aata hai?", "opts": ["i=value, x=index", "i=index, x=value", "dono value", "error aata hai"], "ans": 1, "expl": "enumerate() har iteration pe <code>(index, value)</code> ka tuple deta hai. Java mein iske liye alag loop variable + index logic lagana padta."}, {"q": "Java <code>if (a &amp;&amp; b)</code> ka Python equivalent?", "opts": ["<code>if a && b:</code>", "<code>if a and b:</code>", "<code>if a & b:</code>", "<code>if a?b:</code>"], "ans": 1, "expl": "<code>&& → and</code>, <code>|| → or</code>, <code>! → not</code>. <code>&</code> Python mein bitwise AND hai — ye alag kaam karta hai."}]}, {"cat": "10. Strings", "title": "String Basics", "note": "length, indexing, substring — DSA mein sabse zyada use hone wale operations. Python ka negative indexing aur slicing Java mein exist hi nahi karte.", "type": "code", "java": "String s = \"Hello World\";\nint len = s.length();                  // method () lagta hai\nchar c = s.charAt(0);                  // 'H'\nchar last = s.charAt(s.length() - 1);  // no negative index\n\nString sub = s.substring(1, 4);        // \"ell\" (end exclusive)\nString concat = s + \"!\";               // concatenation\n\nchar[] chars = s.toCharArray();        // string -> char array", "python": "s = \"Hello World\"\nlength = len(s)            # function, property nahi\nc = s[0]                   # 'H'\nlast = s[-1]               # 'd'  🔥 negative indexing\n\nsub = s[1:4]               # \"ell\" (slicing)\nconcat = s + \"!\"\n\nchars = list(s)            # ['H','e',...]", "extra": "<b>Flow:</b> Java <code>s.length()</code> method hai (parentheses ke saath), array ka <code>arr.length</code> property hai (bina parentheses) — ye bhol-baal interview mein chhoti si galti ban jaati hai. Python dono jagah <code>len()</code> function. Slicing <code>s[a:b]</code> mein b exclusive hota hai — <code>s[1:4]</code> = index 1,2,3.", "cpp": "// STRING BASICS\n#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    string s = \"Hello World\";\n    int len = (int)s.length();               // ya size() — dono same\n    char c = s[0];                           // 'H'\n    char last = s[s.length() - 1];           // 'd' — negative index nahi hai\n\n    string sub = s.substr(1, 3);             // \"ell\" — (start, length) ⚠️ Java substring(1,4) = end-exclusive\n    string concat = s + \"!\";                 // concatenation\n\n    // string -> char vector (copy)\n    vector<char> chars(s.begin(), s.end());\n\n    cout << len << \" \" << c << \" \" << last << endl;\n    cout << sub << \" \" << concat << endl;\n    cout << chars.size() << endl;\n    return 0;\n}"}, {"cat": "10. Strings", "title": "String Methods Table", "note": "Java ke saare common String methods aur unka Python equivalent — interview ke liye bookmark karo.", "type": "table", "headers": ["Java", "Python", "Example"], "rows": [["<code>s.length()</code>", "<code>len(s)</code>", "<code>len(\"abc\")</code> → 3"], ["<code>s.toLowerCase()</code>", "<code>s.lower()</code>", ""], ["<code>s.toUpperCase()</code>", "<code>s.upper()</code>", ""], ["<code>s.trim()</code>", "<code>s.strip()</code>", "Sirf ends se spaces hatata hai"], ["<code>s.contains(x)</code>", "<code>x in s</code>", "Substring check"], ["<code>s.replace(a,b)</code>", "<code>s.replace(a,b)</code>", "Same naam, same kaam"], ["<code>s.split(\" \")</code>", "<code>s.split()</code>", "Empty split() = whitespace pe"], ["<code>s.indexOf(x)</code>", "<code>s.find(x)</code>", "Not found: -1 dono mein"], ["<code>s.startsWith(x)</code>", "<code>s.startswith(x)</code>", ""], ["<code>s.endsWith(x)</code>", "<code>s.endswith(x)</code>", ""], ["<code>s.equals(t)</code>", "<code>s == t</code>", "Python == value compare karta hai"], ["<code>s.compareTo(t)</code>", "<code>(s &gt; t) - (s &lt; t)</code>", "Ya direct <code>s &gt; t</code>"], ["<code>s.charAt(i)</code>", "<code>s[i]</code>", ""], ["<code>new StringBuilder(s)</code>", "<code>s</code> hi kaafi", "Strings immutable dono mein"], ["<code>s.matches(regex)</code>", "<code>re.fullmatch(p,s)</code>", "import re chahiye"]]}, {"cat": "10. Strings", "title": "Reverse & Traverse String", "note": "Python ka slicing trick <code>s[::-1]</code> interview mein sabse zyada use hone wala one-liner hai — string, list, tuple sabpe chalta hai.", "type": "code", "java": "String rev = new StringBuilder(s).reverse().toString();\n\n// traverse char by char\nfor (int i = 0; i < s.length(); i++) {\n    System.out.println(s.charAt(i));\n}\n\n// or char array se\nfor (char c : s.toCharArray()) {\n    System.out.println(c);\n}", "python": "rev = s[::-1]          # 🔥 most-used Python trick\n\nfor ch in s:            # direct iteration\n    print(ch)\n\nfor i in range(len(s)):\n    print(i, s[i])\n\n# reversed()\nfor ch in reversed(s):\n    print(ch)", "extra": "<b>Yaad rakhne wala slicing:</b> <code>s[start:stop:step]</code>. <code>s[::-1]</code> = poora, reverse. <code>s[1::2]</code> = index 1 se even steps. Ye hi syntax <b>string, list, tuple</b> — teeno pe kaam karta hai. Java mein reverse ke liye StringBuilder ka reverse() method ya manual two-pointer loop.", "cpp": "// REVERSE & TRAVERSE STRING\n#include <algorithm>\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string s = \"Hello\";\n\n    string rev = s;\n    reverse(rev.begin(), rev.end());         // two-pointer loop bhi chal sakta hai\n\n    // traverse char by char\n    for (int i = 0; i < (int)s.length(); i++) {\n        cout << s[i] << endl;\n    }\n\n    // or range-based for se\n    for (char c : s) {\n        cout << c << endl;\n    }\n\n    cout << \"reversed: \" << rev << endl;\n    return 0;\n}"}, {"cat": "10. Strings", "title": "Character Counting & String Building", "note": "Frequency counting (letters) aur efficient string building — dono languages ke best practices.", "type": "code", "java": "// count lowercase letter frequency\nint[] freq = new int[26];\nfor (char c : s.toCharArray()) {\n    freq[c - 'a']++;\n}\n\n// efficient concatenation -> StringBuilder\nStringBuilder sb = new StringBuilder();\nsb.append(\"a\").append(\"b\").append('c');\nString result = sb.toString();", "python": "freq = [0] * 26\nfor ch in s:\n    freq[ord(ch) - ord('a')] += 1\n\n# efficient building -> join 🔥\nchars = []\nchars.append(\"a\"); chars.append(\"b\")\nresult = \"\".join(chars)\n\n# or direct (small strings ok)\nresult = \"ab\" + \"c\"", "extra": "⚠️ <b>Performance flow:</b> Python mein <code>s = s + ch</code> loop ke andar O(n²) hai (har baar nayi string banti hai). Hamesha <code>list + join()</code> ya StringIO use karo. Java mein <code>+=</code> bhi similar problem deta hai — isliye <code>StringBuilder</code>. Frequency counting ka <code>freq[c - 'a']</code> pattern dono languages mein same hai.", "cpp": "// CHAR COUNTING & STRING BUILDING\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string s = \"aabbc\";\n\n    // count lowercase letter frequency\n    int freq[26] = {0};\n    for (char c : s) {\n        freq[c - 'a']++;      // index = c - 'a'\n    }\n\n    // efficient concatenation -> string += (amortized fast)\n    string result = \"ab\";\n    result += 'c';\n\n    cout << freq[0] << \" \" << freq[1] << \" \" << freq[2] << endl;  // a=2, b=2, c=1\n    cout << result << endl;\n    return 0;\n}"}, {"cat": "10. Strings", "title": "Palindrome Check — Full Flow", "note": "Classic interview problem. Poore flow ko dono languages mein same rakhna — sirf syntax alag.", "type": "code", "java": "static boolean isPalindrome(String s) {\n    int l = 0, r = s.length() - 1;\n    while (l < r) {\n        if (s.charAt(l) != s.charAt(r)) return false;\n        l++; r--;\n    }\n    return true;\n}\n// isPalindrome(\"racecar\") -> true", "python": "def is_palindrome(s):\n    l, r = 0, len(s) - 1\n    while l < r:\n        if s[l] != s[r]:\n            return False\n        l += 1\n        r -= 1\n    return True\n\n# one-liner version 🔥\ndef is_pal(s):\n    return s == s[::-1]", "extra": "<b>Flow (dono languages mein same):</b> 1) do pointers l=0, r=len-1 2) jab tak l &lt; r, dono end ke chars compare karo 3) mismatch mila → false 4) warna pointers ko andar le jaao. Python one-liner <code>s == s[::-1]</code> shortcut hai — lekin interviewer pooche toh two-pointer version bhi batao.", "cpp": "// PALINDROME CHECK — TWO POINTERS\n#include <iostream>\n#include <string>\nusing namespace std;\n\nbool isPalindrome(string s) {\n    int l = 0, r = (int)s.length() - 1;\n    while (l < r) {\n        if (s[l] != s[r]) return false;\n        l++; r--;\n    }\n    return true;\n}\n// isPalindrome(\"racecar\") -> true\n\nint main() {\n    cout << \"racecar: \" << isPalindrome(\"racecar\") << endl;  // 1 = true\n    cout << \"hello:   \" << isPalindrome(\"hello\") << endl;    // 0 = false\n    return 0;\n}"}, {"type": "lc", "cat": "10. Strings", "title": "Q38 · Reverse Words in a String", "diff": "M", "note": "String ke saare words reverse karo — extra spaces hat jayein.", "java": "static String reverseWords(String s) {\n    String[] words = s.trim().split(\"\\\\s+\");\n    StringBuilder sb = new StringBuilder();\n    for (int i = words.length - 1; i >= 0; i--) {\n        sb.append(words[i]);\n        if (i > 0) sb.append(\" \");\n    }\n    return sb.toString();\n}", "python": "def reverse_words(s):\n    return \" \".join(s.split()[::-1])", "extra": "<b>Approach:</b> <code>split()</code> se words alag, phir reverse. O(n) time, O(n) space. Python one-liner: <code>\" \".join(s.split()[::-1])</code>. Edge cases: leading/trailing spaces, multiple spaces between words.", "cpp": "std::string reverseWords(std::string s) {\n    std::vector<std::string> words;\n    std::stringstream ss(s);\n    std::string w;\n    while (ss >> w) words.push_back(w);      // whitespace se split\n    std::string res;\n    for (int i = (int)words.size() - 1; i >= 0; i--) {\n        res += words[i];\n        if (i > 0) res += \" \";\n    }\n    return res;\n}"}, {"type": "lc", "cat": "10. Strings", "title": "Q39 · Valid Parentheses", "diff": "E", "note": "Brackets sahi se matched hain ya nahi — stack se solve hota hai.", "java": "static boolean isValid(String s) {\n    java.util.Stack<Character> st = new java.util.Stack<>();\n    for (char c : s.toCharArray()) {\n        if (c == '(') st.push(')');\n        else if (c == '{') st.push('}');\n        else if (c == '[') st.push(']');\n        else if (st.isEmpty() || st.pop() != c) return false;\n    }\n    return st.isEmpty();\n}", "python": "def is_valid(s):\n    stack = []\n    mp = {')':'(', '}':'{', ']':'['}\n    for c in s:\n        if c in mp:\n            if not stack or stack[-1] != mp[c]:\n                return False\n            stack.pop()\n        else:\n            stack.append(c)\n    return len(stack) == 0", "extra": "<b>Stack pattern:</b> Opening bracket aaye → push. Closing bracket aaye → stack top match karo. End mein stack empty → valid. O(n) time, O(n) space. Ye pattern interview mein bahut aata hai — Min Stack, Generate Parentheses sab isi pe based hain.", "cpp": "bool isValid(std::string s) {\n    std::stack<char> st;\n    for (char c : s) {\n        if (c == '(') st.push(')');\n        else if (c == '{') st.push('}');\n        else if (c == '[') st.push(']');\n        else if (st.empty() || st.top() != c) return false;\n        else st.pop();\n    }\n    return st.empty();\n}"}, {"type": "lc", "cat": "10. Strings", "title": "Q40 · Longest Palindromic Substring", "diff": "M", "note": "Sabse lamba palindrome substring (not subsequence) dhundho.", "java": "static String longestPalindrome(String s) {\n    int start = 0, maxLen = 1;\n    for (int i = 0; i < s.length(); i++) {\n        expand(s, i, i, start, maxLen);     // odd\n        expand(s, i, i+1, start, maxLen);   // even\n    }\n    return s.substring(start, start + maxLen);\n}\nstatic void expand(String s, int l, int r,\n        int[] start, int[] maxLen) {\n    while (l >= 0 && r < s.length()\n            && s.charAt(l) == s.charAt(r)) {\n        if (r - l + 1 > maxLen[0]) {\n            start[0] = l;\n            maxLen[0] = r - l + 1;\n        }\n        l--; r++;\n    }\n}", "python": "def longest_palindrome(s):\n    start, max_len = 0, 1\n    def expand(l, r):\n        nonlocal start, max_len\n        while l >= 0 and r < len(s) and s[l]
