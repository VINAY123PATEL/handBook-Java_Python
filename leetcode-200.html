{type:"lc", cat:"Arrays & Hashing", title:"Q001 · Two Sum", diff:"E", note:"Array mein aise 2 numbers ke indices return karo jinka sum = target ho.",
java:`public int[] twoSum(int[] nums, int target) {
    Map<Integer,Integer> m = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int need = target - nums[i];
        if (m.containsKey(need))
            return new int[]{m.get(need), i};
        m.put(nums[i], i);
    }
    return new int[]{};
}`,
python:`def twoSum(nums, target):
    m = {}
    for i, v in enumerate(nums):
        if target - v in m:
            return [m[target - v], i]
        m[v] = i
    return []`,
extra:`<b>HashMap</b> mein har number + index rakho. Har step pe check karo ki <b>target - nums[i]</b> pehle se map mein hai toh dono indices return. O(n) time, O(n) space.`,
desc:`Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target. You may assume that each input would have exactly one solution, and you may not use the same element twice. You can return the answer in any order.`,
examples:[{"input": "nums = [2,7,11,15], target = 9", "output": "[0,1]", "explanation": "Because nums[0] + nums[1] == 9, we return [0, 1]."}, {"input": "nums = [3,2,4], target = 6", "output": "[1,2]", "explanation": "Because nums[1] + nums[2] == 6, we return [1, 2]."}, {"input": "nums = [3,3], target = 6", "output": "[0,1]", "explanation": "Because nums[0] + nums[1] == 6, we return [0, 1]."}],
constraints:["2 <= nums.length <= 10^4", "-10^9 <= nums[i] <= 10^9", "-10^9 <= target <= 10^9", "Only one valid answer exists."]
},

{type:"lc", cat:"Arrays & Hashing", title:"Q003 · Valid Anagram", diff:"E", note:"Check karo dono strings same characters utni hi baar rakhti hain ya nahi.",
java:`public boolean isAnagram(String s, String t) {
    if (s.length() != t.length()) return false;
    int[] c = new int[26];
    for (int i = 0; i < s.length(); i++) {
        c[s.charAt(i)-'a']++;
        c[t.charAt(i)-'a']--;
    }
    for (int x : c) if (x != 0) return false;
    return true;
}`,
python:`from collections import Counter
def isAnagram(s, t):
    return Counter(s) == Counter(t)`,
extra:`Character <b>count array (26)</b> mein ek string se +1, dusri se -1. Agar sab 0 hain toh anagram. Python mein <b>Counter</b> directly compare. O(n).`,
desc:`Given two strings s and t, return true if t is an anagram of s, and false otherwise. An anagram is a word or phrase formed by rearranging the letters of a different word or phrase, typically using all the original letters exactly once.`,

{type:"lc", cat:"Arrays & Hashing", title:"Q004 · Group Anagrams", diff:"M", note:"Strings ko group karo — anagrams same group mein hon.",
java:`public List<List<String>> groupAnagrams(String[] strs) {
    Map<String, List<String>> m = new HashMap<>();
    for (String s : strs) {
        char[] c = s.toCharArray();
        Arrays.sort(c);
        m.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);
    }
    return new ArrayList<>(m.values());
}`,
python:`from collections import defaultdict
def groupAnagrams(strs):
    m = defaultdict(list)
    for s in strs:
        m[''.join(sorted(s))].append(s)
    return list(m.values())`,
extra:`Har string ko <b>sort</b> karo aur sorted form ko <b>key</b> banao — same anagram wali sab strings ek hi bucket mein aa jayengi. O(n·k log k).`,
desc:`Given an array of strings strs, group the anagrams together. You can return the answer in any order. An anagram is a word or phrase formed by rearranging the letters of a different word or phrase, typically using all the original letters exactly once.`,

{type:"lc", cat:"Arrays & Hashing", title:"Q005 · Top K Frequent Elements", diff:"M", note:"Array mein sabse zyada baar aane wale K elements return karo (order koi bhi).",
java:`public int[] topKFrequent(int[] nums, int k) {
    Map<Integer,Integer> cnt = new HashMap<>();
    for (int n : nums) cnt.merge(n, 1, Integer::sum);
    PriorityQueue<Integer> pq = new PriorityQueue<>((a,b)->cnt.get(a)-cnt.get(b));
    for (int n : cnt.keySet()) {
        pq.offer(n);
        if (pq.size() > k) pq.poll();
    }
    int[] r = new int[k];
    for (int i = 0; i < k; i++) r[i] = pq.poll();
    return r;
}`,
python:`from collections import Counter
import heapq
def topKFrequent(nums, k):
    cnt = Counter(nums)
    return heapq.nlargest(k, cnt.keys(), key=cnt.get)`,
extra:`Frequency count karo, phir <b>min-heap size k</b> rakho (sabse chhota nikalo) ya Python ka <b>nlargest</b>. O(n log k).`,

{type:"lc", cat:"Arrays & Hashing", title:"Q006 · Product of Array Except Self", diff:"M", note:"Har index pe baaki sab elements ka product, bina division use kiye.",
java:`public int[] productExceptSelf(int[] nums) {
    int n = nums.length;
    int[] r = new int[n];
    r[0] = 1;
    for (int i = 1; i < n; i++)
        r[i] = r[i-1] * nums[i-1];
    int right = 1;
    for (int i = n-1; i >= 0; i--) {
        r[i] *= right;
        right *= nums[i];
    }
    return r;
}`,
python:`def productExceptSelf(nums):
    n = len(nums)
    r = [1] * n
    for i in range(1, n):
        r[i] = r[i-1] * nums[i-1]
    right = 1

        r[i] *= right
        right *= nums[i]
    return r`,

{type:"lc", cat:"Arrays & Hashing", title:"Q007 · Longest Consecutive Sequence", diff:"M", note:"Array mein longest consecutive numbers ka length (O(n) mein).",
java:`public int longestConsecutive(int[] nums) {
    Set<Integer> s = new HashSet<>();
    for (int n : nums) s.add(n);
    int best = 0;
    for (int n : s) {
        if (!s.contains(n-1)) {
            int len = 1;
            while (s.contains(n+len)) len++;
            best = Math.max(best, len);
        }
    }
    return best;
}`,
python:`def longestConsecutive(nums):
    s = set(nums)

        if n - 1 not in s:
            ln = 1
            while n + ln in s:
                ln += 1
            best = max(best, ln)
    return best`,

{type:"lc", cat:"Arrays & Hashing", title:"Q009 · Subarray Sum Equals K", diff:"M", note:"Kitne contiguous subarrays ka sum exactly K hai.",
java:`public int subarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, 1);
    int sum = 0, ans = 0;
    for (int n : nums) {
        sum += n;
        ans += m.getOrDefault(sum - k, 0);

}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q010 · K-diff Pairs in an Array", diff:"M", note:"Aise pairs (i,j) count karo jinka difference exactly k ho — unique pairs (values ke basis pe).",
java:`public int findPairs(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    for (int n : nums) m.merge(n, 1, Integer::sum);
    int ans = 0;
    for (int n : m.keySet()) {

{type:"lc", cat:"Arrays & Hashing", title:"Q011 · Sort Colors", diff:"M", note:"0,1,2 (red/white/blue) ko in-place sort karo — koi sort library nahi.",
java:`public void sortColors(int[] nums) {
    int lo = 0, hi = nums.length-1, i = 0;
    while (i <= hi) {
        if (nums[i] == 0) swap(nums, lo++, i++);
        else if (nums[i] == 2) swap(nums, i, hi--);
        else i++;
    }
}
private void swap(int[] a, int i, int j) {
    int t = a[i]; a[i] = a[j]; a[j] = t;
}`,
python:`def sortColors(nums):
    lo = 0; hi = len(nums) - 1; i = 0
    while i <= hi:
        if nums[i] == 0:
            nums[lo], nums[i] = nums[i], nums[lo]
            lo += 1; i += 1
        elif nums[i] == 2:
            nums[i], nums[hi] = nums[hi], nums[i]
            hi -= 1
        else:
            i += 1`,
extra:`<b>Dutch National Flag</b> — 3 pointers: 0 left pe, 2 right pe, 1 beech. Ek hi pass mein O(n).`,

{type:"lc", cat:"Arrays & Hashing", title:"Q012 · Next Permutation", diff:"M", note:"Array ka lexicographically next permutation banao (in-place).",
java:`public void nextPermutation(int[] nums) {
    int i = nums.length - 2;
    while (i >= 0 && nums[i] >= nums[i+1]) i--;
    if (i >= 0) {
        int j = nums.length - 1;
        while (nums[j] <= nums[i]) j--;
        swap(nums, i, j);
    }
    reverse(nums, i+1);
}
private void reverse(int[] a, int s) {
    int i = s, j = a.length-1;
    while (i < j) swap(a, i++, j--);
}`,
python:`def nextPermutation(nums):
    i = len(nums) - 2
    while i >= 0 and nums[i] >= nums[i+1]:
        i -= 1
    if i >= 0:
        j = len(nums) - 1
        while nums[j] <= nums[i]:
            j -= 1
        nums[i], nums[j] = nums[j], nums[i]
    nums[i+1:] = reversed(nums[i+1:])`,
extra:`Right se <b>pehla dip</b> dhundo, usse apne right ke sabse chhote bade element se swap karo, phir right part <b>reverse</b>.`,

examples:[{"input": "nums = [1,2,3]", "output": "[1,3,2]", "explanation": "The next lexicographically greater permutation."}, {"input": "nums = [3,2,1]", "output": "[1,2,3]", "explanation": "Already the largest permutation, wrap to smallest."}, {"input": "nums = [1,1,5]", "output": "[1,5,1]", "explanation": "Swap 1 and 5."}],

java:`public List<Integer> findDuplicates(int[] nums) {
    List<Integer> r = new ArrayList<>();
    for (int n : nums) {
        int idx = Math.abs(n) - 1;
        if (nums[idx] < 0) r.add(Math.abs(n));

    }

}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q015 · Continuous Subarray Sum", diff:"M", note:"Kya koi subarray (size ≥ 2) hai jiska sum k ka multiple hai.",
java:`public boolean checkSubarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, -1);
    int sum = 0;
    for (int i = 0; i < nums.length; i++) {
        sum = (sum + nums[i]) % k;
        if (m.containsKey(sum)) {
            if (i - m.get(sum) > 1) return true;
        } else m.put(sum, i);
    }
    return false;
}`,

            if i - m[s] > 1: return True

{type:"lc", cat:"Arrays & Hashing", title:"Q016 · Insert Delete GetRandom O(1)", diff:"M", note:"Insert, remove, getRandom — teeno O(1) average mein.",
java:`class RandomizedSet {
    Map<Integer,Integer> idx = new HashMap<>();
    List<Integer> list = new ArrayList<>();
    Random rnd = new Random();
    public boolean insert(int v) {
        if (idx.containsKey(v)) return false;
        idx.put(v, list.size());
        list.add(v);
        return true;
    }
    public boolean remove(int v) {
        if (!idx.containsKey(v)) return false;
        int i = idx.remove(v);
        int last = list.remove(list.size()-1);
        if (i != list.size()) { list.set(i, last); idx.put(last, i); }
        return true;
    }
    public int getRandom() { return list.get(rnd.nextInt(list.size())); }
}`,
python:`import random
class RandomizedSet:
    def __init__(self):
        self.idx = {}
        self.list = []
    def insert(self, v):
        if v in self.idx: return False
        self.idx[v] = len(self.list)
        self.list.append(v)
        return True
    def remove(self, v):
        if v not in self.idx: return False
        i = self.idx.pop(v)
        last = self.list.pop()
        if i != len(self.list):
            self.list[i] = last
            self.idx[last] = i
        return True
    def getRandom(self):
        return random.choice(self.list)`,
extra:`<b>HashMap (value→index) + ArrayList</b>. Remove mein last element ko deleted spot pe copy karo taaki O(1) ho.`,
desc:`Implement the RandomizedSet class: RandomizedSet() Initializes the RandomizedSet object. bool insert(int val) Inserts an item val into the set if not present. Returns true if the item was not present, false otherwise. bool remove(int val) Removes an item val from the set if present. Returns true if the item was present, false otherwise. int getRandom() Returns a random element from the current set of elements. Each element must have the same probability of being returned. You must implement the functions of the class such that each function works in average O(1) time complexity.`,

constraints:["-2^31 <= val <= 2^31 - 1", "At most 2 * 10^5 calls will be made to insert, remove, and getRandom.", "There will be at least one element in the data structure when getRandom is called."]

{type:"lc", cat:"Arrays & Hashing", title:"Q017 · Maximum Product Subarray", diff:"M", note:"Subarray jiska product sabse zyada ho.",
java:`public int maxProduct(int[] nums) {
    int best = nums[0], mn = nums[0], mx = nums[0];
    for (int i = 1; i < nums.length; i++) {
        int t1 = nums[i]*mn, t2 = nums[i]*mx;
        mn = Math.min(nums[i], Math.min(t1, t2));
        mx = Math.max(nums[i], Math.max(t1, t2));
        best = Math.max(best, mx);
    }
    return best;
}`,
python:`def maxProduct(nums):
    mn = mx = best = nums[0]
    for v in nums[1:]:
        a, b = v*mn, v*mx
        mn = min(v, a, b)
        mx = max(v, a, b)
        best = max(best, mx)
    return best`,
extra:`Negative × negative = positive — isliye <b>min aur max dono track</b> karo. Har step pe 3 options: naya, min*val, max*val.`,

{type:"lc", cat:"Arrays & Hashing", title:"Q018 · Set Matrix Zeroes", diff:"M", note:"Jis row/col mein 0 hai, poori row/col ko 0 banao (in-place).",
java:`public void setZeroes(int[][] m) {
    boolean fr = false, fc = false;
    for (int i = 0; i < m.length; i++)
        for (int j = 0; j < m[0].length; j++)
            if (m[i][j] == 0) {
                if (i == 0) fr = true;
                if (j == 0) fc = true;
                m[i][0] = 0; m[0][j] = 0;
            }
    for (int i = 1; i < m.length; i++)
        for (int j = 1; j < m[0].length; j++)
            if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;
    if (fr) for (int j = 0; j < m[0].length; j++) m[0][j] = 0;
    if (fc) for (int i = 0; i < m.length; i++) m[i][0] = 0;
}`,
python:`def setZeroes(m):
    R, C = len(m), len(m[0])
    fr = any(x == 0 for x in m[0])
    fc = any(m[i][0] == 0 for i in range(R))
    for i in range(R):
        for j in range(C):
            if m[i][j] == 0:
                m[i][0] = 0; m[0][j] = 0
    for i in range(1, R):
        for j in range(1, C):
            if m[i][0] == 0 or m[0][j] == 0:
                m[i][j] = 0
    if fr: m[0] = [0]*C
    if fc:
        for i in range(R): m[i][0] = 0`,
extra:`<b>Pehli row/col ko marker</b> use karo (zero hone ka signal), phir baaki cells update karo, aakhir mein pehli row/col.`,

{type:"lc", cat:"Arrays & Hashing", title:"Q019 · Rotate Image", diff:"M", note:"n×n matrix ko 90° clockwise rotate karo (in-place).",
java:`public void rotate(int[][] m) {
    int n = m.length;
    for (int i = 0; i < n; i++)
        for (int j = i; j < n; j++) {
            int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;
        }

{type:"lc", cat:"Arrays & Hashing", title:"Q020 · Spiral Matrix", diff:"M", note:"Matrix elements ko spiral order mein return karo.",
java:`public List<Integer> spiralOrder(int[][] m) {
    List<Integer> r = new ArrayList<>();
    int t = 0, b = m.length-1, l = 0, rt = m[0].length-1;
    while (t <= b && l <= rt) {
        for (int j = l; j <= rt; j++) r.add(m[t][j]);
        for (int i = t+1; i <= b; i++) r.add(m[i][rt]);
        if (t < b) for (int j = rt-1; j >= l; j--) r.add(m[b][j]);
        if (l < rt) for (int i = b-1; i > t; i--) r.add(m[i][l]);
        t++; b--; l++; rt--;
    }
    return r;
}`,
python:`def spiralOrder(m):
    r = []
    t, b, l, rt = 0, len(m)-1, 0, len(m[0])-1
    while t <= b and l <= rt:
        for j in range(l, rt+1): r.append(m[t][j])
        for i in range(t+1, b+1): r.append(m[i][rt])
        if t < b:
            for j in range(rt-1, l-1, -1): r.append(m[b][j])
        if l < rt:
            for i in range(b-1, t, -1): r.append(m[i][l])
        t += 1; b -= 1; l += 1; rt -= 1
    return r`,
extra:`4 <b>boundaries</b> (top/bottom/left/right) ko loop kar kar ke tighten karte jaao. Har cell ek baar. O(n).`,

{type:"lc", cat:"Arrays & Hashing", title:"Q214 · Valid Sudoku", diff:"M", note:"Board valid hai (rows, cols, boxes mein no duplicates). Solve nahi karna.",
java:`public boolean isValidSudoku(char[][] b) {
    Set<String> seen = new HashSet<>();
    for (int i = 0; i < 9; i++)
        for (int j = 0; j < 9; j++) {
            char c = b[i][j];
            if (c == '.') continue;
            if (!seen.add(c + " in r" + i) ||
                !seen.add(c + " in c" + j) ||
                !seen.add(c + " in b" + i/3 + j/3)) return false;
        }

}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q228 · Majority Element II", diff:"M", note:"Saare elements jo &gt; n/3 baar aaye (max 2 possible).",
java:`public List<Integer> majorityElement(int[] nums) {
    int a = 0, b = 0, ca = 0, cb = 0;
    for (int n : nums) {
        if (n == a) ca++;
        else if (n == b) cb++;
        else if (ca == 0) { a = n; ca = 1; }
        else if (cb == 0) { b = n; cb = 1; }
        else { ca--; cb--; }
    }
    ca = 0; cb = 0;
    for (int n : nums) { if (n == a) ca++; else if (n == b) cb++; }
    List<Integer> r = new ArrayList<>();
    if (ca > nums.length/3) r.add(a);
    if (cb > nums.length/3) r.add(b);
    return r;
}`,
python:`def majorityElement(nums):
    a = b = None
    ca = cb = 0
    for n in nums:
        if n == a: ca += 1
        elif n == b: cb += 1
        elif ca == 0: a, ca = n, 1
        elif cb == 0: b, cb = n, 1
        else: ca -= 1; cb -= 1
    return [x for x in (a, b) if nums.count(x) > len(nums) // 3]`,
extra:`<b>1)</b> Boyer-Moore extended — 2 candidates. <b>2)</b> Verify pass — count &gt; n/3 check. <br><b>Complexity:</b> O(n) time, O(1) space.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q243 · Maximum Size Subarray Sum Equals K", diff:"M", note:"Sum = k wala sabse lamba subarray — prefix sum map.",
java:`public int maxSubArrayLen(int[] nums, int k) {
    Map<Integer, Integer> m = new HashMap<>();
    m.put(0, -1);
    int sum = 0, best = 0;
    for (int i = 0; i < nums.length; i++) {
        sum += nums[i];
        if (m.containsKey(sum - k)) best = Math.max(best, i - m.get(sum - k));
        m.putIfAbsent(sum, i);
    }
    return best;
}`,
python:`def maxSubArrayLen(nums, k):

        if s - k in m: best = max(best, i - m[s - k])

{type:"lc", cat:"Strings", title:"Q195 · Palindrome Pairs", diff:"H", note:"Kis (i, j) pair ka concatenation palindrome hai.",
java:`public List<List<Integer>> palindromePairs(String[] words) {
    Map<String, Integer> m = new HashMap<>();
    for (int i = 0; i < words.length; i++) m.put(words[i], i);
    List<List<Integer>> r = new ArrayList<>();
    for (int i = 0; i < words.length; i++) {
        String w = words[i];
        for (int j = 0; j <= w.length(); j++) {
            String pre = w.substring(0, j), suf = w.substring(j);
            if (isPal(pre)) {
                String need = new StringBuilder(suf).reverse().toString();
                if (m.containsKey(need) && m.get(need) != i)
                    r.add(Arrays.asList(m.get(need), i));
            }
            if (j < w.length() && isPal(suf)) {
                String need = new StringBuilder(pre).reverse().toString();
                if (m.containsKey(need) && m.get(need) != i)
                    r.add(Arrays.asList(i, m.get(need)));
            }
        }
    }
    return r;
}
private boolean isPal(String s) {
    int i = 0, j = s.length() - 1;
    while (i < j) if (s.charAt(i++) != s.charAt(j--)) return false;
    return true;
}`,
python:`def palindromePairs(words):
    m = {w: i for i, w in enumerate(words)}
    r = []
    for i, w in enumerate(words):

            pre, suf = w[:j], w[j:]
            if pre == pre[::-1]:
                need = suf[::-1]
                if need in m and m[need] != i:
                    r.append([m[need], i])
            if j < len(w) and suf == suf[::-1]:
                need = pre[::-1]
                if need in m and m[need] != i:
                    r.append([i, m[need]])
    return r`,

desc:`Given a list of unique words, find all pairs of distinct indices (i, j) in the given list such that the concatenation of the two words, i.e. words[i] + words[j], is a palindrome.`,

    Map<Character,Integer> m = Map.of('I',1,'V',5,'X',10,'L',50,'C',100,'D',500,'M',1000);

{type:"lc", cat:"Strings", title:"Q210 · Integer to Roman", diff:"M", note:"Integer ko Roman mein badlo (greedy lookup).",
java:`public String intToRoman(int num) {
    int[] vals = {1000,900,500,400,100,90,50,40,10,9,5,4,1};
    String[] syms = {"M","CM","D","CD","C","XC","L","XL","X","IX","V","IV","I"};
    StringBuilder sb = new StringBuilder();
    for (int i = 0; i < vals.length; i++)
        while (num >= vals[i]) {
            sb.append(syms[i]);
            num -= vals[i];
        }
    return sb.toString();
}`,

    vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1]

{type:"lc", cat:"Strings", title:"Q215 · Add Strings", diff:"E", note:"Do number strings add karo — bina built-in conversion ke (column-wise).",
java:`public String addStrings(String a, String b) {
    StringBuilder sb = new StringBuilder();
    int i = a.length()-1, j = b.length()-1, carry = 0;
    while (i >= 0 || j >= 0 || carry > 0) {
        int d = carry;
        if (i >= 0) d += a.charAt(i--) - '0';
        if (j >= 0) d += b.charAt(j--) - '0';
        sb.append(d % 10);
        carry = d / 10;
    }
    return sb.reverse().toString();
}`,

java:`public boolean isIsomorphic(String s, String t) {
    int[] m1 = new int[256], m2 = new int[256];

{type:"lc", cat:"Strings", title:"Q221 · Reverse Vowels of a String", diff:"E", note:"Sirf vowels reverse karo, baaki chars apni jagah.",
java:`public String reverseVowels(String s) {
    char[] c = s.toCharArray();
    int l = 0, r = c.length - 1;
    while (l < r) {
        while (l < r && !isVowel(c[l])) l++;
        while (l < r && !isVowel(c[r])) r--;
        char t = c[l]; c[l] = c[r]; c[r] = t;
        l++; r--;
    }
    return new String(c);
}
private boolean isVowel(char c) {
    return "aeiouAEIOU".indexOf(c) != -1;
}`,
python:`def reverseVowels(s):

        while l < r and s[r] not in v: r -= 1

{type:"lc", cat:"Strings", title:"Q252 · Minimum Time Difference", diff:"M", note:"Time strings ka minimum difference (circular) — bucket trick.",
java:`public int findMinDifference(List<String> tp) {
    boolean[] seen = new boolean[1440];
    for (String t : tp) {
        int min = Integer.parseInt(t.substring(0,2)) * 60 + Integer.parseInt(t.substring(3));
        if (seen[min]) return 0;
        seen[min] = true;
    }
    int first = -1, prev = -1, best = Integer.MAX_VALUE;
    for (int i = 0; i < 1440; i++) {
        if (seen[i]) {
            if (first == -1) first = i;
            else best = Math.min(best, i - prev);
            prev = i;
        }
    }
    best = Math.min(best, 1440 - prev + first);
    return best;
}`,
python:`def findMinDifference(tp):
    seen = [False] * 1440
    for t in tp:
        h, m = t.split(':')
        mins = int(h) * 60 + int(m)
        if seen[mins]: return 0
        seen[mins] = True
    prev = first = -1
    best = float('inf')
    for i in range(1440):
        if seen[i]:
            if first == -1: first = i
            else: best = min(best, i - prev)
            prev = i
    best = min(best, 1440 - prev + first)
    return best`,
extra:`<b>1)</b> Minutes mein convert (00:00 → 0). <b>2)</b> 1440 bucket — duplicate → 0. <b>3)</b> Circular diff check. <br><b>Complexity:</b> O(n) time, O(1440) space.`,
desc:`Given a list of 24-hour clock time points in 'HH:MM' format, find the minimum difference in minutes between any two time points in the list. The time wraps around (circular), so the difference between '23:59' and '00:00' is 1 minute.`,
examples:[{"input": "timePoints = [\"23:59\",\"00:00\"]", "output": "1", "explanation": "The minimum difference is 1 minute (from 23:59 to 00:00)."}, {"input": "timePoints = [\"00:00\",\"23:59\",\"12:34\"]", "output": "1", "explanation": "The minimum difference is 1 minute between '23:59' and '00:00'."}, {"input": "timePoints = [\"01:01\",\"02:01\",\"03:00\"]", "output": "59", "explanation": "Differences are 60, 1439 (circular), and 59. The minimum is 59."}],
constraints:["2 <= timePoints.length <= 2 * 10^4", "timePoints[i] is in the format 'HH:MM'."]
},

{type:"lc", cat:"Strings", title:"Q253 · Custom Sort String", diff:"M", note:"order ke hisaab se s sort karo — rank comparator.",
java:`public String customSortString(String order, String s) {
    int[] rank = new int[26];
    Arrays.fill(rank, 26);
    for (int i = 0; i < order.length(); i++) rank[order.charAt(i)-'a'] = i;
    Character[] c = s.chars().mapToObj(ch -> (char) ch).toArray(Character[]::new);
    Arrays.sort(c, (a, b) -> rank[a-'a'] - rank[b-'a']);
    StringBuilder sb = new StringBuilder();
    for (char ch : c) sb.append(ch);
    return sb.toString();
}`,
python:`def customSortString(order, s):
    rank = {c: i for i, c in enumerate(order)}
    return ''.join(sorted(s, key=lambda c: rank.get(c, len(order))))`,
extra:`<b>1)</b> order ke chars ko rank do. <b>2)</b> Baaki chars rank 26+. <b>3)</b> Sort by rank. <br><b>Complexity:</b> O(n log n) time, O(n) space.`,
desc:`Given a string s and a string order of unique characters, sort s so that all characters are sorted based on the ordering defined by order. Characters not present in order should be placed at the end of s in any order. The relative order of the remaining characters in s does not need to be preserved.`,
examples:[{"input": "order = 'cba', s = 'abcd'", "output": "'cbad'", "explanation": "'c' comes before 'b' before 'a' per order, so 'cba' then 'd' at the end."}, {"input": "order = 'cbafg', s = 'abcd'", "output": "'cbad'", "explanation": "'c', 'b', 'a' are in order. 'd' and 'f', 'g' are not in order, but 'd' goes to end."}],
constraints:["1 <= order.length <= 26", "1 <= s.length <= 200", "order and s consist of lowercase English letters.", "All characters in order are unique."]
},

java:`public boolean isPalindrome(String s) {
    int i = 0, j = s.length()-1;
    while (i < j) {
        while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;
        while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;
        if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) return false;
        i++; j--;

}`,

        i += 1; j -= 1
    return True`,

desc:`Given a string s, return true if it is a palindrome, or false otherwise. A phrase is a palindrome if, after converting all uppercase letters into lowercase letters and removing all non-alphanumeric characters, it reads the same forward and backward.`,

java:`public int[] sortedSquares(int[] nums) {
    int n = nums.length, i = 0, j = n-1;

    for (int k = n-1; k >= 0; k--) {

java:`public int trap(int[] h) {
    int l = 0, r = h.length - 1, lMax = 0, rMax = 0, water = 0;
    while (l < r) {
        if (h[l] <= h[r]) {
            lMax = Math.max(lMax, h[l]);
            water += lMax - h[l];

}`,

{type:"lc", cat:"Two Pointers", title:"Q229 · Sort Array By Parity", diff:"E", note:"Even pehle, odd baad — two pointers.",
java:`public int[] sortArrayByParity(int[] nums) {
    int l = 0, r = nums.length - 1;
    while (l < r) {
        while (l < r && nums[l] % 2 == 0) l++;
        while (l < r && nums[r] % 2 == 1) r--;
        int t = nums[l]; nums[l] = nums[r]; nums[r] = t;
        l++; r--;
    }
    return nums;
}`,
python:`def sortArrayByParity(nums):
    l, r = 0, len(nums) - 1
    while l < r:
        while l < r and nums[l] % 2 == 0: l += 1
        while l < r and nums[r] % 2 == 1: r -= 1
        nums[l], nums[r] = nums[r], nums[l]
        l += 1; r -= 1
    return nums`,

{type:"lc", cat:"Sliding Window", title:"Q030 · Longest Substring Without Repeating Characters", diff:"M", note:"Sabse lamba substring jisme koi character repeat na ho.",
java:`public int lengthOfLongestSubstring(String s) {
    Map<Character,Integer> m = new HashMap<>();
    int left = 0, best = 0;
    for (int right = 0; right < s.length(); right++) {
        char c = s.charAt(right);
        if (m.containsKey(c)) left = Math.max(left, m.get(c)+1);
        m.put(c, right);
        best = Math.max(best, right-left+1);
    }
    return best;
}`,
python:`def lengthOfLongestSubstring(s):
    m = {}
    left = best = 0
    for right, c in enumerate(s):
        if c in m:
            left = max(left, m[c] + 1)
        m[c] = right
        best = max(best, right - left + 1)
    return best`,
extra:`<b>Sliding window</b> — char ka last index map mein. Repeat milne pe left boundary uske aage le aao.`,
desc:`Given a string s, find the length of the longest substring without repeating characters. A substring is a contiguous non-empty sequence of characters within a string.`,
examples:[{"input": "s = 'abcabcbb'", "output": "3", "explanation": "The longest substring is 'abc' with length 3."}, {"input": "s = 'bbbbb'", "output": "1", "explanation": "The longest substring is 'b' with length 1."}, {"input": "s = 'pwwkew'", "output": "3", "explanation": "The longest substring is 'wke' with length 3."}],
constraints:["0 <= s.length <= 5 * 10^4", "s consists of English letters, digits, symbols and spaces."]
},

{type:"lc", cat:"Sliding Window", title:"Q031 · Longest Repeating Character Replacement", diff:"M", note:"Max K replacements se sabse lamba substring jisme sab chars same ho.",
java:`public int characterReplacement(String s, int k) {
    int[] cnt = new int[26];
    int left = 0, best = 0, maxFreq = 0;
    for (int right = 0; right < s.length(); right++) {
        maxFreq = Math.max(maxFreq, ++cnt[s.charAt(right)-'a']);
        if (right-left+1 - maxFreq > k) {
            cnt[s.charAt(left++)-'a']--;
        }
        best = Math.max(best, right-left+1);
    }
    return best;
}`,
python:`def characterReplacement(s, k):
    cnt = {}
    left = best = maxF = 0
    for right, c in enumerate(s):
        cnt[c] = cnt.get(c, 0) + 1
        maxF = max(maxF, cnt[c])
        if right-left+1 - maxF > k:
            cnt[s[left]] -= 1
            left += 1
        best = max(best, right-left+1)
    return best`,
extra:`Window rule: <b>length - maxFreq ≤ k</b>. Violate ho toh left shrink karo. O(n).`,
desc:`You are given a string s consisting of only uppercase English letters and an integer k. You can choose at most k characters from the string and replace them with any other uppercase English letter. Return the length of the longest substring containing the same letter you can get after performing the above operation.`,
examples:[{"input": "s = 'ABAB', k = 2", "output": "4", "explanation": "Replace both B's with A to get 'AAAA'."}, {"input": "s = 'AABABBA', k = 1", "output": "4", "explanation": "Replace the middle A with B to get 'AABBBBA' -> 'BBBB'."}],
constraints:["1 <= s.length <= 10^5", "s consists of only uppercase English letters.", "0 <= k <= s.length"]
},

{type:"lc", cat:"Sliding Window", title:"Q032 · Permutation in String", diff:"M", note:"Kya s1 ka koi permutation s2 ka substring hai.",
java:`public boolean checkInclusion(String s1, String s2) {
    int[] need = new int[26], have = new int[26];
    for (char c : s1.toCharArray()) need[c-'a']++;
    int left = 0;

java:`public int[] maxSlidingWindow(int[] nums, int k) {
    Deque<Integer> dq = new ArrayDeque<>();
    int[] r = new int[nums.length - k + 1];
    int idx = 0;
    for (int i = 0; i < nums.length; i++) {
        while (!dq.isEmpty() && dq.peekFirst() < i - k + 1) dq.pollFirst();
        while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();
        dq.offerLast(i);
        if (i >= k - 1) r[idx++] = nums[dq.peekFirst()];
    }
    return r;
}`,

java:`public int shortestSubarray(int[] nums, int k) {
    int n = nums.length;
    long[] pre = new long[n + 1];

}`,

{type:"lc", cat:"Binary Search", title:"Q039 · Search in Rotated Sorted Array", diff:"M", note:"Rotated sorted array mein target ka index dhundo.",
java:`public int search(int[] nums, int target) {
    int lo = 0, hi = nums.length-1;
    while (lo <= hi) {
        int mid = (lo + hi) / 2;
        if (nums[mid] == target) return mid;
        if (nums[lo] <= nums[mid]) {           // left half sorted
            if (target >= nums[lo] && target < nums[mid]) hi = mid - 1;
            else lo = mid + 1;
        } else {                               // right half sorted
            if (target > nums[mid] && target <= nums[hi]) lo = mid + 1;
            else hi = mid - 1;
        }
    }
    return -1;
}`,

    lo, hi = 0, len(nums)-1

        mid = (lo + hi) // 2
        if nums[mid] == target: return mid
        if nums[lo] <= nums[mid]:
            if nums[lo] <= target < nums[mid]: hi = mid - 1
            else: lo = mid + 1

java:`public double findMedianSortedArrays(int[] a, int[] b) {
    if (a.length > b.length) return findMedianSortedArrays(b, a);
    int m = a.length, n = b.length, lo = 0, hi = m;
    while (lo <= hi) {
        int i = (lo + hi) / 2, j = (m + n + 1) / 2 - i;
        int aL = (i == 0) ? Integer.MIN_VALUE : a[i-1];
        int aR = (i == m) ? Integer.MAX_VALUE : a[i];
        int bL = (j == 0) ? Integer.MIN_VALUE : b[j-1];
        int bR = (j == n) ? Integer.MAX_VALUE : b[j];
        if (aL <= bR && bL <= aR) {
            if ((m + n) % 2 == 1) return Math.max(aL, bL);
            return (Math.max(aL, bL) + Math.min(aR, bR)) / 2.0;
        }
        if (aL > bR) hi = i - 1;
        else lo = i + 1;
    }
    return 0;
}`,

        i = (lo + hi) // 2

public List<Integer> countSmaller(int[] nums) {
    int n = nums.length;
    count = new int[n];
    int[] idx = new int[n];
    for (int i = 0; i < n; i++) idx[i] = i;
    mergeSort(nums, idx, 0, n - 1);

    for (int c : count) r.add(c);
    return r;
}
private void mergeSort(int[] nums, int[] idx, int l, int r) {
    if (l >= r) return;
    int mid = (l + r) / 2;
    mergeSort(nums, idx, l, mid);
    mergeSort(nums, idx, mid + 1, r);
    int[] temp = new int[r - l + 1];
    int i = l, j = mid + 1, k = 0;
    while (i <= mid && j <= r) {
        if (nums[idx[i]] <= nums[idx[j]]) {
            count[idx[i]] += j - mid - 1;
            temp[k++] = idx[i++];
        } else temp[k++] = idx[j++];
    }
    while (i <= mid) { count[idx[i]] += j - mid - 1; temp[k++] = idx[i++]; }
    while (j <= r) temp[k++] = idx[j++];
    for (i = 0; i < k; i++) idx[l + i] = temp[i];
}`,
python:`def countSmaller(nums):
    n = len(nums)
    res = [0] * n
    idx = list(range(n))
    def merge_sort(arr):

        mid = len(arr) // 2
        left = merge_sort(arr[:mid])
        right = merge_sort(arr[mid:])
        i = j = 0
        sorted_ = []
        while i < len(left) and j < len(right):

                res[left[i]] += j
                sorted_.append(left[i])

private boolean can(int[] nums, int k, int limit) {

    }

}`,

{type:"lc", cat:"Linked List", title:"Q052 · Add Two Numbers", diff:"M", note:"Do numbers (reverse-order linked lists) ka sum — result bhi linked list.",
java:`public ListNode addTwoNumbers(ListNode l1, ListNode l2) {
    ListNode head = new ListNode(0), cur = head;
    int carry = 0;
    while (l1 != null || l2 != null || carry > 0) {
        int sum = carry;
        if (l1 != null) { sum += l1.val; l1 = l1.next; }
        if (l2 != null) { sum += l2.val; l2 = l2.next; }
        carry = sum / 10;
        cur.next = new ListNode(sum % 10);

    }
    return head.next;
}`,

        if l2: s += l2.val; l2 = l2.next

{type:"lc", cat:"Linked List", title:"Q054 · Reorder List", diff:"M", note:"L0→Ln→L1→Ln-1→... order mein reorder karo.",
java:`public void reorderList(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
    }
    ListNode prev = null, cur = slow.next;
    slow.next = null;
    while (cur != null) {              // reverse second half
        ListNode nxt = cur.next;
        cur.next = prev;
        prev = cur;
        cur = nxt;
    }
    ListNode a = head, b = prev;        // merge
    while (b != null) {
        ListNode t1 = a.next, t2 = b.next;
        a.next = b; b.next = t1;
        a = t1; b = t2;
    }
}`,

        fast = fast.next.next
    prev, cur = None, slow.next

    while cur:
        nxt = cur.next
        cur.next = prev
        prev, cur = cur, nxt
    a, b = head, prev

        a.next = b
        b.next = t1

{type:"lc", cat:"Linked List", title:"Q057 · Sort List", diff:"M", note:"Linked list ko O(n log n) mein sort karo — constant space.",
java:`public ListNode sortList(ListNode head) {
    if (head == null || head.next == null) return head;
    ListNode slow = head, fast = head.next;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;

    slow.next = null;

private ListNode merge(ListNode a, ListNode b) {

        if (a.val < b.val) { c.next = a; a = a.next; }
        else { c.next = b; b = b.next; }
        c = c.next;
    }
    c.next = (a != null) ? a : b;
    return h.next;
}`,

    mid = slow.next
    slow.next = None
    return merge(sortList(head), sortList(mid))`,

{type:"lc", cat:"Linked List", title:"Q191 · LRU Cache", diff:"H", note:"Least Recently Used evict karne wala cache.",
java:`class LRUCache {
    Map<Integer, Integer> m = new LinkedHashMap<>();
    int cap;
    public LRUCache(int capacity) { cap = capacity; }
    public int get(int key) {
        if (!m.containsKey(key)) return -1;
        int v = m.remove(key);
        m.put(key, v);
        return v;
    }
    public void put(int key, int value) {
        if (m.containsKey(key)) m.remove(key);
        else if (m.size() == cap) m.remove(m.keySet().iterator().next());
        m.put(key, value);
    }
}`,
python:`from collections import OrderedDict
class LRUCache:
    def __init__(self, capacity):
        self.m = OrderedDict()
        self.cap = capacity
    def get(self, key):
        if key not in self.m: return -1
        self.m.move_to_end(key)
        return self.m[key]
    def put(self, key, value):
        if key in self.m:
            self.m.move_to_end(key)
        self.m[key] = value
        if len(self.m) > self.cap:
            self.m.popitem(last=False)`,
extra:`<b>LinkedHashMap / OrderedDict</b> — access pe move to end, full hone pe oldest evict.`,

{type:"lc", cat:"Linked List", title:"Q192 · LFU Cache", diff:"H", note:"Least Frequently Used evict karne wala cache (tie → LRU).",
java:`class LFUCache {
    int cap, minF;
    Map<Integer, Integer> vals = new HashMap<>();
    Map<Integer, Integer> freqs = new HashMap<>();
    Map<Integer, LinkedHashSet<Integer>> lists = new HashMap<>();
    public LFUCache(int capacity) { cap = capacity; }
    public int get(int key) {
        if (!vals.containsKey(key)) return -1;
        increment(key);
        return vals.get(key);
    }
    public void put(int key, int value) {
        if (cap == 0) return;
        if (vals.containsKey(key)) {
            vals.put(key, value);
            increment(key);
            return;
        }
        if (vals.size() == cap) {
            int evict = lists.get(minF).iterator().next();
            lists.get(minF).remove(evict);
            vals.remove(evict); freqs.remove(evict);
        }
        vals.put(key, value);
        freqs.put(key, 1);
        lists.computeIfAbsent(1, k -> new LinkedHashSet<>()).add(key);
        minF = 1;
    }
    private void increment(int key) {
        int f = freqs.get(key);
        lists.get(f).remove(key);
        if (f == minF && lists.get(f).isEmpty()) minF++;
        freqs.put(key, f + 1);
        lists.computeIfAbsent(f + 1, k -> new LinkedHashSet<>()).add(key);
    }
}`,
python:`from collections import OrderedDict, defaultdict
class LFUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.minF = 0
        self.vals = {}
        self.freqs = {}
        self.lists = defaultdict(OrderedDict)
    def get(self, key):
        if key not in self.vals: return -1
        self._increment(key)
        return self.vals[key]
    def _increment(self, key):
        f = self.freqs[key]
        del self.lists[f][key]
        if f == self.minF and not self.lists[f]: self.minF += 1
        self.freqs[key] = f + 1
        self.lists[f + 1][key] = None
    def put(self, key, value):
        if self.cap == 0: return
        if key in self.vals:
            self.vals[key] = value
            self._increment(key)
            return
        if len(self.vals) == self.cap:
            evict, _ = self.lists[self.minF].popitem(last=False)
            del self.vals[evict]
            del self.freqs[evict]
        self.vals[key] = value
        self.freqs[key] = 1
        self.lists[1][key] = None
        self.minF = 1`,
extra:`<b>freq → LinkedHashSet (LRU order)</b>. Evict = minF list ka first. Increment on access.`,

{type:"lc", cat:"Stack", title:"Q062 · Min Stack", diff:"M", note:"Stack with getMin() in O(1) — push/pop/top bhi O(1).",
java:`class MinStack {
    Stack<Integer> st = new Stack<>();
    Stack<Integer> mins = new Stack<>();
    public void push(int v) {
        st.push(v);
        if (mins.isEmpty() || v <= mins.peek()) mins.push(v);
    }
    public void pop() {
        if (st.pop().equals(mins.peek())) mins.pop();
    }
    public int top() { return st.peek(); }
    public int getMin() { return mins.peek(); }
}`,
python:`class MinStack:
    def __init__(self):
        self.st = []
        self.mins = []
    def push(self, v):
        self.st.append(v)
        if not self.mins or v <= self.mins[-1]:
            self.mins.append(v)
    def pop(self):
        if self.st.pop() == self.mins[-1]:
            self.mins.pop()
    def top(self):
        return self.st[-1]
    def getMin(self):
        return self.mins[-1]`,
extra:`<b>Do stack</b> — ek normal, ek sirf current minimum rakhta hai. Min change ho toh hi push.`,

java:`public int evalRPN(String[] t) {
    Stack<Integer> st = new Stack<>();
    for (String s : t) {
        if (s.equals("+")) st.push(st.pop() + st.pop());
        else if (s.equals("-")) { int b = st.pop(), a = st.pop(); st.push(a - b); }
        else if (s.equals("*")) st.push(st.pop() * st.pop());
        else if (s.equals("/")) { int b = st.pop(), a = st.pop(); st.push(a / b); }
        else st.push(Integer.parseInt(s));
    }
    return st.pop();
}`,

java:`public String decodeString(String s) {
    Stack<StringBuilder> st = new Stack<>();
    Stack<Integer> num = new Stack<>();
    StringBuilder cur = new StringBuilder();
    int k = 0;
    for (char c : s.toCharArray()) {
        if (Character.isDigit(c)) k = k * 10 + (c - '0');
        else if (c == '[') {
            num.push(k); st.push(cur);
            cur = new StringBuilder(); k = 0;
        } else if (c == ']') {
            StringBuilder prev = st.pop();
            int n = num.pop();
            for (int i = 0; i < n; i++) prev.append(cur);
            cur = prev;
        } else cur.append(c);
    }
    return cur.toString();
}`,

    Stack<Integer> st = new Stack<>();
    for (int a : ast) {
        boolean alive = true;
        while (!st.isEmpty() && st.peek() > 0 && a < 0) {

            else { alive = false; break; }

{type:"lc", cat:"Stack", title:"Q190 · Maximum Frequency Stack", diff:"H", note:"Sabse zyada frequent element pop karo — tie mein latest.",
java:`class FreqStack {
    Map<Integer, Integer> freq = new HashMap<>();
    Map<Integer, Stack<Integer>> groups = new HashMap<>();
    int maxF = 0;
    public void push(int v) {
        int f = freq.getOrDefault(v, 0) + 1;
        freq.put(v, f);
        maxF = Math.max(maxF, f);
        groups.computeIfAbsent(f, k -> new Stack<>()).push(v);
    }
    public int pop() {
        int v = groups.get(maxF).pop();
        freq.put(v, freq.get(v) - 1);
        if (groups.get(maxF).isEmpty()) maxF--;
        return v;
    }
}`,
python:`class FreqStack:
    def __init__(self):
        self.freq = {}
        self.groups = {}
        self.maxF = 0
    def push(self, v):
        f = self.freq.get(v, 0) + 1
        self.freq[v] = f
        self.maxF = max(self.maxF, f)
        self.groups.setdefault(f, []).append(v)
    def pop(self):
        v = self.groups[self.maxF].pop()
        self.freq[v] -= 1
        if not self.groups[self.maxF]: self.maxF -= 1
        return v`,
extra:`<b>freq → stack of elements</b> (groups). push = freq+1 group mein daalo, pop = maxF group se.`,

{type:"lc", cat:"Stack", title:"Q244 · Sum of Subarray Minimums", diff:"M", note:"Saare subarrays ke minimums ka sum — contribution trick.",
java:`public int sumSubarrayMins(int[] arr) {
    int MOD = 1_000_000_007, n = arr.length;
    Stack<Integer> st = new Stack<>();
    long sum = 0;
    for (int i = 0; i <= n; i++) {
        while (!st.isEmpty() && (i == n || arr[st.peek()] >= arr[i])) {
            int mid = st.pop();
            int left = st.isEmpty() ? -1 : st.peek();
            sum = (sum + (long) arr[mid] * (mid - left) % MOD * (i - mid) % MOD) % MOD;
        }
        st.push(i);
    }
    return (int) sum;
}`,
python:`def sumSubarrayMins(arr):
    MOD = 10**9 + 7
    st = []
    total = 0
    for i in range(len(arr) + 1):
        while st and (i == len(arr) or arr[st[-1]] >= arr[i]):
            mid = st.pop()
            left = st[-1] if st else -1
            total = (total + arr[mid] * (mid - left) * (i - mid)) % MOD
        st.append(i)
    return total`,
extra:`<b>1)</b> Monotonic increasing stack. <b>2)</b> Har pop pe: arr[mid] kitne subarrays ka min = <code>(mid-left)*(i-mid)</code>. <b>3)</b> Sum mod. <br><b>Complexity:</b> O(n) time, O(n) space.`,

java:`public String removeDuplicates(String s, int k) {
    Stack<int[]> st = new Stack<>();

java:`public List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> r = new ArrayList<>();
    if (root == null) return r;
    Queue<TreeNode> q = new LinkedList<>();
    q.offer(root);
    while (!q.isEmpty()) {
        int n = q.size();
        List<Integer> level = new ArrayList<>();
        for (int i = 0; i < n; i++) {
            TreeNode node = q.poll();
            level.add(node.val);
            if (node.left != null) q.offer(node.left);
            if (node.right != null) q.offer(node.right);
        }
        r.add(level);
    }
    return r;
}`,

    r = []

    while q:
        level = []

            node = q.popleft()
            level.append(node.val)
            if node.left: q.append(node.left)

java:`public int kthSmallest(TreeNode root, int k) {
    Stack<TreeNode> st = new Stack<>();

    while (cur != null || !st.isEmpty()) {
        while (cur != null) { st.push(cur); cur = cur.left; }
        cur = st.pop();
        if (--k == 0) return cur.val;
        cur = cur.right;
    }
    return -1;
}`,

{type:"lc", cat:"Trees & BST", title:"Q079 · Construct Binary Tree from Preorder and Inorder", diff:"M", note:"Preorder + inorder se tree reconstruct karo.",
java:`public TreeNode buildTree(int[] pre, int[] in) {
    Map<Integer,Integer> idx = new HashMap<>();
    for (int i = 0; i < in.length; i++) idx.put(in[i], i);
    return build(pre, 0, pre.length-1, in, 0, in.length-1, idx);
}
private TreeNode build(int[] pre, int ps, int pe, int[] in, int is, int ie, Map<Integer,Integer> idx) {
    if (ps > pe) return null;
    TreeNode root = new TreeNode(pre[ps]);
    int ri = idx.get(pre[ps]);
    int leftSize = ri - is;
    root.left = build(pre, ps+1, ps+leftSize, in, is, ri-1, idx);
    root.right = build(pre, ps+leftSize+1, pe, in, ri+1, ie, idx);
    return root;
}`,
python:`def buildTree(pre, ino):

        ri = idx[pre[ps]]
        left = ri - is_
        root.left = build(ps+1, ps+left, is_, ri-1)
        root.right = build(ps+left+1, pe, ri+1, ie)
        return root
    return build(0, len(pre)-1, 0, len(ino)-1)`,

java:`public List<Integer> rightSideView(TreeNode root) {
    List<Integer> r = new ArrayList<>();

            if (i == n-1) r.add(node.val);

}`,

{type:"lc", cat:"Trees & BST", title:"Q081 · Binary Tree Zigzag Level Order", diff:"M", note:"Zigzag traversal — alternate level direction.",
java:`public List<List<Integer>> zigzagLevelOrder(TreeNode root) {
    List<List<Integer>> r = new ArrayList<>();
    if (root == null) return r;
    Queue<TreeNode> q = new LinkedList<>();
    q.offer(root);
    boolean leftToRight = true;
    while (!q.isEmpty()) {
        int n = q.size();
        LinkedList<Integer> level = new LinkedList<>();
        for (int i = 0; i < n; i++) {
            TreeNode node = q.poll();
            if (leftToRight) level.addLast(node.val);
            else level.addFirst(node.val);
            if (node.left != null) q.offer(node.left);
            if (node.right != null) q.offer(node.right);
        }
        r.add(level);
        leftToRight = !leftToRight;
    }
    return r;
}`,
python:`from collections import deque
def zigzagLevelOrder(root):
    r = []
    if not root: return r
    q = deque([root])
    rev = False
    while q:
        level = []
        for _ in range(len(q)):
            node = q.popleft()
            level.append(node.val)
            if node.left: q.append(node.left)
            if node.right: q.append(node.right)
        r.append(level[::-1] if rev else level)
        rev = not rev
    return r`,

{type:"lc", cat:"Trees & BST", title:"Q083 · Path Sum II", diff:"M", note:"Root-to-leaf saare paths jinka sum = target.",
java:`public List<List<Integer>> pathSum(TreeNode root, int target) {
    List<List<Integer>> r = new ArrayList<>();
    dfs(root, target, new ArrayList<>(), r);
    return r;
}
private void dfs(TreeNode n, int target, List<Integer> path, List<List<Integer>> r) {
    if (n == null) return;
    path.add(n.val);
    if (n.left == null && n.right == null && target == n.val)
        r.add(new ArrayList<>(path));
    dfs(n.left, target - n.val, path, r);
    dfs(n.right, target - n.val, path, r);
    path.remove(path.size()-1);
}`,
python:`def pathSum(root, target):
    r = []

        if not n: return
        path.append(n.val)
        if not n.left and not n.right and t == n.val:
            r.append(path[:])
        dfs(n.left, t - n.val, path)
        dfs(n.right, t - n.val, path)
        path.pop()
    dfs(root, target, [])
    return r`,

java:`public TreeNode deleteNode(TreeNode root, int key) {
    if (root == null) return null;
    if (key < root.val) root.left = deleteNode(root.left, key);
    else if (key > root.val) root.right = deleteNode(root.right, key);
    else {
        if (root.left == null) return root.right;
        if (root.right == null) return root.left;
        TreeNode min = root.right;

        root.val = min.val;
        root.right = deleteNode(root.right, min.val);
    }
    return root;
}`,

java:`class BSTIterator {
    Stack<TreeNode> st = new Stack<>();

        pushAll(n.right);
        return n.val;

java:`public int pathSum(TreeNode root, int targetSum) {
    Map<Long, Integer> m = new HashMap<>();
    m.put(0L, 1);
    return dfs(root, 0, targetSum, m);
}
private int dfs(TreeNode n, long sum, int t, Map<Long, Integer> m) {
    if (n == null) return 0;
    sum += n.val;
    int count = m.getOrDefault(sum - t, 0);
    m.merge(sum, 1, Integer::sum);
    count += dfs(n.left, sum, t, m) + dfs(n.right, sum, t, m);
    m.merge(sum, -1, Integer::sum);
    return count;
}`,
python:`def pathSum(root, targetSum):
    m = {0: 1}
    def dfs(n, s):
        if not n: return 0
        s += n.val
        count = m.get(s - targetSum, 0)
        m[s] = m.get(s, 0) + 1
        count += dfs(n.left, s) + dfs(n.right, s)
        m[s] -= 1
        return count
    return dfs(root, 0)`,
extra:`<b>1)</b> Path ka prefix sum. <b>2)</b> Map: sum → count. <b>3)</b> <code>sum - target</code> check. <b>4)</b> Backtrack pe decrement. <br><b>Complexity:</b> O(n) time, O(n) space.`,

{type:"lc", cat:"Trees & BST", title:"Q262 · Maximum Width of Binary Tree", diff:"M", note:"Har level ki maximum width (null nodes count karke).",
java:`public int widthOfBinaryTree(TreeNode root) {
    Queue<Object[]> q = new LinkedList<>();
    q.offer(new Object[]{root, 1L});
    int max = 0;
    while (!q.isEmpty()) {
        int size = q.size();
        long first = 0, last = 0;
        for (int i = 0; i < size; i++) {
            Object[] c = q.poll();
            TreeNode n = (TreeNode) c[0];
            long idx = (long) c[1];
            if (i == 0) first = idx;
            if (i == size - 1) last = idx;
            if (n.left != null) q.offer(new Object[]{n.left, 2 * idx});
            if (n.right != null) q.offer(new Object[]{n.right, 2 * idx + 1});
        }
        max = (int) Math.max(max, last - first + 1);
    }
    return max;
}`,
python:`from collections import deque
def widthOfBinaryTree(root):
    q = deque([(root, 1)])
    mx = 0
    while q:
        mx = max(mx, q[-1][1] - q[0][1] + 1)
        for _ in range(len(q)):
            n, idx = q.popleft()
            if n.left: q.append((n.left, 2 * idx))
            if n.right: q.append((n.right, 2 * idx + 1))
    return mx`,
extra:`<b>1)</b> Complete-tree indexing: left=2i, right=2i+1. <b>2)</b> Har level first-last width. <b>3)</b> Max track. <br><b>Complexity:</b> O(n) time, O(n) space.`,

{type:"lc", cat:"Trees & BST", title:"Q263 · Count Complete Tree Nodes", diff:"M", note:"Complete tree ke nodes count — height trick, O(log² n).",
java:`public int countNodes(TreeNode root) {
    if (root == null) return 0;
    int lh = 0, rh = 0;
    TreeNode l = root, r = root;
    while (l != null) { lh++; l = l.left; }
    while (r != null) { rh++; r = r.right; }
    if (lh == rh) return (1 << lh) - 1;
    return 1 + countNodes(root.left) + countNodes(root.right);
}`,
python:`def countNodes(root):
    if not root: return 0
    l = r = root
    lh = rh = 0
    while l: lh += 1; l = l.left
    while r: rh += 1; r = r.right
    if lh == rh: return (1 << lh) - 1
    return 1 + countNodes(root.left) + countNodes(root.right)`,

    for (char c : s.toCharArray()) cnt[c-'a']++;

python:`import heapq
def reorganizeString(s):
    cnt = {}
    for c in s: cnt[c] = cnt.get(c, 0) + 1
    pq = [(-v, k) for k, v in cnt.items()]
    heapq.heapify(pq)
    res = []

    while pq:
        v, k = heapq.heappop(pq)
        res.append(k)
        if prev and prev[0] < 0:
            heapq.heappush(pq, prev)
        prev = (v + 1, k)
    return ''.join(res) if len(res) == len(s) else ""`,

java:`public List<List<Integer>> kSmallestPairs(int[] a, int[] b, int k) {
    List<List<Integer>> r = new ArrayList<>();

def kSmallestPairs(a, b, k):

java:`class MedianFinder {

    PriorityQueue<Integer> hi = new PriorityQueue<>();
    public void addNum(int n) {
        lo.offer(n);
        hi.offer(lo.poll());

python:`import heapq
class MedianFinder:
    def __init__(self):
        self.lo = []   # max-heap (negated)
        self.hi = []   # min-heap
    def addNum(self, n):
        heapq.heappush(self.lo, -n)
        heapq.heappush(self.hi, -heapq.heappop(self.lo))
        if len(self.hi) > len(self.lo):
            heapq.heappush(self.lo, -heapq.heappop(self.hi))
    def findMedian(self):
        if len(self.lo) > len(self.hi): return -self.lo[0]
        return (-self.lo[0] + self.hi[0]) / 2`,

java:`public List<List<Integer>> getSkyline(int[][] buildings) {
    List<int[]> events = new ArrayList<>();
    for (int[] b : buildings) {
        events.add(new int[]{b[0], -b[2]});
        events.add(new int[]{b[1], b[2]});
    }
    events.sort((a, c) -> a[0] != c[0] ? a[0] - c[0] : a[1] - c[1]);
    PriorityQueue<Integer> pq = new PriorityQueue<>(Collections.reverseOrder());
    pq.offer(0);
    List<List<Integer>> r = new ArrayList<>();
    int prev = 0;
    for (int[] e : events) {
        if (e[1] < 0) pq.offer(-e[1]);
        else pq.remove(e[1]);
        int cur = pq.peek();
        if (cur != prev) {
            r.add(Arrays.asList(e[0], cur));
            prev = cur;
        }
    }
    return r;
}`,
python:`import heapq
def getSkyline(buildings):
    events = []
    for l, r, h in buildings:
        events.append((l, -h))
        events.append((r, h))
    events.sort()
    pq = [0]
    prev = 0
    res = []
    for x, h in events:
        if h < 0:
            heapq.heappush(pq, h)
        else:
            pq.remove(-h)
            heapq.heapify(pq)
        cur = -pq[0]
        if cur != prev:
            res.append([x, cur])
            prev = cur

    r.add(new ArrayList<>(cur));

java:`public List<List<Integer>> permute(int[] nums) {
    List<List<Integer>> r = new ArrayList<>();
    backtrack(nums, new boolean[nums.length], new ArrayList<>(), r);
    return r;
}
private void backtrack(int[] a, boolean[] used, List<Integer> cur, List<List<Integer>> r) {
    if (cur.size() == a.length) { r.add(new ArrayList<>(cur)); return; }
    for (int i = 0; i < a.length; i++) {
        if (used[i]) continue;
        used[i] = true;
        cur.add(a[i]);
        backtrack(a, used, cur, r);
        cur.remove(cur.size()-1);
        used[i] = false;
    }
}`,
python:`def permute(nums):
    r = []
    def bt(cur, used):
        if len(cur) == len(nums):
            r.append(cur[:]); return
        for i, v in enumerate(nums):
            if i in used: continue
            used.add(i)
            cur.append(v)
            bt(cur, used)
            cur.pop()
            used.remove(i)
    bt([], set())
    return r`,
extra:`Har position pe har unused element try karo. <b>used[] set</b> se visited track. O(n!).`,

java:`public List<List<String>> partition(String s) {
    List<List<String>> r = new ArrayList<>();
    backtrack(s, 0, new ArrayList<>(), r);
    return r;
}
private void backtrack(String s, int start, List<String> cur, List<List<String>> r) {
    if (start == s.length()) { r.add(new ArrayList<>(cur)); return; }
    for (int end = start + 1; end <= s.length(); end++) {
        if (isPal(s, start, end - 1)) {
            cur.add(s.substring(start, end));
            backtrack(s, end, cur, r);
            cur.remove(cur.size()-1);
        }
    }
}
private boolean isPal(String s, int i, int j) {
    while (i < j) if (s.charAt(i++) != s.charAt(j--)) return false;
    return true;
}`,
python:`def partition(s):

        if start == len(s):
            r.append(cur[:]); return

            sub = s[start:end]
            if sub == sub[::-1]:
                cur.append(sub)
                bt(end, cur)
                cur.pop()
    bt(0, [])
    return r`,

private void backtrack(int open, int close, StringBuilder sb, List<String> r) {
    if (open == 0 && close == 0) { r.add(sb.toString()); return; }
    if (open > 0) {
        sb.append('(');
        backtrack(open - 1, close, sb, r);
        sb.deleteCharAt(sb.length()-1);

        if close > open_:
            bt(open_, close - 1, cur + ")")

{type:"lc", cat:"Backtracking", title:"Q172 · N-Queens", diff:"H", note:"n queens is tarah rakho ki koi ek ko attack na kare.",
java:`public List<List<String>> solveNQueens(int n) {
    List<List<String>> r = new ArrayList<>();
    char[][] b = new char[n][n];
    for (char[] row : b) Arrays.fill(row, '.');
    backtrack(n, 0, b, r);
    return r;
}
private void backtrack(int n, int row, char[][] b, List<List<String>> r) {
    if (row == n) {
        List<String> cur = new ArrayList<>();
        for (char[] rr : b) cur.add(new String(rr));
        r.add(cur);
        return;
    }
    for (int c = 0; c < n; c++) {
        if (valid(b, row, c)) {
            b[row][c] = 'Q';
            backtrack(n, row + 1, b, r);
            b[row][c] = '.';
        }
    }
}
private boolean valid(char[][] b, int r, int c) {
    for (int i = 0; i < r; i++) if (b[i][c] == 'Q') return false;
    for (int i = r, j = c; i >= 0 && j >= 0; i--, j--) if (b[i][j] == 'Q') return false;
    for (int i = r, j = c; i >= 0 && j < b.length; i--, j++) if (b[i][j] == 'Q') return false;
    return true;
}`,
python:`def solveNQueens(n):
    r = []
    cols = set()
    d1 = set()  # r - c
    d2 = set()  # r + c
    board = ['.' * n for _ in range(n)]
    def bt(row):
        if row == n:
            r.append(board[:]); return
        for c in range(n):
            if c in cols or (row - c) in d1 or (row + c) in d2: continue
            cols.add(c); d1.add(row - c); d2.add(row + c)
            board[row] = board[row][:c] + 'Q' + board[row][c+1:]
            bt(row + 1)
            cols.remove(c); d1.remove(row - c); d2.remove(row + c)
            board[row] = board[row][:c] + '.' + board[row][c+1:]
    bt(0)
    return r`,
extra:`<b>Backtracking</b> — row-wise queen rakhna. sets: col, diag(r-c), anti-diag(r+c). O(n!).`},

{type:"lc", cat:"Backtracking", title:"Q173 · Sudoku Solver", diff:"H", note:"Sudoku board solve karo (backtracking).",
java:`public void solveSudoku(char[][] b) {
    solve(b);
}
private boolean solve(char[][] b) {
    for (int i = 0; i < 9; i++)
        for (int j = 0; j < 9; j++)
            if (b[i][j] == '.') {
                for (char c = '1'; c <= '9'; c++)
                    if (valid(b, i, j, c)) {
                        b[i][j] = c;
                        if (solve(b)) return true;
                        b[i][j] = '.';
                    }
                return false;
            }
    return true;
}
private boolean valid(char[][] b, int r, int c, char v) {
    for (int i = 0; i < 9; i++) {
        if (b[i][c] == v) return false;
        if (b[r][i] == v) return false;
        if (b[3*(r/3)+i/3][3*(c/3)+i%3] == v) return false;
    }
    return true;
}`,
python:`def solveSudoku(board):
    def valid(r, c, v):
        for i in range(9):
            if board[i][c] == v: return False
            if board[r][i] == v: return False
            if board[3*(r//3)+i//3][3*(c//3)+i%3] == v: return False
        return True
    def solve():
        for i in range(9):
            for j in range(9):
                if board[i][j] == '.':
                    for v in '123456789':
                        if valid(i, j, v):
                            board[i][j] = v

                            board[i][j] = '.'
                    return False

{type:"lc", cat:"Backtracking", title:"Q193 · Design Search Autocomplete System", diff:"H", note:"Live search suggestions by sentence frequency (top 3).",
java:`class AutocompleteSystem {
    Map<String, Integer> cnt = new HashMap<>();
    StringBuilder cur = new StringBuilder();
    public AutocompleteSystem(String[] sentences, int[] times) {
        for (int i = 0; i < sentences.length; i++)
            cnt.merge(sentences[i], times[i], Integer::sum);
    }
    public List<String> input(char c) {
        List<String> r = new ArrayList<>();
        if (c == '#') {
            cnt.merge(cur.toString(), 1, Integer::sum);
            cur.setLength(0);
            return r;
        }
        cur.append(c);
        String p = cur.toString();
        PriorityQueue<String> pq = new PriorityQueue<>((a, b) -> {
            int ca = cnt.getOrDefault(a, 0), cb = cnt.getOrDefault(b, 0);
            return ca != cb ? ca - cb : b.compareTo(a);
        });
        for (String s : cnt.keySet())
            if (s.startsWith(p)) {
                pq.offer(s);
                if (pq.size() > 3) pq.poll();
            }
        while (!pq.isEmpty()) r.add(pq.poll());
        Collections.reverse(r);
        return r;
    }
}`,
python:`class AutocompleteSystem:
    def __init__(self, sentences, times):
        self.cnt = {}
        for s, t in zip(sentences, times):
            self.cnt[s] = t
        self.cur = ''
    def input(self, c):
        if c == '#':
            self.cnt[self.cur] = self.cnt.get(self.cur, 0) + 1
            self.cur = ''
            return []
        self.cur += c
        return sorted((s for s in self.cnt if s.startswith(self.cur)),

{type:"lc", cat:"Backtracking", title:"Q196 · Word Search II", diff:"H", note:"Grid mein multiple words dhundho — Trie + DFS.",
java:`class Trie {
    Trie[] next = new Trie[26];
    String word;
}
public List<String> findWords(char[][] b, String[] words) {
    Trie root = new Trie();
    for (String w : words) {
        Trie t = root;
        for (char c : w.toCharArray()) {
            if (t.next[c-'a'] == null) t.next[c-'a'] = new Trie();
            t = t.next[c-'a'];
        }
        t.word = w;
    }
    List<String> r = new ArrayList<>();
    for (int i = 0; i < b.length; i++)
        for (int j = 0; j < b[0].length; j++)
            dfs(b, i, j, root, r);
    return r;
}
private void dfs(char[][] b, int i, int j, Trie t, List<String> r) {
    if (i < 0 || i >= b.length || j < 0 || j >= b[0].length || b[i][j] == '#') return;
    Trie nxt = t.next[b[i][j]-'a'];
    if (nxt == null) return;
    if (nxt.word != null) { r.add(nxt.word); nxt.word = null; }
    char c = b[i][j];
    b[i][j] = '#';
    dfs(b, i+1, j, nxt, r); dfs(b, i-1, j, nxt, r);
    dfs(b, i, j+1, nxt, r); dfs(b, i, j-1, nxt, r);
    b[i][j] = c;
}`,
python:`class Trie:
    def __init__(self):
        self.next = {}
        self.word = None
def findWords(b, words):

        for c in w:
            t = t.next.setdefault(c, Trie())
        t.word = w
    R, C = len(b), len(b[0])
    r = []

        if i < 0 or i >= R or j < 0 or j >= C or b[i][j] == '#': return

        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            dfs(i + di, j + dj, nxt)
        b[i][j] = ch
    for i in range(R):
        for j in range(C):
            dfs(i, j, root)
    return r`,

java:`public List<List<Integer>> pacificAtlantic(int[][] h) {
    int R = h.length, C = h[0].length;
    boolean[][] pac = new boolean[R][C], atl = new boolean[R][C];
    for (int i = 0; i < R; i++) {
        dfs(h, i, 0, pac); dfs(h, i, C-1, atl);
    }
    for (int j = 0; j < C; j++) {
        dfs(h, 0, j, pac); dfs(h, R-1, j, atl);
    }
    List<List<Integer>> r = new ArrayList<>();
    for (int i = 0; i < R; i++)
        for (int j = 0; j < C; j++)
            if (pac[i][j] && atl[i][j]) r.add(Arrays.asList(i, j));
    return r;
}
private void dfs(int[][] h, int i, int j, boolean[][] v) {
    if (v[i][j]) return;
    v[i][j] = true;
    for (int[] d : new int[][]{{1,0},{-1,0},{0,1},{0,-1}}) {
        int ni = i+d[0], nj = j+d[1];
        if (ni >= 0 && ni < h.length && nj >= 0 && nj < h[0].length && h[ni][nj] >= h[i][j])
            dfs(h, ni, nj, v);
    }
}`,

    R, C = len(h), len(h[0])

    atl = [[False]*C for _ in range(R)]

        if v[i][j]: return
        v[i][j] = True
        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            ni, nj = i+di, j+dj
            if 0 <= ni < R and 0 <= nj < C and h[ni][nj] >= h[i][j]:
                dfs(ni, nj, v)
    for i in range(R): dfs(i, 0, pac); dfs(i, C-1, atl)
    for j in range(C): dfs(0, j, pac); dfs(R-1, j, atl)
    return [[i, j] for i in range(R) for j in range(C) if pac[i][j] and atl[i][j]]`,

java:`public boolean canFinish(int n, int[][] pre) {
    List<List<Integer>> adj = new ArrayList<>();

def canFinish(n, pre):
    adj = [[] for _ in range(n)]
    indeg = [0] * n
    for a, b in pre:

    q = deque([i for i in range(n) if indeg[i] == 0])

{type:"lc", cat:"Graphs", title:"Q112 · Rotting Oranges", diff:"M", note:"Saare oranges rotten hone mein kitne minutes (BFS layers).",
java:`public int orangesRotting(int[][] g) {
    int R = g.length, C = g[0].length, fresh = 0;
    Queue<int[]> q = new LinkedList<>();
    for (int i = 0; i < R; i++)
        for (int j = 0; j < C; j++) {
            if (g[i][j] == 2) q.offer(new int[]{i, j});
            if (g[i][j] == 1) fresh++;
        }
    int mins = 0;
    int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};
    while (!q.isEmpty() && fresh > 0) {
        mins++;
        int n = q.size();
        for (int t = 0; t < n; t++) {
            int[] c = q.poll();
            for (int[] d : dirs) {
                int ni = c[0]+d[0], nj = c[1]+d[1];
                if (ni >= 0 && ni < R && nj >= 0 && nj < C && g[ni][nj] == 1) {
                    g[ni][nj] = 2;
                    fresh--;
                    q.offer(new int[]{ni, nj});
                }
            }
        }
    }
    return fresh == 0 ? mins : -1;
}`,
python:`from collections import deque
def orangesRotting(g):
    R, C = len(g), len(g[0])

    fresh = 0

        for j in range(C):
            if g[i][j] == 2: q.append((i, j))
            elif g[i][j] == 1: fresh += 1
    mins = 0
    while q and fresh > 0:
        mins += 1
        for _ in range(len(q)):
            i, j = q.popleft()
            for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:

                if 0 <= ni < R and 0 <= nj < C and g[ni][nj] == 1:
                    g[ni][nj] = 2

    return mins if fresh == 0 else -1`,

    for (int i = 0; i < R; i++)
        for (int j = 0; j < C; j++) {
            if (b[i][j] == 'O') b[i][j] = 'X';
            else if (b[i][j] == '#') b[i][j] = 'O';
        }
}

java:`public boolean validTree(int n, int[][] edges) {
    if (edges.length != n - 1) return false;
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
    for (int[] e : edges) {
        adj.get(e[0]).add(e[1]);
        adj.get(e[1]).add(e[0]);

}
private boolean dfs(List<List<Integer>> adj, int u, int parent, boolean[] v) {
    v[u] = true;
    for (int nb : adj.get(u)) {
        if (nb == parent) continue;
        if (v[nb]) return false;
        if (!dfs(adj, nb, u, v)) return false;
    }
    return true;
}`,
python:`def validTree(n, edges):
    if len(edges) != n - 1: return False
    adj = [[] for _ in range(n)]
    for a, b in edges:

    v = set()
    def dfs(u, parent):
        v.add(u)
        for nb in adj[u]:
            if nb == parent: continue
            if nb in v: return False
            if not dfs(nb, u): return False
        return True

{type:"lc", cat:"Graphs", title:"Q119 · Network Delay Time", diff:"M", note:"Source se sab nodes tak pahunchne ka max shortest time — Dijkstra.",
java:`public int networkDelayTime(int[][] times, int n, int k) {
    List<List<int[]>> adj = new ArrayList<>();
    for (int i = 0; i <= n; i++) adj.add(new ArrayList<>());
    for (int[] t : times) adj.get(t[0]).add(new int[]{t[1], t[2]});
    int[] dist = new int[n+1];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[k] = 0;
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[1] - b[1]);
    pq.offer(new int[]{k, 0});
    while (!pq.isEmpty()) {
        int[] c = pq.poll();
        if (c[1] > dist[c[0]]) continue;
        for (int[] e : adj.get(c[0])) {
            int nd = c[1] + e[1];
            if (nd < dist[e[0]]) {
                dist[e[0]] = nd;
                pq.offer(new int[]{e[0], nd});
            }
        }
    }
    int max = 0;
    for (int i = 1; i <= n; i++) max = Math.max(max, dist[i]);
    return max == Integer.MAX_VALUE ? -1 : max;
}`,
python:`import heapq
def networkDelayTime(times, n, k):
    adj = [[] for _ in range(n+1)]
    for a, b, w in times:
        adj[a].append((b, w))
    dist = {i: float('inf') for i in range(1, n+1)}
    dist[k] = 0
    pq = [(0, k)]
    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]: continue
        for v, w in adj[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(pq, (d + w, v))
    mx = max(dist.values())
    return mx if mx != float('inf') else -1`,

java:`public int ladderLength(String begin, String end, List<String> list) {
    Set<String> set = new HashSet<>(list);
    if (!set.contains(end)) return 0;
    Queue<String> q = new LinkedList<>();
    q.offer(begin);
    int steps = 1;
    while (!q.isEmpty()) {
        int n = q.size();
        for (int t = 0; t < n; t++) {
            String w = q.poll();
            if (w.equals(end)) return steps;
            char[] c = w.toCharArray();
            for (int i = 0; i < c.length; i++) {
                char orig = c[i];
                for (char ch = 'a'; ch <= 'z'; ch++) {

                    String nw = new String(c);
                    if (set.contains(nw)) { q.offer(nw); set.remove(nw); }
                }
                c[i] = orig;
            }
        }
        steps++;
    }
    return 0;
}`,

{type:"lc", cat:"Graphs", title:"Q178 · Alien Dictionary", diff:"H", note:"Sorted alien words se character order find karo (topo sort).",
java:`public String alienOrder(String[] words) {
    Map<Character, Set<Character>> adj = new HashMap<>();
    int[] indeg = new int[26];
    Arrays.fill(indeg, -1);
    for (String w : words)
        for (char c : w.toCharArray()) indeg[c-'a'] = 0;
    for (int i = 0; i < words.length - 1; i++) {
        String a = words[i], b = words[i+1];
        if (a.length() > b.length() && a.startsWith(b)) return "";
        int len = Math.min(a.length(), b.length());
        for (int j = 0; j < len; j++)
            if (a.charAt(j) != b.charAt(j)) {
                if (!adj.containsKey(a.charAt(j))) adj.put(a.charAt(j), new HashSet<>());
                if (adj.get(a.charAt(j)).add(b.charAt(j))) indeg[b.charAt(j)-'a']++;
                break;
            }
    }
    Queue<Character> q = new LinkedList<>();
    for (char c = 'a'; c <= 'z'; c++)
        if (indeg[c-'a'] == 0) q.offer(c);
    StringBuilder sb = new StringBuilder();
    while (!q.isEmpty()) {
        char c = q.poll();
        sb.append(c);
        if (adj.containsKey(c))
            for (char nxt : adj.get(c))
                if (--indeg[nxt-'a'] == 0) q.offer(nxt);
    }
    return sb.length() == Arrays.stream(indeg).filter(x -> x >= 0).count() ? sb.toString() : "";
}`,
python:`from collections import deque
def alienOrder(words):
    adj = {}
    indeg = {}
    for w in words:
        for c in w:
            adj.setdefault(c, set())
            indeg[c] = 0
    for a, b in zip(words, words[1:]):
        if len(a) > len(b) and a.startswith(b): return ""
        for x, y in zip(a, b):
            if x != y:
                if y not in adj[x]:
                    adj[x].add(y)
                    indeg[y] += 1
                break
    q = deque([c for c in indeg if indeg[c] == 0])
    r = []
    while q:
        c = q.popleft()
        r.append(c)
        for nxt in adj[c]:
            indeg[nxt] -= 1
            if indeg[nxt] == 0: q.append(nxt)
    return ''.join(r) if len(r) == len(indeg) else ""`,

{type:"lc", cat:"Graphs", title:"Q189 · Shortest Path in a Grid with Obstacles Elimination", diff:"H", note:"k obstacles ko hata ke shortest path (BFS with k state).",
java:`public int shortestPath(int[][] g, int k) {
    int R = g.length, C = g[0].length;
    if (R == 1 && C == 1) return 0;
    int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};
    boolean[][][] seen = new boolean[R][C][k + 1];
    Queue<int[]> q = new LinkedList<>();
    q.offer(new int[]{0, 0, k});
    int steps = 0;
    while (!q.isEmpty()) {
        int n = q.size();
        steps++;
        for (int t = 0; t < n; t++) {
            int[] c = q.poll();
            for (int[] d : dirs) {
                int ni = c[0]+d[0], nj = c[1]+d[1];
                if (ni < 0 || ni >= R || nj < 0 || nj >= C) continue;
                int nk = c[2] - g[ni][nj];
                if (nk < 0 || seen[ni][nj][nk]) continue;
                if (ni == R-1 && nj == C-1) return steps;
                seen[ni][nj][nk] = true;
                q.offer(new int[]{ni, nj, nk});
            }
        }
    }
    return -1;
}`,
python:`from collections import deque
def shortestPath(g, k):
    R, C = len(g), len(g[0])
    if R == 1 and C == 1: return 0
    seen = [[[False] * (k + 1) for _ in range(C)] for _ in range(R)]
    q = deque([(0, 0, k, 0)])
    seen[0][0][k] = True
    while q:
        i, j, rem, steps = q.popleft()
        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            ni, nj = i + di, j + dj
            if 0 <= ni < R and 0 <= nj < C:
                nk = rem - g[ni][nj]
                if nk >= 0 and not seen[ni][nj][nk]:
                    if ni == R-1 and nj == C-1: return steps + 1
                    seen[ni][nj][nk] = True
                    q.append((ni, nj, nk, steps + 1))
    return -1`,

java:`public boolean possibleBipartition(int n, int[][] dislikes) {
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i <= n; i++) adj.add(new ArrayList<>());
    for (int[] d : dislikes) {
        adj.get(d[0]).add(d[1]);
        adj.get(d[1]).add(d[0]);
    }
    int[] color = new int[n + 1];
    for (int i = 1; i <= n; i++)
        if (color[i] == 0 && !bfs(adj, i, color)) return false;
    return true;
}
private boolean bfs(List<List<Integer>> adj, int s, int[] color) {
    Queue<Integer> q = new LinkedList<>();
    q.offer(s); color[s] = 1;
    while (!q.isEmpty()) {
        int u = q.poll();
        for (int v : adj.get(u)) {
            if (color[v] == color[u]) return false;
            if (color[v] == 0) { color[v] = -color[u]; q.offer(v); }
        }
    }
    return true;
}`,
python:`from collections import deque
def possibleBipartition(n, dislikes):
    adj = [[] for _ in range(n + 1)]
    for a, b in dislikes:
        adj[a].append(b); adj[b].append(a)
    color = [0] * (n + 1)
    def bfs(s):
        q = deque([s])
        color[s] = 1
        while q:
            u = q.popleft()
            for v in adj[u]:
                if color[v] == color[u]: return False
                if color[v] == 0:
                    color[v] = -color[u]
                    q.append(v)
        return True
    for i in range(1, n + 1):
        if color[i] == 0 and not bfs(i): return False
    return True`,
extra:`<b>1)</b> 2-coloring (bipartite). <b>2)</b> Neighbor opposite color. <b>3)</b> Same color → conflict. <br><b>Complexity:</b> O(V+E) time, O(V+E) space.`,

{type:"lc", cat:"Greedy", title:"Q123 · Hand of Straights", diff:"M", note:"Cards ko groupSize ke consecutive groups mein baato (W ≤ 1).",
java:`public boolean isNStraightHand(int[] hand, int gs) {
    if (hand.length % gs != 0) return false;
    Map<Integer,Integer> cnt = new HashMap<>();
    for (int c : hand) cnt.merge(c, 1, Integer::sum);
    PriorityQueue<Integer> pq = new PriorityQueue<>(cnt.keySet());
    while (!pq.isEmpty()) {
        int first = pq.peek();
        for (int i = first; i < first + gs; i++) {
            if (!cnt.containsKey(i) || cnt.get(i) == 0) return false;
            cnt.merge(i, -1, Integer::sum);
            if (cnt.get(i) == 0) pq.poll();
        }
    }
    return true;
}`,

{type:"lc", cat:"Greedy", title:"Q124 · Longest Palindrome by Concatenating Two Letter Words", diff:"M", note:"Two-letter words se sabse lamba palindrome banao.",
java:`public int longestPalindrome(String[] words) {
    Map<String, Integer> m = new HashMap<>();
    int ans = 0, center = 0;
    for (String w : words) m.merge(w, 1, Integer::sum);
    for (String w : m.keySet()) {
        String rev = "" + w.charAt(1) + w.charAt(0);
        if (w.equals(rev)) {
            ans += (m.get(w) / 2) * 4;
            if (m.get(w) % 2 == 1) center = 1;
        } else if (w.compareTo(rev) < 0 && m.containsKey(rev)) {
            ans += Math.min(m.get(w), m.get(rev)) * 4;
        }
    }
    return ans + center * 2;
}`,
python:`def longestPalindrome(words):
    m = {}
    ans = center = 0
    for w in words: m[w] = m.get(w, 0) + 1
    for w, v in m.items():
        rev = w[::-1]
        if w == rev:
            ans += (v // 2) * 4
            if v % 2: center = 2
        elif rev in m and w < rev:
            ans += min(v, m[rev]) * 4
    return ans + center`,

{type:"lc", cat:"Greedy", title:"Q126 · Restore the Array From Adjacent Pairs", diff:"M", note:"Adjacent pairs se array reconstruct karo (unique order).",
java:`public int[] restoreArray(int[][] pairs) {
    Map<Integer, List<Integer>> adj = new HashMap<>();
    for (int[] p : pairs) {
        adj.computeIfAbsent(p[0], k -> new ArrayList<>()).add(p[1]);
        adj.computeIfAbsent(p[1], k -> new ArrayList<>()).add(p[0]);
    }
    int start = 0;
    for (int k : adj.keySet()) if (adj.get(k).size() == 1) { start = k; break; }
    int[] r = new int[pairs.length + 1];
    int prev = 0;
    r[0] = start;
    int cur = adj.get(start).get(0);
    for (int i = 1; i < r.length; i++) {
        r[i] = cur;
        int nxt = adj.get(cur).get(0) == prev ? adj.get(cur).get(1) : adj.get(cur).get(0);
        prev = cur;
        cur = nxt;
    }
    return r;
}`,
python:`def restoreArray(pairs):

java:`public int minDeletions(String s) {
