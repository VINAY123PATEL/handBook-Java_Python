java:`public int candy(int[] ratings) {
    int n = ratings.length;
    int[] c = new int[n];
    Arrays.fill(c, 1);
    for (int i = 1; i < n; i++)
        if (ratings[i] > ratings[i-1]) c[i] = c[i-1] + 1;

java:`public int bagOfTokensScore(int[] tokens, int power) {
    Arrays.sort(tokens);

    while (l <= r) {

java:`public boolean isPossible(int[] nums) {
    Map<Integer,Integer> freq = new HashMap<>(), end = new HashMap<>();
    for (int n : nums) freq.merge(n, 1, Integer::sum);

            freq.merge(n + 1, -1, Integer::sum);

        } else return false;
    }
    return true;
}`,

java:`public int lengthOfLIS(int[] nums) {
    int[] tails = new int[nums.length];

{type:"lc", cat:"1-D DP", title:"Q135 · Longest Palindromic Substring", diff:"M", note:"Longest palindromic substring return karo.",
java:`public String longestPalindrome(String s) {
    int n = s.length(), best = 0, start = 0;
    for (int i = 0; i < n; i++) {
        int l = i, r = i;
        while (l >= 0 && r < n && s.charAt(l) == s.charAt(r)) { l--; r++; }
        if (r - l - 1 > best) { best = r - l - 1; start = l + 1; }
        l = i; r = i + 1;
        while (l >= 0 && r < n && s.charAt(l) == s.charAt(r)) { l--; r++; }
        if (r - l - 1 > best) { best = r - l - 1; start = l + 1; }
    }
    return s.substring(start, start + best);
}`,
python:`def longestPalindrome(s):
    best = ''
    for i in range(len(s)):
        for l, r in ((i, i), (i, i + 1)):
            while l >= 0 and r < len(s) and s[l] == s[r]:
                l -= 1; r += 1
            if r - l - 1 > len(best):
                best = s[l+1:r]
    return best`,
extra:`<b>Expand around center</b> — odd + even centers. O(n²) time, O(1) space.`,
desc:`Given a string s, return the longest palindromic substring in s.`,

java:`public boolean canPartition(int[] nums) {
    int sum = 0;
    for (int n : nums) sum += n;

    boolean[] dp = new boolean[target + 1];

{type:"lc", cat:"1-D DP", title:"Q233 · Ugly Number II", diff:"M", note:"nth ugly number (factors sirf 2,3,5) — merge 3 sequences.",
java:`public int nthUglyNumber(int n) {
    int[] u = new int[n];
    u[0] = 1;
    int i2 = 0, i3 = 0, i5 = 0;
    int f2 = 2, f3 = 3, f5 = 5;
    for (int i = 1; i < n; i++) {
        int next = Math.min(f2, Math.min(f3, f5));
        u[i] = next;
        if (f2 == next) f2 = 2 * u[++i2];
        if (f3 == next) f3 = 3 * u[++i3];
        if (f5 == next) f5 = 5 * u[++i5];
    }
    return u[n-1];
}`,
python:`def nthUglyNumber(n):
    u = [1]
    i2 = i3 = i5 = 0
    while len(u) < n:
        nxt = min(u[i2]*2, u[i3]*3, u[i5]*5)
        u.append(nxt)
        if nxt == u[i2]*2: i2 += 1
        if nxt == u[i3]*3: i3 += 1
        if nxt == u[i5]*5: i5 += 1
    return u[-1]`,
extra:`<b>1)</b> 3 streams ×2, ×3, ×5 merge karo. <b>2)</b> Min select, sab equal wale pointers aage. <b>3)</b> Duplicates skip. <br><b>Complexity:</b> O(n) time, O(n) space.`,

java:`public int minDistance(String a, String b) {
    int m = a.length(), n = b.length();
    int[] dp = new int[n + 1];
    for (int j = 0; j <= n; j++) dp[j] = j;

        dp[0] = i;

            int t = dp[j];
            if (a.charAt(i-1) == b.charAt(j-1)) dp[j] = prev;
            else dp[j] = 1 + Math.min(dp[j], Math.min(dp[j-1], prev));
            prev = t;
        }
    }
    return dp[n];
}`,

{type:"lc", cat:"2-D DP", title:"Q147 · Target Sum", diff:"M", note:"+/- assign karke target sum — kitne ways?",
java:`public int findTargetSumWays(int[] nums, int target) {
    int sum = 0;
    for (int n : nums) sum += n;
    if (Math.abs(target) > sum || (sum + target) % 2 != 0) return 0;
    int t = (sum + target) / 2;
    int[] dp = new int[t + 1];
    dp[0] = 1;
    for (int n : nums)
        for (int s = t; s >= n; s--)
            dp[s] += dp[s - n];
    return dp[t];
}`,
python:`def findTargetSumWays(nums, target):
    total = sum(nums)
    if abs(target) > total or (total + target) % 2: return 0
    t = (total + target) // 2
    dp = [0] * (t + 1)
    dp[0] = 1
    for n in nums:
        for s in range(t, n - 1, -1):
            dp[s] += dp[s - n]
    return dp[t]`,
extra:`Transform: P - N = target, P + N = sum → <b>P = (sum+target)/2</b>. Subset sum count.`,

{type:"lc", cat:"2-D DP", title:"Q179 · Longest Increasing Path in a Matrix", diff:"H", note:"Grid mein sabse lamba strictly increasing path (4 directions).",
java:`int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};
public int longestIncreasingPath(int[][] m) {
    int R = m.length, C = m[0].length;
    int[][] memo = new int[R][C];
    int best = 0;
    for (int i = 0; i < R; i++)
        for (int j = 0; j < C; j++)
            best = Math.max(best, dfs(m, i, j, memo));
    return best;
}
private int dfs(int[][] m, int i, int j, int[][] memo) {
    if (memo[i][j] != 0) return memo[i][j];
    int best = 1;
    for (int[] d : dirs) {
        int ni = i+d[0], nj = j+d[1];
        if (ni >= 0 && ni < m.length && nj >= 0 && nj < m[0].length && m[ni][nj] > m[i][j])
            best = Math.max(best, 1 + dfs(m, ni, nj, memo));
    }
    memo[i][j] = best;
    return best;
}`,
python:`def longestIncreasingPath(m):
    R, C = len(m), len(m[0])
    memo = {}
    def dfs(i, j):
        if (i, j) in memo: return memo[(i, j)]
        best = 1
        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            ni, nj = i+di, j+dj
            if 0 <= ni < R and 0 <= nj < C and m[ni][nj] > m[i][j]:
                best = max(best, 1 + dfs(ni, nj))
        memo[(i, j)] = best
        return best
    return max(dfs(i, j) for i in range(R) for j in range(C))`,
extra:`<b>DFS + memoization</b> — strictly increasing edge pe hi jao. Har cell se path.`,
desc:`Given an m x n matrix, return the length of the longest strictly increasing path. From each cell you can move in four directions.`,
examples:[{"input": "matrix = [[9,9,4],[6,6,8],[2,1,1]],", "output": 4, "explanation": "Longest path: 1 -> 2 -> 6 -> 9."}, {"input": "matrix = [[3,4,5],[3,2,6],[2,2,1]],", "output": 4, "explanation": "Longest path: 3 -> 4 -> 5 -> 6."}, {"input": "matrix = [[1]],", "output": 1, "explanation": "Single cell, length is 1."}],

{type:"lc", cat:"2-D DP", title:"Q194 · Wildcard Matching", diff:"H", note:"'?' (any char) aur '*' (any sequence) wala regex match.",
java:`public boolean isMatch(String s, String p) {
    int m = s.length(), n = p.length();
    boolean[][] dp = new boolean[m + 1][n + 1];
    dp[0][0] = true;
    for (int j = 1; j <= n; j++)
        if (p.charAt(j-1) == '*') dp[0][j] = dp[0][j-1];
    for (int i = 1; i <= m; i++)
        for (int j = 1; j <= n; j++) {
            char pc = p.charAt(j-1);
            if (pc == '*') dp[i][j] = dp[i-1][j] || dp[i][j-1];
            else if (pc == '?' || pc == s.charAt(i-1)) dp[i][j] = dp[i-1][j-1];
        }
    return dp[m][n];
}`,
python:`def isMatch(s, p):
    m, n = len(s), len(p)
    dp = [[False] * (n + 1) for _ in range(m + 1)]
    dp[0][0] = True
    for j in range(1, n + 1):
        if p[j-1] == '*': dp[0][j] = dp[0][j-1]
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            pc = p[j-1]
            if pc == '*':
                dp[i][j] = dp[i-1][j] or dp[i][j-1]

java:`public int[][] merge(int[][] ints) {
    Arrays.sort(ints, (a, b) -> a[0] - b[0]);
    List<int[]> r = new ArrayList<>();
    for (int[] in : ints) {
        if (r.isEmpty() || in[0] > r.get(r.size()-1)[1])
            r.add(in);
        else

}`,

            r.append([s, e])
        else:
            r[-1][1] = max(r[-1][1], e)
    return r`,

java:`public int[][] insert(int[][] ints, int[] nw) {
    List<int[]> r = new ArrayList<>();
    int i = 0;
    while (i < ints.length && ints[i][1] < nw[0]) r.add(ints[i++]);
    while (i < ints.length && ints[i][0] <= nw[1]) {
        nw[0] = Math.min(nw[0], ints[i][0]);
        nw[1] = Math.max(nw[1], ints[i][1]);
        i++;
    }
    r.add(nw);
    while (i < ints.length) r.add(ints[i++]);
    return r.toArray(new int[r.size()][]);
}`,
python:`def insert(ints, nw):
    r = []
    i = 0
    while i < len(ints) and ints[i][1] < nw[0]:
        r.append(ints[i]); i += 1

{type:"lc", cat:"Intervals", title:"Q156 · Minimum Interval to Include Each Query", diff:"H", note:"Har query ke liye smallest interval jisme woh ho.",
java:`public int[] minInterval(int[][] ints, int[] queries) {
    Arrays.sort(ints, (a, b) -> a[0] - b[0]);
    int[][] qs = new int[queries.length][2];
    for (int i = 0; i < queries.length; i++) qs[i] = new int[]{queries[i], i};
    Arrays.sort(qs, (a, b) -> a[0] - b[0]);
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);
    int[] r = new int[queries.length];
    Arrays.fill(r, -1);
    int i = 0;
    for (int[] q : qs) {
        while (i < ints.length && ints[i][0] <= q[0]) {
            int len = ints[i][1] - ints[i][0] + 1;
            pq.offer(new int[]{len, ints[i][1]});
            i++;
        }
        while (!pq.isEmpty() && pq.peek()[1] < q[0]) pq.poll();
        if (!pq.isEmpty()) r[q[1]] = pq.peek()[0];
    }
    return r;
}`,
python:`import heapq
def minInterval(ints, queries):
    ints.sort()
    qs = sorted((q, i) for i, q in enumerate(queries))
    pq = []
    r = [-1] * len(queries)
    i = 0
    for q, idx in qs:
        while i < len(ints) and ints[i][0] <= q:
            s, e = ints[i]
            heapq.heappush(pq, (e - s + 1, e))
            i += 1
        while pq and pq[0][1] < q:
            heapq.heappop(pq)
        if pq: r[idx] = pq[0][0]
    return r`,
extra:`Queries sort karo. <b>Min-heap (len, end)</b> mein eligible intervals. Stale (end < query) pop.`,
desc:`Given intervals and queries, for each query find the minimum length interval that fully contains the query point. If no interval contains it, return -1.`,

{type:"lc", cat:"Intervals", title:"Q158 · My Calendar II", diff:"M", note:"Triple booking nahi hone dene wala calendar.",
java:`class MyCalendarTwo {
    List<int[]> books = new ArrayList<>(), overlaps = new ArrayList<>();
    public boolean book(int s, int e) {
        for (int[] o : overlaps)
            if (s < o[1] && e > o[0]) return false;
        for (int[] b : books)
            if (s < b[1] && e > b[0])
                overlaps.add(new int[]{Math.max(s, b[0]), Math.min(e, b[1])});

{type:"lc", cat:"Intervals", title:"Q251 · Video Stitching", diff:"M", note:"Clips se [0, time] ka coverage — minimum clips (greedy jumps).",
java:`public int videoStitching(int[][] clips, int time) {
    int[] maxEnd = new int[time + 1];
    for (int[] c : clips) if (c[0] < time) maxEnd[c[0]] = Math.max(maxEnd[c[0]], c[1]);
    int count = 0, cur = 0, far = 0;
    for (int i = 0; i < time; i++) {
        far = Math.max(far, maxEnd[i]);
        if (i == cur) { count++; cur = far; }
        if (cur >= time) break;
    }
    return cur >= time ? count : -1;
}`,
python:`def videoStitching(clips, time):
    maxEnd = [0] * time
    for s, e in clips:
        if s < time: maxEnd[s] = max(maxEnd[s], e)
    count = cur = far = 0
    for i in range(time):
        far = max(far, maxEnd[i])
        if i == cur:
            count += 1
            cur = far
        if cur >= time: break
    return count if cur >= time else -1`,
extra:`<b>1)</b> maxEnd[i] = i se start clip ka max end. <b>2)</b> Jump-game jaisa greedy. <b>3)</b> Gap → impossible. <br><b>Complexity:</b> O(n + time) time, O(time) space.`,
desc:`Given video clips clips[i] = [starti, endi], find the minimum number of clips to cover the range [0, time]. Return -1 if impossible.`,

{type:"lc", cat:"Math & Bit", title:"Q167 · Multiply Strings", diff:"M", note:"Do number strings multiply karo — bina BigInteger ke.",
java:`public String multiply(String a, String b) {
    int m = a.length(), n = b.length();
    int[] pos = new int[m + n];
    for (int i = m - 1; i >= 0; i--)
        for (int j = n - 1; j >= 0; j--) {
            int p1 = i + j, p2 = i + j + 1;
            int mul = (a.charAt(i)-'0') * (b.charAt(j)-'0') + pos[p2];
            pos[p1] += mul / 10;
            pos[p2] = mul % 10;
        }

    return sb.length() == 0 ? "0" : sb.toString();

python:`def multiply(a, b):
    if a == "0" or b == "0": return "0"
    pos = [0] * (len(a) + len(b))

        for j in range(len(b) - 1, -1, -1):
            p1, p2 = i + j, i + j + 1
            mul = int(a[i]) * int(b[j]) + pos[p2]

java:`public int[] singleNumber(int[] nums) {
    int x = 0;
    for (int n : nums) x ^= n;          // a ^ b

    int a = 0, b = 0;

const slideEl = document.getElementById('slide');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const metaLeft = document.getElementById('metaLeft');
const metaRight = document.getElementById('metaRight');
const drawerList = document.getElementById('drawerList');
const dotsMini = document.getElementById('dotsMini');

const catList = [...new Set(DATA.filter(d => d.type !== 'home').map(d => d.cat))];
let current = 0;

/* ---------- Done / progress tracking ---------- */
const doneKey = 'dsa_done_leetcode';
function qnum(d){ const m = /^Q(\d+)/.exec(d.title); return m ? m[1] : ''; }
function getDone(){
  try { const v = JSON.parse(localStorage.getItem(doneKey) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function isDone(i){ return getDone().indexOf(qnum(DATA[i])) !== -1; }
function toggleDone(i){
  const id = qnum(DATA[i]); if(!id) return;
  const d = getDone(); const idx = d.indexOf(id);
  if(idx === -1){ d.push(id); } else { d.splice(idx, 1); }
  try { localStorage.setItem(doneKey, JSON.stringify(d)); } catch(e){}
}

function highlightCode(src){
  var s = String(src).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var toks = [], ti = 0;
  function tok(h){ var id='\x01PH'+ti+'\x01'; toks.push([id,h]); ti++; return id; }
  s = s.replace(/(\/\/[^\n]*|\/\/[^\n]*$)/g, function(m){ return tok('<span class="comment">'+m+'</span>'); });
  s = s.replace(/(#.*)/g, function(m){ return tok('<span class="comment">'+m+'</span>'); });
  s = s.replace(/(".*?"|'.*?')/g, function(m){ return tok('<span class="str">'+m+'</span>'); });
  s = s.replace(/\b(class|def|return|if|elif|else|for|in|while|import|from|try|except|finally|new|static|void|int|double|float|char|boolean|String|long|public|private|self|None|True|False|break|continue|lambda|with|as|pass|extends|super|is|var|Integer|List|Map|Set|int\[\])\b/g, function(m){ return tok('<span class="kw">'+m+'</span>'); });
  s = s.replace(/\b(\d+\.?\d*)\b/g, function(m){ return tok('<span class="num">'+m+'</span>'); });
  toks.forEach(function(t){ s = s.split(t[0]).join(t[1]); });
  return s;
}

function buildDrawer(){
  let html = '';
  let lastCat = '';
  DATA.forEach((d,i)=>{
    if(d.type === 'home') return;
    if(d.cat !== lastCat){
      html += `<li class="cat">${d.cat}</li>`;
      lastCat = d.cat;
    }
    html += `<li data-i="${i}"${isDone(i) ? ' class="done"' : ''}><span class="num">${d.diff === 'H' ? 'H' : 'Q' + qnum(d)}</span>${d.title.replace(/Q\d+\s*[·.]\s*/,'')}</li>`;
  });
  drawerList.innerHTML = html;
  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.addEventListener('click', ()=>{ goTo(parseInt(li.dataset.i)); closeDrawer(); });
  });
}

function buildDotsMini(){
  let dots = '';
  DATA.forEach((d,i)=>{ if(d.type !== 'home') dots += `<span data-i="${i}"></span>`; });
  dotsMini.innerHTML = dots;
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.addEventListener('click', ()=> goTo(parseInt(s.dataset.i)) );
  });
}

function buildHomeHtml(){
  let html = `
    <div class="home-hero">
      <div class="home-mark"><span class="j">JAVA</span> ⇄ <span class="p">PYTHON</span></div>
      <h2>LeetCode Top 267</h2>
      <p class="lead">LeetCode ke <b>267 sabse popular questions</b> — zyada tar <b>Medium</b>, popular <b>Easy</b> classics aur aakhir mein <b>Hard</b> ka random mix. Topic-wise list neeche hai. Har question ke saath <b>question → Java/Python solution → concise approach (steps + complexity)</b>. Click karo aur chale jaao.</p>
      <div class="home-stats">
        <div class="home-stat"><b>${catList.length}</b><span>Chapters</span></div>
        <div class="home-stat"><b>${DATA.length - 1}</b><span>Questions</span></div>

        <div class="home-stat"><b>${getDone().length}</b><span>Done ✓</span></div>
      </div>
    </div>
    <div class="home-chapters">`;
  catList.forEach((c, ci)=>{
    html += `<div class="home-ch">
      <div class="home-ch-head"><span class="n">Ch ${ci+1} / ${catList.length}</span>${c}</div>
      <div class="home-ch-grid">`;
    DATA.forEach((d, i)=>{
      if(d.type === 'home' || d.cat !== c) return;
      const hardCls = d.diff === 'H' ? ' hard-t' : '';
      const doneCls = isDone(i) ? ' done' : '';

      html += `<button class="home-topic${hardCls}${doneCls}" data-i="${i}"><span class="qn">${qn}</span>${d.title.replace(/Q\d+\s*[·.]\s*/,'')}</button>`;

    html += `</div></div>`;
  });
  html += `</div>`;
  return html;

function goTo(i){
  current = Math.max(0, Math.min(DATA.length - 1, i));
  render();
}

function render(){
  const d = DATA[current];

  let bodyHtml = '';
  if(d.type === 'code' || d.type === 'lc'){
    bodyHtml = `
      <div class="rosetta">
        <div class="col java">
          <div class="col-head"><span class="dot j"></span><span>Java</span></div>
          <pre><code>${highlightCode(d.java)}</code></pre>

        <div class="spine"><div class="glyph">⇄</div></div>
        <div class="col python">
          <div class="col-head"><span class="dot p"></span><span>Python</span></div>
          <pre><code>${highlightCode(d.python)}</code></pre>
        </div>
      </div>`;
  }

  const extraHtml = d.extra ? `<div class="extra-box"><span class="tag">Approach — kaise solve kiya</span>${d.extra}</div>` : '';

  if(d.type === 'home'){
    slideEl.innerHTML = buildHomeHtml();
  } else {
    const ch = catList.indexOf(d.cat) + 1;
    const badge = d.diff === 'H' ? '<span class="diff d-H">HARD</span>' : (d.diff === 'E' ? '<span class="diff d-E">EASY</span>' : '<span class="diff d-M">MEDIUM</span>');
    slideEl.innerHTML = `
      <div class="eyebrow"><span class="ch">Ch ${ch}/${catList.length}</span>${d.cat} · Q${qnum(d)} / ${DATA.length - 1} questions</div>
      <h2>${d.title}${badge}</h2>
      <p class="note">${d.note}</p>
      ${bodyHtml}
      ${extraHtml}
      <div class="done-row">
        <button class="done-btn${isDone(current) ? ' is-done' : ''}" data-i="${current}">${isDone(current) ? '✓ DONE — dabao to unmark' : 'Mark Done ✓'}</button>
        <span class="done-count"><b>${getDone().length}</b> / ${DATA.length - 1} done</span>
      </div>
    `;
  }

  progressFill.style.width = ((current+1)/DATA.length*100) + '%';
  metaLeft.textContent = 'SLIDE ' + (current+1);
  metaRight.textContent = '/ ' + (DATA.length - 1) + ' · ' + getDone().length + ' ✓';
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === DATA.length - 1 ? 'Restart ↺' : 'Next →';

  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.classList.toggle('active', parseInt(li.dataset.i) === current);
    li.classList.toggle('done', isDone(parseInt(li.dataset.i)));
  });
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.i) === current);
  });

  const activeLi = drawerList.querySelector('li.active');
  if(activeLi) activeLi.scrollIntoView({block:'nearest'});
