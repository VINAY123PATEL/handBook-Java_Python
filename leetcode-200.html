<script>
const DATA = [

/* ========== FRONT PAGE (HOME) ========== */
{type:"home", title:"Front Page", note:"", java:"", python:""},

/* ========== QUESTIONS ========== */

/* ========== CHAPTER 1 — Arrays & Hashing ========== */

{type:"lc", cat:"Arrays & Hashing", title:"Q001 · Two Sum", diff:"E", note:"Array mein aise 2 numbers ke indices return karo jinka sum = target ho.",
java:`public int[] twoSum(int[] nums, int target) {
    Map<Integer,Integer> m = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int need = target - nums[i];
        if (m.containsKey(need))
            return new int[]{m.get(need), i};
        m.put(nums[i], i);
    }
    return new int[]{};
}`,
python:`def twoSum(nums, target):
    m = {}
    for i, v in enumerate(nums):
        if target - v in m:
            return [m[target - v], i]
        m[v] = i
    return []`,
extra:`<b>HashMap</b> mein har number + index rakho. Har step pe check karo ki <b>target - nums[i]</b> pehle se map mein hai toh dono indices return. O(n) time, O(n) space.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q002 · Contains Duplicate", diff:"E", note:"Array mein koi value duplicate hai ya nahi.",
java:`public boolean containsDuplicate(int[] nums) {
    Set<Integer> s = new HashSet<>();
    for (int n : nums)
        if (!s.add(n)) return true;
    return false;
}`,
python:`def containsDuplicate(nums):
    return len(set(nums)) != len(nums)`,
extra:`<b>Set</b> mein add karte jaao — agar koi number dobara add hua (false) toh duplicate mil gaya. Python mein seedha <b>set size compare</b>. O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q003 · Valid Anagram", diff:"E", note:"Check karo dono strings same characters utni hi baar rakhti hain ya nahi.",
java:`public boolean isAnagram(String s, String t) {
    if (s.length() != t.length()) return false;
    int[] c = new int[26];
    for (int i = 0; i < s.length(); i++) {
        c[s.charAt(i)-'a']++;
        c[t.charAt(i)-'a']--;
    }
    for (int x : c) if (x != 0) return false;
    return true;
}`,
python:`from collections import Counter
def isAnagram(s, t):
    return Counter(s) == Counter(t)`,
extra:`Character <b>count array (26)</b> mein ek string se +1, dusri se -1. Agar sab 0 hain toh anagram. Python mein <b>Counter</b> directly compare. O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q004 · Group Anagrams", diff:"M", note:"Strings ko group karo — anagrams same group mein hon.",
java:`public List<List<String>> groupAnagrams(String[] strs) {
    Map<String, List<String>> m = new HashMap<>();
    for (String s : strs) {
        char[] c = s.toCharArray();
        Arrays.sort(c);
        m.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);
    }
    return new ArrayList<>(m.values());
}`,
python:`from collections import defaultdict
def groupAnagrams(strs):
    m = defaultdict(list)
    for s in strs:
        m[''.join(sorted(s))].append(s)
    return list(m.values())`,
extra:`Har string ko <b>sort</b> karo aur sorted form ko <b>key</b> banao — same anagram wali sab strings ek hi bucket mein aa jayengi. O(n·k log k).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q005 · Top K Frequent Elements", diff:"M", note:"Array mein sabse zyada baar aane wale K elements return karo (order koi bhi).",
java:`public int[] topKFrequent(int[] nums, int k) {
    Map<Integer,Integer> cnt = new HashMap<>();
    for (int n : nums) cnt.merge(n, 1, Integer::sum);
    PriorityQueue<Integer> pq = new PriorityQueue<>((a,b)->cnt.get(a)-cnt.get(b));
    for (int n : cnt.keySet()) {
        pq.offer(n);
        if (pq.size() > k) pq.poll();
    }
    int[] r = new int[k];
    for (int i = 0; i < k; i++) r[i] = pq.poll();
    return r;
}`,
python:`from collections import Counter
import heapq
def topKFrequent(nums, k):
    cnt = Counter(nums)
    return heapq.nlargest(k, cnt.keys(), key=cnt.get)`,
extra:`Frequency count karo, phir <b>min-heap size k</b> rakho (sabse chhota nikalo) ya Python ka <b>nlargest</b>. O(n log k).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q006 · Product of Array Except Self", diff:"M", note:"Har index pe baaki sab elements ka product, bina division use kiye.",
java:`public int[] productExceptSelf(int[] nums) {
    int n = nums.length;
    int[] r = new int[n];
    r[0] = 1;
    for (int i = 1; i < n; i++)
        r[i] = r[i-1] * nums[i-1];
    int right = 1;
    for (int i = n-1; i >= 0; i--) {
        r[i] *= right;
        right *= nums[i];
    }
    return r;
}`,
python:`def productExceptSelf(nums):
    n = len(nums)
    r = [1] * n
    for i in range(1, n):
        r[i] = r[i-1] * nums[i-1]
    right = 1
    for i in range(n-1, -1, -1):
        r[i] *= right
        right *= nums[i]
    return r`,
extra:`Pehle pass mein <b>left products</b> fill karo, dusre pass mein <b>right products</b> multiply karo. O(n) time, O(1) extra space.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q007 · Longest Consecutive Sequence", diff:"M", note:"Array mein longest consecutive numbers ka length (O(n) mein).",
java:`public int longestConsecutive(int[] nums) {
    Set<Integer> s = new HashSet<>();
    for (int n : nums) s.add(n);
    int best = 0;
    for (int n : s) {
        if (!s.contains(n-1)) {
            int len = 1;
            while (s.contains(n+len)) len++;
            best = Math.max(best, len);
        }
    }
    return best;
}`,
python:`def longestConsecutive(nums):
    s = set(nums)
    best = 0
    for n in s:
        if n - 1 not in s:
            ln = 1
            while n + ln in s:
                ln += 1
            best = max(best, ln)
    return best`,
extra:`Sirf <b>sequence ke start</b> (n-1 exist na ho) se aage count karo — har element ek hi baar process hota hai. O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q008 · Maximum Subarray", diff:"M", note:"Sum sabse zyada wala contiguous subarray ka sum.",
java:`public int maxSubArray(int[] nums) {
    int best = nums[0], cur = nums[0];
    for (int i = 1; i < nums.length; i++) {
        cur = Math.max(nums[i], cur + nums[i]);
        best = Math.max(best, cur);
    }
    return best;
}`,
python:`def maxSubArray(nums):
    cur = best = nums[0]
    for v in nums[1:]:
        cur = max(v, cur + v)
        best = max(best, cur)
    return best`,
extra:`<b>Kadane's algorithm</b> — har step pe decide karo: current subarray ko badhana hai ya naya shuru karna hai. O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q009 · Subarray Sum Equals K", diff:"M", note:"Kitne contiguous subarrays ka sum exactly K hai.",
java:`public int subarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, 1);
    int sum = 0, ans = 0;
    for (int n : nums) {
        sum += n;
        ans += m.getOrDefault(sum - k, 0);
        m.merge(sum, 1, Integer::sum);
    }
    return ans;
}`,
python:`def subarraySum(nums, k):
    m = {0: 1}
    s = ans = 0
    for n in nums:
        s += n
        ans += m.get(s - k, 0)
        m[s] = m.get(s, 0) + 1
    return ans`,

{type:"lc", cat:"Arrays & Hashing", title:"Q010 · K-diff Pairs in an Array", diff:"M", note:"Aise pairs (i,j) count karo jinka difference exactly k ho — unique pairs (values ke basis pe).",

}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q011 · Sort Colors", diff:"M", note:"0,1,2 (red/white/blue) ko in-place sort karo — koi sort library nahi.",
java:`public void sortColors(int[] nums) {
    int lo = 0, hi = nums.length-1, i = 0;
    while (i <= hi) {
        if (nums[i] == 0) swap(nums, lo++, i++);
        else if (nums[i] == 2) swap(nums, i, hi--);
        else i++;
    }
}
private void swap(int[] a, int i, int j) {
    int t = a[i]; a[i] = a[j]; a[j] = t;
}`,
python:`def sortColors(nums):
    lo = 0; hi = len(nums) - 1; i = 0
    while i <= hi:
        if nums[i] == 0:
            nums[lo], nums[i] = nums[i], nums[lo]
            lo += 1; i += 1
        elif nums[i] == 2:
            nums[i], nums[hi] = nums[hi], nums[i]
            hi -= 1
        else:
            i += 1`,
extra:`<b>Dutch National Flag</b> — 3 pointers: 0 left pe, 2 right pe, 1 beech. Ek hi pass mein O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q012 · Next Permutation", diff:"M", note:"Array ka lexicographically next permutation banao (in-place).",
java:`public void nextPermutation(int[] nums) {
    int i = nums.length - 2;
    while (i >= 0 && nums[i] >= nums[i+1]) i--;
    if (i >= 0) {
        int j = nums.length - 1;
        while (nums[j] <= nums[i]) j--;
        swap(nums, i, j);
    }
    reverse(nums, i+1);
}
private void reverse(int[] a, int s) {
    int i = s, j = a.length-1;
    while (i < j) swap(a, i++, j--);
}`,
python:`def nextPermutation(nums):
    i = len(nums) - 2
    while i >= 0 and nums[i] >= nums[i+1]:
        i -= 1
    if i >= 0:
        j = len(nums) - 1
        while nums[j] <= nums[i]:
            j -= 1
        nums[i], nums[j] = nums[j], nums[i]
    nums[i+1:] = reversed(nums[i+1:])`,
extra:`Right se <b>pehla dip</b> dhundo, usse apne right ke sabse chhote bade element se swap karo, phir right part <b>reverse</b>.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q013 · Majority Element", diff:"E", note:"Element jo n/2 se zyada baar aata hai (guaranteed hai).",

{type:"lc", cat:"Arrays & Hashing", title:"Q015 · Continuous Subarray Sum", diff:"M", note:"Kya koi subarray (size ≥ 2) hai jiska sum k ka multiple hai.",
java:`public boolean checkSubarraySum(int[] nums, int k) {
    Map<Integer,Integer> m = new HashMap<>();
    m.put(0, -1);
    int sum = 0;
    for (int i = 0; i < nums.length; i++) {
        sum = (sum + nums[i]) % k;
        if (m.containsKey(sum)) {
            if (i - m.get(sum) > 1) return true;
        } else m.put(sum, i);
    }
    return false;
}`,

    s = 0
    for i, v in enumerate(nums):

        if s in m:
            if i - m[s] > 1: return True
        else:

    return False`,

{type:"lc", cat:"Arrays & Hashing", title:"Q016 · Insert Delete GetRandom O(1)", diff:"M", note:"Insert, remove, getRandom — teeno O(1) average mein.",
java:`class RandomizedSet {
    Map<Integer,Integer> idx = new HashMap<>();
    List<Integer> list = new ArrayList<>();
    Random rnd = new Random();
    public boolean insert(int v) {
        if (idx.containsKey(v)) return false;
        idx.put(v, list.size());
        list.add(v);
        return true;
    }
    public boolean remove(int v) {
        if (!idx.containsKey(v)) return false;
        int i = idx.remove(v);
        int last = list.remove(list.size()-1);
        if (i != list.size()) { list.set(i, last); idx.put(last, i); }
        return true;
    }
    public int getRandom() { return list.get(rnd.nextInt(list.size())); }
}`,
python:`import random
class RandomizedSet:
    def __init__(self):
        self.idx = {}
        self.list = []
    def insert(self, v):
        if v in self.idx: return False
        self.idx[v] = len(self.list)
        self.list.append(v)
        return True
    def remove(self, v):
        if v not in self.idx: return False
        i = self.idx.pop(v)
        last = self.list.pop()
        if i != len(self.list):
            self.list[i] = last
            self.idx[last] = i
        return True
    def getRandom(self):
        return random.choice(self.list)`,
extra:`<b>HashMap (value→index) + ArrayList</b>. Remove mein last element ko deleted spot pe copy karo taaki O(1) ho.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q017 · Maximum Product Subarray", diff:"M", note:"Subarray jiska product sabse zyada ho.",
java:`public int maxProduct(int[] nums) {
    int best = nums[0], mn = nums[0], mx = nums[0];
    for (int i = 1; i < nums.length; i++) {
        int t1 = nums[i]*mn, t2 = nums[i]*mx;
        mn = Math.min(nums[i], Math.min(t1, t2));
        mx = Math.max(nums[i], Math.max(t1, t2));
        best = Math.max(best, mx);
    }
    return best;
}`,
python:`def maxProduct(nums):
    mn = mx = best = nums[0]
    for v in nums[1:]:
        a, b = v*mn, v*mx
        mn = min(v, a, b)
        mx = max(v, a, b)
        best = max(best, mx)
    return best`,
extra:`Negative × negative = positive — isliye <b>min aur max dono track</b> karo. Har step pe 3 options: naya, min*val, max*val.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q018 · Set Matrix Zeroes", diff:"M", note:"Jis row/col mein 0 hai, poori row/col ko 0 banao (in-place).",
java:`public void setZeroes(int[][] m) {
    boolean fr = false, fc = false;
    for (int i = 0; i < m.length; i++)
        for (int j = 0; j < m[0].length; j++)
            if (m[i][j] == 0) {
                if (i == 0) fr = true;
                if (j == 0) fc = true;
                m[i][0] = 0; m[0][j] = 0;
            }
    for (int i = 1; i < m.length; i++)
        for (int j = 1; j < m[0].length; j++)
            if (m[i][0] == 0 || m[0][j] == 0) m[i][j] = 0;
    if (fr) for (int j = 0; j < m[0].length; j++) m[0][j] = 0;
    if (fc) for (int i = 0; i < m.length; i++) m[i][0] = 0;
}`,
python:`def setZeroes(m):
    R, C = len(m), len(m[0])
    fr = any(x == 0 for x in m[0])
    fc = any(m[i][0] == 0 for i in range(R))
    for i in range(R):
        for j in range(C):
            if m[i][j] == 0:
                m[i][0] = 0; m[0][j] = 0
    for i in range(1, R):
        for j in range(1, C):
            if m[i][0] == 0 or m[0][j] == 0:
                m[i][j] = 0
    if fr: m[0] = [0]*C
    if fc:
        for i in range(R): m[i][0] = 0`,

{type:"lc", cat:"Arrays & Hashing", title:"Q019 · Rotate Image", diff:"M", note:"n×n matrix ko 90° clockwise rotate karo (in-place).",
java:`public void rotate(int[][] m) {
    int n = m.length;
    for (int i = 0; i < n; i++)
        for (int j = i; j < n; j++) {
            int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;
        }
    for (int i = 0; i < n; i++)

        }
}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q020 · Spiral Matrix", diff:"M", note:"Matrix elements ko spiral order mein return karo.",
java:`public List<Integer> spiralOrder(int[][] m) {
    List<Integer> r = new ArrayList<>();
    int t = 0, b = m.length-1, l = 0, rt = m[0].length-1;
    while (t <= b && l <= rt) {
        for (int j = l; j <= rt; j++) r.add(m[t][j]);
        for (int i = t+1; i <= b; i++) r.add(m[i][rt]);
        if (t < b) for (int j = rt-1; j >= l; j--) r.add(m[b][j]);
        if (l < rt) for (int i = b-1; i > t; i--) r.add(m[i][l]);
        t++; b--; l++; rt--;
    }
    return r;
}`,
python:`def spiralOrder(m):
    r = []
    t, b, l, rt = 0, len(m)-1, 0, len(m[0])-1
    while t <= b and l <= rt:
        for j in range(l, rt+1): r.append(m[t][j])
        for i in range(t+1, b+1): r.append(m[i][rt])
        if t < b:
            for j in range(rt-1, l-1, -1): r.append(m[b][j])
        if l < rt:
            for i in range(b-1, t, -1): r.append(m[i][l])
        t += 1; b -= 1; l += 1; rt -= 1
    return r`,
extra:`4 <b>boundaries</b> (top/bottom/left/right) ko loop kar kar ke tighten karte jaao. Har cell ek baar. O(n).`},

{type:"lc", cat:"Arrays & Hashing", title:"Q171 · First Missing Positive", diff:"H", note:"Missing smallest positive integer — O(n) time, O(1) space.",
java:`public int firstMissingPositive(int[] nums) {
    int n = nums.length;
    for (int i = 0; i < n; i++)
        while (nums[i] > 0 && nums[i] <= n && nums[nums[i]-1] != nums[i])
            { int t = nums[nums[i]-1]; nums[nums[i]-1] = nums[i]; nums[i] = t; }
    for (int i = 0; i < n; i++)

}`,

{type:"lc", cat:"Arrays & Hashing", title:"Q214 · Valid Sudoku", diff:"M", note:"Board valid hai (rows, cols, boxes mein no duplicates). Solve nahi karna.",
java:`public boolean isValidSudoku(char[][] b) {
    Set<String> seen = new HashSet<>();
    for (int i = 0; i < 9; i++)
        for (int j = 0; j < 9; j++) {
            char c = b[i][j];
            if (c == '.') continue;
            if (!seen.add(c + " in r" + i) ||
                !seen.add(c + " in c" + j) ||
                !seen.add(c + " in b" + i/3 + j/3)) return false;
        }

}`,
python:`def isValidSudoku(b):
    seen = set()
    for i in range(9):
        for j in range(9):
            c = b[i][j]
            if c == '.': continue
            if (c, 'r', i) in seen or (c, 'c', j) in seen or (c, 'b', i//3, j//3) in seen:

{type:"lc", cat:"Arrays & Hashing", title:"Q225 · Pascal's Triangle", diff:"E", note:"Pascal triangle ke n rows banao.",
java:`public List<List<Integer>> generate(int n) {

{type:"lc", cat:"Arrays & Hashing", title:"Q228 · Majority Element II", diff:"M", note:"Saare elements jo &gt; n/3 baar aaye (max 2 possible).",
java:`public List<Integer> majorityElement(int[] nums) {
    int a = 0, b = 0, ca = 0, cb = 0;
    for (int n : nums) {
        if (n == a) ca++;
        else if (n == b) cb++;
        else if (ca == 0) { a = n; ca = 1; }
        else if (cb == 0) { b = n; cb = 1; }
        else { ca--; cb--; }
    }
    ca = 0; cb = 0;
    for (int n : nums) { if (n == a) ca++; else if (n == b) cb++; }
    List<Integer> r = new ArrayList<>();
    if (ca > nums.length/3) r.add(a);
    if (cb > nums.length/3) r.add(b);
    return r;
}`,
python:`def majorityElement(nums):
    a = b = None
    ca = cb = 0
    for n in nums:
        if n == a: ca += 1
        elif n == b: cb += 1
        elif ca == 0: a, ca = n, 1
        elif cb == 0: b, cb = n, 1
        else: ca -= 1; cb -= 1
    return [x for x in (a, b) if nums.count(x) > len(nums) // 3]`,
extra:`<b>1)</b> Boyer-Moore extended — 2 candidates. <b>2)</b> Verify pass — count &gt; n/3 check. <br><b>Complexity:</b> O(n) time, O(1) space.`},

{type:"lc", cat:"Arrays & Hashing", title:"Q230 · Matrix Diagonal Sum", diff:"E", note:"Primary + secondary diagonal sum — center ek baar (odd n).",

    for (int i = 0; i < n; i++) {

}`,

{type:"lc", cat:"Strings", title:"Q195 · Palindrome Pairs", diff:"H", note:"Kis (i, j) pair ka concatenation palindrome hai.",
java:`public List<List<Integer>> palindromePairs(String[] words) {
    Map<String, Integer> m = new HashMap<>();
    for (int i = 0; i < words.length; i++) m.put(words[i], i);
    List<List<Integer>> r = new ArrayList<>();
    for (int i = 0; i < words.length; i++) {
        String w = words[i];
        for (int j = 0; j <= w.length(); j++) {
            String pre = w.substring(0, j), suf = w.substring(j);
            if (isPal(pre)) {
                String need = new StringBuilder(suf).reverse().toString();
                if (m.containsKey(need) && m.get(need) != i)
                    r.add(Arrays.asList(m.get(need), i));
            }
            if (j < w.length() && isPal(suf)) {
                String need = new StringBuilder(pre).reverse().toString();
                if (m.containsKey(need) && m.get(need) != i)
                    r.add(Arrays.asList(i, m.get(need)));
            }
        }
    }
    return r;
}
private boolean isPal(String s) {
    int i = 0, j = s.length() - 1;
    while (i < j) if (s.charAt(i++) != s.charAt(j--)) return false;
    return true;
}`,
python:`def palindromePairs(words):

        if (i >= 0) d += a.charAt(i--) - '0';

{type:"lc", cat:"Strings", title:"Q252 · Minimum Time Difference", diff:"M", note:"Time strings ka minimum difference (circular) — bucket trick.",
java:`public int findMinDifference(List<String> tp) {
    boolean[] seen = new boolean[1440];
    for (String t : tp) {
        int min = Integer.parseInt(t.substring(0,2)) * 60 + Integer.parseInt(t.substring(3));
        if (seen[min]) return 0;
        seen[min] = true;
    }
    int first = -1, prev = -1, best = Integer.MAX_VALUE;
    for (int i = 0; i < 1440; i++) {
        if (seen[i]) {
            if (first == -1) first = i;
            else best = Math.min(best, i - prev);
            prev = i;
        }
    }
    best = Math.min(best, 1440 - prev + first);
    return best;
}`,
python:`def findMinDifference(tp):
    seen = [False] * 1440
    for t in tp:
        h, m = t.split(':')
        mins = int(h) * 60 + int(m)
        if seen[mins]: return 0
        seen[mins] = True
    prev = first = -1
    best = float('inf')
    for i in range(1440):
        if seen[i]:
            if first == -1: first = i
            else: best = min(best, i - prev)
            prev = i
    best = min(best, 1440 - prev + first)
    return best`,
extra:`<b>1)</b> Minutes mein convert (00:00 → 0). <b>2)</b> 1440 bucket — duplicate → 0. <b>3)</b> Circular diff check. <br><b>Complexity:</b> O(n) time, O(1440) space.`},

{type:"lc", cat:"Strings", title:"Q253 · Custom Sort String", diff:"M", note:"order ke hisaab se s sort karo — rank comparator.",
java:`public String customSortString(String order, String s) {

    for (int i = 0; i < order.length(); i++) rank[order.charAt(i)-'a'] = i;
    Character[] c = s.chars().mapToObj(ch -> (char) ch).toArray(Character[]::new);
    Arrays.sort(c, (a, b) -> rank[a-'a'] - rank[b-'a']);

{type:"lc", cat:"Sliding Window", title:"Q030 · Longest Substring Without Repeating Characters", diff:"M", note:"Sabse lamba substring jisme koi character repeat na ho.",

{type:"lc", cat:"Sliding Window", title:"Q031 · Longest Repeating Character Replacement", diff:"M", note:"Max K replacements se sabse lamba substring jisme sab chars same ho.",
java:`public int characterReplacement(String s, int k) {
    int[] cnt = new int[26];
    int left = 0, best = 0, maxFreq = 0;
    for (int right = 0; right < s.length(); right++) {
        maxFreq = Math.max(maxFreq, ++cnt[s.charAt(right)-'a']);
        if (right-left+1 - maxFreq > k) {

        }
        best = Math.max(best, right-left+1);

}`,

    for right, c in enumerate(s):
        cnt[c] = cnt.get(c, 0) + 1
        maxF = max(maxF, cnt[c])
        if right-left+1 - maxF > k:

{type:"lc", cat:"Sliding Window", title:"Q180 · Sliding Window Maximum", diff:"H", note:"Har window of size k ka maximum — deque O(n).",
java:`public int[] maxSlidingWindow(int[] nums, int k) {

    for (int i = 0; i < nums.length; i++) {

        while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();

{type:"lc", cat:"Sliding Window", title:"Q198 · Shortest Subarray with Sum at Least K", diff:"H", note:"Sum ≥ K wala shortest subarray — monotonic deque.",
java:`public int shortestSubarray(int[] nums, int k) {

java:`public int search(int[] nums, int target) {

            else lo = mid + 1;

{type:"lc", cat:"Binary Search", title:"Q168 · Median of Two Sorted Arrays", diff:"H", note:"Do sorted arrays ka median — O(log(m+n)).",
java:`public double findMedianSortedArrays(int[] a, int[] b) {
    if (a.length > b.length) return findMedianSortedArrays(b, a);
    int m = a.length, n = b.length, lo = 0, hi = m;
    while (lo <= hi) {
        int i = (lo + hi) / 2, j = (m + n + 1) / 2 - i;
        int aL = (i == 0) ? Integer.MIN_VALUE : a[i-1];
        int aR = (i == m) ? Integer.MAX_VALUE : a[i];

            return (Math.max(aL, bL) + Math.min(aR, bR)) / 2.0;

public List<Integer> countSmaller(int[] nums) {

private void mergeSort(int[] nums, int[] idx, int l, int r) {
    if (l >= r) return;
    int mid = (l + r) / 2;
    mergeSort(nums, idx, l, mid);
    mergeSort(nums, idx, mid + 1, r);
    int[] temp = new int[r - l + 1];
    int i = l, j = mid + 1, k = 0;
    while (i <= mid && j <= r) {
        if (nums[idx[i]] <= nums[idx[j]]) {
            count[idx[i]] += j - mid - 1;
            temp[k++] = idx[i++];
        } else temp[k++] = idx[j++];
    }
    while (i <= mid) { count[idx[i]] += j - mid - 1; temp[k++] = idx[i++]; }
    while (j <= r) temp[k++] = idx[j++];
    for (i = 0; i < k; i++) idx[l + i] = temp[i];
}`,
python:`def countSmaller(nums):
    n = len(nums)
    res = [0] * n
    idx = list(range(n))
    def merge_sort(arr):
        if len(arr) <= 1: return arr
        mid = len(arr) // 2
        left = merge_sort(arr[:mid])
        right = merge_sort(arr[mid:])
        i = j = 0
        sorted_ = []
        while i < len(left) and j < len(right):
            if nums[left[i]] <= nums[right[j]]:
                res[left[i]] += j
                sorted_.append(left[i])
                i += 1
            else:
                sorted_.append(right[j])
                j += 1
        while i < len(left):
            res[left[i]] += j
            sorted_.append(left[i])
            i += 1
        sorted_.extend(right[j:])
        return sorted_

{type:"lc", cat:"Linked List", title:"Q191 · LRU Cache", diff:"H", note:"Least Recently Used evict karne wala cache.",
java:`class LRUCache {
    Map<Integer, Integer> m = new LinkedHashMap<>();
    int cap;
    public LRUCache(int capacity) { cap = capacity; }
    public int get(int key) {
        if (!m.containsKey(key)) return -1;
        int v = m.remove(key);
        m.put(key, v);
        return v;
    }
    public void put(int key, int value) {

{type:"lc", cat:"Linked List", title:"Q192 · LFU Cache", diff:"H", note:"Least Frequently Used evict karne wala cache (tie → LRU).",
java:`class LFUCache {
    int cap, minF;
    Map<Integer, Integer> vals = new HashMap<>();
    Map<Integer, Integer> freqs = new HashMap<>();
    Map<Integer, LinkedHashSet<Integer>> lists = new HashMap<>();
    public LFUCache(int capacity) { cap = capacity; }
    public int get(int key) {
        if (!vals.containsKey(key)) return -1;
        increment(key);
        return vals.get(key);
    }
    public void put(int key, int value) {
        if (cap == 0) return;
        if (vals.containsKey(key)) {
            vals.put(key, value);
            increment(key);
            return;
        }
        if (vals.size() == cap) {
            int evict = lists.get(minF).iterator().next();
            lists.get(minF).remove(evict);
            vals.remove(evict); freqs.remove(evict);
        }
        vals.put(key, value);
        freqs.put(key, 1);
        lists.computeIfAbsent(1, k -> new LinkedHashSet<>()).add(key);
        minF = 1;
    }
    private void increment(int key) {
        int f = freqs.get(key);
        lists.get(f).remove(key);
        if (f == minF && lists.get(f).isEmpty()) minF++;
        freqs.put(key, f + 1);
        lists.computeIfAbsent(f + 1, k -> new LinkedHashSet<>()).add(key);
    }
}`,
python:`from collections import OrderedDict, defaultdict
class LFUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.minF = 0
        self.vals = {}
        self.freqs = {}
        self.lists = defaultdict(OrderedDict)
    def get(self, key):
        if key not in self.vals: return -1
        self._increment(key)
        return self.vals[key]
    def _increment(self, key):
        f = self.freqs[key]
        del self.lists[f][key]
        if f == self.minF and not self.lists[f]: self.minF += 1
        self.freqs[key] = f + 1
        self.lists[f + 1][key] = None
    def put(self, key, value):
        if self.cap == 0: return
        if key in self.vals:
            self.vals[key] = value
            self._increment(key)
            return
        if len(self.vals) == self.cap:
            evict, _ = self.lists[self.minF].popitem(last=False)
            del self.vals[evict]
            del self.freqs[evict]
        self.vals[key] = value
        self.freqs[key] = 1
        self.lists[1][key] = None
        self.minF = 1`,
extra:`<b>freq → LinkedHashSet (LRU order)</b>. Evict = minF list ka first. Increment on access.`},

{type:"lc", cat:"Stack", title:"Q062 · Min Stack", diff:"M", note:"Stack with getMin() in O(1) — push/pop/top bhi O(1).",
java:`class MinStack {
    Stack<Integer> st = new Stack<>();
    Stack<Integer> mins = new Stack<>();
    public void push(int v) {
        st.push(v);
        if (mins.isEmpty() || v <= mins.peek()) mins.push(v);
    }
    public void pop() {
        if (st.pop().equals(mins.peek())) mins.pop();
    }
    public int top() { return st.peek(); }
    public int getMin() { return mins.peek(); }
}`,
python:`class MinStack:
    def __init__(self):
        self.st = []
        self.mins = []
    def push(self, v):
        self.st.append(v)
        if not self.mins or v <= self.mins[-1]:
            self.mins.append(v)
    def pop(self):
        if self.st.pop() == self.mins[-1]:
            self.mins.pop()
    def top(self):
        return self.st[-1]
    def getMin(self):
        return self.mins[-1]`,
extra:`<b>Do stack</b> — ek normal, ek sirf current minimum rakhta hai. Min change ho toh hi push.`},

{type:"lc", cat:"Stack", title:"Q063 · Evaluate Reverse Polish Notation", diff:"M", note:"Postfix expression evaluate karo.",
java:`public int evalRPN(String[] t) {
    Stack<Integer> st = new Stack<>();
    for (String s : t) {
        if (s.equals("+")) st.push(st.pop() + st.pop());
        else if (s.equals("-")) { int b = st.pop(), a = st.pop(); st.push(a - b); }
        else if (s.equals("*")) st.push(st.pop() * st.pop());
        else if (s.equals("/")) { int b = st.pop(), a = st.pop(); st.push(a / b); }
        else st.push(Integer.parseInt(s));
    }
    return st.pop();
}`,

        elif s == "*": st.append(st.pop() * st.pop())
        elif s == "/":

{type:"lc", cat:"Stack", title:"Q065 · Decode String", diff:"M", note:"3[a2[c]] → accaccacc — encoded string decode karo.",
java:`public String decodeString(String s) {
    Stack<StringBuilder> st = new Stack<>();
    Stack<Integer> num = new Stack<>();
    StringBuilder cur = new StringBuilder();
    int k = 0;
    for (char c : s.toCharArray()) {
        if (Character.isDigit(c)) k = k * 10 + (c - '0');
        else if (c == '[') {
            num.push(k); st.push(cur);
            cur = new StringBuilder(); k = 0;
        } else if (c == ']') {
            StringBuilder prev = st.pop();
            int n = num.pop();
            for (int i = 0; i < n; i++) prev.append(cur);
            cur = prev;
        } else cur.append(c);
    }
    return cur.toString();
}`,

        elif c == "[":

{type:"lc", cat:"Stack", title:"Q066 · Car Fleet", diff:"M", note:"Cars target tak pahunchnge — kitne fleets banege?",
java:`public int carFleet(int target, int[] pos, int[] speed) {
    int n = pos.length;
    Integer[] idx = new Integer[n];
    for (int i = 0; i < n; i++) idx[i] = i;
    Arrays.sort(idx, (a, b) -> pos[b] - pos[a]);   // closest to target first
    int fleets = 0;
    double prev = -1;
    for (int i : idx) {
        double time = (double)(target - pos[i]) / speed[i];
        if (time > prev) { fleets++; prev = time; }
    }
    return fleets;
}`,

{type:"lc", cat:"Stack", title:"Q067 · Remove K Digits", diff:"M", note:"K digits hatao taaki number minimum ho.",
java:`public String removeKdigits(String num, int k) {
    Stack<Character> st = new Stack<>();
    for (char c : num.toCharArray()) {
        while (k > 0 && !st.isEmpty() && st.peek() > c) {
            st.pop(); k--;
        }
        st.push(c);
    }
    while (k > 0) { st.pop(); k--; }
    StringBuilder sb = new StringBuilder();
    while (!st.isEmpty()) sb.append(st.pop());
    sb.reverse();
    while (sb.length() > 1 && sb.charAt(0) == '0') sb.deleteCharAt(0);
    return sb.toString();
}`,

        st.append(c)
    while k:

    s = ''.join(st).lstrip('0')

{type:"lc", cat:"Stack", title:"Q068 · Asteroid Collision", diff:"M", note:"Asteroids collide hote hain — final state batayo.",
java:`public int[] asteroidCollision(int[] ast) {
    Stack<Integer> st = new Stack<>();
    for (int a : ast) {
        boolean alive = true;
        while (!st.isEmpty() && st.peek() > 0 && a < 0) {
            if (Math.abs(a) > st.peek()) st.pop();
            else if (Math.abs(a) == st.peek()) { st.pop(); alive = false; break; }

{type:"lc", cat:"Stack", title:"Q190 · Maximum Frequency Stack", diff:"H", note:"Sabse zyada frequent element pop karo — tie mein latest.",
java:`class FreqStack {
    Map<Integer, Integer> freq = new HashMap<>();
    Map<Integer, Stack<Integer>> groups = new HashMap<>();
    int maxF = 0;
    public void push(int v) {
        int f = freq.getOrDefault(v, 0) + 1;
        freq.put(v, f);
        maxF = Math.max(maxF, f);
        groups.computeIfAbsent(f, k -> new Stack<>()).push(v);
    }
    public int pop() {
        int v = groups.get(maxF).pop();
        freq.put(v, freq.get(v) - 1);
        if (groups.get(maxF).isEmpty()) maxF--;
        return v;
    }
}`,
python:`class FreqStack:
    def __init__(self):
        self.freq = {}
        self.groups = {}
        self.maxF = 0
    def push(self, v):
        f = self.freq.get(v, 0) + 1
        self.freq[v] = f
        self.maxF = max(self.maxF, f)
        self.groups.setdefault(f, []).append(v)
    def pop(self):
        v = self.groups[self.maxF].pop()
        self.freq[v] -= 1
        if not self.groups[self.maxF]: self.maxF -= 1
        return v`,
extra:`<b>freq → stack of elements</b> (groups). push = freq+1 group mein daalo, pop = maxF group se.`},

{type:"lc", cat:"Stack", title:"Q244 · Sum of Subarray Minimums", diff:"M", note:"Saare subarrays ke minimums ka sum — contribution trick.",
java:`public int sumSubarrayMins(int[] arr) {
    int MOD = 1_000_000_007, n = arr.length;
    Stack<Integer> st = new Stack<>();
    long sum = 0;
    for (int i = 0; i <= n; i++) {
        while (!st.isEmpty() && (i == n || arr[st.peek()] >= arr[i])) {
            int mid = st.pop();
            int left = st.isEmpty() ? -1 : st.peek();
            sum = (sum + (long) arr[mid] * (mid - left) % MOD * (i - mid) % MOD) % MOD;
        }
        st.push(i);
    }
    return (int) sum;
}`,

java:`class BSTIterator {

    public BSTIterator(TreeNode root) { pushAll(root); }

        pushAll(n.right);
        return n.val;

        self._push_all(root)

    sum += n.val;
    int count = m.getOrDefault(sum - t, 0);
    m.merge(sum, 1, Integer::sum);

    return count;
}`,

        m[s] = m.get(s, 0) + 1

{type:"lc", cat:"Trees & BST", title:"Q262 · Maximum Width of Binary Tree", diff:"M", note:"Har level ki maximum width (null nodes count karke).",
java:`public int widthOfBinaryTree(TreeNode root) {
    Queue<Object[]> q = new LinkedList<>();
    q.offer(new Object[]{root, 1L});
    int max = 0;
    while (!q.isEmpty()) {
        int size = q.size();
        long first = 0, last = 0;
        for (int i = 0; i < size; i++) {
            Object[] c = q.poll();
            TreeNode n = (TreeNode) c[0];
            long idx = (long) c[1];
            if (i == 0) first = idx;
            if (i == size - 1) last = idx;
            if (n.left != null) q.offer(new Object[]{n.left, 2 * idx});
            if (n.right != null) q.offer(new Object[]{n.right, 2 * idx + 1});
        }
        max = (int) Math.max(max, last - first + 1);
    }
    return max;
}`,
python:`from collections import deque
def widthOfBinaryTree(root):
    q = deque([(root, 1)])
    mx = 0
    while q:
        mx = max(mx, q[-1][1] - q[0][1] + 1)
        for _ in range(len(q)):
            n, idx = q.popleft()
            if n.left: q.append((n.left, 2 * idx))
            if n.right: q.append((n.right, 2 * idx + 1))
    return mx`,
extra:`<b>1)</b> Complete-tree indexing: left=2i, right=2i+1. <b>2)</b> Har level first-last width. <b>3)</b> Max track. <br><b>Complexity:</b> O(n) time, O(n) space.`},

{type:"lc", cat:"Trees & BST", title:"Q263 · Count Complete Tree Nodes", diff:"M", note:"Complete tree ke nodes count — height trick, O(log² n).",
java:`public int countNodes(TreeNode root) {
    if (root == null) return 0;
    int lh = 0, rh = 0;
    TreeNode l = root, r = root;
    while (l != null) { lh++; l = l.left; }
    while (r != null) { rh++; r = r.right; }
    if (lh == rh) return (1 << lh) - 1;
    return 1 + countNodes(root.left) + countNodes(root.right);
}`,
python:`def countNodes(root):

    l = r = root
    lh = rh = 0
    while l: lh += 1; l = l.left
    while r: rh += 1; r = r.right
    if lh == rh: return (1 << lh) - 1
    return 1 + countNodes(root.left) + countNodes(root.right)`,
extra:`<b>1)</b> Left == right height → perfect tree, <code>2^h - 1</code>. <b>2)</b> Warna recurse. <b>3)</b> Har level pe ek subtree skip. <br><b>Complexity:</b> O(log² n) time, O(log n) space.`},

class KthLargest:

class MedianFinder:
    def __init__(self):
        self.lo = []   # max-heap (negated)
        self.hi = []   # min-heap
    def addNum(self, n):
        heapq.heappush(self.lo, -n)
        heapq.heappush(self.hi, -heapq.heappop(self.lo))
        if len(self.hi) > len(self.lo):

java:`public List<List<String>> partition(String s) {

private void backtrack(String s, int start, List<String> cur, List<List<String>> r) {
    if (start == s.length()) { r.add(new ArrayList<>(cur)); return; }
    for (int end = start + 1; end <= s.length(); end++) {
        if (isPal(s, start, end - 1)) {

java:`public List<List<String>> solveNQueens(int n) {
    List<List<String>> r = new ArrayList<>();
    char[][] b = new char[n][n];
    for (char[] row : b) Arrays.fill(row, '.');
    backtrack(n, 0, b, r);
    return r;

private void backtrack(int n, int row, char[][] b, List<List<String>> r) {
    if (row == n) {
        List<String> cur = new ArrayList<>();
        for (char[] rr : b) cur.add(new String(rr));
        r.add(cur);
        return;
    }
    for (int c = 0; c < n; c++) {
        if (valid(b, row, c)) {
            b[row][c] = 'Q';
            backtrack(n, row + 1, b, r);
            b[row][c] = '.';
        }
    }
}
private boolean valid(char[][] b, int r, int c) {
    for (int i = 0; i < r; i++) if (b[i][c] == 'Q') return false;
    for (int i = r, j = c; i >= 0 && j >= 0; i--, j--) if (b[i][j] == 'Q') return false;
    for (int i = r, j = c; i >= 0 && j < b.length; i--, j++) if (b[i][j] == 'Q') return false;
    return true;
}`,
python:`def solveNQueens(n):
    r = []
    cols = set()
    d1 = set()  # r - c
    d2 = set()  # r + c
    board = ['.' * n for _ in range(n)]
    def bt(row):
        if row == n:
            r.append(board[:]); return
        for c in range(n):
            if c in cols or (row - c) in d1 or (row + c) in d2: continue
            cols.add(c); d1.add(row - c); d2.add(row + c)
            board[row] = board[row][:c] + 'Q' + board[row][c+1:]
            bt(row + 1)
            cols.remove(c); d1.remove(row - c); d2.remove(row + c)
            board[row] = board[row][:c] + '.' + board[row][c+1:]
    bt(0)
    return r`,

    Trie nxt = t.next[b[i][j]-'a'];

        if (c[1] > dist[c[0]]) continue;
        for (int[] e : adj.get(c[0])) {
            int nd = c[1] + e[1];
            if (nd < dist[e[0]]) {
                dist[e[0]] = nd;
                pq.offer(new int[]{e[0], nd});
            }
        }

    int max = 0;

    return max == Integer.MAX_VALUE ? -1 : max;

python:`import heapq
def networkDelayTime(times, n, k):
    adj = [[] for _ in range(n+1)]
    for a, b, w in times:
        adj[a].append((b, w))
    dist = {i: float('inf') for i in range(1, n+1)}
    dist[k] = 0
    pq = [(0, k)]
    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]: continue
        for v, w in adj[u]:
            if d + w < dist[v]:
                dist[v] = d + w
                heapq.heappush(pq, (d + w, v))
    mx = max(dist.values())
    return mx if mx != float('inf') else -1`,
extra:`<b>Dijkstra</b> — min-heap, distance relaxation. Max reachable distance = answer.`},

{type:"lc", cat:"Graphs", title:"Q178 · Alien Dictionary", diff:"H", note:"Sorted alien words se character order find karo (topo sort).",
java:`public String alienOrder(String[] words) {
    Map<Character, Set<Character>> adj = new HashMap<>();
    int[] indeg = new int[26];

    for (String w : words)

        for (int j = 0; j < len; j++)
            if (a.charAt(j) != b.charAt(j)) {
                if (!adj.containsKey(a.charAt(j))) adj.put(a.charAt(j), new HashSet<>());
                if (adj.get(a.charAt(j)).add(b.charAt(j))) indeg[b.charAt(j)-'a']++;
                break;
            }
    }
    Queue<Character> q = new LinkedList<>();
    for (char c = 'a'; c <= 'z'; c++)
        if (indeg[c-'a'] == 0) q.offer(c);
    StringBuilder sb = new StringBuilder();
    while (!q.isEmpty()) {
        char c = q.poll();
        sb.append(c);
        if (adj.containsKey(c))
            for (char nxt : adj.get(c))
                if (--indeg[nxt-'a'] == 0) q.offer(nxt);
    }
    return sb.length() == Arrays.stream(indeg).filter(x -> x >= 0).count() ? sb.toString() : "";
}`,
python:`from collections import deque
def alienOrder(words):
    adj = {}
    indeg = {}
    for w in words:
        for c in w:
            adj.setdefault(c, set())
            indeg[c] = 0
    for a, b in zip(words, words[1:]):
        if len(a) > len(b) and a.startswith(b): return ""
        for x, y in zip(a, b):
            if x != y:
                if y not in adj[x]:
                    adj[x].add(y)
                    indeg[y] += 1
                break
    q = deque([c for c in indeg if indeg[c] == 0])
    r = []
    while q:
        c = q.popleft()
        r.append(c)
        for nxt in adj[c]:
            indeg[nxt] -= 1
            if indeg[nxt] == 0: q.append(nxt)
    return ''.join(r) if len(r) == len(indeg) else ""`,

{type:"lc", cat:"Graphs", title:"Q189 · Shortest Path in a Grid with Obstacles Elimination", diff:"H", note:"k obstacles ko hata ke shortest path (BFS with k state).",
java:`public int shortestPath(int[][] g, int k) {
    int R = g.length, C = g[0].length;
    if (R == 1 && C == 1) return 0;
    int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};
    boolean[][][] seen = new boolean[R][C][k + 1];
    Queue<int[]> q = new LinkedList<>();
    q.offer(new int[]{0, 0, k});
    int steps = 0;
    while (!q.isEmpty()) {
        int n = q.size();
        steps++;
        for (int t = 0; t < n; t++) {
            int[] c = q.poll();
            for (int[] d : dirs) {
                int ni = c[0]+d[0], nj = c[1]+d[1];
                if (ni < 0 || ni >= R || nj < 0 || nj >= C) continue;
                int nk = c[2] - g[ni][nj];
                if (nk < 0 || seen[ni][nj][nk]) continue;
                if (ni == R-1 && nj == C-1) return steps;
                seen[ni][nj][nk] = true;
                q.offer(new int[]{ni, nj, nk});
            }
        }
    }
    return -1;
}`,
python:`from collections import deque
def shortestPath(g, k):
    R, C = len(g), len(g[0])
    if R == 1 and C == 1: return 0
    seen = [[[False] * (k + 1) for _ in range(C)] for _ in range(R)]
    q = deque([(0, 0, k, 0)])
    seen[0][0][k] = True
    while q:
        i, j, rem, steps = q.popleft()
        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            ni, nj = i + di, j + dj
            if 0 <= ni < R and 0 <= nj < C:
                nk = rem - g[ni][nj]
                if nk >= 0 and not seen[ni][nj][nk]:
                    if ni == R-1 and nj == C-1: return steps + 1
                    seen[ni][nj][nk] = True
                    q.append((ni, nj, nk, steps + 1))
    return -1`,
extra:`BFS state = <b>(i, j, k-left)</b>. Obstacle pe k-1. 3D visited.`},

{type:"lc", cat:"Graphs", title:"Q267 · Possible Bipartition", diff:"M", note:"Dislikes wale alag groups — 2-coloring check.",
java:`public boolean possibleBipartition(int n, int[][] dislikes) {
    List<List<Integer>> adj = new ArrayList<>();
    for (int i = 0; i <= n; i++) adj.add(new ArrayList<>());
    for (int[] d : dislikes) {
        adj.get(d[0]).add(d[1]);
        adj.get(d[1]).add(d[0]);
    }

        if (color[i] == 0 && !bfs(adj, i, color)) return false;
    return true;
}
private boolean bfs(List<List<Integer>> adj, int s, int[] color) {
    Queue<Integer> q = new LinkedList<>();
    q.offer(s); color[s] = 1;
    while (!q.isEmpty()) {
        int u = q.poll();
        for (int v : adj.get(u)) {
            if (color[v] == color[u]) return false;
            if (color[v] == 0) { color[v] = -color[u]; q.offer(v); }
        }
    }
    return true;
}`,
python:`from collections import deque
def possibleBipartition(n, dislikes):
    adj = [[] for _ in range(n + 1)]
    for a, b in dislikes:
        adj[a].append(b); adj[b].append(a)
    color = [0] * (n + 1)
    def bfs(s):
        q = deque([s])
        color[s] = 1
        while q:
            u = q.popleft()
            for v in adj[u]:
                if color[v] == color[u]: return False
                if color[v] == 0:
                    color[v] = -color[u]
                    q.append(v)
        return True
    for i in range(1, n + 1):
        if color[i] == 0 and not bfs(i): return False
    return True`,
extra:`<b>1)</b> 2-coloring (bipartite). <b>2)</b> Neighbor opposite color. <b>3)</b> Same color → conflict. <br><b>Complexity:</b> O(V+E) time, O(V+E) space.`},

{type:"lc", cat:"Greedy", title:"Q249 · Split Array into Consecutive Subsequences", diff:"M", note:"Array ko length ≥ 3 ke consecutive sequences mein split ho sakta hai?",
java:`public boolean isPossible(int[] nums) {
    Map<Integer,Integer> freq = new HashMap<>(), end = new HashMap<>();
    for (int n : nums) freq.merge(n, 1, Integer::sum);
    for (int n : nums) {
        if (freq.get(n) == 0) continue;
        if (end.getOrDefault(n - 1, 0) > 0) {
            end.merge(n - 1, -1, Integer::sum);
            end.merge(n, 1, Integer::sum);
            freq.merge(n, -1, Integer::sum);
        } else if (freq.getOrDefault(n + 1, 0) > 0 && freq.getOrDefault(n + 2, 0) > 0) {
            freq.merge(n, -1, Integer::sum);
            freq.merge(n + 1, -1, Integer::sum);
            freq.merge(n + 2, -1, Integer::sum);
            end.merge(n + 2, 1, Integer::sum);
        } else return false;
    }
    return true;
}`,
python:`from collections import Counter
def isPossible(nums):
    freq = Counter(nums)
    end = Counter()
    for n in nums:
        if freq[n] == 0: continue
        if end[n - 1] > 0:
            end[n - 1] -= 1
            end[n] += 1
            freq[n] -= 1
        elif freq[n + 1] > 0 and freq[n + 2] > 0:
            freq[n] -= 1; freq[n + 1] -= 1; freq[n + 2] -= 1
            end[n + 2] += 1
        else:

    return True`,

{type:"lc", cat:"1-D DP", title:"Q135 · Longest Palindromic Substring", diff:"M", note:"Longest palindromic substring return karo.",
java:`public String longestPalindrome(String s) {

{type:"lc", cat:"1-D DP", title:"Q233 · Ugly Number II", diff:"M", note:"nth ugly number (factors sirf 2,3,5) — merge 3 sequences.",
java:`public int nthUglyNumber(int n) {
    int[] u = new int[n];
    u[0] = 1;
    int i2 = 0, i3 = 0, i5 = 0;
    int f2 = 2, f3 = 3, f5 = 5;
    for (int i = 1; i < n; i++) {
        int next = Math.min(f2, Math.min(f3, f5));
        u[i] = next;
        if (f2 == next) f2 = 2 * u[++i2];
        if (f3 == next) f3 = 3 * u[++i3];
        if (f5 == next) f5 = 5 * u[++i5];
    }
    return u[n-1];
}`,

    i2 = i3 = i5 = 0
    while len(u) < n:
        nxt = min(u[i2]*2, u[i3]*3, u[i5]*5)
        u.append(nxt)
        if nxt == u[i2]*2: i2 += 1
        if nxt == u[i3]*3: i3 += 1
        if nxt == u[i5]*5: i5 += 1
    return u[-1]`,
extra:`<b>1)</b> 3 streams ×2, ×3, ×5 merge karo. <b>2)</b> Min select, sab equal wale pointers aage. <b>3)</b> Duplicates skip. <br><b>Complexity:</b> O(n) time, O(n) space.`},

{type:"lc", cat:"2-D DP", title:"Q145 · Edit Distance", diff:"M", note:"Word1 → word2 mein minimum operations (insert/delete/replace).",
java:`public int minDistance(String a, String b) {
    int m = a.length(), n = b.length();
    int[] dp = new int[n + 1];
    for (int j = 0; j <= n; j++) dp[j] = j;
    for (int i = 1; i <= m; i++) {
        int prev = dp[0];
        dp[0] = i;
        for (int j = 1; j <= n; j++) {
            int t = dp[j];
            if (a.charAt(i-1) == b.charAt(j-1)) dp[j] = prev;
            else dp[j] = 1 + Math.min(dp[j], Math.min(dp[j-1], prev));
            prev = t;
        }
    }
    return dp[n];
}`,
python:`def minDistance(a, b):

    dp = list(range(n + 1))
    for i in range(1, m + 1):
        prev = dp[0]
        dp[0] = i
        for j in range(1, n + 1):
            t = dp[j]
            if a[i-1] == b[j-1]: dp[j] = prev
            else: dp[j] = 1 + min(dp[j], dp[j-1], prev)
            prev = t
    return dp[n]`,

{type:"lc", cat:"2-D DP", title:"Q147 · Target Sum", diff:"M", note:"+/- assign karke target sum — kitne ways?",

    int t = (sum + target) / 2;
    int[] dp = new int[t + 1];

    dp[0] = true;
    for (int j = 1; j <= s2.length(); j++) dp[j] = dp[j-1] && s2.charAt(j-1) == s3.charAt(j-1);
    for (int i = 1; i <= s1.length(); i++) {
        dp[0] = dp[0] && s1.charAt(i-1) == s3.charAt(i-1);
        for (int j = 1; j <= s2.length(); j++)
            dp[j] = (dp[j] && s1.charAt(i-1) == s3.charAt(i+j-1))
                 || (dp[j-1] && s2.charAt(j-1) == s3.charAt(i+j-1));
    }
    return dp[s2.length()];
}`,
python:`def isInterleave(s1, s2, s3):
    if len(s1) + len(s2) != len(s3): return False
    dp = [False] * (len(s2) + 1)
    dp[0] = True
    for j in range(1, len(s2) + 1):
        dp[j] = dp[j-1] and s2[j-1] == s3[j-1]
    for i in range(1, len(s1) + 1):
        dp[0] = dp[0] and s1[i-1] == s3[i-1]
        for j in range(1, len(s2) + 1):
            dp[j] = (dp[j] and s1[i-1] == s3[i+j-1]) or \

{type:"lc", cat:"2-D DP", title:"Q149 · Minimum Path Sum", diff:"M", note:"Top-left se bottom-right minimum path sum (down/right only).",
java:`public int minPathSum(int[][] g) {

    for (int i = 1; i < m; i++) g[i][0] += g[i-1][0];

    for (int i = 1; i < m; i++)

{type:"lc", cat:"2-D DP", title:"Q179 · Longest Increasing Path in a Matrix", diff:"H", note:"Grid mein sabse lamba strictly increasing path (4 directions).",
java:`int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};
public int longestIncreasingPath(int[][] m) {
    int R = m.length, C = m[0].length;
    int[][] memo = new int[R][C];
    int best = 0;
    for (int i = 0; i < R; i++)
        for (int j = 0; j < C; j++)
            best = Math.max(best, dfs(m, i, j, memo));
    return best;
}
private int dfs(int[][] m, int i, int j, int[][] memo) {
    if (memo[i][j] != 0) return memo[i][j];
    int best = 1;
    for (int[] d : dirs) {
        int ni = i+d[0], nj = j+d[1];
        if (ni >= 0 && ni < m.length && nj >= 0 && nj < m[0].length && m[ni][nj] > m[i][j])
            best = Math.max(best, 1 + dfs(m, ni, nj, memo));
    }
    memo[i][j] = best;
    return best;
}`,
python:`def longestIncreasingPath(m):
    R, C = len(m), len(m[0])
    memo = {}
    def dfs(i, j):
        if (i, j) in memo: return memo[(i, j)]
        best = 1
        for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
            ni, nj = i+di, j+dj
            if 0 <= ni < R and 0 <= nj < C and m[ni][nj] > m[i][j]:
                best = max(best, 1 + dfs(ni, nj))
        memo[(i, j)] = best
        return best
    return max(dfs(i, j) for i in range(R) for j in range(C))`,
extra:`<b>DFS + memoization</b> — strictly increasing edge pe hi jao. Har cell se path.`},

{type:"lc", cat:"2-D DP", title:"Q194 · Wildcard Matching", diff:"H", note:"'?' (any char) aur '*' (any sequence) wala regex match.",
java:`public boolean isMatch(String s, String p) {
    int m = s.length(), n = p.length();
    boolean[][] dp = new boolean[m + 1][n + 1];
    dp[0][0] = true;
    for (int j = 1; j <= n; j++)
        if (p.charAt(j-1) == '*') dp[0][j] = dp[0][j-1];
    for (int i = 1; i <= m; i++)
        for (int j = 1; j <= n; j++) {
            char pc = p.charAt(j-1);
            if (pc == '*') dp[i][j] = dp[i-1][j] || dp[i][j-1];
            else if (pc == '?' || pc == s.charAt(i-1)) dp[i][j] = dp[i-1][j-1];
        }
    return dp[m][n];
}`,
python:`def isMatch(s, p):
    m, n = len(s), len(p)
    dp = [[False] * (n + 1) for _ in range(m + 1)]
    dp[0][0] = True
    for j in range(1, n + 1):
        if p[j-1] == '*': dp[0][j] = dp[0][j-1]
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            pc = p[j-1]
            if pc == '*':
                dp[i][j] = dp[i-1][j] or dp[i][j-1]
            elif pc == '?' or pc == s[i-1]:
                dp[i][j] = dp[i-1][j-1]
    return dp[m][n]`,

java:`public int minDistance(String a, String b) {

java:`public int[][] insert(int[][] ints, int[] nw) {

{type:"lc", cat:"Intervals", title:"Q156 · Minimum Interval to Include Each Query", diff:"H", note:"Har query ke liye smallest interval jisme woh ho.",
java:`public int[] minInterval(int[][] ints, int[] queries) {
    Arrays.sort(ints, (a, b) -> a[0] - b[0]);
    int[][] qs = new int[queries.length][2];
    for (int i = 0; i < queries.length; i++) qs[i] = new int[]{queries[i], i};
    Arrays.sort(qs, (a, b) -> a[0] - b[0]);
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);
    int[] r = new int[queries.length];
    Arrays.fill(r, -1);
    int i = 0;
    for (int[] q : qs) {
        while (i < ints.length && ints[i][0] <= q[0]) {
            int len = ints[i][1] - ints[i][0] + 1;
            pq.offer(new int[]{len, ints[i][1]});
            i++;
        }
        while (!pq.isEmpty() && pq.peek()[1] < q[0]) pq.poll();
        if (!pq.isEmpty()) r[q[1]] = pq.peek()[0];
    }
    return r;
}`,
python:`import heapq
def minInterval(ints, queries):
    ints.sort()
    qs = sorted((q, i) for i, q in enumerate(queries))
    pq = []
    r = [-1] * len(queries)
    i = 0
    for q, idx in qs:
        while i < len(ints) and ints[i][0] <= q:
            s, e = ints[i]
            heapq.heappush(pq, (e - s + 1, e))
            i += 1
        while pq and pq[0][1] < q:
            heapq.heappop(pq)
        if pq: r[idx] = pq[0][0]
    return r`,
extra:`Queries sort karo. <b>Min-heap (len, end)</b> mein eligible intervals. Stale (end < query) pop.`},

extra:`<b>Exponentiation by squaring</b> — har step pe x square, n ke set bit pe result multiply.`},

{type:"lc", cat:"Math & Bit", title:"Q167 · Multiply Strings", diff:"M", note:"Do number strings multiply karo — bina BigInteger ke.",
java:`public String multiply(String a, String b) {
    int m = a.length(), n = b.length();
    int[] pos = new int[m + n];
    for (int i = m - 1; i >= 0; i--)
        for (int j = n - 1; j >= 0; j--) {
            int p1 = i + j, p2 = i + j + 1;
            int mul = (a.charAt(i)-'0') * (b.charAt(j)-'0') + pos[p2];
            pos[p1] += mul / 10;
            pos[p2] = mul % 10;
        }
    StringBuilder sb = new StringBuilder();
    for (int p : pos) if (!(sb.length() == 0 && p == 0)) sb.append(p);
    return sb.length() == 0 ? "0" : sb.toString();
}`,
python:`def multiply(a, b):
    if a == "0" or b == "0": return "0"
    pos = [0] * (len(a) + len(b))
    for i in range(len(a) - 1, -1, -1):
        for j in range(len(b) - 1, -1, -1):
            p1, p2 = i + j, i + j + 1
            mul = int(a[i]) * int(b[j]) + pos[p2]
            pos[p1] += mul // 10
            pos[p2] = mul % 10
    return ''.join(map(str, pos)).lstrip('0')`,
extra:`Digit-wise multiply, <b>grade-school algorithm</b>. Carry pos[i+j] mein. Leading zeros strip.`},

{type:"lc", cat:"Math & Bit", title:"Q201 · Fizz Buzz", diff:"E", note:"3 → Fizz, 5 → Buzz, 15 → FizzBuzz, warna number. Sabse classic warm-up.",
java:`public List<String> fizzBuzz(int n) {
    List<String> r = new ArrayList<>();
    for (int i = 1; i <= n; i++) {
        if (i % 15 == 0) r.add("FizzBuzz");
        else if (i % 3 == 0) r.add("Fizz");
        else if (i % 5 == 0) r.add("Buzz");
        else r.add(String.valueOf(i));
    }
    return r;
}`,
python:`def fizzBuzz(n):
    r = []
    for i in range(1, n + 1):
        if i % 15 == 0: r.append("FizzBuzz")
        elif i % 3 == 0: r.append("Fizz")
        elif i % 5 == 0: r.append("Buzz")
        else: r.append(str(i))
    return r`,
extra:`<b>1)</b> 15 se divisible pehle check (FizzBuzz). <b>2)</b> Phir 3 aur 5. <b>3)</b> Baaki number. <br><b>Complexity:</b> O(n) time, O(1) space (output ke alawa).`},

{type:"lc", cat:"Math & Bit", title:"Q202 · Palindrome Number", diff:"E", note:"Number apna reverse equal hai? Negative → false (sign bhi palta hota).",
java:`public boolean isPalindrome(int x) {
    if (x < 0 || (x % 10 == 0 && x != 0)) return false;
    int rev = 0;
    while (x > rev) {
        rev = rev * 10 + x % 10;
        x /= 10;
    }
    return x == rev || x == rev / 10;
}`,
python:`def isPalindrome(x):
    if x < 0 or (x % 10 == 0 and x != 0): return False
    rev = 0
    while x > rev:
        rev = rev * 10 + x % 10
        x //= 10
    return x == rev or x == rev // 10`,
extra:`<b>1)</b> Negative ya last digit 0 (lekin number 0 nahi) → false. <b>2)</b> Aadha number reverse karo. <b>3)</b> Aadha equal ya 10 se divide — overflow se bachne ka tarika. <br><b>Complexity:</b> O(log n) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q211 · Happy Number", diff:"E", note:"Digits ke squares ka sum repeat karo — 1 tak pahuncha toh happy (cycle check).",
java:`public boolean isHappy(int n) {
    Set<Integer> seen = new HashSet<>();
    while (n != 1 && seen.add(n)) {
        int sum = 0;
        while (n > 0) { int d = n % 10; sum += d * d; n /= 10; }
        n = sum;
    }
    return n == 1;
}`,
python:`def isHappy(n):
    seen = set()
    while n != 1 and n not in seen:
        seen.add(n)
        n = sum(int(d) ** 2 for d in str(n))
    return n == 1`,
extra:`<b>1)</b> Sum of squares loop. <b>2)</b> 1 aaya → happy. <b>3)</b> Set se cycle detect → false. <br><b>Complexity:</b> O(log n) per step, O(log n) space.`},

{type:"lc", cat:"Math & Bit", title:"Q212 · Power of Two", diff:"E", note:"n power of 2 hai? Bit trick: n & (n-1).",
java:`public boolean isPowerOfTwo(int n) {
    return n > 0 && (n & (n - 1)) == 0;
}`,
python:`def isPowerOfTwo(n):
    return n > 0 and (n & (n - 1)) == 0`,
extra:`<b>1)</b> Power of 2 ka binary mein sirf ek 1 bit hota hai. <b>2)</b> <code>n &amp; (n-1)</code> last bit hata deta hai — 0 aaya toh power of 2. <br><b>Complexity:</b> O(1) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q213 · Ugly Number", diff:"E", note:"Number sirf 2,3,5 factors se banta hai? (1 is ugly).",
java:`public boolean isUgly(int n) {
    if (n <= 0) return false;
    for (int f : new int[]{2,3,5})
        while (n % f == 0) n /= f;
    return n == 1;
}`,
python:`def isUgly(n):
    if n <= 0: return False
    for f in (2, 3, 5):
        while n % f == 0: n //= f
    return n == 1`,
extra:`<b>1)</b> 2,3,5 se jab tak divide ho tab tak divide. <b>2)</b> 1 bacha → ugly. <b>3)</b> ≤ 0 → false. <br><b>Complexity:</b> O(log n) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q218 · Factorial Trailing Zeroes", diff:"E", note:"n! ke end mein kitne zeros — count factors of 5.",
java:`public int trailingZeroes(int n) {
    int count = 0;
    while (n > 0) { n /= 5; count += n; }
    return count;
}`,
python:`def trailingZeroes(n):
    count = 0
    while n:
        n //= 5
        count += n
    return count`,
extra:`<b>1)</b> Zero = factor 10 = 2×5. <b>2)</b> 2 zyada milte hain — 5 count karo. <b>3)</b> n/5 + n/25 + ... <br><b>Complexity:</b> O(log n) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q222 · Find the Difference", diff:"E", note:"t = s + ek extra char — woh char dhundho (XOR).",
java:`public char findTheDifference(String s, String t) {
    int x = 0;
    for (char c : s.toCharArray()) x ^= c;
    for (char c : t.toCharArray()) x ^= c;
    return (char) x;
}`,
python:`def findTheDifference(s, t):
    x = 0
    for c in s + t: x ^= ord(c)
    return chr(x)`,
extra:`<b>1)</b> Saare chars XOR karo. <b>2)</b> Pairs cancel, extra bachega. <br><b>Complexity:</b> O(n) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q231 · Single Number III", diff:"M", note:"Exactly do elements ek baar, baaki sab double — dono single dhundho (bit manipulation).",
java:`public int[] singleNumber(int[] nums) {
    int x = 0;
    for (int n : nums) x ^= n;          // a ^ b
    int bit = x & -x;                   // rightmost set bit
    int a = 0, b = 0;
    for (int n : nums) {
        if ((n & bit) == 0) a ^= n;
        else b ^= n;
    }
    return new int[]{a, b};
}`,
python:`def singleNumber(nums):
    x = 0
    for n in nums: x ^= n
    bit = x & -x
    a = b = 0
    for n in nums:
        if n & bit: a ^= n
        else: b ^= n
    return [a, b]`,
extra:`<b>1)</b> Sab XOR → <code>a^b</code> milta hai. <b>2)</b> Rightmost set bit se numbers do groups mein baato. <b>3)</b> Har group ka XOR = ek single number. <br><b>Complexity:</b> O(n) time, O(1) space.`},

{type:"lc", cat:"Math & Bit", title:"Q232 · Base 7", diff:"E", note:"Integer ko base-7 string mein (negative handle).",
java:`public String convertToBase7(int num) {
    if (num == 0) return "0";
    boolean neg = num < 0;
    num = Math.abs(num);
    StringBuilder sb = new StringBuilder();
    while (num > 0) { sb.append(num % 7); num /= 7; }
    return (neg ? "-" : "") + sb.reverse().toString();
}`,
python:`def convertToBase7(num):
    if num == 0: return "0"
    neg = num < 0
    num = abs(num)
    r = []
    while num:
        r.append(str(num % 7))
        num //= 7
    return ('-' if neg else '') + ''.join(reversed(r))`,
extra:`<b>1)</b> num%7 digit, num//7 aage. <b>2)</b> Reverse karo. <b>3)</b> Sign add. <br><b>Complexity:</b> O(log₇ n) time, O(1) space.`},

/* ========== (more medium) ========== */

const slideEl = document.getElementById('slide');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const metaLeft = document.getElementById('metaLeft');
const metaRight = document.getElementById('metaRight');
const drawerList = document.getElementById('drawerList');
const dotsMini = document.getElementById('dotsMini');

const catList = [...new Set(DATA.filter(d => d.type !== 'home').map(d => d.cat))];
let current = 0;

/* ---------- Done / progress tracking ---------- */
const doneKey = 'dsa_done_leetcode';
function qnum(d){ const m = /^Q(\d+)/.exec(d.title); return m ? m[1] : ''; }
function getDone(){
  try { const v = JSON.parse(localStorage.getItem(doneKey) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function isDone(i){ return getDone().indexOf(qnum(DATA[i])) !== -1; }
function toggleDone(i){
  const id = qnum(DATA[i]); if(!id) return;
  const d = getDone(); const idx = d.indexOf(id);
  if(idx === -1){ d.push(id); } else { d.splice(idx, 1); }
  try { localStorage.setItem(doneKey, JSON.stringify(d)); } catch(e){}
}

function highlightCode(src){
  return String(src)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*|\/\/[^\n]*$)/g,'<span class="comment">$1</span>')
    .replace(/(#.*)/g,'<span class="comment">$1</span>')
    .replace(/(".*?"|'.*?')/g,'<span class="str">$1</span>')
    .replace(/\b(class|def|return|if|elif|else|for|in|while|import|from|try|except|finally|new|static|void|int|double|float|char|boolean|String|long|public|private|self|None|True|False|break|continue|lambda|with|as|pass|extends|super|is|var|Integer|List|Map|Set|int\[\])\b/g,'<span class="kw">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
}

function buildDrawer(){
  let html = '';
  let lastCat = '';
  DATA.forEach((d,i)=>{
    if(d.type === 'home') return;
    if(d.cat !== lastCat){
      html += `<li class="cat">${d.cat}</li>`;
      lastCat = d.cat;
    }
    html += `<li data-i="${i}"${isDone(i) ? ' class="done"' : ''}><span class="num">${d.diff === 'H' ? 'H' : 'Q' + qnum(d)}</span>${d.title.replace(/Q\d+\s*[·.]\s*/,'')}</li>`;
  });
  drawerList.innerHTML = html;
  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.addEventListener('click', ()=>{ goTo(parseInt(li.dataset.i)); closeDrawer(); });
  });
}

function buildDotsMini(){
  let dots = '';
  DATA.forEach((d,i)=>{ if(d.type !== 'home') dots += `<span data-i="${i}"></span>`; });
  dotsMini.innerHTML = dots;
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.addEventListener('click', ()=> goTo(parseInt(s.dataset.i)) );
  });
}

function buildHomeHtml(){
  let html = `
    <div class="home-hero">
      <div class="home-mark"><span class="j">JAVA</span> ⇄ <span class="p">PYTHON</span></div>
      <h2>LeetCode Top 267</h2>
      <p class="lead">LeetCode ke <b>267 sabse popular questions</b> — zyada tar <b>Medium</b>, popular <b>Easy</b> classics aur aakhir mein <b>Hard</b> ka random mix. Topic-wise list neeche hai. Har question ke saath <b>question → Java/Python solution → concise approach (steps + complexity)</b>. Click karo aur chale jaao.</p>
      <div class="home-stats">
        <div class="home-stat"><b>${catList.length}</b><span>Chapters</span></div>
        <div class="home-stat"><b>${DATA.length - 1}</b><span>Questions</span></div>
        <div class="home-stat"><b>${DATA.filter(d => d.diff === 'H').length}</b><span>Hard</span></div>
        <div class="home-stat"><b>${getDone().length}</b><span>Done ✓</span></div>
      </div>
    </div>
    <div class="home-chapters">`;
  catList.forEach((c, ci)=>{
    html += `<div class="home-ch">
      <div class="home-ch-head"><span class="n">Ch ${ci+1} / ${catList.length}</span>${c}</div>
      <div class="home-ch-grid">`;
    DATA.forEach((d, i)=>{
      if(d.type === 'home' || d.cat !== c) return;
      const hardCls = d.diff === 'H' ? ' hard-t' : '';
      const doneCls = isDone(i) ? ' done' : '';
      const qn = d.diff === 'H' ? 'H' : 'Q' + qnum(d);
      html += `<button class="home-topic${hardCls}${doneCls}" data-i="${i}"><span class="qn">${qn}</span>${d.title.replace(/Q\d+\s*[·.]\s*/,'')}</button>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

function goTo(i){
  current = Math.max(0, Math.min(DATA.length - 1, i));
  render();
}

function render(){
  const d = DATA[current];

  let bodyHtml = '';
  if(d.type === 'code' || d.type === 'lc'){
    bodyHtml = `
      <div class="rosetta">
        <div class="col java">
          <div class="col-head"><span class="dot j"></span><span>Java</span></div>
          <pre><code>${highlightCode(d.java)}</code></pre>
        </div>
        <div class="spine"><div class="glyph">⇄</div></div>
        <div class="col python">
          <div class="col-head"><span class="dot p"></span><span>Python</span></div>
          <pre><code>${highlightCode(d.python)}</code></pre>
        </div>
      </div>`;
  }

  const extraHtml = d.extra ? `<div class="extra-box"><span class="tag">Approach — kaise solve kiya</span>${d.extra}</div>` : '';

  if(d.type === 'home'){
    slideEl.innerHTML = buildHomeHtml();
  } else {
    const ch = catList.indexOf(d.cat) + 1;
    const badge = d.diff === 'H' ? '<span class="diff d-H">HARD</span>' : (d.diff === 'E' ? '<span class="diff d-E">EASY</span>' : '<span class="diff d-M">MEDIUM</span>');
    slideEl.innerHTML = `
      <div class="eyebrow"><span class="ch">Ch ${ch}/${catList.length}</span>${d.cat} · Q${qnum(d)} / ${DATA.length - 1} questions</div>
      <h2>${d.title}${badge}</h2>
      <p class="note">${d.note}</p>
      ${bodyHtml}
      ${extraHtml}
      <div class="done-row">
        <button class="done-btn${isDone(current) ? ' is-done' : ''}" data-i="${current}">${isDone(current) ? '✓ DONE — dabao to unmark' : 'Mark Done ✓'}</button>
        <span class="done-count"><b>${getDone().length}</b> / ${DATA.length - 1} done</span>
      </div>
    `;
  }

  progressFill.style.width = ((current+1)/DATA.length*100) + '%';
  metaLeft.textContent = 'SLIDE ' + (current+1);
  metaRight.textContent = '/ ' + (DATA.length - 1) + ' · ' + getDone().length + ' ✓';
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === DATA.length - 1 ? 'Restart ↺' : 'Next →';

  drawerList.querySelectorAll('li[data-i]').forEach(li=>{
    li.classList.toggle('active', parseInt(li.dataset.i) === current);
    li.classList.toggle('done', isDone(parseInt(li.dataset.i)));
  });
  dotsMini.querySelectorAll('span').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.i) === current);
  });

  const activeLi = drawerList.querySelector('li.active');
  if(activeLi) activeLi.scrollIntoView({block:'nearest'});

  if(DATA[current].type === 'home'){
    slideEl.querySelectorAll('.home-topic').forEach(btn=>{
      btn.addEventListener('click', ()=> goTo(parseInt(btn.dataset.i)));
    });
  }
  slideEl.querySelectorAll('.done-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      toggleDone(current);
      render();
    });
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

prevBtn.addEventListener('click', ()=> goTo(current - 1));
nextBtn.addEventListener('click', ()=> goTo(current === DATA.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
  if(e.key === 'Escape') closeDrawer();
});

const drawerBtn = document.getElementById('drawerBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
drawerBtn.addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawer);

const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', ()=> goTo(0));
document.querySelector('.brand').addEventListener('click', ()=> goTo(0));

buildDrawer();
buildDotsMini();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
